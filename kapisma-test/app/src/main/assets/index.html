function persist(){try{localStorage.setItem('kapisma-v07',JSON.stringify(S))}catch{}}
function today(){const t=new Date();return `${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`}
function daily(){if(!S.daily||S.daily.date!==today()){S.daily={date:today(),duels:0,correct:0,survival:0,reward:false};persist()}}
daily();
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clearTimers(){if(V.tick)clearInterval(V.tick);if(V.next)clearTimeout(V.next);V.tick=V.next=null}
function audio(ok){if(!S.sound)return;try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(ok?680:205,c.currentTime);o.frequency.exponentialRampToValueAtTime(ok?920:150,c.currentTime+.13);g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.19);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2);o.onended=()=>c.close()}catch{}}
function header(){return `<div class="header"><img src="${avatar}" class="avatar" alt="Oyuncu avatarı"><div class="user"><b>Arena Oyuncusu</b><small>✦ Seviye ${Math.floor(S.xp/350)+1}</small></div><button data-action="profile" class="coin">🪙 ${S.coins}</button><button data-action="missions" class="bell" aria-label="Görevler">🔔</button></div>`}
function nav(){const names=[['home','🏠','Ana Sayfa'],['tournament','🏆','Turnuva'],['duel','⚔️','Kapışma'],['leaders','🛡️','Ligler'],['profile','👤','Profil']];el('nav').innerHTML=names.map(([p,emoji,name])=>`<button data-nav="${p}" class="${V.page===p||(p==='duel'&&V.page==='play')?'on':''}"><span>${emoji}</span>${name}</button>`).join('')}
function title(t){return `<div class="page-title"><button class="back" data-action="home">❮ Geri</button><b>${t}</b></div>`}
function home(){return `${header()}<div class="hero"><img src="${hero}" alt="Kapışma Arena 3D taç ve altın arena"><div class="hero-label">✦ KAPIŞMA ARENA • SEZON 1 ✦</div></div>
<button class="gold" data-action="duel"><span class="sword">⚔️</span><span class="words"><b>Şimdi Kapış!</b><small>Arena Bot'a meydan oku • 10 soru</small></span><span class="go">❯</span></button>
<div class="panel"><h3>🎮 NASIL KAPIŞMAK İSTERSİN?</h3><div class="field">Konu seç</div><div class="row">${CAT.map(([n,e])=>`<button class="depth category ${S.category===n?'on':''}" data-cat="${n}">${e} ${n}</button>`).join('')}</div>

<div class="field">⏱️ Soru süresi</div><div class="row">${[20,25,30].map(n=>`<button class="depth sec ${S.seconds===n?'blue':''}" data-sec="${n}">${n} sn</button>`).join('')}</div>

<div class="tiles"><button class="tile" data-action="quick"><em>⚡</em><strong>60 Saniye</strong><small>Zamana karşı bilgi yarışması</small></button><button class="tile" data-action="survival"><em>🛡️</em><strong>Hayatta Kal</strong><small>3 hak • elenmeden ilerle</small></button><button class="tile" data-action="tournament"><em>🏆</em><strong>Turnuva</strong><small>7 soru • bot rakip</small></button><button class="tile" data-action="missions"><em>🎯</em><strong>Günlük Görevler</strong><small>Ödül ve altın kazan</small></button></div>
<div class="panel"><h3>✨ ARENA EKSTRALARI</h3><div class="features"><span class="emoji">🧠</span><div class="desc"><b>Yanlış Soruları Tekrar Et</b><small>${S.wrongIds.length} soru seni bekliyor</small></div><button class="depth btnsmall" data-action="wrong">Aç</button></div><div class="features"><span class="emoji">👥</span><div class="desc"><b>Arkadaşını Davet Et</b><small>Bağlantıyı paylaş</small></div><button class="depth btnsmall" data-action="invite">Paylaş</button></div><div class="features"><span class="emoji">🔊</span><div class="desc"><b>Oyun Sesleri</b><small>Doğru / yanlış cevap sesi</small></div><button class="depth btnsmall" data-action="sound">${S.sound?'Açık':'Kapalı'}</button></div></div>
<div class="notice">Bu sürüm internetsiz çalışır. Kapışma ve turnuva rakibi <b>Arena Bot</b> olarak simüle edilir; gerçek online oyuncu eşleştirmesi henüz yoktur.</div>`}
function choosePool(mode){let p=mode==='wrong'?BANK.filter(q=>S.wrongIds.includes(q.id)):BANK.filter(q=>(S.category==='Karışık'||q.category===S.category)&&q.difficulty===S.difficulty);if(!p.length&&mode!=='wrong')p=BANK.filter(q=>S.category==='Karışık'||q.category===S.category);return shuffle([...p])}
function start(mode){clearTimers();let qs=choosePool(mode);if(!qs.length){toast('Tekrar edilecek yanlış soru yok.');return}V.game={mode,qs,index:0,right:0,wrong:0,lives:3,score:0,bot:0,remaining:mode==='quick'?60:S.seconds,max:mode==='duel'?10:mode==='tournament'?7:mode==='survival'?30:mode==='wrong'?qs.length:50};V.page='play';V.locked=false;render();timer()}
const gameName=m=>({duel:'⚔️ Arena Kapışması',quick:'⚡ 60 Saniye',survival:'🛡️ Hayatta Kal',tournament:'🏆 Turnuva',wrong:'🧠 Yanlış Sorular'})[m];
function gameView(){let g=V.game,q=g.qs[g.index];return `${title(gameName(g.mode))}<div class="panel"><div class="game-top"><span class="tag">SORU ${g.index+1} / ${g.max}</span><span class="timer" id="timer">⏱️ ${g.remaining} sn</span></div><div class="meter"><div id="bar" style="width:${g.mode==='quick'?0:g.index/g.max*100}%"></div></div><div class="game-top" style="margin-bottom:14px"><span class="tag">${h(q.category)} • ${h(q.difficulty)}</span><span class="tag">✅ ${g.right} ❌ ${g.wrong}${g.mode==='survival'?` 💗 ${g.lives}`:''}</span></div>${['duel','tournament'].includes(g.mode)?`<div class="game-top small" style="margin-bottom:14px"><b>👤 Sen: ${g.score}</b><b>🤖 Arena Bot: ${g.bot}</b></div>`:''}
<div class="question">${h(q.q)}</div><div class="answers">${q.answers.map((a,i)=>`<button data-answer="${i}" id="ans${i}" class="answer"><span>${'ABCD'[i]}</span>${h(a)}</button>`).join('')}</div><div class="feedback" id="feedback">Cevabını seç!</div></div><button class="back" style="width:100%;margin-top:10px" data-action="exit">Oyundan Çık</button>`}
function timer(){clearTimers();let g=V.game;if(!g||V.page!=='play')return;V.tick=setInterval(()=>{if(V.page!=='play'||V.locked){clearTimers();return}g.remaining--;let t=el('timer');if(t){t.textContent=`⏱️ ${g.remaining} sn`;t.classList.toggle('urgent',g.remaining<=5)}if(g.mode==='quick'&&el('bar'))el('bar').style.width=`${(60-g.remaining)/60*100}%`;if(g.remaining<=0){if(g.mode==='quick')finish();else answer(-1)}},1000)}
function answer(i){let g=V.game;if(!g||V.locked)return;clearTimers();V.locked=true;let q=g.qs[g.index],ok=i===q.correct;if(ok){g.right++;g.score+=g.mode==='tournament'?20:10;S.correct++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);S.daily.correct++;S.wrongIds=S.wrongIds.filter(n=>n!==q.id)}else{g.wrong++;S.streak=0;if(g.mode==='survival')g.lives--;if(!S.wrongIds.includes(q.id))S.wrongIds.push(q.id);S.wrongIds=S.wrongIds.slice(-300)}S.total++;if(['duel','tournament'].includes(g.mode)){let prob={Kolay:.78,Orta:.65,Zor:.50}[S.difficulty];if(Math.random()<prob)g.bot+=g.mode==='tournament'?20:10}
for(let j=0;j<4;j++){let b=el('ans'+j);if(!b)continue;b.disabled=true;if(j===q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')}el('feedback').textContent=ok?'✅ Doğru cevap!':i===-1?`⏰ Süre doldu! Doğru: ${q.answers[q.correct]}`:`❌ Doğru: ${q.answers[q.correct]}`;audio(ok);persist();V.next=setTimeout(()=>{V.next=null;if(!V.game||V.page!=='play')return;g.index++;if(g.index>=Math.min(g.max,g.qs.length)||(g.mode==='survival'&&g.lives<=0)){finish();return}V.locked=false;if(g.mode!=='quick')g.remaining=S.seconds;render();timer()},1100)}
function finish(){if(!V.game)return;clearTimers();let g=V.game;S.played++;S.xp+=g.right*15;let earned=g.right*3;g.win=null;if(['duel','tournament'].includes(g.mode)){g.win=g.score>g.bot?true:g.score<g.bot?false:null;S.daily.duels++;if(g.win){S.wins++;earned+=g.mode==='tournament'?75:35}else if(g.win===false)S.losses++}if(g.mode==='quick')S.bestQuick=Math.max(S.bestQuick,g.right);if(g.mode==='survival'){S.bestSurvival=Math.max(S.bestSurvival,g.right);S.daily.survival++}g.earned=earned;S.coins+=earned;V.page='result';V.locked=false;persist();render()}
function result(){let g=V.game;return `${title('Maç Sonucu')}<div class="panel"><div class="result-icon">${g.win===true?'🏆':g.win===false?'🛡️':'🌟'}</div><div class="result-title">${g.win===true?'ZAFER SENİN!':g.win===false?'BU KEZ OLMADI':g.win===null&&['duel','tournament'].includes(g.mode)?'BERABERE!':'ARENA TAMAMLANDI!'}</div><p class="center muted">${gameName(g.mode)}</p><div class="stats"><div class="stat"><b>${g.right}</b><small>Doğru</small></div><div class="stat"><b>${g.wrong}</b><small>Yanlış</small></div><div class="stat"><b>+${g.earned}</b><small>Altın</small></div></div>${['duel','tournament'].includes(g.mode)?`<p class="notice center">👤 ${g.score} puan &nbsp; VS &nbsp; 🤖 ${g.bot} puan</p>`:''}<p class="notice center">⭐ +${g.right*15} XP • Toplam ${S.xp} XP</p><button class="gold" data-action="replay"><span class="sword">⚔️</span><span class="words"><b>Yeniden Oyna</b></span><span class="go">❯</span></button><button class="bluebtn" data-action="home">Ana Sayfaya Dön</button></div>`}
function leaderPanel(){let n=S.wins;return `<div class="panel"><h3>🏅 KİŞİSEL LİG • SEZON 1</h3><div class="features"><span class="emoji">${n>=20?'🥇':n>=10?'🥈':'🥉'}</span><div class="desc"><b>${n>=20?'Altın':n>=10?'Gümüş':'Bronz'} Lig</b><small>${n} galibiyet • ${n<10?10-n+' galibiyet sonra Gümüş':n<20?20-n+' galibiyet sonra Altın':'En üst ligdesin!'}</small></div></div><div class="stats"><div class="stat"><b>${S.wins}</b><small>Galibiyet</small></div><div class="stat"><b>${S.bestQuick}</b><small>60 sn rekoru</small></div><div class="stat"><b>${S.bestSurvival}</b><small>Hayatta kalma</small></div></div></div>`}
function tournament(){return `${title('🏆 Turnuva')}<div class="panel"><div class="result-icon">🏆</div><div class="goldtext center">Arena Turnuvası</div><p class="center muted">7 soruda Arena Bot ile mücadele et. Galibiyete +75 altın!</p><div class="notice">Bu çevrimdışı bot turnuvasıdır, gerçek çevrimiçi oyuncu bulunmaz.</div><button class="gold" data-action="start-tournament"><span class="sword">🏁</span><span class="words"><b>Turnuvaya Katıl</b></span><span class="go">❯</span></button></div>${leaderPanel()}`}
function leaders(){return `${title('🛡️ Ligler')}${leaderPanel()}<div class="panel"><h3>🏆 KUPA YOLCULUĞU</h3>${[['🥉','Bronz',0],['🥈','Gümüş',10],['🥇','Altın',20]].map(([emo,name,req])=>`<div class="features ${S.wins<req?'quiet':''}"><span class="emoji">${emo}</span><div class="desc"><b>${name} Lig</b><small>${req} galibiyet ile açılır</small></div><span class="tag">${S.wins>=req?'✓ Açık':'🔒 Kilitli'}</span></div>`).join('')}</div>`}
function missions(){let d=S.daily,goals=[['⚔️','2 kapışma/turnuva tamamla',d.duels,2],['🧠','10 doğru cevap ver',d.correct,10],['🛡️','1 hayatta kalma turu bitir',d.survival,1]],ready=goals.every(g=>g[2]>=g[3]);return `${title('🎯 Günlük Görevler')}<div class="panel"><div class="goldtext">Günlük Altın Sandığı</div><p class="small muted">Tüm görevleri tamamla, 150 altın kazan. Her gün sıfırlanır.</p>${goals.map(([ico,name,current,goal])=>`<div class="features"><span class="emoji">${ico}</span><div class="desc"><b>${name}</b><div class="meter"><div style="width:${Math.min(100,current/goal*100)}%"></div></div></div><span class="tag">${Math.min(current,goal)}/${goal}</span></div>`).join('')}<button class="gold ${!ready||d.reward?'quiet':''}" data-action="claim" ${!ready||d.reward?'disabled':''}><span class="sword">🎁</span><span class="words"><b>${d.reward?'Ödül Alındı':'150 Altın Kazan'}</b></span><span class="go">❯</span></button></div>`}
function profile(){let progress=S.xp%350;return `${title('👤 Profil')}<div class="panel"><div class="frame"><img src="${avatar}" alt="Profil avatarı" style="border-color:${S.frame==='Efsane'?'#f4a6fa':S.frame==='Safir'?'#3accff':'#ffd14a'}"><div><div class="goldtext">Arena Oyuncusu</div><p>✦ Seviye ${Math.floor(S.xp/350)+1} • ${S.xp} XP</p><p class="muted">${h(S.frame)} profil çerçevesi</p></div></div><div class="meter"><div style="width:${progress/350*100}%"></div></div><p class="small muted">Sonraki seviye için ${350-progress} XP</p><div class="stats"><div class="stat"><b>${S.played}</b><small>Oyun</small></div><div class="stat"><b>${S.maxStreak}</b><small>Seri rekoru</small></div><div class="stat"><b>${S.correct}</b><small>Doğru cevap</small></div></div></div><div class="panel"><h3>👑 3D PROFİL ÇERÇEVELERİ</h3>${[['Mor',0,'💜'],['Safir',150,'💎'],['Altın',350,'👑'],['Efsane',900,'🌟']].map(([name,cost,ico])=>`<div class="features"><span class="emoji">${ico}</span><div class="desc"><b>${name} Çerçeve</b><small>${cost?'Satın alma bedeli '+cost+' altın':'Ücretsiz'} ${S.frames.includes(name)?'• Açık':''}</small></div><button class="depth btnsmall" data-frame="${name}" data-cost="${cost}">${S.frame===name?'✓ Aktif':S.frames.includes(name)?'Kullan':cost+' 🪙'}</button></div>`).join('')}</div><div class="panel"><div class="features"><span class="emoji">🔊</span><div class="desc"><b>Oyun Sesleri</b><small>Ses efektlerini aç veya kapat</small></div><button class="depth btnsmall" data-action="sound">${S.sound?'Açık':'Kapalı'}</button></div><div class="features"><span class="emoji">👥</span><div class="desc"><b>Oyunu Paylaş</b><small>Arkadaşına oyunu göster</small></div><button class="depth btnsmall" data-action="invite">Paylaş</button></div></div>`}
function wrong(){return `${title('🧠 Yanlış Sorular')}<div class="panel"><div class="result-icon">📚</div><div class="result-title">${S.wrongIds.length} Soru</div><p class="muted center">Yanlış cevaplarını tekrar çözerek öğren.</p><button class="gold" data-action="start-wrong" ${S.wrongIds.length?'':'disabled'}><span class="sword">🧠</span><span class="words"><b>Tekrar Et</b></span><span class="go">❯</span></button></div>`}
function render(){daily();const routes={home,tournament,leaders,profile,missions,wrong,play:gameView,result};el('app').innerHTML=(routes[V.page]||home)();nav();window.scrollTo(0,0)}
function go(p){clearTimers();if(V.page==='play')V.game=null;V.page=p;render()}
function toast(txt){let e=el('toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','status');e.style.cssText='position:fixed;bottom:94px;left:50%;transform:translateX(-50%);z-index:50;width:max-content;max-width:90vw;background:#133c92;color:#fff;border:2px solid #57cfff;border-radius:14px;box-shadow:0 8px 20px #000a;padding:12px 18px;font-size:13px;font-weight:800;text-align:center';document.body.append(e)}e.textContent=txt;e.style.display='block';clearTimeout(e._timer);e._timer=setTimeout(()=>e.style.display='none',2600)}
document.addEventListener('click',event=>{let b=event.target.closest('[data-action],[data-nav],[data-cat],[data-diff],[data-sec],[data-answer],[data-frame]');if(!b||b.disabled)return;if('nav'in b.dataset){b.dataset.nav==='duel'?start('duel'):go(b.dataset.nav);return}if('cat'in b.dataset){S.category=b.dataset.cat;persist();render();return}if('diff'in b.dataset){S.difficulty=b.dataset.diff;persist();render();return}if('sec'in b.dataset){S.seconds=+b.dataset.sec;persist();render();return}if('answer'in b.dataset){answer(+b.dataset.answer);return}if('frame'in b.dataset){let name=b.dataset.frame,cost=+b.dataset.cost;if(S.frame===name)return;if(!S.frames.includes(name)){if(S.coins<cost){toast('Altının yetmiyor!');return}S.coins-=cost;S.frames.push(name)}S.frame=name;persist();audio(true);render();return}
switch(b.dataset.action){case 'home':go('home');break;case 'profile':go('profile');break;case 'missions':go('missions');break;case 'wrong':go('wrong');break;case 'duel':start('duel');break;case 'quick':start('quick');break;case 'survival':start('survival');break;case 'tournament':go('tournament');break;case 'start-tournament':start('tournament');break;case 'start-wrong':start('wrong');break;case 'replay':start(V.game?.mode||'duel');break;case 'sound':S.sound=!S.sound;persist();render();if(S.sound)audio(true);break;
case 'exit':if(confirm('Oyundan çıkarsan mevcut tur kaydedilmez. Çıkılsın mı?'))go('home');break;
case 'claim':if(!S.daily.reward&&S.daily.duels>=2&&S.daily.correct>=10&&S.daily.survival>=1){S.daily.reward=true;S.coins+=150;persist();render();audio(true);toast('🎁 150 altın kazandın!')}break;
case 'invite':{let link=location.protocol==='file:'?'':location.href;if(navigator.share){navigator.share({title:'Kapışma Arena',text:'⚔️ Kapışma Arena bilgi yarışmasını dene!',url:link||undefined}).catch(()=>{})}else if(navigator.clipboard&&link){navigator.clipboard.writeText('Kapışma Arena: '+link).then(()=>toast('Bağlantı kopyalandı!')).catch(()=>toast('Paylaşım yapılamadı.'))}else toast('İnternette yayınlanınca oyun bağlantısını paylaşabilirsin.');break;}
}});
el('skip').addEventListener('click',()=>el('splash').classList.add('hide'));setTimeout(()=>el('splash').classList.add('hide'),3500);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimers();else if(V.page==='play'&&!V.locked)timer()});
render();
</script></body></html>
