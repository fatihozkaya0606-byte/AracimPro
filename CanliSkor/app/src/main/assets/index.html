    <div class="match-score ${live?'is-live':''}">${escapeHtml(scoreText(m,'home'))}<span style="font-size:11px;opacity:.6">:</span>${escapeHtml(scoreText(m,'away'))}</div>

function groupedCards(items){
  const by=new Map();
  for(const m of items){let k=m.league||'Diğer Ligler';if(!by.has(k))by.set(k,[]);by.get(k).push(m)}
  if(!items.length)return `<div class="empty"><div class="empty-icon">⚽</div><h3>${STATE.tab==='live'?'Şu anda canlı maç görünmüyor':'Bu filtrede maç bulunamadı'}</h3><p>Veri sağlayıcısında maç bulunmuyor. Başka bir tarih seçebilir veya yenileyebilirsin.</p><button class="secondary" data-refresh="1">↻ Yenile</button></div>`;
  const priority=l=>/Süper Lig|Turkey|Türkiye|Trendyol/i.test(l)?0:/Şampiyonlar|Champions|UEFA/i.test(l)?1:/Premier League|England/i.test(l)?2:3;
  return [...by].sort((a,b)=>priority(a[0])-priority(b[0])||a[0].localeCompare(b[0],'tr')).map(([league,ms])=>
    `<section class="league-group"><div class="league-head"><strong>◈ ${escapeHtml(league)}</strong><span>${ms.length} maç ›</span></div>${ms.sort((a,b)=>Number(isLive(b))-Number(isLive(a))||String(a.time||'').localeCompare(String(b.time||''))).map(matchCard).join('')}</section>`
  ).join('');
}

function switchTab(tab){
  if(tab===STATE.tab){render();return}
  STATE.tab=tab;STATE.match=null;STATE.details=null;STATE.filter='Tümü';STATE.term='';

$('content').addEventListener('click',e=>{

    if(b.dataset.day!==undefined){
      let day=Math.max(-10,Math.min(10,Number(b.dataset.day)));
      if(day!==STATE.day){STATE.day=day;STATE.tab='today';STATE.matches=[];STATE.lastFixtures=0;STATE.filter='Tümü';STATE.term='';refresh(true);}
      return;
    }
    if(b.dataset.filter!==undefined){STATE.filter=decodeURIComponent(b.dataset.filter);render();return}
    if(b.dataset.star){e.stopPropagation();let key=decodeURIComponent(b.dataset.star);let m=[...STATE.liveMatches,...STATE.matches].find(x=>matchKey(x)===key);if(m)saveMatch(m);return}
    if(b.dataset.back){STATE.match=null;STATE.details=null;render();return}
    if(b.dataset.saveToken){
      let value=$('token').value.trim();bsdToken=value;localStorage.setItem('bsdToken',value);

const V4_LEAGUES=[
 ['tr-super','🇹🇷 Türkiye - Trendyol Süper Lig'],

 ['eng-premier','🏴 İngiltere - Premier League'],

function getDate(offset=0){return new Date(Date.now()+offset*86400000+10800000).toISOString().slice(0,10)}
function v4LocalDate(date){if(!date)return '';const d=new Date(date);return isNaN(d)?'':new Date(d.getTime()+10800000).toISOString().slice(0,10)}
function v4Arr(x){if(Array.isArray(x))return x;for(const v of [x?.results,x?.events,x?.matches,x?.fixtures,x?.live,x?.live_events,x?.data?.results,x?.data?.events,x?.data?.matches,x?.data])if(Array.isArray(v))return v;return []}

function v4LeagueKey(name,country,id){
 const n=String(name||'').toLocaleLowerCase('tr-TR'),c=String(country||'').toLocaleLowerCase('tr-TR');
 if(/süper lig|super lig|trendyol super|trendyol süper/.test(n)&&(!c||/turkey|turkiye|türkiye/.test(c)))return 'tr-super';
 if(/trendyol 1|1\. lig|tff 1/.test(n)&&(!c||/turkey|turkiye|türkiye/.test(c)))return 'tr-first';
 if(/premier league|premier lig/.test(n)&&(!c||/england|ingiltere|i̇ngiltere/.test(c)))return 'eng-premier';
 if(/la ?liga|laliga/.test(n))return 'esp-laliga';
 if(/serie a/.test(n)&&(!c||/ital/.test(c)))return 'ita-seriea';
 if(/bundesliga/.test(n)&&(!c||/german|almanya/.test(c)))return 'ger-bundesliga';
 if(/ligue 1/.test(n))return 'fra-ligue1';
 if(/champions league|şampiyonlar ligi/.test(n)&&!/women|u19|youth/.test(n))return 'uefa-ucl';
 if(/europa league|avrupa ligi/.test(n))return 'uefa-uel';
 return 'other:'+String(id||n||'unknown');

function v4League(row){

 const name=String(textVal(obj)||first(row,['league_name','competition_name'],null)||l.name||(id?'Lig #'+id:'Diğer Lig'));
 const country=String(first(row,['country','country_name'],l.country||obj?.country||''));

}
function v4Status(x,forceLive){
 if(forceLive)return 'live';
 const s=String(first(x,['status','match_status','state'],x?.time?.status||'upcoming')).toLowerCase().replace(/[\s-]+/g,'_');
 if(['live','in_progress','in_play','inplay','playing','1h','2h','ht','extra_time','et','penalties','first_half','second_half','half_time','break'].includes(s))return 'live';
 if(['ft','ended','finished','complete','completed','aet'].includes(s))return 'finished';
 if(['cancelled','postponed'].includes(s))return s;
 return 'upcoming';

function normalize(x,provider,forceLive=false){
 const ho=first(x,['home_team','home','homeTeam','team_home','home_team_name']);
 const aw=first(x,['away_team','away','awayTeam','team_away','away_team_name']);

 const date=first(x,['event_date','start_time','kickoff','kickoff_at','start_at','date'],x?.time?.kickoff_at||'');
 const status=v4Status(x,forceLive);
 const minute=first(x,['current_minute','minute','elapsed','status_text'],x?.time?.display??x?.time?.minute??'');
 const scores=x.score&&typeof x.score==='object'?x.score:{};
 let hs=first(x,['home_score','score_home','homeGoals'],scores.home??null),as=first(x,['away_score','score_away','awayGoals'],scores.away??null);
 if(x.extra_time_score&&hs!==null&&as!==null){hs=Number(hs)+Number(x.extra_time_score.home||0);as=Number(as)+Number(x.extra_time_score.away||0)}
 const id=String(first(x,['id','event_id','match_id','slug'],home+away+date));

async function v4FixtureRows(day){

 if(bsdToken){
  await v4EnsureLeagues();

  let all=[],seen=new Set();
  for(let i=0;i<5&&next;i++){if(seen.has(next))break;seen.add(next);
   const data=await request(next,bsdToken);all.push(...v4Rows(data,'Maçlar'));
   const n=data?.next;
   next=(typeof n==='string'&&n.startsWith('https://sports.bzzoiro.com/'))?n:(typeof n==='string'&&n.startsWith('/')?API_BSD+n:null);
  }
  const unique=new Set();
  return all.filter(x=>v4LocalDate(first(x,['event_date','start_time','kickoff','kickoff_at'],x?.time?.kickoff_at||''))===target)
  .map(x=>normalize(x,'bsd')).filter(x=>{let k=matchKey(x);if(unique.has(k))return false;unique.add(k);return true});
 }
 const data=await request(API_SS+'/api/v1/fixtures/?sport=football&date='+target+'&limit=200');

}

async function v4RefreshLive(){
 if(STATE.liveLoading)return;STATE.liveLoading=true;STATE.lastLiveAttempt=Date.now();
 try{STATE.liveMatches=await v4LiveRows();STATE.lastLive=Date.now();STATE.liveChecked=true;STATE.liveError='';v4MergeLive();STATE.last=Date.now();}
 catch(e){STATE.liveChecked=false;STATE.liveError=String(e.message||e)}
 finally{STATE.liveLoading=false;render()}
}
async function refresh(force=false){
 if(STATE.loading)return;STATE.loading=true;STATE.error='';render();
 try{
  if(force||!STATE.lastFixtures||Date.now()-STATE.lastFixtures>240000||!STATE.matches.length){
   STATE.matches=await v4FixtureRows(STATE.day);STATE.lastFixtures=Date.now();
  }
  if(STATE.day===0||STATE.tab==='live')await v4RefreshLive();
  STATE.last=Date.now();
 }catch(e){STATE.error=String(e.message||e)}
 finally{STATE.loading=false;render()}
}
function v4Visible(){
 let a=STATE.tab==='live'?(STATE.liveMatches.length?STATE.liveMatches:STATE.matches.filter(isLive)):
 STATE.tab==='favorites'?[...new Map([...STATE.matches,...STATE.liveMatches].map(m=>[matchKey(m),m])).values()].filter(saved):STATE.matches;
 if(STATE.tab==='finished')a=a.filter(isFinal);
 if(STATE.filter!=='Tümü')a=a.filter(m=>m.leagueKey===STATE.filter);
 if(STATE.term)a=a.filter(m=>(m.home+' '+m.away+' '+m.league).toLocaleLowerCase('tr-TR').includes(STATE.term.toLocaleLowerCase('tr-TR')));
 return a;
}
function v4OneMatch(m){
 const id=encodeURIComponent(matchKey(m)),live=isLive(m);
 const clock=statusText(m);
 const score=(live||isFinal(m))?String(m.hs??'–')+' - '+String(m.as??'–'):'v';
 return '<article class="v4-match" data-open="'+id+'"><span class="v4-status '+(live?'live':'')+'">'+escapeHtml(clock)+'</span>'+
 '<span class="v4-home">'+escapeHtml(m.home)+'</span><b class="v4-score '+(live?'live':'')+'">'+escapeHtml(score)+'</b>'+
 '<span class="v4-away">'+escapeHtml(m.away)+'</span><button class="v4-star '+(saved(m)?'saved':'')+'" data-star="'+id+'">'+(saved(m)?'★':'☆')+'</button></article>';
}
function groupedCards(items){
 if(!items.length&&STATE.term)return '<div class="v4-note">Aramada maç bulunamadı.</div>';
 const map=new Map();
 for(const m of items){const k=m.leagueKey||'other:unknown';if(!map.has(k))map.set(k,{title:m.league,items:[]});map.get(k).items.push(m)}
 let used=new Set(),sections=[];
 for(const [key,title] of V4_LEAGUES){if(STATE.filter!=='Tümü'&&STATE.filter!==key)continue;sections.push({key,title,items:map.get(key)?.items||[]});used.add(key)}
 for(const [key,g] of map)if(!used.has(key))sections.push({key,title:g.title,items:g.items});
 if(STATE.tab==='live'&&!items.length&&!STATE.term){
  const msg=STATE.liveError?'Canlı veri alınamadı: '+STATE.liveError:'BSD şu anda canlı maç bildirmiyor. Maç programını Maçlar sekmesinde görebilirsin.';
  sections.unshift({notice:msg});
 }
 return sections.map(g=>g.notice?'<div class="v4-note">'+escapeHtml(g.notice)+'</div>':
 '<section class="v4-league-card"><div class="v4-league-head"><span>'+escapeHtml(g.title)+'</span><small>'+g.items.length+' maç</small></div>'+
 (g.items.length?g.items.sort((a,b)=>Number(isLive(b))-Number(isLive(a))||String(a.time||'').localeCompare(String(b.time||''))).map(v4OneMatch).join(''):
 '<p class="v4-no-matches">'+(STATE.tab==='live'?'Bu ligde şu anda canlı maç yok.':'Bugün bu ligde maç yok.')+'</p>')+'</section>').join('');
}
function screenMatches(){
 const items=v4Visible();
 const dates=Array.from({length:7},(_,i)=>i-3).map(n=>'<button class="v4-date '+(STATE.day===n?'on':'')+'" data-day="'+n+'"><small>'+getDate(n).slice(8)+'.'+getDate(n).slice(5,7)+'</small><b>'+(n===0?'Bugün':n===-1?'Dün':n===1?'Yarın':getDate(n).slice(8)+'.'+getDate(n).slice(5,7))+'</b></button>').join('');
 const tabs=[['today','Tümü'],['live','● Canlı'],['finished','Biten'],['favorites','☆ Favoriler']].map(x=>'<button class="top-tab '+(STATE.tab===x[0]?'on':'')+'" data-top-tab="'+x[0]+'">'+x[1]+'</button>').join('');
 const extra=new Map();for(const m of [...STATE.matches,...STATE.liveMatches])if(!V4_LEAGUES.some(l=>l[0]===m.leagueKey))extra.set(m.leagueKey,m.league);
 const filters=[['Tümü','Tüm Ligler'],...V4_LEAGUES,...extra.entries()].map(x=>'<button class="chip '+(STATE.filter===x[0]?'on':'')+'" data-filter="'+encodeURIComponent(x[0])+'">'+escapeHtml(x[1])+'</button>').join('');
 return '<div class="v4-dates">'+dates+'</div><div class="top-tabs">'+tabs+'</div>'+
 '<div class="v4-tools"><label>⌕ <input id="search" type="search" placeholder="Takım veya lig ara…" value="'+escapeHtml(STATE.term)+'"></label><button data-refresh="1">↻ Yenile</button></div>'+
 '<div class="v4-filter">'+filters+'</div>'+
 '<div class="v4-summary"><span>'+items.length+' maç · '+(bsdToken?'BSD':'SportScore')+'</span><span>'+(STATE.loading?'Güncelleniyor…':STATE.last?new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'Veri bekleniyor')+'</span></div>'+
 (STATE.error?'<div class="errorbox">⚠ '+escapeHtml(STATE.error)+'</div>':'')+
 '<div id="match-results">'+groupedCards(items)+'</div>';
}
function render(){
 $('live-count').textContent=String(STATE.liveMatches.length||STATE.matches.filter(isLive).length);
 $('today-count').textContent=String(STATE.matches.length);
 $('updated-at').textContent=STATE.last?new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';
 $('source-label').textContent=bsdToken?'BSD API':'SPORTSCORE';
 $('content').innerHTML=STATE.match?detailScreen(STATE.match):STATE.tab==='settings'?screenSettings():screenMatches();
 $('credit').innerHTML=bsdToken?'Veri kaynağı: BSD · Anlık veri gecikmeli olabilir':'<a href="https://sportscore.com/">Powered by SportScore</a>';
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===STATE.tab));
}
function switchTab(tab){
 if(tab===STATE.tab)return;
 STATE.tab=tab;STATE.match=null;STATE.details=null;STATE.filter='Tümü';STATE.term='';
 if(tab==='settings'){render();return}
 if(tab==='live')STATE.day=0;
 render();
 if(tab==='live'){v4RefreshLive();if(!STATE.matches.length)refresh(true)}
 else if(!STATE.matches.length)refresh(true);
}

// Scheduled refresh only while app is visible and while match lists are in use.
// Poll frequently only while the app is visible and matches are live.
// lastAttempt prevents retry storms when the data provider is unavailable.

setInterval(()=>{
 if(document.visibilityState==='hidden'||STATE.match||STATE.tab==='settings'||STATE.loading||STATE.liveLoading)return;
 const hasLive=STATE.tab==='live'||STATE.liveMatches.length>0||STATE.matches.some(isLive);
 const liveDelay=bsdToken?(hasLive?15000:60000):65000;
 if((STATE.day===0||STATE.tab==='live')&&Date.now()-Math.max(STATE.lastLiveAttempt,STATE.lastLive)>=liveDelay){v4RefreshLive();return;}
 if(STATE.tab!=='live'&&Date.now()-STATE.lastFixtures>=300000)refresh();
},1000);
window.onNativeBack=()=>{if(STATE.match){STATE.match=null;STATE.details=null;render();return true}if(STATE.tab!=='today'){STATE.tab='today';render();return true}return false};
if(bsdToken)STATE.source='bsd';render();refresh();
</script></body></html>
