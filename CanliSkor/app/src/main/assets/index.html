<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101e"><title>Canlı Skor+</title>
<style>
:root{--bg:#07111e;--base:#0d1b2c;--paper:#12263a;--muted:#879daf;--txt:#f5f9ff;--line:#253d4b;--lime:#b4ff45;--teal:#55d7b2;--red:#ff5a68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--lime)}
#app{max-width:800px;margin:auto;min-height:100dvh;padding-bottom:calc(79px + env(safe-area-inset-bottom))}
.header{padding:calc(13px + env(safe-area-inset-top)) 14px 12px;background:radial-gradient(ellipse at 80% 5%,#164f4f80,transparent 56%),linear-gradient(122deg,#0a1623,#0b2131 67%,#0c2930);position:relative;overflow:hidden;border-bottom:1px solid #2e4a49}
.header:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 48%,#b4ff4510 49%,transparent 50%),radial-gradient(circle at 84% 4%,#b4ff4565 0%,transparent 4%),radial-gradient(circle at 73% 4%,#fff7 0%,transparent 4%);pointer-events:none}
.titlebar,.brand{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.titlebar{justify-content:space-between}
.brand-mark{height:39px;width:39px;border-radius:12px;background:linear-gradient(135deg,#d0ff5d,#8ce53d);display:grid;place-items:center;color:#092010;box-shadow:0 5px 17px #afff3d3d;font-size:24px}
.title{font-size:22px;letter-spacing:-.8px;font-weight:900}.subtitle{font-size:10px;color:#a6bcb9}
.status-pill{display:flex;align-items:center;gap:6px;background:#142e31aa;border:1px solid #45635d;border-radius:99px;padding:6px 8px;font-size:9px;letter-spacing:.4px;color:#c1e9d7;max-width:120px}
.dot{display:inline-block;height:6px;width:6px;background:var(--lime);border-radius:50%;box-shadow:0 0 9px var(--lime)}
.live-strip{margin-top:12px;display:flex;gap:0;align-items:center;border:1px solid #405d52;border-radius:10px;background:linear-gradient(120deg,#213c39,#142b35);box-shadow:inset 0 1px #ffffff13,0 7px 15px #0003;position:relative;z-index:1;min-height:37px}
.live-strip .s-item{flex:1;text-align:center;padding:8px 1px;color:#afc2c7;font-size:10px;border-right:1px solid #426054}
.live-strip .s-item:last-child{border:0}
.live-strip b{font-size:13px;color:white}.live-strip .live-number{color:var(--lime)}
.section{padding:12px 9px 8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title{font-size:16px;font-weight:850}.muted{font-size:11px;color:var(--muted)}
.datebar{display:flex;align-items:center;gap:5px;margin:2px 0 10px;padding:5px;background:#112236;border:1px solid #293f4e;border-radius:12px}
.date-btn{background:transparent;border:0;min-width:0;flex:1;padding:8px 4px;color:#9cb3c6;border-radius:8px;font-size:12px;font-weight:750}
.date-btn.on{background:linear-gradient(135deg,#d2ff67,#9bed39);box-shadow:0 3px 10px #9cf44742;color:#112413}
.top-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:8px 0 9px}
.top-tab{padding:11px 3px;border:1px solid #2c4c53;border-radius:10px;background:linear-gradient(160deg,#1a3345,#0f2433);color:#bccdd6;font-size:12px;font-weight:760;white-space:nowrap}
.top-tab.on{background:linear-gradient(140deg,#b8ff4a,#88dd32);color:#0e2413;box-shadow:0 0 14px #a5ff2d45;border-color:#c1ff69}
.toolbar{display:flex;gap:6px;margin:0 0 7px}
.searchbox{height:35px;border:1px solid #33505b;background:#0f1e2b;border-radius:10px;display:flex;align-items:center;gap:7px;padding:0 10px;color:#8ca8b2;flex:1;min-width:0}
.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f7fbff;font-size:12px}.searchbox input::placeholder{color:#8196a7}
.refresh-btn{height:35px;border:1px solid #55704c;color:#c5f989;background:linear-gradient(150deg,#1c4539,#18352e);border-radius:10px;padding:0 11px;font-size:11px;font-weight:800;flex-shrink:0}
.filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0 7px}.filter::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 12px;border:1px solid #324a5a;border-radius:30px;background:#132536;color:#adc0cb;font-size:11px;font-weight:650}
.chip.on{color:#142416;background:linear-gradient(140deg,#a6f345,#c5ff68);border-color:#b9ff5b}
.list-summary{font-size:11px;color:#98b1bb;display:flex;justify-content:space-between;align-items:center;margin:2px 1px 8px}
.list-summary strong{color:#e3f2fc}
.league-group{border:1px solid #38515c;border-radius:12px;background:linear-gradient(155deg,#132b3b,#0d1a2b);overflow:hidden;margin:0 0 10px;box-shadow:0 5px 18px #020d1580,inset 0 1px #ffffff13}
.league-head{height:33px;display:flex;justify-content:space-between;align-items:center;gap:9px;padding:0 10px;background:linear-gradient(115deg,#1b3a43,#152737);border-bottom:1px solid #35525c}
.league-head strong{font-size:12px;letter-spacing:-.05px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.league-head span{font-size:10px;color:#9fbabf;flex-shrink:0}
.match{display:grid;grid-template-columns:39px minmax(0,1fr) 50px minmax(0,1fr) 24px;gap:4px;align-items:center;min-height:53px;padding:8px 6px;border-top:1px solid #263c49;cursor:pointer}
.match:first-of-type{border-top:0}.match:hover{background:#20374a}
.match-info{font-size:10px;color:#adc2cb;font-weight:750;text-align:center;line-height:1.25;word-break:keep-all}
.score-live{color:var(--lime)}
.match-info.is-live:before{content:'●';display:block;font-size:9px;color:#fb5260;text-shadow:0 0 7px #fd6476}
.match-info.is-live .live-mini{display:block;font-size:9px;color:var(--lime);letter-spacing:.15px}
.club{display:flex;align-items:center;min-width:0;gap:4px;font-size:11.5px;font-weight:650}
.club.away{flex-direction:row-reverse;text-align:left}
.club-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crest{height:20px;width:20px;flex-shrink:0;border-radius:50%;background:linear-gradient(150deg,#2f4758,#1e3142);border:1px solid #526a7a;display:grid;place-items:center;font-size:10px;font-weight:900;color:#f2ffed}
.match-score{white-space:nowrap;text-align:center;font-size:17px;font-weight:900;letter-spacing:.4px;padding:5px 0;border-radius:8px;background:linear-gradient(150deg,#243c48,#142533);box-shadow:inset 0 1px #ffffff14}
.match-score.is-live{color:var(--lime);background:linear-gradient(150deg,#2a4b37,#172c30)}
.star{font-size:21px;border:0;color:#738fa2;background:none;padding:0 1px;line-height:1}.star.saved{color:#b6ff43}
.empty{border:1px dashed #39505b;background:#142638;border-radius:12px;text-align:center;padding:23px 12px;margin:15px 1px}
.empty-icon{font-size:30px}.empty h3{font-size:16px;margin:6px 0}.empty p{font-size:12px;color:var(--muted);line-height:1.5}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:800px;background:#091827fb;border-top:1px solid #3f5a5c;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 7px calc(5px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -8px 27px #0008}
.nav button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;border:0;background:none;color:#91a5b1;font-size:10px;padding:5px 2px;font-weight:700}
.nav span{font-size:21px}.nav button.on{color:var(--lime);text-shadow:0 0 14px #abff4975}
.credit{font-size:10px;text-align:center;color:#94a7b5;margin:15px}.credit a{color:#a8edb8}
.loading{text-align:center;padding:20px;color:#c9e4d2}.spinner{height:15px;width:15px;border:2px solid #3a5860;border-top-color:var(--lime);border-radius:50%;display:inline-block;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.errorbox,.banner{margin:9px 0;border:1px solid #7a5060;color:#f6bbca;background:#352630;padding:10px;border-radius:9px;font-size:12px}
.setting{background:#13283b;border:1px solid #365366;border-radius:14px;padding:14px;margin:12px 0}.setting h3{font-size:15px;margin:0 0 8px}.setting p{font-size:12px;color:var(--muted);line-height:1.6}
.setting input{width:100%;margin:8px 0;border:1px solid #4c6778;background:#0c1c2b;color:#fff;border-radius:8px;padding:12px}
.primary{border:0;background:var(--lime);color:#162817;font-weight:800;padding:11px;border-radius:9px}.secondary,.smallbtn{background:#1a3145;color:#f1f8ff;border:1px solid #345367;padding:10px 11px;border-radius:9px}
.setting-actions,.gridlinks{display:flex;gap:6px}.gridlinks a{background:#1b3245;padding:10px;color:#bef5c7;text-decoration:none;border-radius:9px;flex:1;font-size:11px}
.label{font-size:11px;color:#b1c9d0}.limit-note{margin-top:10px;color:var(--muted);font-size:11px}
.detail-hero{background:linear-gradient(145deg,#1b3d48,#112438);border:1px solid #4b6863;padding:16px;border-radius:14px;margin:13px 0}.detail-teams{display:flex;gap:12px;align-items:center;text-align:center;justify-content:space-between}
.detail-teams>div{flex:1;min-width:0}.detail-score{font-size:25px;font-weight:900;white-space:nowrap}.detail-teamname{font-size:12px;font-weight:800;overflow-wrap:anywhere;margin-top:7px}.detail-tag{color:var(--lime);text-align:center;margin-top:10px;font-size:12px}
.back{border:0;background:none;color:var(--lime);padding:5px 0 11px}.event{display:flex;gap:10px;align-items:center;border-bottom:1px solid #2b4a53;padding:12px 5px;font-size:12px}.event small{width:35px;color:var(--lime)}
.stats-row{margin:13px 0}.stats-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.track{height:8px;border-radius:9px;background:#294152;display:flex;overflow:hidden}.track div:first-child{background:var(--lime)}.track div:last-child{background:#5692d8}
@media(max-width:360px){.match{grid-template-columns:35px minmax(0,1fr) 45px minmax(0,1fr) 21px;gap:3px;padding:7px 4px}.club{font-size:10.5px}.crest{width:18px;height:18px}.status-pill{max-width:105px}}
</style></head><body><div id="app">
<header class="header">
  <div class="titlebar"><div class="brand"><div class="brand-mark">⚽</div><div><div class="title">Canlı Skor<span style="color:var(--lime)">+</span></div><div class="subtitle">Tüm maçlar, tek ekranda</div></div></div>
  <span class="status-pill"><i class="dot"></i><span id="source-label">BAĞLANIYOR</span></span></div>
  <div class="live-strip"><div class="s-item"><b class="live-number" id="live-count">—</b> CANLI</div><div class="s-item"><b id="today-count">—</b> MAÇ</div><div class="s-item">GÜNCELLEME <b id="updated-at">—</b></div></div>
</header>
<main id="content" class="section"></main><div class="credit" id="credit"></div></div>
<nav class="nav" id="nav">
<button data-tab="today" class="on"><span>▦</span>Maçlar</button>
<button data-tab="live"><span>◉</span>Canlı</button>
<button data-tab="favorites"><span>☆</span>Favoriler</button>
<button data-tab="settings"><span>⚙</span>Ayarlar</button>
</nav>
<script>
'use strict';
const $=id=>document.getElementById(id); const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const STATE={tab:'today',day:0,filter:'Tümü',term:'',match:null,matches:[],loading:false,error:'',last:0,lastAttempt:0,source:'sportscore',details:null};
const API_BSD='https://sports.bzzoiro.com',API_SS='https://sportscore.com';
let bsdToken=localStorage.getItem('bsdToken')||''; let favorites=new Set(JSON.parse(localStorage.getItem('canliFavorites')||'[]')); const pending=new Map(); let seq=0;
function nativeAvailable(){return typeof window.AndroidApi!=='undefined' && typeof AndroidApi.request==='function'}
window.__nativeResult=function(id,status,body){let o=pending.get(id);if(!o)return;pending.delete(id);let data;try{data=JSON.parse(body)}catch(e){o.reject(new Error('Geçersiz JSON yanıtı'));return}if(status<200||status>=300){let msg=(data&&data.detail)||data.message||('HTTP '+status);o.reject(new Error(typeof msg==='string'?msg:'HTTP '+status));return}o.resolve(data)};
function request(url,token=''){if(nativeAvailable())return new Promise((resolve,reject)=>{let id='r'+(++seq);pending.set(id,{resolve,reject});AndroidApi.request(url,token,id);setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('Bağlantı zaman aşımına uğradı'))}},18000)});return fetch(url,{headers:token?{'Authorization':'Token '+token}:{},cache:'no-store'}).then(async r=>{let j=await r.json();if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j})}
function getDate(offset=0){let now=new Date();now.setHours(12,0,0,0);now.setDate(now.getDate()+offset);return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')}
function showDate(iso){if(!iso)return '';let d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'})}
function showDateFull(iso){if(!iso)return '';let d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Istanbul'})}
function first(obj,keys,def=''){for(let k of keys){let v=obj?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return def}
function textVal(v){return typeof v==='object'&&v!==null?first(v,['name','short_name','title','display_name'],''):v||''}
function num(v){return (v===null||v===undefined||v==='')?'—':String(v)}
function normalize(row,provider){const b=provider==='bsd';let ho=first(row,['home_team','home','homeTeam','team_home','home_team_name']);let aw=first(row,['away_team','away','awayTeam','team_away','away_team_name']);let league=first(row,['league','competition','tournament','league_name']);let date=first(row,['event_date','start_time','kickoff','time','start_at','date']);let status=String(first(row,['status','match_status'],'upcoming')).toLowerCase();if(['in_progress','playing','in-play','inplay','1h','2h','ht','extra_time','et','penalties'].includes(status))status='live';if(status==='ft'||status==='ended')status='finished';let hName=String(textVal(ho)||first(row,['home_name','home_team_name'],'Ev sahibi')),aName=String(textVal(aw)||first(row,['away_name','away_team_name'],'Deplasman'));let minute=first(row,['current_minute','minute','elapsed','status_text'],'');let id=String(first(row,['id','event_id','match_id','slug'],[hName,aName,date].join('-')));let scoreH=first(row,['home_score','score_home','homeGoals'],null),scoreA=first(row,['away_score','score_away','awayGoals'],null);if(scoreH===null&&row.score&&typeof row.score==='object'){scoreH=first(row.score,['home','home_score'],null);scoreA=first(row.score,['away','away_score'],null)}if(b&&row.extra_time_score){let eh=first(row.extra_time_score,['home','home_score'],0),ea=first(row.extra_time_score,['away','away_score'],0);if(scoreH!==null&&scoreA!==null){scoreH=Number(scoreH)+Number(eh||0);scoreA=Number(scoreA)+Number(ea||0)}}return {provider,id,slug:String(row.slug||''),home:hName,away:aName,league:String(textVal(league)||'Diğer Ligler'),time:date,status,minute,hs:scoreH,as:scoreA,raw:row}}
function arrayOf(x){if(Array.isArray(x))return x;for(let k of ['results','matches','fixtures','events','data','live'])if(Array.isArray(x?.[k]))return x[k];return []}
async function getMatches(day=0,liveOnly=false){let date=getDate(day),items=[];if(bsdToken){let endpoint=liveOnly?'/api/v2/events/live/':'/api/v2/events/?date_from='+date+'&date_to='+date+'&limit=200';let data=await request(API_BSD+endpoint,bsdToken);items=arrayOf(data).map(x=>normalize(x,'bsd'));STATE.source='bsd';return liveOnly?items.filter(x=>x.status==='live'):items}
let url=liveOnly?API_SS+'/api/widget/matches/?sport=football&limit=50':API_SS+'/api/v1/fixtures/?sport=football&date='+date+'&limit=200';let data;try{data=await request(url)}catch(e){if(liveOnly||day!==0)throw e;data=await request(API_SS+'/api/widget/matches/?sport=football&limit=50')}
items=arrayOf(data).map(x=>normalize(x,'sportscore'));STATE.source='sportscore'; if(liveOnly)return items.filter(x=>x.status==='live');return items}
const isLive=m=>m.status==='live';const isFinal=m=>m.status==='finished';const matchKey=m=>(m.provider==='bsd'?'b':'s')+':'+(m.slug||m.id);function saved(m){return favorites.has(matchKey(m))}
function saveMatch(m){let key=matchKey(m);if(favorites.has(key))favorites.delete(key);else favorites.add(key);localStorage.setItem('canliFavorites',JSON.stringify([...favorites]));render()}
function statusText(m){if(isLive(m))return m.minute?(/\d/.test(String(m.minute)) ? String(m.minute).replace(/[^\d+']/g,'').slice(0,5)+(String(m.minute).includes("'")?'':"'") : String(m.minute).slice(0,8)):'CANLI';if(isFinal(m))return 'MS';if(m.status==='postponed')return 'ERT';if(m.status==='cancelled')return 'İPT';return showDate(m.time)||'—'}
function scoreText(m,side){if(!isLive(m)&&!isFinal(m))return '–';return num(side==='home'?m.hs:m.as)}
function crest(name){return escapeHtml(String(name||'?').trim().charAt(0).toLocaleUpperCase('tr-TR'))}
function matchCard(m){
  let key=encodeURIComponent(matchKey(m)), live=isLive(m), st=escapeHtml(statusText(m)), home=escapeHtml(m.home),away=escapeHtml(m.away);
  let status=live?`<span class="live-mini">CANLI</span><b>${st}</b>`:`<b>${st}</b>`;
  return `<article class="match" data-open="${key}" title="${home} - ${away}">
    <div class="match-info ${live?'is-live':''}">${status}</div>
    <div class="club home"><span class="crest">${crest(m.home)}</span><span class="club-name">${home}</span></div>
    <div class="match-score ${live?'is-live':''}">${escapeHtml(scoreText(m,'home'))}<span style="font-size:11px;opacity:.6">:</span>${escapeHtml(scoreText(m,'away'))}</div>
    <div class="club away"><span class="crest">${crest(m.away)}</span><span class="club-name">${away}</span></div>
    <button class="star ${saved(m)?'saved':''}" data-star="${key}" aria-label="${saved(m)?'Favorilerden çıkar':'Favorilere ekle'}">${saved(m)?'★':'☆'}</button>
  </article>`;
}
function groupedCards(items){
  const by=new Map();
  for(const m of items){let k=m.league||'Diğer Ligler';if(!by.has(k))by.set(k,[]);by.get(k).push(m)}
  if(!items.length)return `<div class="empty"><div class="empty-icon">⚽</div><h3>${STATE.tab==='live'?'Şu anda canlı maç görünmüyor':'Bu filtrede maç bulunamadı'}</h3><p>Veri sağlayıcısında maç bulunmuyor. Başka bir tarih seçebilir veya yenileyebilirsin.</p><button class="secondary" data-refresh="1">↻ Yenile</button></div>`;
  const priority=l=>/Süper Lig|Turkey|Türkiye|Trendyol/i.test(l)?0:/Şampiyonlar|Champions|UEFA/i.test(l)?1:/Premier League|England/i.test(l)?2:3;
  return [...by].sort((a,b)=>priority(a[0])-priority(b[0])||a[0].localeCompare(b[0],'tr')).map(([league,ms])=>
    `<section class="league-group"><div class="league-head"><strong>◈ ${escapeHtml(league)}</strong><span>${ms.length} maç ›</span></div>${ms.sort((a,b)=>Number(isLive(b))-Number(isLive(a))||String(a.time||'').localeCompare(String(b.time||''))).map(matchCard).join('')}</section>`
  ).join('');
}
function titleRow(title){return `<div class="row"><div><div class="section-title">${title}</div><div class="muted">${STATE.last?('Son güncelleme: '+new Date(STATE.last).toLocaleTimeString('tr-TR')):'Canlı veri bekleniyor'}</div></div><button class="refresh-btn" data-refresh="1">↻ Yenile</button></div>`}
function dateLabel(offset){if(offset===0)return 'Bugün';if(offset===-1)return 'Dün';if(offset===1)return 'Yarın';let date=new Date();date.setDate(date.getDate()+offset);return date.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})}
function screenMatches(){
  let items=STATE.matches;
  if(STATE.tab==='live')items=items.filter(isLive);
  if(STATE.tab==='finished')items=items.filter(isFinal);
  if(STATE.tab==='favorites')items=items.filter(saved);
  if(STATE.filter!=='Tümü')items=items.filter(m=>m.league===STATE.filter);
  if(STATE.term.trim())items=items.filter(m=>(m.home+' '+m.away+' '+m.league).toLocaleLowerCase('tr-TR').includes(STATE.term.toLocaleLowerCase('tr-TR').trim()));
  let leagues=[...new Set(STATE.matches.map(x=>x.league))].sort((x,y)=>x.localeCompare(y,'tr'));
  let buttons=[['today','Tümü'],['live','◉ Canlı'],['finished','Biten'],['favorites','☆ Favoriler']].map(([tab,label])=>
    `<button data-top-tab="${tab}" class="top-tab ${STATE.tab===tab?'on':''}">${label}</button>`).join('');
  let cards=STATE.loading && !STATE.matches.length ? '<div class="loading"><i class="spinner"></i> Maçlar yükleniyor…</div>' : groupedCards(items);
  return `<div class="datebar">
    <button class="date-btn" data-day="${STATE.day-1}" aria-label="Önceki gün">‹ ${dateLabel(STATE.day-1)}</button>
    <button class="date-btn on" data-day="${STATE.day}">▦ ${dateLabel(STATE.day)}</button>
    <button class="date-btn" data-day="${STATE.day+1}" aria-label="Sonraki gün">${dateLabel(STATE.day+1)} ›</button>
  </div>
  <div class="top-tabs">${buttons}</div>
  <div class="toolbar"><label class="searchbox">⌕ <input type="search" id="search" autocomplete="off" placeholder="Takım veya lig ara…" value="${escapeHtml(STATE.term)}"></label><button class="refresh-btn" data-refresh="1">↻ Yenile</button></div>
  <div class="filter"><button data-filter="${encodeURIComponent('Tümü')}" class="chip ${STATE.filter==='Tümü'?'on':''}">Tüm Ligler</button>${leagues.map(l=>`<button data-filter="${encodeURIComponent(l)}" class="chip ${STATE.filter===l?'on':''}">${escapeHtml(l)}</button>`).join('')}</div>
  <div class="list-summary"><span><strong>${items.length}</strong> maç gösteriliyor</span><span>${STATE.loading?'● Yenileniyor':STATE.last?'● Son: '+new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'Veri bekleniyor'}</span></div>
  ${STATE.error?`<div class="errorbox">⚠ ${escapeHtml(STATE.error)}</div>`:''}
  <div id="match-results">${cards}</div>`;
}
function screenSettings(){return `${titleRow('⚙ Veri Kaynağı Ayarları')}<div class="setting"><h3>🚀 BSD — daha sık güncelleme</h3><p>Ücretsiz BSD hesabından aldığın API anahtarını gir. Maçlar ve canlı skorlar BSD'den alınır. Bu sürüm test içindir; halka açık sürümde anahtar sunucu tarafında saklanmalıdır.</p><div class="label">BSD API ANAHTARI</div><input id="token" type="password" placeholder="API anahtarını buraya yapıştır" value="${escapeHtml(bsdToken)}" spellcheck="false" autocomplete="off"><div class="setting-actions"><button class="primary" data-save-token="1">Kaydet ve bağlan</button><button class="secondary" data-clear-token="1">Anahtarsız kullan</button></div><div class="limit-note">BSD: 7.500 istek/gün ücretsiz; Canlı ekranı ve canlı maç bulunan bugünkü liste 15 saniyede bir kontrol edilir. Canlı maç yokken 60 saniyede bir kontrol edilir. Her cihazın ayrı istek yaptığı bu test sürümü çok kullanıcılı yayın için uygun değildir.</div></div><div class="setting"><h3>🌍 SportScore — anahtarsız</h3><p>API anahtarı girilmediğinde otomatik kullanılır. Ücretsiz kaynak; sunucu yanıtları 60 saniye önbellekte tutulur ve günlük yaklaşık 10.000 istek/IP sınırı vardır. Kapsam tüm ligler için garanti değildir.</p><div class="gridlinks"><a href="https://sports.bzzoiro.com/register/">BSD hesabı oluştur ↗</a><a href="https://sportscore.com/developers/">SportScore şartları ↗</a></div></div><div class="setting"><h3>ℹ Uygulama bilgisi</h3><p>Canlı maçları görüntüler, favorileri bu cihazda saklar. Arka plan gol bildirimi ve canlı maç video yayını bu test sürümüne dahil değildir. Kaynak verisi bazen gecikmeli gelebilir.</p><p>Aktif kaynak: <b>${STATE.source==='bsd'?'BSD':'SportScore'}</b>. Veriler güncellenmediğinde eski skorlar canlıymış gibi gösterilmez.</p></div>`}
async function openDetail(m){STATE.match=m;STATE.details=null;STATE.error='';render();try{if(m.provider==='bsd'&&bsdToken){let [inc,stats]=await Promise.allSettled([request(API_BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/incidents/',bsdToken),request(API_BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/stats/',bsdToken)]);STATE.details={inc:inc.status==='fulfilled'?inc.value:null,stats:stats.status==='fulfilled'?stats.value:null}}else if(m.slug){STATE.details={ss:await request(API_SS+'/api/widget/match/?sport=football&slug='+encodeURIComponent(m.slug))}}else{STATE.details={}}}catch(e){STATE.details={err:e.message}}render()}
function statRow(label,left,right){let l=Number(left),r=Number(right);if(!Number.isFinite(l)||!Number.isFinite(r)||left===null||right===null)return '';let total=l+r,percentage=total?100*l/total:50;return `<div class="stats-row"><div class="stats-top"><b>${escapeHtml(left)}</b><span>${escapeHtml(label)}</span><b>${escapeHtml(right)}</b></div><div class="track"><div style="width:${percentage}%"></div><div style="width:${100-percentage}%"></div></div></div>`}
function detailScreen(m){let html=`<button class="back" data-back="1">‹ Maçlara dön</button><div class="section-title">${escapeHtml(m.league)}</div><div class="detail-hero"><div class="muted" style="text-align:center;margin-bottom:14px">${escapeHtml(showDateFull(m.time))} ${escapeHtml(showDate(m.time))}</div><div class="detail-teams"><div><div class="crest" style="width:50px;height:50px;font-size:21px;margin:auto">${crest(m.home)}</div><div class="detail-teamname">${escapeHtml(m.home)}</div></div><div class="detail-score">${scoreText(m,'home')} : ${scoreText(m,'away')}</div><div><div class="crest" style="width:50px;height:50px;font-size:21px;margin:auto">${crest(m.away)}</div><div class="detail-teamname">${escapeHtml(m.away)}</div></div></div><div class="detail-tag">${escapeHtml(statusText(m))} ${isLive(m)?' • CANLI':''}</div></div>`;
if(!STATE.details)return html+'<div class="loading"><span class="spinner"></span>Maç ayrıntıları getiriliyor…</div>';
if(STATE.details.err)html+=`<div class="errorbox">${escapeHtml(STATE.details.err)}</div>`;
let data=STATE.details.inc, events=arrayOf(data);if(!events.length)events=Array.isArray(data?.incidents)?data.incidents:[];if(STATE.details.ss){let d=STATE.details.ss;events=first(d,['timeline','incidents','events'],[]);if(!Array.isArray(events))events=[]}
html+='<h3>📋 Maç olayları</h3>';html+=events.length?events.map(e=>{let ty=String(first(e,['type','incident_type'],'')).toLowerCase(),ico=ty.includes('goal')?'⚽':ty.includes('card')?'🟨':ty.includes('sub')?'🔁':'•',time=first(e,['minute','time','match_minute'],'—'),name=textVal(first(e,['player','player_name','text','description'],''));return `<div class="event"><small>${escapeHtml(String(time))}'</small><span>${ico}</span><div><b>${escapeHtml(ty.replaceAll('_',' '))}</b> ${escapeHtml(name)}</div></div>`}).join(''):'<p class="muted">Bu maç için olay verisi henüz mevcut değil.</p>';
let s=STATE.details.stats?.stats;if(s&&s.home&&s.away){html+='<h3>📊 İstatistikler</h3>';for(const [label,key] of [['Topla oynama (%)','ball_possession'],['Şutlar','total_shots'],['İsabetli şutlar','shots_on_target'],['Korner','corner_kicks'],['Fauller','fouls'],['Sarı kart','yellow_cards']])html+=statRow(label,s.home[key],s.away[key])}else html+='<h3>📊 İstatistikler</h3><p class="muted">Bu maç için istatistik bulunmuyor veya veri kaynağı desteklemiyor.</p>';return html}
function render(){
  let live=STATE.matches.filter(isLive).length;
  $('live-count').textContent=String(live);
  $('today-count').textContent=String(STATE.matches.length);
  $('updated-at').textContent=STATE.last?new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';
  $('source-label').textContent=STATE.source==='bsd'?'BSD API':'SPORTSCORE';
  $('content').innerHTML=STATE.match?detailScreen(STATE.match):STATE.tab==='settings'?screenSettings():screenMatches();
  $('credit').innerHTML=STATE.source==='sportscore'?'<a href="https://sportscore.com/" rel="dofollow">Powered by SportScore</a> · Verilerde gecikme olabilir':'Veri kaynağı: BSD · Verilerde gecikme olabilir';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===STATE.tab));
}
async function refresh(force=false){if(STATE.loading)return;STATE.lastAttempt=Date.now();STATE.loading=true;STATE.error='';render();try{let list=await getMatches(STATE.day,STATE.tab==='live'&&STATE.day===0);STATE.matches=list;STATE.last=Date.now();let cache={matches:list.map(x=>({...x,raw:undefined})),last:STATE.last,source:STATE.source,day:STATE.day};localStorage.setItem('scoreCache',JSON.stringify(cache))}catch(e){STATE.error=e.message||'Bağlantı kurulamadı. İnternetini kontrol et.';if(!STATE.matches.length){try{let cache=JSON.parse(localStorage.getItem('scoreCache')||'null');if(cache&&cache.day===STATE.day){STATE.matches=cache.matches||[];STATE.last=0;STATE.error+=' • Gösterilenler daha önce kaydedilmiş sonuçlardır.'}}catch(_){}}}finally{STATE.loading=false;render()}}
function switchTab(tab){
  if(tab===STATE.tab){render();return}
  STATE.tab=tab;STATE.match=null;STATE.details=null;STATE.filter='Tümü';STATE.term='';
  if(tab==='settings'){render();return}
  // Live and finished filters always operate on today's fixtures.
  STATE.day=0;STATE.matches=[];refresh(true);
}
$('nav').addEventListener('click',e=>{
  let b=e.target.closest('[data-tab]');
  if(b)switchTab(b.dataset.tab);
});
$('content').addEventListener('click',e=>{
  let b=e.target.closest('button');
  if(b){
    if(b.dataset.refresh){refresh(true);return}
    if(b.dataset.topTab){switchTab(b.dataset.topTab);return}
    if(b.dataset.day!==undefined){
      let day=Math.max(-10,Math.min(10,Number(b.dataset.day)));
      if(day!==STATE.day){STATE.day=day;STATE.tab='today';STATE.matches=[];STATE.filter='Tümü';STATE.term='';refresh(true);}
      return;
    }
    if(b.dataset.filter!==undefined){STATE.filter=decodeURIComponent(b.dataset.filter);render();return}
    if(b.dataset.star){e.stopPropagation();let key=decodeURIComponent(b.dataset.star);let m=STATE.matches.find(x=>matchKey(x)===key);if(m)saveMatch(m);return}
    if(b.dataset.back){STATE.match=null;STATE.details=null;render();return}
    if(b.dataset.saveToken){
      let value=$('token').value.trim();bsdToken=value;localStorage.setItem('bsdToken',value);
      STATE.source=value?'bsd':'sportscore';STATE.match=null;STATE.tab='today';STATE.day=0;STATE.matches=[];refresh(true);return;
    }
    if(b.dataset.clearToken){
      bsdToken='';localStorage.removeItem('bsdToken');STATE.source='sportscore';
      STATE.match=null;STATE.tab='today';STATE.day=0;STATE.matches=[];refresh(true);return;
    }
  }
  let card=e.target.closest('[data-open]');
  if(card){let key=decodeURIComponent(card.dataset.open);let m=STATE.matches.find(x=>matchKey(x)===key);if(m)openDetail(m)}
});
$('content').addEventListener('input',e=>{
  if(e.target.id==='search'){
    STATE.term=e.target.value;
    let a=STATE.matches;
    if(STATE.tab==='live')a=a.filter(isLive);
    if(STATE.tab==='finished')a=a.filter(isFinal);
    if(STATE.tab==='favorites')a=a.filter(saved);
    if(STATE.filter!=='Tümü')a=a.filter(m=>m.league===STATE.filter);
    a=a.filter(m=>(m.home+' '+m.away+' '+m.league).toLocaleLowerCase('tr-TR').includes(STATE.term.toLocaleLowerCase('tr-TR')));
    let box=$('match-results');if(box)box.innerHTML=groupedCards(a);
  }
});
// Scheduled refresh only while app is visible and while match lists are in use.
// Poll frequently only while the app is visible and matches are live.
// lastAttempt prevents retry storms when the data provider is unavailable.
setInterval(()=>{
  if(document.visibilityState==='hidden'||STATE.match||STATE.tab==='settings'||STATE.loading)return;
  const shouldFastRefresh=bsdToken && STATE.day===0 && (STATE.tab==='live'||STATE.matches.some(isLive));
  const intervalMs=bsdToken ? (shouldFastRefresh ? 15000 : 60000) : 65000;
  if(Date.now()-Math.max(STATE.lastAttempt||0,STATE.last||0)>=intervalMs)refresh();
},1000);
window.onNativeBack=()=>{if(STATE.match){STATE.match=null;STATE.details=null;render();return true}if(STATE.tab!=='today'){STATE.tab='today';render();return true}return false};
if(bsdToken)STATE.source='bsd';render();refresh();
</script></body></html>
