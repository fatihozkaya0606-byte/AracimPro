.game-hero:before{content:'';position:absolute;top:-40px;left:-40px;right:-40px;height:94px;z-index:-1;background:radial-gradient(circle at 15% 9%,#eaffba 0 2px,transparent 4px),radial-gradient(circle at 86% 8%,#d9ffb8 0 3px,transparent 5px),linear-gradient(90deg,transparent,#c4ff3235,transparent);filter:blur(3px);transform:perspective(140px) rotateX(28deg)}
.game-hero:after{content:'';position:absolute;inset:auto -13% -31% -13%;height:62%;z-index:-1;border-radius:50%;transform:perspective(100px) rotateX(30deg);border:2px solid #91ee7290;box-shadow:0 0 20px #90f8725c,inset 0 0 40px #78d67037;background:repeating-linear-gradient(90deg,transparent 0 26px,#caff4613 27px 28px),linear-gradient(#1d624744,#115b3880)}
.game-date{text-align:center;color:#b4ccca;font-size:11px;margin-bottom:11px}
.game-scoreline{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);align-items:center;gap:5px;min-height:125px}
.game-team{text-align:center;min-width:0}.game-team img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 5px 4px #0008)}
.game-team .team-name{font-weight:800;font-size:12px;margin-top:5px;line-height:1.23;text-shadow:0 2px 4px #0009;overflow-wrap:anywhere}
.game-team .fallback-crest{margin:auto}.fallback-crest:has(+ img){display:none}
.score-podium{position:relative;text-align:center;padding:20px 0 15px;border-radius:18px;background:linear-gradient(135deg,#3e6772,#0c2b40 51%,#102336);border:1px solid #9ad5be78;box-shadow:inset 0 2px #ffffff55,inset 0 -7px 12px #0005,0 6px 0 #062637,0 14px 16px #00141a80}
.score-podium:before{content:'⚽';position:absolute;top:-15px;left:calc(50% - 14px);font-size:25px;filter:drop-shadow(0 3px 4px #000);opacity:.9}
.score-podium .score-values{font-size:30px;letter-spacing:-1.4px;font-weight:950;text-shadow:0 4px 4px #0009}
.score-podium .score-status{display:inline-block;font-size:10px;font-weight:850;margin-top:4px;padding:4px 9px;border-radius:10px;background:#324d4d;color:#d6dfdf}
.score-podium .score-status.live{background:#a6ec3f;color:#142517;box-shadow:0 0 12px #a6fa576a}
.game-footnote{text-align:center;margin-top:14px;color:#cfe3df;font-size:11px;display:flex;gap:7px;align-items:center;justify-content:center}
.game-footnote .indicator{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b6ff4d;box-shadow:0 0 9px #aaff4d}
.game-section{border:1px solid #507780;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,#1a3a49,#101f32);box-shadow:inset 0 1px #ffffff24,0 5px 0 #0a1a2b,0 13px 21px #0006;margin-bottom:17px}
.game-section .section-head{font-size:14px;font-weight:850;padding:12px 13px;border-bottom:1px solid #54757a80;background:linear-gradient(95deg,#28534e,#1a3546);display:flex;align-items:center;justify-content:space-between}
.game-section .section-head small{font-size:10px;font-weight:500;color:#bad4d4}
.mini-score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 18px}
.mini-score-grid>div{text-align:center;padding:11px 2px;border:1px solid #5e85836d;border-radius:11px;background:linear-gradient(140deg,#28514d,#132a3a);box-shadow:inset 0 1px #ffffff41,0 4px 0 #0b2030,0 7px 10px #0005}
.mini-score-grid strong{display:block;font-size:16px;color:#c4ff70;font-weight:900}.mini-score-grid span{display:block;color:#b7cbd1;font-size:10px;margin-top:3px}
.detail-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 14px}.detail-tab{background:linear-gradient(160deg,#213f51,#112739);border:1px solid #456b75;border-radius:9px;padding:11px 3px;color:#bacbd4;font-size:11px;font-weight:760;box-shadow:inset 0 1px #ffffff21,0 4px 0 #071827}.detail-tab.on{color:#13300f;border-color:#d8ff95;background:linear-gradient(140deg,#deff89,#9ceb37);box-shadow:inset 0 1px #fff9,0 4px 0 #4b862b,0 8px 13px #bbff505c}
.stat-block{padding:10px 12px 12px;border-bottom:1px solid #365767}.stat-block:last-child{border-bottom:0}
.stat-numbers{display:grid;grid-template-columns:55px minmax(0,1fr) 55px;align-items:center;gap:3px;font-size:11px;color:#dae9f1;margin-bottom:8px}.stat-numbers b{font-size:15px;font-weight:900}.stat-numbers b:last-child{text-align:right}.stat-numbers span{text-align:center;font-weight:620}
.stat-rails{height:10px;border-radius:20px;display:flex;gap:3px;overflow:hidden;background:#091b2a;box-shadow:inset 0 2px 3px #0009}.stat-rails>div{height:100%;transition:width .6s}.stat-rails .stat-home{border-radius:18px 3px 3px 18px;background:linear-gradient(180deg,#dfff9c,#8cdf34);box-shadow:inset 0 1px #fff9}.stat-rails .stat-away{border-radius:3px 18px 18px 3px;background:linear-gradient(180deg,#82c5f4,#3e82cb);box-shadow:inset 0 1px #ffffff75}
.stat-empty{text-align:center;padding:22px 15px;color:#a7c0ce;font-size:12px;line-height:1.6}.stat-empty strong{display:block;font-size:13px;color:#e3f1f5;margin-bottom:7px}
.stat-note{padding:10px 13px;color:#9cb8c0;font-size:10px;border-top:1px solid #43636e59}
.timeline-item{display:grid;grid-template-columns:39px 26px 1fr;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid #36545f;font-size:12px}
.timeline-item:last-child{border:0}.timeline-item .mins{font-weight:850;color:#b9ff65}.timeline-item .event-type{font-weight:780;color:#e5f3f3}.timeline-item small{display:block;color:#9db3c3;margin-top:3px}
.lineup-card{padding:12px 13px;border-bottom:1px solid #335362}.lineup-card h4{margin:0 0 8px;font-size:13px}.lineup-person{font-size:11px;padding:5px 0;color:#d4e8e8;border-bottom:1px solid #ffffff10}
@media(max-width:390px){.game-scoreline{grid-template-columns:minmax(0,1fr) 106px minmax(0,1fr)}.game-team img{width:52px;height:52px}.v4-score{padding:5px 0}}
@media(prefers-reduced-motion:reduce){.v4-status.now:before{animation:none}}

.detail-crest-frame{display:grid;place-items:center;width:67px;height:67px;margin:0 auto 5px;border-radius:18px;background:linear-gradient(140deg,#40656d,#122c42);border:1px solid #99c0a1aa;box-shadow:inset 0 2px #ffffff54,0 5px 0 #062736,0 10px 13px #0006;position:relative;overflow:hidden}
.detail-crest-frame .fallback-crest{font-weight:950;font-size:26px;color:#e7ffa8;text-shadow:0 3px 4px #0007}
.detail-crest-frame .team-img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:contain;filter:drop-shadow(0 3px 2px #0009)}

/* v0.6 – responsive tonal theme + team kit palette + lineups pitch */
:root{--home-kit:#b3d6ef;--away-kit:#a9d0e6;--home-ink:#e5f0fa;--away-ink:#e5f0fa}
.theme-switch{display:flex;align-items:center;justify-content:center;border:1px solid #7e9daa66;background:linear-gradient(145deg,#234351,#112c3d);border-radius:12px;width:37px;height:37px;min-width:37px;color:#e7f7c6;font-size:18px;box-shadow:inset 0 1px #ffffff29,0 4px 10px #0004}
.header-actions{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.v4-match .v4-home{color:var(--home-ink);font-weight:750;text-shadow:0 1px 1px #0008}
.v4-match .v4-away{color:var(--away-ink);font-weight:750;text-shadow:0 1px 1px #0008}
.v4-match{position:relative;--edge-left:var(--home-kit);--edge-right:var(--away-kit)}
.v4-match:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--edge-left);border-radius:4px;opacity:.75}
.v4-match:after{content:'';position:absolute;right:0;top:10px;bottom:10px;width:3px;background:var(--edge-right);border-radius:4px;opacity:.75}
.v4-score.now{color:#dff7ed!important;background:linear-gradient(145deg,#315264,#183447)!important;border-color:#83a5a4!important;box-shadow:inset 0 1px #ffffff34,0 3px 0 #071826,0 5px 10px #0005}
.v4-status.now{color:#b8ff65!important}
.game-hero{border-top:3px solid var(--home-kit);border-bottom:3px solid var(--away-kit)}
.game-team.home .team-name{color:var(--home-ink)}
.game-team.away .team-name{color:var(--away-ink)}
.game-hero .detail-crest-frame{box-shadow:0 0 0 2px #ffffff20,0 4px 0 #061c2a,0 11px 13px #0006}
.stat-rails .stat-home{background:linear-gradient(180deg,var(--home-kit),color-mix(in srgb,var(--home-kit) 68%,#152536))!important}
.stat-rails .stat-away{background:linear-gradient(180deg,var(--away-kit),color-mix(in srgb,var(--away-kit) 68%,#152536))!important}
.kit-legend{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;color:#a7bcc7;font-size:11px;padding:5px 3px 12px}
.kit-dot{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--home-kit);border:1px solid #ffffff8a;box-shadow:inset 0 1px #fff8}
.kit-dot.away{background:var(--away-kit)}
.detail-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 8px;margin-bottom:9px}
.detail-tab{flex:0 0 auto;min-width:88px;padding:10px 9px}
.theme-settings{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.theme-option{padding:12px 7px;border-radius:12px;border:1px solid #456471;background:#1b3348;color:#e1f4fa;font-weight:750}
.theme-option.on{border-color:#b8fb6f;background:#b4f45d;color:#153010;box-shadow:inset 0 1px #fff8,0 4px 14px #8aff4b48}
.lineup-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
.lineup-two .lineup-card{border:1px solid #405969;border-radius:11px;padding:9px;min-width:0;background:#132b3b}
.lineup-two .lineup-card h4{margin:0 0 7px;font-size:11px;line-height:1.35}
.lineup-two .lineup-person{font-size:11px;line-height:1.5;padding:7px 0;overflow-wrap:anywhere}
.lineup-person .jersey{border-radius:6px;background:#264152;color:#eaf4fb;display:inline-flex;min-width:24px;min-height:22px;align-items:center;justify-content:center;margin-right:5px;font-size:10px;font-weight:800}
.lineup-person .captain{color:#b8ee70;font-size:10px}
.lineup-label{font-size:11px;color:#b0c7d3;padding:8px 0;border-bottom:1px solid #ffffff24;font-weight:700}
.lineup-note{font-size:11px;color:#b8c6d2;padding:0 12px 10px}
.formation-switch{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:11px 12px 0}
.formation-switch button{padding:9px 4px;border-radius:9px;background:#183343;color:#bdd5dc;border:1px solid #385c64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formation-switch button.on{background:#c0fa70;color:#16331b;font-weight:850;border-color:#bfff5b}
.pitch{position:relative;margin:12px auto 15px;width:calc(100% - 24px);max-width:420px;aspect-ratio:0.74;border-radius:15px;padding:15px 9px;background:repeating-linear-gradient(180deg,#1a5b46 0 14%,#18513e 14% 28%);border:2px solid #9cdeb690;box-shadow:inset 0 0 0 5px #ffffff0d,0 9px 19px #0008;overflow:hidden;display:flex;flex-direction:column-reverse;justify-content:space-evenly;gap:10px}
.pitch:before{content:'';position:absolute;inset:13px;border:1px solid #d3fff87b;pointer-events:none}
.pitch:after{content:'';position:absolute;top:50%;left:13px;right:13px;border-top:1px solid #d3fff87a;pointer-events:none}
.pitch-center{position:absolute;width:88px;height:88px;border:1px solid #d3fff87a;border-radius:50%;top:calc(50% - 44px);left:calc(50% - 44px);pointer-events:none}
.pitch-row{display:flex;justify-content:space-evenly;gap:2px;align-items:center;position:relative;z-index:2;flex:1;min-height:0}
.pitch-player{flex:1;min-width:0;max-width:90px;text-align:center;color:white;text-shadow:0 1px 3px #000;font-weight:750;font-size:9px;line-height:1.2}
.pitch-jersey{display:flex;justify-content:center;align-items:center;border-radius:6px 6px 9px 9px;width:30px;height:30px;margin:0 auto 5px;background:var(--pitch-kit,#dedede);border:1px solid #fff9;color:var(--pitch-number,#15212b);font-size:12px;font-weight:900;box-shadow:0 3px 7px #0006}
.pitch-player span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitch-caption{text-align:center;font-size:11px;font-weight:750;color:#cbe4df;padding:0 8px 8px}
.pitch-warning{font-size:10px;color:#a8bfc5;text-align:center;padding:2px 12px 14px}

body.v15 .v18-promo-fallback{display:flex;align-items:center;gap:6px;justify-content:center;min-height:166px;background:#173d53;border:1px solid #4b90a9;color:#def9f5;padding:15px;font-weight:850;border-radius:12px}

/* Two original kit silhouettes keep cards visually useful while portraits load/offline. */
body.v15 .v18-figure{position:absolute;bottom:20px;height:120px;width:114px;pointer-events:none;display:block;opacity:.95;z-index:0;filter:drop-shadow(0 6px 7px #000c)}
body.v15 .v18-figure-head{position:absolute;left:39px;top:5px;width:36px;height:40px;background:linear-gradient(145deg,#d5b29f,#805d58);border-radius:43% 44% 46% 47%;box-shadow:inset 0 6px #273745b0,0 1px 5px #0008}
body.v15 .v18-figure-neck{position:absolute;left:47px;top:35px;height:20px;width:20px;background:#a67b67}
body.v15 .v18-figure-kit{position:absolute;left:1px;top:47px;width:112px;height:72px;clip-path:polygon(20% 3%,39% 0,50% 14%,61% 0,81% 3%,100% 32%,83% 46%,83% 100%,18% 100%,17% 46%,0 32%);background:repeating-linear-gradient(90deg,var(--teamkit,#a52731) 0 21px,#ffffffba 21px 35px,var(--teamkit,#a52731) 35px 54px);box-shadow:inset 0 3px 10px #0003}
body.v15 .v18-side.away .v18-figure-kit{background:repeating-linear-gradient(90deg,var(--teamkit,#244d9d) 0 30px,#111e32ac 30px 44px,var(--teamkit,#244d9d) 44px 57px)}
body.v15 .v18-player-img{z-index:3}
body.v15 .v18-side:has(.v18-player-img:not([style*="display: none"])) .v18-figure{opacity:.22}
body.v15 .v18-side .v18-team-label{z-index:6}


/* v1.9 - Compact live-match showcase: two cards fit in a phone viewport. */
body.v15 .v17-news-bar{margin:3px 0 4px}

body.v15 .v17-news-rail{margin-bottom:2px;padding-bottom:3px;gap:7px}
body.v15 .v18-showcase-card{flex:0 0 clamp(195px,58vw,240px);height:105px;border-radius:11px;box-shadow:0 2px 5px #0007}
body.v15 .v18-side{top:5px;bottom:1px;width:45%}
body.v15 .v18-side.home{left:0}
body.v15 .v18-side.away{right:0}
body.v15 .v18-player-img{height:83px;max-width:85px;bottom:14px}

body.v15 .v18-figure{width:73px;height:78px;bottom:13px;transform:scale(.65);transform-origin:center bottom}
body.v15 .v18-team-label{font-size:8px;padding:2px 2px 1px;line-height:1.1}
body.v15 .v18-center{top:33px;min-width:60px;max-width:34%}
body.v15 .v18-score{font-size:20px;padding:3px 3px;border-radius:6px}
body.v15 .v18-min{margin-top:3px;padding:2px 4px;font-size:9px}

body.v15 .v18-showcase-card .v18-live-label{font-size:8px;top:4px;left:4px;padding:2px 4px}
body.v15 .v18-showcase-card .v18-corner-tap{font-size:8px;bottom:3px;right:3px;padding:1px 3px}

/* v2.2 launch sequence: deterministic 3.5 seconds, zero network assets */
#launch-splash{position:fixed;inset:0;z-index:40000;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background:radial-gradient(ellipse 100% 52% at 50% 115%,#175650 0%,#071b30 68%,#030a14 100%);color:#f3faff;
 transition:opacity .48s ease,visibility .48s ease;isolation:isolate}
#launch-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#launch-splash:before{content:'';position:absolute;inset:-20%;background:conic-gradient(from 10deg at 50% 20%,transparent 0 12%,#a7e9ff24 13%,transparent 15% 36%,#b4ff4530 38%,transparent 40% 69%,#95e6ff24 72%,transparent 74%);animation:v22-lights 3.5s ease-in-out both;filter:blur(7px)}
#launch-splash:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-28%;height:58%;border-radius:50%;border:3px solid #9eff7838;
 background:repeating-linear-gradient(90deg,#7cf9ad08 0 42px,#55aecd06 42px 84px),radial-gradient(ellipse,#10412f,#041b26 75%);box-shadow:0 0 60px #b4ff4525;transform:perspective(300px) rotateX(55deg)}
.launch-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;animation:v22-rise .88s ease both}
.launch-ball{font-size:78px;line-height:1;filter:drop-shadow(0 8px 8px #000b) drop-shadow(0 0 18px #9dff5f60);animation:v22-ball 3.4s cubic-bezier(.2,.8,.2,1) both}
.launch-brand{font-size:clamp(31px,10vw,42px);font-weight:950;letter-spacing:-1.4px;text-shadow:0 3px 18px #000;white-space:nowrap}
.launch-brand em{font-style:normal;color:#a9ff55}.launch-caption{color:#a4c0d2;letter-spacing:1.9px;font-size:11px;text-transform:uppercase;font-weight:700}
.launch-progress{width:176px;height:5px;border-radius:99px;background:#ffffff19;border:1px solid #9aff6540;overflow:hidden;margin-top:14px}
.launch-progress span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1a958e,#b4ff4e);border-radius:99px;animation:v22-fill 3.4s linear both;transform-origin:left}
@keyframes v22-lights{0%{transform:rotate(-18deg);opacity:.05}50%{opacity:1}100%{transform:rotate(16deg);opacity:.5}}
@keyframes v22-ball{0%{transform:scale(.3) rotate(-75deg);opacity:0}30%{transform:scale(1.14) rotate(8deg);opacity:1}45%{transform:scale(1) rotate(0)}100%{transform:scale(1.06) rotate(0)}}
@keyframes v22-rise{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}
@keyframes v22-fill{from{transform:scaleX(.01)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){#launch-splash:before,.launch-content,.launch-ball,.launch-progress span{animation:none}.launch-progress span{transform:scaleX(1)}}
/* v2.2 finish */

/* v2.2 UI personalization */
body{--v22-accent:#b4ff45}
body.v15 .v15-icon-tab.on,body.v15 .v15-pill.on,body.v15 .v15-league-pill.on{border-color:var(--v22-accent)!important}
body.v15 .v15-pill.on{box-shadow:0 0 12px color-mix(in srgb,var(--v22-accent),transparent 70%)}
.v22-setting-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.v22-toggle{padding:10px;border-radius:11px;border:1px solid #41647c;background:#142b40;color:#dbe9f4;font-size:12px;font-weight:750;min-height:40px}
.v22-toggle.on{border-color:var(--v22-accent);color:var(--v22-accent);background:#122d37}
.v22-color-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:12px 0 0}

.v22-color.on{border-color:var(--v22-accent);box-shadow:inset 0 0 8px #ffffff12}
.v22-pinned-wrap{margin:2px 1px 7px;overflow:hidden}
.v22-pinned-row{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:5px 1px}
.v22-pinned-label{white-space:nowrap;font-weight:800;font-size:11px;color:#dcf5e8;padding:5px 8px 5px 2px}
.v22-pin-chip{flex:0 0 auto;border:1px solid #426277;border-radius:16px;background:#1a3048;color:#deeff9;font-size:10px;padding:7px 9px;white-space:nowrap}

.v22-header-line{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.v22-mini-stats{position:absolute;bottom:24px;left:6px;right:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;pointer-events:none}
.v22-mini-stats span{display:block;height:3px;border-radius:6px;background:#345264}
.v22-mini-stats i{display:block;height:100%;background:var(--v22-accent);border-radius:6px}

async function paginated(url,token,maxPages=14){
 let all=[],next=url,seen=new Set();
 for(let i=0;next&&i<maxPages;i++){
  if(seen.has(next))break;
  seen.add(next);
  const data=await request(next,token);
  const rows=assertArrayShape(data,'Fikstür');
  all.push(...rows);
  let candidate=data?.next||null;
  // BSD paginates with limit and offset. Never forward the API token to other hosts.
  if(candidate && /^https:\/\/sports\.bzzoiro\.com\//.test(candidate))next=candidate;
  else if(candidate&&candidate.startsWith('/'))next=BSD+candidate;
  else if(!candidate&&Number(data?.count||0)>all.length&&rows.length){
   const nextURL=new URL(url);
   nextURL.searchParams.set('limit','200');
   nextURL.searchParams.set('offset',String(all.length));
   next=nextURL.toString();
  }else next=null;
 }
 return all;
}
async function fixtures(day){

  // a large three-day window, so future-day matches are not cut off by pagination.
  const url=BSD+'/api/v2/events/?date_from='+target+'&date_to='+target+'&limit=200';
  const todays=await paginated(url,bsdToken,14);
  // Turkey is UTC+3. Events between 00:00 and 02:59 Istanbul may belong to
  // the previous UTC calendar day, so include the preceding day's records.
  const previous=getDate(day-1);
  const previousURL=BSD+'/api/v2/events/?date_from='+previous+'&date_to='+previous+'&limit=200';
  const prevRows=await paginated(previousURL,bsdToken,14);
  const seen=new Set();
  const all=todays.concat(prevRows);
  const result=all.filter(r=>dateOf(first(r,['event_date','start_time','kickoff','kickoff_at','start_at','date'],r?.time?.kickoff_at))===target)
    .map(r=>normalize(r,'bsd')).filter(m=>{const k=matchKey(m);if(seen.has(k))return false;seen.add(k);return true});

function matchForStanding(team,live){

function leagueTableHtml(data){

 if(!groups.length)return '<div class="odds-empty">Bu lig veya sezon için puan durumu henüz paylaşılmadı.</div>';
 const live=activeLeagueMatches();
 return groups.map(g=>{
  const calculated=g.rows.map(r=>{
   const m=matchForStanding(r,live),home=m?standingIsHome(r,m):false;
   const gf=m?Number(home?m.hs:m.as):0,ga=m?Number(home?m.as:m.hs):0;
   const valid=Boolean(m&&Number.isFinite(gf)&&Number.isFinite(ga));
   const gain=valid?(gf>ga?3:gf===ga?1:0):0;
   return {...r,match:m,home,projected:Number(r.points)+(valid?gain:0),projectedGd:r.gd+(valid?gf-ga:0),projectedGf:r.gf+(valid?gf:0)};
  });
  const showLive=STATE.standingsView==='live'&&live.length>0;
  const sorted=showLive?calculated.slice().sort((a,b)=>b.projected-a.projected||b.projectedGd-a.projectedGd||b.projectedGf-a.projectedGf||Number(a.pos)-Number(b.pos)):calculated;

   const note=m?`<div class="v16-stand-live"><span class="v16-live-dot">● ${escapeHtml(formatStatus(m))}</span><span class="v16-versus">${escapeHtml(opponent)}</span><strong class="v16-live-score">${escapeHtml(m.hs??'–')}–${escapeHtml(m.as??'–')}</strong></div>`:'';
   const pt=showLive?r.projected:r.points,position=showLive?String(i+1):r.pos;
   const badge=/^\d+$/.test(r.teamId)?`<img src="${BSD}/img/team/${encodeURIComponent(r.teamId)}/?bg=transparent" alt="" loading="lazy" onerror="this.remove()">`:'';
   return `<tr class="${m?'is-playing':''}"><td class="t-position">${escapeHtml(position)}</td><td class="t-name"><div class="stand-team">${badge}<span class="stand-team-name">${escapeHtml(r.name)}</span></div>${note}</td><td>${escapeHtml(r.played)}</td><td>${escapeHtml(r.w)}</td><td>${escapeHtml(r.d)}</td><td>${escapeHtml(r.l)}</td><td>${escapeHtml(r.gf)}</td><td>${escapeHtml(r.ga)}</td><td class="t-diff">${escapeHtml(showLive?r.projectedGd:r.gd)}</td><td class="t-point">${escapeHtml(pt)}</td></tr>`;
  }).join('')}</tbody></table></div><div class="standings-tip">${showLive?'● Canlı karşılaşmanın sonucuna göre hesaplanan geçici sıralamadır. Resmî puan tablosu değildir.':'Bu resmî puan tablosudur; sağlayıcıda güncelleme gecikmesi olabilir.'} Canlı satırın altındaki skor rakibiyle birlikte gösterilir.</div></section>`;

function v22MiniStats(m){
 if(!V22_PREFS.mini)return '';
 const x=m.raw?.statistics||m.raw?.stats||m.raw?.match_stats||{};
 const a=x.home?.possession??x.home?.ball_possession;
 const b=x.away?.possession??x.away?.ball_possession;
 const p=Number(String(a??'').replace('%',''));
 const q=Number(String(b??'').replace('%',''));
 if(!Number.isFinite(p)||!Number.isFinite(q)||p+q<=0)return '';
 const pct=Math.min(100,Math.max(0,p/(p+q)*100));
 return `<span class="v22-mini-stats" title="Topla oynama"><span><i style="width:${pct}%"></i></span><span><i style="width:${100-pct}%;background:#60b8ed"></i></span></span>`;
}

function v18MatchPriority(m){
 const key=((m?.home||'')+' '+(m?.away||'')).toLocaleLowerCase('tr-TR');
 if(key.includes('barcelona')&&key.includes('atlé')||key.includes('barcelona')&&key.includes('atlético')||key.includes('barcelona')&&key.includes('atletico'))return -100;
 const lg=m?.league?.key||'';
 const preferred=['esp-laliga','tr-super','eng-premier','ita-seriea','ger-bundesliga','fra-ligue1','uefa-ucl'];
 const k=preferred.findIndex(p=>lg.includes(p));
 return k<0?70:k*8;
}
function v18FeaturedMatches(){
 const all=[...STATE.liveMatches,...STATE.matches];const unique=new Map();
 for(const m of all){if(!m?.id)continue;const key=v21Identity(m);const prev=unique.get(key);if(!prev||(!isLive(prev)&&isLive(m))||(isLive(prev)===isLive(m)&&v21Prefer(m)>v21Prefer(prev)))unique.set(key,m)}
 const live=[...unique.values()].filter(isLive).sort((a,b)=>v18MatchPriority(a)-v18MatchPriority(b));
 const upcoming=[...unique.values()].filter(m=>!isLive(m)&&!isFinal(m)).sort((a,b)=>v18MatchPriority(a)-v18MatchPriority(b)||String(a.time).localeCompare(String(b.time)));
 const ended=[...unique.values()].filter(isFinal).sort((a,b)=>v18MatchPriority(a)-v18MatchPriority(b));
 const picked=live.slice(0,10);
 if(picked.length<8)picked.push(...upcoming.slice(0,8-picked.length));
 if(picked.length<6)picked.push(...ended.slice(0,6-picked.length));
 return picked.slice(0,10);
}

let V24_RAIL_REBASE_TIMER=null;
function v24RailStride(rail){const cards=rail.querySelectorAll('.v18-showcase-card');return cards.length>1?cards[1].offsetLeft-cards[0].offsetLeft:0}
function v24RailInit(rail){
 const n=Number(rail.dataset.v24Count||0),stride=v24RailStride(rail);if(!n||!stride)return;
 V17_NEWS_POS=((V17_NEWS_POS%n)+n)%n;
 rail.classList.add('v24-rebasing');rail.scrollLeft=(n+V17_NEWS_POS)*stride;
 requestAnimationFrame(()=>rail.classList.remove('v24-rebasing'));
}
function v24RailRebase(rail){
 if(!rail||!rail.isConnected)return;
 const n=Number(rail.dataset.v24Count||0),stride=v24RailStride(rail);if(n<2||!stride)return;
 const physical=Math.round(rail.scrollLeft/stride);
 if(physical>=n&&physical<2*n)return;
 const same=(physical%n+n)%n;
 rail.classList.add('v24-rebasing');rail.scrollLeft=(n+same)*stride;
 requestAnimationFrame(()=>rail.classList.remove('v24-rebasing'));
}
function v17MoveNews(step){
 const rail=document.getElementById('v17-news-rail');if(!rail)return;
 const n=Number(rail.dataset.v24Count||0),stride=v24RailStride(rail);if(!n||!stride)return;
 if(n===1){V17_NEWS_POS=0;return}
 // If the last displayed copy was reached, silently reset to the identical middle copy.
 v24RailRebase(rail);
 const physical=Math.round(rail.scrollLeft/stride),next=physical+step;
 V17_NEWS_POS=((next%n)+n)%n;
 rail.scrollTo({left:next*stride,behavior:'smooth'});
 const dots=document.querySelectorAll('.v17-news-dots i');dots.forEach((d,i)=>d.classList.toggle('on',i===V17_NEWS_POS));
 clearTimeout(V24_RAIL_REBASE_TIMER);
 V24_RAIL_REBASE_TIMER=setTimeout(()=>v24RailRebase(rail),850);
}

function v18PickPortrait(records){
 const people=(Array.isArray(records)?records:[]).map(playerRecord).filter(p=>p.id&&p.label&&p.label!=='Oyuncu');
 if(!people.length)return null;
 const pick=people.find(p=>/forward|striker|attacker|wing|forvet|hücum|st\b|fw\b|lw\b|rw\b/i.test(p.pos))||people.find(p=>/midfielder|orta saha|mf\b|cm\b/i.test(p.pos))||people[Math.min(people.length-1,7)];
 return {id:pick.id,label:pick.label,at:Date.now()};
}
function v18SquadPeople(raw){
 const out=[];const seen=new Set();let total=0;
 function dig(node,depth,key){
  if(!node||depth>9||total++>1400)return;
  if(Array.isArray(node)){node.slice(0,150).forEach(x=>dig(x,depth+1,key));return}
  if(typeof node!=='object'||seen.has(node))return;seen.add(node);
  if(node.player||/^(players|squad|forwards|attackers|strikers|midfielders|starters|goalkeepers|defenders)$/i.test(key||'')){
   const p=playerRecord(node);if(p.id&&p.label&&p.label!=='Oyuncu')out.push(node);
  }
  for(const [k,v]of Object.entries(node)){
   if(Array.isArray(v)||v&&typeof v==='object'&&depth<7)dig(v,depth+1,k);
  }
 }
 dig(raw,0,'');return out;
}
async function v18FetchPortraits(){
 if(!bsdToken||STATE.source!=='bsd'||document.visibilityState==='hidden')return;
 if(Date.now()-V18_LAST_PROBE<180000)return;
 V18_LAST_PROBE=Date.now();
 const candidates=v18FeaturedMatches().filter(m=>m.provider==='bsd'&&/^\d+$/.test(m.id)).slice(0,5);
 for(const m of candidates){
  if(!document.getElementById('v17-news-rail'))break;
  const h=String(m.homeId||''),a=String(m.awayId||'');
  if(V18_PORTRAITS.has(h)&&V18_PORTRAITS.has(a))continue;
  const mk=matchKey(m);if(V18_FETCHING.has(mk))continue;V18_FETCHING.add(mk);
  try{
   // Confirmed starters from event lineups first, so photos correspond to the current fixture.
   const data=await request(BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/lineups/',bsdToken);
   for(const [side,teamId]of [['home',h],['away',a]]){
    if(!/^\d+$/.test(teamId)||V18_PORTRAITS.has(teamId))continue;
    const sideData=lineupSide({lineups:data},side);
    const portrait=v18PickPortrait(lineupPlayers(sideData));
    if(portrait)V18_PORTRAITS.set(teamId,portrait);
   }
  }catch(_){}finally{V18_FETCHING.delete(mk)}
  for(const teamId of [h,a]){
   if(!/^\d+$/.test(teamId)||V18_PORTRAITS.has(teamId))continue;
   try{const squad=await request(BSD+'/api/v2/teams/'+encodeURIComponent(teamId)+'/squad/',bsdToken);
    const portrait=v18PickPortrait(v18SquadPeople(squad));if(portrait)V18_PORTRAITS.set(teamId,portrait);
   }catch(_){}
  }
  v18PersistPortraits();
  // The cards remain live as scores refresh. Re-render to place newly discovered portraits.
  if(!STATE.match&&!STATE.leagueView&&(STATE.tab==='today'||STATE.tab==='live'||STATE.tab==='news'||STATE.tab==='all'))render();
 }
}

const goalQueue=[];let goalTimer=null;
function showNextGoal(){
 const box=$('goal-toast');if(!box||!goalQueue.length){if(box)box.classList.remove('visible');goalTimer=null;return}
 const g=goalQueue.shift();
 box.innerHTML=`<div class="v16-goal-flag">⚽ GOL! <span>${escapeHtml(g.minute)}</span><button type="button" data-close-goal aria-label="Gol bildirimini kapat">×</button></div><div class="v16-goal-line"><span>${escapeHtml(g.home)}</span><strong>${escapeHtml(g.score)}</strong><span>${escapeHtml(g.away)}</span></div><div class="v16-goal-scorer" id="v16-goal-scorer">${escapeHtml(g.scorer||'Gol atan takım')}${g.player?' · '+escapeHtml(g.player):''}</div>`;
 box.classList.add('visible');if(g.id&&g.provider==='bsd'&&!g.player)enrichGoalToast(g);
 goalTimer=setTimeout(()=>{box.classList.remove('visible');setTimeout(showNextGoal,400)},7200);
}
async function enrichGoalToast(g){
 if(!bsdToken||!g.id||!/^[0-9]+$/.test(str(g.id)))return;
 try{
  const payload=await request(BSD+'/api/v2/events/'+encodeURIComponent(g.id)+'/incidents/',bsdToken);
  const list=v16EventRows({inc:payload}).filter(e=>/goal/i.test(str(first(e,['type','incident_type','event_type'],'')))&&!/var/i.test(str(e.type||'')));
  const wanted=g.isHome?'home':'away';
  const clock=x=>{const v=str(x).match(/(\d{1,3})(?:\s*\+\s*(\d{1,2}))?/);return v?Number(v[1])+(v[2]?Number(v[2]):0):null};
  const observed=clock(g.minute),goalScore=g.score.replace(/[^\d-]/g,'');
  const candidates=list.filter(e=>{
   if(v16EventSide(e,{homeId:g.homeId,awayId:g.awayId,home:g.home,away:g.away})!==wanted)return false;
   const incidentScore=v16EventScore(e).replace(/<[^>]+>/g,'').replace(/[^\d-]/g,'');
   if(incidentScore)return incidentScore===goalScore;
   const when=clock(incidentMinute(e));return observed!==null&&when!==null&&Math.abs(observed-when)<=2;
  });
  const selected=candidates[candidates.length-1];
  const name=selected?str(textVal(selected.player)||first(selected,['player_name','player'],'')).trim():'';
  if(!name)return;
  const place=$('v16-goal-scorer');
  if(place&&$('goal-toast')?.classList.contains('visible')&&$('goal-toast')?.textContent.includes(g.score))place.textContent=g.scorer+' · ⚽ '+name;
 }catch(_){}
}

 const setting=localStorage.getItem('canliGoalMode')||'all';if(setting==='off'||(setting==='favorites'&&!saved(newMatch)&&!watchedMatchAlerts.has(matchKey(newMatch))))return;
 goalQueue.push({home:newMatch.home,away:newMatch.away,homeId:newMatch.homeId,awayId:newMatch.awayId,score:nh+' - '+na,scorer:byHome?newMatch.home:newMatch.away,isHome:byHome,minute:formatStatus(newMatch),id:newMatch.id,provider:newMatch.provider});

async function openProfile(id,name){V25.profile={id,name,loading:true,error:''};showProfile();try{
 const [info,stats]=await Promise.allSettled([
   request(BSD+'/api/v2/players/'+encodeURIComponent(id)+'/',bsdToken),
   request(BSD+'/api/v2/players/'+encodeURIComponent(id)+'/stats/?limit=30',bsdToken)
 ]);
 if(V25.profile?.id!==id)return;
 V25.profile.loading=false;
 if(info.status==='fulfilled')V25.profile.profile=info.value;
 else V25.profile.error=String(info.reason?.message||'Profil alınamadı.');
 V25.profile.stats=stats.status==='fulfilled'?arrayOf(stats.value):[];
 }catch(e){if(V25.profile)V25.profile.error=String(e.message||e)}showProfile();}

const nativeSettings=screenSettings;
screenSettings=function(){
 const used=usage();const on=V25.apiEnabled?'on':'';
 return nativeSettings()+`<section class="setting v25-setting"><h3>📡 Ek Canlı Maç Kaynağı · API-Football</h3><p>İsteğe bağlı üçüncü sağlayıcı. Ücretsiz hesapta 100/gün sınırı nedeniyle uygulama en fazla 90 istek yapar ve 20 dakikada bir günceller. Ücretli modda 60 saniyede bir kontrol mümkündür.</p><div class="label">API-Football anahtarı</div><input id="v25-api-key" type="password" placeholder="API anahtarını gir" autocomplete="off" value="${esc(V25.apiKey)}"><div class="v25-action-line"><button class="secondary" data-v25-apikey="1">Anahtarı kaydet</button><button class="secondary ${on}" data-v25-api-on="1">${V25.apiEnabled?'✓ Ek kaynak açık':'Ek kaynağı aç'}</button></div><div class="v25-action-line"><button class="secondary" data-v25-apimode="free">${V25.apiMode==='free'?'✓ ':''}Ücretsiz · 20 dk</button><button class="secondary" data-v25-apimode="paid">${V25.apiMode==='paid'?'✓ ':''}Ücretli · 60 sn</button></div><p>Bugün ${used.used} sorgu kullanıldı. Son kaynak: ${V25.lastApiCount} canlı karşılaşma. ${esc(V25.lastError)}</p></section><section class="setting v25-setting"><h3>🔔 Arka planda gol bildirimi</h3><p>Android'in zamanlanmış kontrolüyle uygulama ekranda değilken de gol değişikliği denetlenebilir. Android güç yönetimi nedeniyle tarama en erken yaklaşık 15 dakika aralıklarla yapılır. Gerçek anlık bildirim için sunucu + Firebase gerekir.</p><button class="secondary" data-v25-background="1">${V25.bgEnabled?'✓ Arka plan kontrolü açık':'Arka plan bildirimini aç'}</button><p>İlk çalıştırmada mevcut skorlar kaydedilir; eski goller için bildirim atılmaz. Uygulama zorla durdurulursa kontrol yeniden açılana kadar durabilir.</p></section>`;
};

// Eski render/menüler korunur. Yalnızca yeni görünüm katmanı eklenir.
const nativeRender=render;
render=function(){nativeRender(); const m=STATE.match; if(m&&['v25h2h','v25summary'].includes(STATE.detailTab))document.body.classList.add('v25-detail');else document.body.classList.remove('v25-detail');};
q('content').addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.v25H2h){fetchH2H(STATE.match,true);return}
 if(b.dataset.v25Player){event.stopPropagation();openProfile(b.dataset.v25Player,b.dataset.v25PlayerName||'Oyuncu');return}
 if(b.dataset.v25Apikey){V25.apiKey=(q('v25-api-key')?.value||'').trim();localStorage.setItem('csApiFootballToken',V25.apiKey);V25.lastFootballAttempt=0;V25.lastError='';render();return}
 if(b.dataset.v25ApiOn){V25.apiEnabled=!V25.apiEnabled;localStorage.setItem('csApiFootballOn',String(V25.apiEnabled));V25.lastFootballAttempt=0;render();if(V25.apiEnabled)refreshLive();return}
 if(b.dataset.v25Apimode){V25.apiMode=b.dataset.v25Apimode;localStorage.setItem('csApiFootballMode',V25.apiMode);V25.lastFootballAttempt=0;render();return}
 if(b.dataset.v25Background){if(!bsdToken&&!V25.bgEnabled){window.alert('Arka plan skor takibi için önce ana futbol API anahtarını kaydet.');return}V25.bgEnabled=!V25.bgEnabled;localStorage.setItem('csBackgroundGoalOn',String(V25.bgEnabled));if(window.AndroidApi?.setBackgroundGoals){try{AndroidApi.setBackgroundGoals(V25.bgEnabled,bsdToken)}catch(_){}}render();return}
},true);
document.body.addEventListener('click',event=>{if(event.target.closest('[data-v25-close]')){V25.profile=null;q('v25-profile-overlay')?.remove();}},true);
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&V25.profile){V25.profile=null;q('v25-profile-overlay')?.remove()}},true);
// Başlangıçta önceden seçilmiş arka plan kontrolü Android tarafında yeniden doğrulanır.
if(V25.bgEnabled&&window.AndroidApi?.setBackgroundGoals){try{AndroidApi.setBackgroundGoals(true,bsdToken)}catch(_){}}
window.__v25={normalizeFootballFixture,summaryText,miniGraph,usage,sourceName};
})();

</script></body></html>
