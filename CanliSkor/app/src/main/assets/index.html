<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const BSD='https://sports.bzzoiro.com', SPORT='https://sportscore.com';
const FEATURED=[
 {key:'tr-super',title:'Türkiye - Trendyol Süper Lig',flag:'🇹🇷'},
 {key:'tr-first',title:'Türkiye - Trendyol 1. Lig',flag:'🇹🇷'},
 {key:'eng-premier',title:'İngiltere - Premier League',flag:'🏴'},
 {key:'esp-laliga',title:'İspanya - LaLiga',flag:'🇪🇸'},
 {key:'ita-seriea',title:'İtalya - Serie A',flag:'🇮🇹'},
 {key:'ger-bundesliga',title:'Almanya - Bundesliga',flag:'🇩🇪'},
 {key:'fra-ligue1',title:'Fransa - Ligue 1',flag:'🇫🇷'},
 {key:'uefa-ucl',title:'UEFA - Şampiyonlar Ligi',flag:'🏆'},
 {key:'uefa-uel',title:'UEFA - Avrupa Ligi',flag:'🏆'},
];
const STATE={tab:'today',day:0,filter:'Tümü',term:'',match:null,details:null,matches:[],liveMatches:[],loading:false,liveLoading:false,error:'',liveError:'',source:'sportscore',last:0,lastFixtures:0,lastLive:0,lastAttempt:0,liveAttempt:0,leagueMap:{},leagueFetched:0,liveChecked:false};
let bsdToken=localStorage.getItem('bsdToken')||'';
let favorites=new Set(JSON.parse(localStorage.getItem('canliFavorites')||'[]'));
const pending=new Map(); let seq=0;
const first=(obj,keys,def='')=>{for(const k of keys){const v=obj?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return def};
const textVal=v=>v&&typeof v==='object'?first(v,['name','short_name','title','display_name','label'],''):v??'';
const str=v=>String(v??'').trim();
const isLive=m=>m.status==='live'; const isFinal=m=>m.status==='finished';
const matchKey=m=>(m.provider==='bsd'?'b':'s')+':'+(m.slug||m.id);
const saved=m=>favorites.has(matchKey(m));
function nativeAvailable(){return typeof window.AndroidApi!=='undefined'&&typeof AndroidApi.request==='function'}
window.__nativeResult=function(id,status,body){const o=pending.get(id);if(!o)return;pending.delete(id);let data;try{data=JSON.parse(body)}catch(e){o.reject(new Error('Sunucu geçersiz veri gönderdi'));return}if(status<200||status>=300){let msg=data?.detail||data?.message||('HTTP '+status);o.reject(new Error(typeof msg==='string'?msg:'HTTP '+status));return}o.resolve(data)};
function request(url,token=''){
 if(nativeAvailable())return new Promise((resolve,reject)=>{const id='r'+(++seq);pending.set(id,{resolve,reject});AndroidApi.request(url,token,id);setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('Bağlantı zaman aşımına uğradı'))}},18000)});
 return fetch(url,{headers:token?{'Authorization':'Token '+token}:{},cache:'no-store'}).then(async r=>{let j=await r.json();if(!r.ok)throw new Error(j?.detail||j?.message||'HTTP '+r.status);return j});
}
function getDate(offset=0){const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'});const now=new Date(Date.now()+offset*86400000);return fmt.format(now)}
function dateOf(value){if(!value)return '';const d=new Date(value);if(!Number.isFinite(d.getTime()))return '';return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function timeOf(value){const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'}):'—'}
function dateLabel(offset){if(offset===0)return 'Bugün';if(offset===-1)return 'Dün';if(offset===1)return 'Yarın';return String(getDate(offset)).slice(8,10)+'.'+String(getDate(offset)).slice(5,7)}
function arrayOf(data){
 if(Array.isArray(data))return data;
 const variants=[data?.results,data?.events,data?.matches,data?.fixtures,data?.live,data?.live_events,data?.data?.results,data?.data?.events,data?.data?.matches,data?.data];
 for(const v of variants)if(Array.isArray(v))return v;
 return [];
}
function assertArrayShape(data,label){const rows=arrayOf(data);if(!rows.length&&Number(data?.count||0)>0)throw new Error(label+' yanıtında '+data.count+' maç bildiriliyor fakat maç listesi çözümlenemedi');return rows}
function normalizeStatus(input){const status=str(input).toLowerCase().replace(/[\s-]+/g,'_');if(['live','in_progress','playing','in_play','inplay','1h','2h','ht','half_time','extra_time','et','penalties','penalty','first_half','second_half','break'].includes(status))return 'live';if(['ft','ended','complete','completed','finished','after_penalties','aet'].includes(status))return 'finished';if(['postponed','cancelled','unresolved'].includes(status))return status;return 'upcoming'}
function leagueIdentity(name,country,id){const n=str(name).toLocaleLowerCase('tr-TR');const c=str(country).toLocaleLowerCase('tr-TR');const tur=/turkey|türkiye|turkiye|türkiye/.test(c),eng=/england|ingiltere|ingiltere/.test(c);
 if((tur||!c)&&/(trendyol super|trendyol süper|super lig|süper lig)/.test(n))return 'tr-super';
 if((tur||!c)&&/(trendyol 1|1\. lig|birinci lig|tff 1)/.test(n))return 'tr-first';
 if((eng||!c)&&/premier league|premier lig/.test(n))return 'eng-premier';
 if(/la ?liga|laliga|primera divisi[oó]n/.test(n)&&(c.includes('spain')||c.includes('ispanya')||!c))return 'esp-laliga';
 if(/serie a/.test(n)&&(c.includes('ital')||!c))return 'ita-seriea';
 if(/bundesliga/.test(n)&&(c.includes('german')||c.includes('almanya')||!c))return 'ger-bundesliga';
 if(/ligue 1/.test(n))return 'fra-ligue1';
 if(/champions league|şampiyonlar ligi/.test(n)&&!/women|kadın|u19|youth/.test(n))return 'uefa-ucl';
 if(/europa league|avrupa ligi/.test(n))return 'uefa-uel';
 return 'other:'+str(id||n||'unknown');
}
function leagueMeta(row){const id=str(first(row,['league_id'],row?.league?.id||''));const fromMap=STATE.leagueMap[id]||{};
 let raw=first(row,['league','league_name','competition','tournament'],null);
 const name=str(textVal(raw)||fromMap.name||first(row,['league_name','competition_name'],'')||(id?'Lig #'+id:'Diğer Lig'));
 const country=str(first(row,['country','country_name'],fromMap.country||raw?.country||''));
 const key=leagueIdentity(name,country,id);const fixed=FEATURED.find(f=>f.key===key);
 return {key,title:fixed?fixed.title:(country?country+' - ':'')+name,flag:fixed?fixed.flag:'⚽',id};
}
function normalize(row,provider,fromLive=false){
 const ho=first(row,['home_team','home','homeTeam','team_home','home_team_name']);
 const aw=first(row,['away_team','away','awayTeam','team_away','away_team_name']);
 const home=str(textVal(ho)||first(row,['home_name','home_team_name'],'Ev sahibi'));
 const away=str(textVal(aw)||first(row,['away_name','away_team_name'],'Deplasman'));
 const date=first(row,['event_date','start_time','kickoff','kickoff_at','start_at','date'],row?.time?.kickoff_at||'');
 const status=fromLive?'live':normalizeStatus(first(row,['status','match_status','state'],row?.time?.status||'upcoming'));
 const minute=first(row,['current_minute','minute','elapsed','status_text'],row?.time?.display??row?.time?.minute??'');
 const scoreObj=row?.score&&typeof row.score==='object'?row.score:{};
 let hs=first(row,['home_score','score_home','homeGoals'],scoreObj.home??null);
 let as=first(row,['away_score','score_away','awayGoals'],scoreObj.away??null);
 if(row.extra_time_score){const ex=row.extra_time_score;if(hs!==null&&as!==null){hs=Number(hs)+Number(ex.home||0);as=Number(as)+Number(ex.away||0)}}
 const id=str(first(row,['id','event_id','match_id','slug'],home+'-'+away+'-'+date));
 const homeId=str(first(row,['home_team_id','home_id'],ho&&typeof ho==='object'?ho.id:''));
 const awayId=str(first(row,['away_team_id','away_id'],aw&&typeof aw==='object'?aw.id:''));
 return {provider,id,slug:str(row.slug||''),home,away,homeId,awayId,league:leagueMeta(row),time:date,status,minute,hs,as,raw:row};
}
async function ensureLeagues(){
 if(!bsdToken)return;
 try{let cached=JSON.parse(localStorage.getItem('bsdLeaguesV4')||'null');if(cached&&Date.now()-cached.at<86400000){STATE.leagueMap=cached.map||{};return}}
 catch(_){}
 try{const response=await request(BSD+'/api/v2/leagues/?limit=200',bsdToken);const rows=assertArrayShape(response,'Lig');const map={};for(const l of rows){const id=str(l.id);if(id)map[id]={name:str(first(l,['name','league_name','title'],'Lig #'+id)),country:str(textVal(first(l,['country','country_name'],'')))} }STATE.leagueMap=map;localStorage.setItem('bsdLeaguesV4',JSON.stringify({at:Date.now(),map}));}
 catch(e){STATE.error='Lig bilgileri alınamadı: '+(e.message||'bağlantı hatası')}
}
async function paginated(url,token,maxPages=4){let all=[];let next=url;const seen=new Set();for(let i=0;next&&i<maxPages;i++){
 if(seen.has(next))break;seen.add(next);let data=await request(next,token);all.push(...assertArrayShape(data,'Fikstür'));
 let candidate=data?.next; if(candidate && /^https:\/\/sports\.bzzoiro\.com\//.test(candidate))next=candidate;else if(candidate&&candidate.startsWith('/'))next=BSD+candidate;else next=null;
 }return all}
async function fixtures(day){
 const target=getDate(day);
 if(bsdToken){await ensureLeagues();const url=BSD+'/api/v2/events/?date_from='+getDate(day-1)+'&date_to='+getDate(day+1)+'&limit=200';
 let rows=await paginated(url,bsdToken,5);
 const seen=new Set();return rows.filter(r=>dateOf(first(r,['event_date','start_time','kickoff','kickoff_at'],r?.time?.kickoff_at))===target).map(r=>normalize(r,'bsd')).filter(m=>{const k=matchKey(m);if(seen.has(k))return false;seen.add(k);return true})}
 let data=await request(SPORT+'/api/v1/fixtures/?sport=football&date='+target+'&limit=200');STATE.source='sportscore';return assertArrayShape(data,'Maç').map(r=>normalize(r,'sportscore'));
}
async function liveMatches(){
 if(bsdToken){const data=await request(BSD+'/api/v2/events/live/?limit=200',bsdToken);const rows=assertArrayShape(data,'Canlı maç');return rows.map(r=>normalize(r,'bsd',true))}
 const data=await request(SPORT+'/api/widget/matches/?sport=football&limit=100');return assertArrayShape(data,'Canlı maç').map(r=>normalize(r,'sportscore')).filter(isLive)
}
function mergeLiveIntoFixtures(){const liveMap=new Map(STATE.liveMatches.map(m=>[matchKey(m),m]));STATE.matches=STATE.matches.map(m=>{const live=liveMap.get(matchKey(m));return live?{...m,...live,homeId:live.homeId||m.homeId,awayId:live.awayId||m.awayId,league:live.league.key.startsWith('other:')?m.league:live.league}:m});}
function visibleMatches(){let items=STATE.tab==='live'?(STATE.liveMatches.length?STATE.liveMatches:STATE.matches.filter(isLive)):(STATE.tab==='favorites'?[...STATE.matches,...STATE.liveMatches].filter((m,i,a)=>a.findIndex(t=>matchKey(t)===matchKey(m))===i).filter(saved):STATE.matches);
 if(STATE.tab==='finished')items=items.filter(isFinal);
 if(STATE.filter!=='Tümü')items=items.filter(m=>m.league.key===STATE.filter);
 if(STATE.term.trim()){const term=STATE.term.toLocaleLowerCase('tr-TR').trim();items=items.filter(m=>(m.home+' '+m.away+' '+m.league.title).toLocaleLowerCase('tr-TR').includes(term))}
 return items;
}
function formatStatus(m){if(isLive(m)){const t=str(m.minute);if(!t)return 'CANLI';return /^\d+/.test(t)?t.replace(/[^\d+']/g,'').slice(0,8)+(t.includes("'")?'':"'"):'CANLI'}if(isFinal(m))return 'MS';if(m.status==='postponed')return 'ERT';if(m.status==='cancelled')return 'İPT';return timeOf(m.time)}
function scoreText(m){return (isLive(m)||isFinal(m)) ? (m.hs??'–')+' - '+(m.as??'–') : 'v';}
function teamBadge(id,short){
 const safe=String(id||'');const letter=escapeHtml(String(short||'?').trim().charAt(0).toLocaleUpperCase('tr-TR'));
 return `<span class="mini-crest"><span class="mini-fallback">${letter}</span>${/^\d+$/.test(safe)&&Number(safe)>0?`<img class="team-img" loading="lazy" alt="" src="${BSD}/img/team/${encodeURIComponent(safe)}/?bg=transparent">`:''}</span>`;
}
function matchCard(m){const live=isLive(m),id=encodeURIComponent(matchKey(m));return `<article class="v4-match" data-open="${id}"><span class="v4-status ${live?'now':''}">${escapeHtml(formatStatus(m))}</span><span class="v4-home">${escapeHtml(m.home)}</span><b class="v4-score ${live?'now':''}">${escapeHtml(scoreText(m))}</b><span class="v4-away">${escapeHtml(m.away)}</span><button class="v4-star ${saved(m)?'saved':''}" data-star="${id}" aria-label="Favori">${saved(m)?'★':'☆'}</button></article>`}

function buildSections(){const data=visibleMatches();const map=new Map();for(const m of data){const key=m.league.key;if(!map.has(key))map.set(key,{league:m.league,rows:[]});map.get(key).rows.push(m)}
 const shown=new Set();let selected=[];
 for(const f of FEATURED){if(STATE.filter!=='Tümü'&&STATE.filter!==f.key)continue;const entry=map.get(f.key);selected.push({league:entry?.league||f,rows:entry?.rows||[]});shown.add(f.key)}
 for(const [key,value] of map){if(!shown.has(key))selected.push(value)}
 if(STATE.term.trim()&&data.length===0)return `<div class="v4-empty"><b>Aramada maç bulunamadı</b><p>Başka bir takım veya lig ara.</p></div>`;
 if(STATE.filter!=='Tümü'&&!selected.length)return `<div class="v4-empty">Seçilen ligde maç bulunamadı.</div>`;
 let html=selected.map(({league,rows})=>`<section class="v4-group"><div class="v4-league"><span>${escapeHtml(league.flag||'⚽')}　${escapeHtml(league.title)}</span><small>${rows.length?rows.length+' maç':'0 maç'}</small></div>${rows.length?rows.sort((a,b)=>Number(isLive(b))-Number(isLive(a))||String(a.time).localeCompare(String(b.time))).map(matchCard).join(''):`<p class="v4-no-match">${STATE.tab==='live'?'Şu anda bu ligde canlı maç yok.':'Seçilen günde bu ligde maç yok.'}</p>`}</section>`).join('');
 if(!data.length&&!STATE.loading&&STATE.tab==='live')html=`<div class="v4-note">${STATE.liveError?'Canlı veri alınamadı: '+escapeHtml(STATE.liveError):STATE.liveChecked?'BSD şu anda canlı maç bildirmiyor. Fikstürdeki maç durumları gecikmeli olabilir.':'Canlı maçlar kontrol ediliyor.'}</div>`+html;
 return html;
}
function screenMatches(){const items=visibleMatches();const tabs=[['today','Tümü'],['live','● Canlı'],['finished','Biten'],['favorites','☆ Favoriler']].map(([id,name])=>`<button data-top-tab="${id}" class="top-tab ${STATE.tab===id?'on':''}">${name}</button>`).join('');
 const dates=Array.from({length:7},(_,i)=>i-3).map(i=>`<button data-day="${i}" class="v4-date ${STATE.day===i?'on':''}"><small>${getDate(i).slice(8)}.${getDate(i).slice(5,7)}</small><b>${dateLabel(i)}</b></button>`).join('');
 const other=new Map();for(const m of STATE.matches.concat(STATE.liveMatches)){const l=m.league;if(!FEATURED.some(f=>f.key===l.key))other.set(l.key,l)}
 const leagues=[{key:'Tümü',title:'Tüm Ligler'},...FEATURED,...other.values()];
 return `<div class="v4-today"><span>⚽ <b>${STATE.liveMatches.length}</b> Canlı</span><span>${STATE.last?'Son: '+new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'Bağlanıyor…'}</span></div><div class="v4-dates">${dates}</div><div class="top-tabs">${tabs}</div><div class="v4-toolbar"><label>⌕ <input id="search" placeholder="Takım veya lig ara…" type="search" autocomplete="off" value="${escapeHtml(STATE.term)}"></label><button data-refresh="1">↻ Yenile</button></div><div class="v4-league-chips">${leagues.map(l=>`<button data-filter="${encodeURIComponent(l.key)}" class="chip ${STATE.filter===l.key?'on':''}">${escapeHtml(l.title)}</button>`).join('')}</div><div class="v4-summary">${items.length} maç · ${STATE.source==='bsd'?'BSD':'SportScore'} ${STATE.loading?'· Güncelleniyor…':''}</div>${STATE.error?`<div class="errorbox">⚠ ${escapeHtml(STATE.error)}</div>`:''}<div id="match-results">${buildSections()}</div>`;
}
function screenSettings(){return `<h2>⚙ Veri Kaynağı</h2><div class="setting"><h3>BSD futbol API</h3><p>BSD hesap panelindeki anahtarı yalnızca bu cihazda kaydet. Canlı maçlar 15 saniyede bir kontrol edilir. Uygulama arka plandayken durur.</p><div class="label">API ANAHTARI</div><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="BSD API anahtarını yapıştır" value="${escapeHtml(bsdToken)}"><div class="setting-actions"><button class="primary" data-save-token="1">Kaydet ve bağlan</button><button class="secondary" data-clear-token="1">Anahtarsız kullan</button></div><p>API anahtarı herkese açık APK'ya veya GitHub'a eklenmez. Google Play sürümü için ortak sunucu gerekir.</p></div><div class="setting"><h3>Bağlantı durumu</h3><p>Kaynak: <b>${STATE.source==='bsd'?'BSD':'SportScore'}</b><br>Son canlı kontrol: ${STATE.lastLive?new Date(STATE.lastLive).toLocaleTimeString('tr-TR'):'Henüz yapılmadı'}<br>${STATE.liveError?'Hata: '+escapeHtml(STATE.liveError):'Hata raporlanmadı.'}</p><p><a href="https://sports.bzzoiro.com/dashboard/">BSD hesap paneline git ↗</a></p></div>`}
const STAT_SPEC=[
 ['Topla oynama','possession','ball_possession','possession_percentage'],
 ['Gol beklentisi (xG)','xg','expected_goals'],
 ['Toplam şut','shots_total','total_shots','shots'],
 ['İsabetli şut','shots_on_target','shots_on_goal'],
 ['İsabetsiz şut','shots_off_target','shots_off_goal'],
 ['Engellenen şut','shots_blocked','blocked_shots'],
 ['Net gol fırsatı','big_chances','big_chances_created'],
 ['Korner','corners','corner_kicks'],
 ['Faul','fouls','fouls_committed'],
 ['Ofsayt','offsides','offside'],
 ['Toplam pas','passes','total_passes'],
 ['Pas isabeti (%)','pass_accuracy','passes_accuracy','pass_accuracy_percentage'],
 ['Başarılı pas','accurate_passes','passes_completed'],
 ['Kaleci kurtarışı','saves','goalkeeper_saves'],
 ['Sarı kart','yellow_cards','yellow_card'],
 ['Kırmızı kart','red_cards','red_card'],
 ['İkili mücadele','duels_won','duels'],
 ['Top kapma','tackles','tackles_won'],
 ['Tehlikeli atak','dangerous_attacks'],
 ['Taç','throw_ins','throwins'],
 ['Serbest vuruş','free_kicks','freekicks']
];
const statSide=(obj,keys)=>{for(const k of keys){const x=obj?.[k];if(x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(String(x).replace('%',''))))return Number(String(x).replace('%',''))}return null};
const detailStats=d=>{const root=d?.stats?.stats||d?.stats||{};let h=root.home||root.home_stats||null,a=root.away||root.away_stats||null;return(h&&a)?{home:h,away:a}:null};
function renderStatRows(stats){if(!stats)return '';let out='';for(const [label,...keys] of STAT_SPEC){const h=statSide(stats.home,keys),a=statSide(stats.away,keys);if(h===null||a===null)continue;const n=h+a,ratio=n>0?h/n*100:50;const pct=Math.max(1,Math.min(99,ratio));const fmt=x=>escapeHtml(Number.isInteger(x)?String(x):x.toFixed(2).replace('.',','));out+=`<div class="stat-block"><div class="stat-numbers"><b>${fmt(h)}</b><span>${escapeHtml(label)}</span><b>${fmt(a)}</b></div><div class="stat-rails"><div class="stat-home" style="width:${pct}%"></div><div class="stat-away" style="width:${100-pct}%"></div></div></div>`}return out}
function eventLabel(kind){const t=str(kind).toLowerCase();if(/goal|gol/.test(t))return['⚽','Gol'];if(/yellow/.test(t))return['🟨','Sarı kart'];if(/red/.test(t))return['🟥','Kırmızı kart'];if(/card/.test(t))return['🟨','Kart'];if(/substitut|change/.test(t))return['🔁','Oyuncu değişikliği'];if(/var/.test(t))return['📺','VAR'];if(/period|half/.test(t))return['⏱','Devre'];if(/penalty/.test(t))return['⚽','Penaltı'];return['•',kind?str(kind).replace(/_/g,' '):'Maç olayı']}
function detailCrest(id,name){const letter=escapeHtml(str(name).slice(0,1).toLocaleUpperCase('tr-TR'));const safe=str(id);return `<div class="detail-crest-frame"><span class="fallback-crest">${letter}</span>${/^\d+$/.test(safe)&&Number(safe)>0?`<img class="team-img" alt="" loading="lazy" src="${BSD}/img/team/${encodeURIComponent(safe)}/?bg=transparent">`:''}</div>`}
function statMini(d,label,keys){const st=detailStats(d),h=st?statSide(st.home,keys):null,a=st?statSide(st.away,keys):null;return `<div><strong>${h!==null&&a!==null?escapeHtml(String(h))+' : '+escapeHtml(String(a)):'—'}</strong><span>${label}</span></div>`}
async function detail(m){STATE.match=m;STATE.detailTab='stats';STATE.details=null;render();await loadDetail(m)}
async function loadDetail(m){
 if(!m)return;
 const url=BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/';
 const currentId=m.id;
 if(m.provider==='bsd'&&bsdToken){
  const results=await Promise.allSettled([
   request(url+'stats/',bsdToken),request(url+'incidents/',bsdToken),request(url,bsdToken)
  ]);
  if(STATE.match?.id!==currentId)return;
  STATE.lastDetailFetch=Date.now();
  STATE.details={stats:results[0].status==='fulfilled'?results[0].value:null,inc:results[1].status==='fulfilled'?results[1].value:null,info:results[2].status==='fulfilled'?results[2].value:null,
   statsErr:results[0].status==='rejected'?str(results[0].reason?.message||'Bağlantı hatası'):'',
   incErr:results[1].status==='rejected'?str(results[1].reason?.message||'Bağlantı hatası'):'',
   lineups:null,lineupsLoaded:false,lineupsErr:''};
 }else STATE.details={stats:null,inc:null,info:null,statsErr:'Bu veri kaynağında ayrıntı mevcut değil.',incErr:'',lineups:null,lineupsLoaded:false,lineupsErr:''};
 render();
}
async function loadLineups(){const m=STATE.match;if(!m||!bsdToken||m.provider!=='bsd')return;STATE.details.lineupsLoaded=false;render();try{const data=await request(BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/lineups/',bsdToken);if(STATE.match?.id!==m.id)return;STATE.details.lineups=data;STATE.details.lineupsErr=''}catch(e){if(STATE.match?.id!==m.id)return;STATE.details.lineupsErr=e.message||'Kadro alınamadı'}finally{if(STATE.match?.id===m.id){STATE.details.lineupsLoaded=true;render()}}}
function lineupPeople(x){if(Array.isArray(x))return x;if(x&&typeof x==='object')for(const k of ['starting_xi','startingXI','starters','players','lineup','starting'])if(Array.isArray(x[k]))return x[k];return []}
function lineupView(d){if(!d.lineupsLoaded)return '<div class="stat-empty">Kadro bilgileri yükleniyor…</div>';if(d.lineupsErr)return `<div class="stat-empty"><strong>Kadro alınamadı</strong>${escapeHtml(d.lineupsErr)}</div>`;const raw=d.lineups||{},o=raw.lineups||raw;const home=lineupPeople(o.home||o.home_lineup||o.home_team),away=lineupPeople(o.away||o.away_lineup||o.away_team);if(!home.length&&!away.length)return '<div class="stat-empty"><strong>Henüz açıklanan kadro yok</strong>Bu maç için kadro bilgisi API tarafından sağlanmadı.</div>';return [{title:STATE.match.home,rows:home},{title:STATE.match.away,rows:away}].map(side=>`<section class="lineup-card"><h4>${escapeHtml(side.title)}</h4>${side.rows.length?side.rows.map(x=>{const person=x.player||x;return `<div class="lineup-person">${escapeHtml(String(person.number??person.shirt_number??''))}　${escapeHtml(str(textVal(person)||person.name||person.player_name||'Oyuncu'))}</div>`}).join(''):'<p class="muted">Kadro bilgisi yok</p>'}</section>`).join('')}
async function refreshDetailStats(){
 const m=STATE.match;if(!m||m.provider!=='bsd'||!bsdToken||STATE.detailLoading||!STATE.details)return;
 STATE.detailLoading=true;STATE.lastDetailFetch=Date.now();
 try{
  const url=BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/';
  const [st,inc]=await Promise.allSettled([request(url+'stats/',bsdToken),request(url+'incidents/',bsdToken)]);
  if(STATE.match?.id!==m.id)return;
  if(st.status==='fulfilled'){STATE.details.stats=st.value;STATE.details.statsErr=''}
  if(inc.status==='fulfilled'){STATE.details.inc=inc.value;STATE.details.incErr=''}
  render();
 }finally{STATE.detailLoading=false}
}
function detailScreen(m){
 const d=STATE.details,tab=STATE.detailTab||'stats',info=d?.info||{};
 const homeId=m.homeId||str(first(info,['home_team_id'],info.home_team?.id||info.home?.id||''));
 const awayId=m.awayId||str(first(info,['away_team_id'],info.away_team?.id||info.away?.id||''));
 const status=isLive(m)?'CANLI · '+escapeHtml(formatStatus(m)):escapeHtml(formatStatus(m));
 let html=`<div class="detail-topbar"><button class="detail-back" data-back="1">‹ Maçlara dön</button><span class="detail-league-pill">${escapeHtml(m.league.flag||'⚽')} ${escapeHtml(m.league.title)}</span></div>
 <div class="game-hero"><div class="game-date">${escapeHtml(new Date(m.time||Date.now()).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Istanbul'}))} · ${escapeHtml(timeOf(m.time))}</div>
 <div class="game-scoreline"><div class="game-team">${detailCrest(homeId,m.home)}<div class="team-name">${escapeHtml(m.home)}</div></div>
 <div class="score-podium"><div class="score-values">${escapeHtml(m.hs??'–')} : ${escapeHtml(m.as??'–')}</div><div class="score-status ${isLive(m)?'live':''}">${status}</div></div>
 <div class="game-team">${detailCrest(awayId,m.away)}<div class="team-name">${escapeHtml(m.away)}</div></div></div><div class="game-footnote"><span class="indicator"></span> Gerçek zamanlı BSD maç merkezi</div></div>
 <div class="mini-score-grid">${statMini(d,'Şut',['shots_total','total_shots','shots'])}${statMini(d,'Korner',['corners','corner_kicks'])}${statMini(d,'Topla oynama %',['possession','ball_possession'])}</div>
 <div class="detail-tabs">${[['stats','📊 İstatistik'],['events','⚽ Olaylar'],['lineups','👕 Kadro']].map(([id,title])=>`<button class="detail-tab ${tab===id?'on':''}" data-detail-tab="${id}">${title}</button>`).join('')}</div>`;
 if(!d)return html+'<div class="game-section"><div class="stat-empty"><span class="spinner"></span> Maç detayları yükleniyor…</div></div>';
 if(tab==='stats'){
  const rows=renderStatRows(detailStats(d));
  html+=`<section class="game-section"><div class="section-head">📊 Canlı maç istatistikleri <small>Ev sahibi / Deplasman</small></div>${rows||`<div class="stat-empty"><strong>${d.statsErr?'İstatistik alınamadı':'Henüz istatistik verisi yok'}</strong>${escapeHtml(d.statsErr||'BSD bu maç için istatistik açıklamadı. Veri geldiğinde burada gösterilecek.')}${d.statsErr?'<p><button class="secondary" data-detail-retry="1">Yeniden dene</button></p>':''}</div>`}<div class="stat-note">Yalnızca veri sağlayıcısının gerçekten gönderdiği rakamlar gösterilir.</div></section>`;
 }else if(tab==='events'){
  const raw=d.inc||{};const events=Array.isArray(raw)?raw:arrayOf(raw).length?arrayOf(raw):Array.isArray(raw.incidents)?raw.incidents:[];
  html+=`<section class="game-section"><div class="section-head">⚽ Maç olayları <small>${events.length} olay</small></div>`;
  if(events.length)html+=events.map(e=>{const [ico,label]=eventLabel(first(e,['type','incident_type','event_type'],'')),person=first(e,['player','player_name','text','description'],'');const time=first(e,['minute','match_minute','time'],'—');return `<div class="timeline-item"><span class="mins">${escapeHtml(str(time))}'</span><span>${ico}</span><div><span class="event-type">${escapeHtml(label)}</span><small>${escapeHtml(str(textVal(person)||''))}</small></div></div>`}).join('');
  else html+=`<div class="stat-empty"><strong>${d.incErr?'Maç olayları alınamadı':'Henüz maç olayı bulunmuyor'}</strong>${escapeHtml(d.incErr||'Gol, kart ve oyuncu değişiklikleri geldikçe burada görünecek.')}</div>`;
  html+='</section>';
 }else if(tab==='lineups')html+=`<section class="game-section"><div class="section-head">👕 Takım kadroları <small>İlk 11</small></div>${lineupView(d)}</section>`;
 return html;
}

function render(){const count=STATE.liveMatches.length||STATE.matches.filter(isLive).length;$('live-count').textContent=String(count);$('today-count').textContent=String(STATE.matches.length);$('updated-at').textContent=STATE.last?new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';$('source-label').textContent=STATE.source==='bsd'?'BSD API':'SPORTSCORE';$('content').innerHTML=STATE.match?detailScreen(STATE.match):STATE.tab==='settings'?screenSettings():screenMatches();$('credit').innerHTML=STATE.source==='sportscore'?'<a href="https://sportscore.com/">Powered by SportScore</a> · Maç verilerinde gecikme olabilir':'Kaynak: BSD · Maç verilerinde gecikme olabilir';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===STATE.tab))}
async function refreshLive(){if(STATE.liveLoading)return;STATE.liveLoading=true;STATE.liveAttempt=Date.now();try{const data=await liveMatches();STATE.liveMatches=data;STATE.liveChecked=true;STATE.lastLive=Date.now();STATE.liveError='';mergeLiveIntoFixtures();if(STATE.match){const fresh=data.find(x=>matchKey(x)===matchKey(STATE.match));if(fresh)STATE.match={...STATE.match,...fresh,homeId:fresh.homeId||STATE.match.homeId,awayId:fresh.awayId||STATE.match.awayId};}STATE.last=Date.now()}catch(e){STATE.liveError=e.message||'Canlı veri alınamadı';STATE.liveChecked=false}finally{STATE.liveLoading=false;render()}}
async function refresh(force=false){if(STATE.loading)return;STATE.loading=true;STATE.lastAttempt=Date.now();STATE.error='';render();try{if(force||!STATE.lastFixtures||Date.now()-STATE.lastFixtures>240000){const data=await fixtures(STATE.day);STATE.matches=data;STATE.lastFixtures=Date.now();}STATE.last=Date.now();if(STATE.day===0||STATE.tab==='live')await refreshLive();}catch(e){STATE.error=e.message||'Maç listesi alınamadı';if(!STATE.matches.length)try{let c=JSON.parse(localStorage.getItem('scoreCacheV4')||'null');if(c&&c.day===STATE.day){STATE.matches=c.matches;STATE.error+=' • Son kaydedilen fikstür gösteriliyor.'}}catch(_){} }finally{STATE.loading=false;try{localStorage.setItem('scoreCacheV4',JSON.stringify({day:STATE.day,matches:STATE.matches.map(({raw,...m})=>m)}))}catch(_){}render()}}
function switchTab(tab){if(tab===STATE.tab)return;STATE.tab=tab;STATE.match=null;STATE.details=null;STATE.filter='Tümü';STATE.term='';if(tab==='live')STATE.day=0;if(tab==='settings'){render();return}render();if(tab==='live'){refreshLive();if(!STATE.matches.length)refresh(true)}else if(!STATE.matches.length)refresh(true);}
$('nav').addEventListener('click',e=>{let button=e.target.closest('[data-tab]');if(button)switchTab(button.dataset.tab)});
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(b){if(b.dataset.refresh){refresh(true);return}if(b.dataset.topTab){switchTab(b.dataset.topTab);return}if(b.dataset.day!==undefined){STATE.day=Number(b.dataset.day);STATE.tab='today';STATE.filter='Tümü';STATE.match=null;STATE.matches=[];STATE.lastFixtures=0;refresh(true);return}if(b.dataset.filter!==undefined){STATE.filter=decodeURIComponent(b.dataset.filter);render();return}if(b.dataset.star){e.stopPropagation();const key=decodeURIComponent(b.dataset.star);const m=[...STATE.liveMatches,...STATE.matches].find(m=>matchKey(m)===key);if(m){if(saved(m))favorites.delete(key);else favorites.add(key);localStorage.setItem('canliFavorites',JSON.stringify([...favorites]));render()}return}if(b.dataset.detailTab){STATE.detailTab=b.dataset.detailTab;render();if(STATE.detailTab==='lineups'&&STATE.details&&!STATE.details.lineupsLoaded&&!STATE.details.lineups)loadLineups();return}if(b.dataset.detailRetry){STATE.details=null;render();loadDetail(STATE.match);return}if(b.dataset.back){STATE.match=null;STATE.details=null;render();return}if(b.dataset.saveToken){bsdToken=$('token').value.trim();localStorage.setItem('bsdToken',bsdToken);STATE.source=bsdToken?'bsd':'sportscore';STATE.matches=[];STATE.liveMatches=[];STATE.lastFixtures=0;STATE.lastLive=0;STATE.leagueMap={};STATE.tab='today';STATE.day=0;refresh(true);return}if(b.dataset.clearToken){bsdToken='';localStorage.removeItem('bsdToken');STATE.source='sportscore';STATE.matches=[];STATE.liveMatches=[];STATE.lastFixtures=0;STATE.tab='today';STATE.day=0;refresh(true);return}}let card=e.target.closest('[data-open]');if(card){const id=decodeURIComponent(card.dataset.open);const m=[...STATE.liveMatches,...STATE.matches].find(m=>matchKey(m)===id);if(m)detail(m)}});
$('content').addEventListener('error',e=>{const img=e.target;if(img?.classList?.contains('team-img'))img.style.display='none'},true);
$('content').addEventListener('load',e=>{const img=e.target;if(img?.classList?.contains('team-img') && img.naturalWidth>0){const fallback=img.parentElement?.querySelector('.fallback-crest');if(fallback)fallback.style.visibility='hidden'}},true);
$('content').addEventListener('input',e=>{if(e.target.id==='search'){STATE.term=e.target.value;const box=$('match-results');if(box)box.innerHTML=buildSections()}});
setInterval(()=>{if(document.visibilityState==='hidden'||STATE.match||STATE.tab==='settings'||STATE.liveLoading||STATE.loading)return;const watchingLive=STATE.tab==='live'||STATE.matches.some(isLive)||STATE.liveMatches.length>0;const delay=bsdToken?(watchingLive?15000:60000):65000;if((STATE.day===0||STATE.tab==='live')&&Date.now()-Math.max(STATE.liveAttempt,STATE.lastLive)>=delay){refreshLive();return}if(STATE.tab!=='live'&&Date.now()-Math.max(STATE.lastFixtures,STATE.lastAttempt)>=300000)refresh()},1000);
// While an active live match is open, refresh score every 15s and deeper stats every 120s.
// No polling when Android WebView is hidden; details are not re-requested every 15 seconds.
setInterval(()=>{
 if(document.visibilityState==='hidden'||!STATE.match||!isLive(STATE.match)||!bsdToken)return;
 if(!STATE.liveLoading&&!STATE.loading&&Date.now()-Math.max(STATE.lastLive,STATE.liveAttempt)>=15000)refreshLive();
 if(STATE.details&&!STATE.detailLoading&&Date.now()-(STATE.lastDetailFetch||0)>=120000)refreshDetailStats();
},1000);
window.onNativeBack=()=>{if(STATE.match){STATE.match=null;STATE.details=null;render();return true}if(STATE.tab!=='today'){STATE.tab='today';render();return true}return false};
if(bsdToken)STATE.source='bsd';render();refresh(true);
</script></body></html>
