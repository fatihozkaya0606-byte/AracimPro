<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101e"><title>Canlı Skor+</title>
<style>
:root{--bg:#08101e;--base:#101c2c;--paper:#142234;--muted:#93a5bb;--txt:#f3f7fc;--line:#26364a;--lime:#b3ff57;--teal:#5be0c6;--red:#ff6c80}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}#app{min-height:100dvh;max-width:800px;margin:auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.header{background:radial-gradient(ellipse at 98% 0%,#1a3b38 0%,#101e2c 44%,#08101e 85%);padding:calc(22px + env(safe-area-inset-top)) 18px 18px}.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{background:var(--lime);color:#0b1715;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;font-weight:1000;font-size:25px;box-shadow:0 6px 24px #b3ff5722}.title{font-size:24px;letter-spacing:-.8px;font-weight:850}.subtitle{color:var(--muted);font-size:12px;margin-top:2px}.status-pill{display:flex;align-items:center;gap:6px;border:1px solid #355246;border-radius:50px;padding:8px 10px;color:var(--teal);font-size:12px;background:#1b302b}.dot{width:7px;height:7px;background:var(--teal);border-radius:100%;box-shadow:0 0 12px var(--teal)}.hero{margin-top:24px;border-radius:19px;padding:20px;background:linear-gradient(125deg,#214738,#174039 48%,#16313a);border:1px solid #2e5e50;position:relative;overflow:hidden}.hero:before{content:'⚽';position:absolute;right:-2px;top:14px;font-size:110px;opacity:.10;transform:rotate(-18deg)}.hero small{color:#c2fae9;letter-spacing:1.7px;font-size:10px;font-weight:750}.hero h1{font-size:25px;line-height:1.2;margin:11px 0 8px;max-width:270px;letter-spacing:-.7px}.hero p{color:#c3d9cf;margin:0;font-size:12px;max-width:290px;line-height:1.6}.hero-bottom{display:flex;align-items:center;gap:14px;margin-top:16px;color:#cbe7df;font-size:12px}.hero-bottom b{color:#fff;font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.section{padding:20px 16px 8px}.section-title{font-size:18px;font-weight:800;letter-spacing:-.3px}.muted{font-size:12px;color:var(--muted)}.datebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.date-btn{border:1px solid var(--line);background:#101e30;color:#b8c7da;border-radius:12px;padding:12px 8px;font-weight:700;font-size:13px}.date-btn.on{background:var(--lime);color:#10221a;border-color:var(--lime)}.searchbox{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--base);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--muted);margin:10px 0}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--txt)}.searchbox input::placeholder{color:#778aa0}.filter{display:flex;gap:8px;overflow:auto;padding:10px 0 17px;scrollbar-width:none}.filter::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:9px 15px;border:1px solid var(--line);border-radius:30px;background:#0f1a2b;color:#a3b4ca;font-size:12px;font-weight:700}.chip.on{background:#29483a;border-color:#5a9768;color:var(--lime)}.league-head{display:flex;justify-content:space-between;align-items:center;padding:15px 15px 10px}.league-head strong{font-size:13px}.league-head span{font-size:11px;color:var(--muted)}.league-group{margin:8px 0 17px;border:1px solid var(--line);border-radius:17px;background:#111d2e;overflow:hidden}.match{padding:15px 13px;display:flex;align-items:center;gap:10px;min-height:86px;border-top:1px solid #253449;cursor:pointer}.match:hover{background:#1b293b}.match-info{width:51px;flex-shrink:0;text-align:center;color:#aab9c9;font-size:11px}.score-live{color:var(--lime);font-weight:900}.teams{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}.team{display:flex;gap:8px;align-items:center;min-width:0;font-weight:650;font-size:13px}.team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crest{width:24px;height:24px;flex-shrink:0;border-radius:9px;border:1px solid #455268;background:#2a394e;display:grid;place-items:center;font-size:10px;font-weight:900;color:#e5eaf4}.scores{display:flex;flex-direction:column;gap:8px;text-align:right;font-weight:900;font-size:19px;min-width:27px}.star{color:#73859d;border:0;background:none;font-size:23px;line-height:1;padding:7px 1px}.star.saved{color:#ffd56a}.empty{padding:35px 20px;text-align:center;border:1px dashed #3a4a5c;background:#111e2e;border-radius:16px;margin-top:12px}.empty-icon{font-size:37px}.empty h3{margin:8px 0;font-size:17px}.empty p{font-size:13px;color:var(--muted);line-height:1.6}.primary{border:0;background:var(--lime);padding:12px 18px;border-radius:11px;font-weight:800;color:#12301d}.secondary{border:1px solid var(--line);background:#1c2d41;padding:11px 16px;border-radius:10px;color:white;font-weight:650}.smallbtn{background:#203149;border:1px solid #3b5366;color:#d3dfeb;border-radius:10px;padding:8px 12px;font-size:12px}.credit{font-size:11px;color:#8297ac;text-align:center;margin:24px 5px 10px}.credit a{color:#a9d2fa;text-decoration:underline}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:800px;display:grid;grid-template-columns:repeat(4,1fr);background:#0d1828f8;border-top:1px solid #2b3b4e;padding:8px 8px calc(6px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(15px)}.nav button{background:none;border:0;color:#7b91a8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px;font-weight:700;padding:7px}.nav span{font-size:22px}.nav button.on{color:var(--lime)}.banner{margin:10px 16px;border:1px solid #695b31;background:#29271b;color:#e7cf93;padding:11px;border-radius:12px;font-size:12px;line-height:1.5}.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--muted)}.spinner{width:18px;height:18px;border:2px solid #38506a;border-top-color:var(--lime);border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.setting{background:#111e30;border:1px solid var(--line);border-radius:16px;padding:17px;margin:15px 0}.setting h3{margin:0 0 9px;font-size:16px}.setting p{margin:0 0 12px;font-size:12px;line-height:1.6;color:var(--muted)}.setting input{width:100%;border:1px solid #3a5063;background:#0b1728;color:#eaf5ff;border-radius:9px;padding:13px 11px;margin-bottom:10px}.setting-actions{display:flex;gap:8px}.label{font-size:11px;color:var(--muted);font-weight:750;letter-spacing:.5px;margin-bottom:8px}.detail-hero{background:#16283c;border:1px solid #385065;border-radius:18px;padding:19px;margin:16px 0}.detail-teams{display:flex;gap:12px;justify-content:space-between;align-items:center;text-align:center}.detail-teams>div{flex:1;min-width:0}.detail-score{font-size:29px;font-weight:900;white-space:nowrap}.detail-tag{text-align:center;color:var(--lime);font-size:12px;margin-top:15px}.detail-teamname{margin-top:8px;font-size:13px;font-weight:800;overflow-wrap:anywhere}.event{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);font-size:13px}.event small{width:45px;color:var(--lime);flex-shrink:0}.stats-row{margin:10px 0 19px}.stats-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d9e6f4;margin-bottom:8px}.track{height:8px;border-radius:10px;background:#2a3a4c;overflow:hidden;display:flex}.track div:first-child{background:var(--lime)}.track div:last-child{background:#5c86e8}.back{border:0;background:transparent;color:var(--lime);font-size:15px;padding:7px 0}.limit-note{margin-top:12px;color:#92a8be;font-size:11px}.gridlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.gridlinks a{display:block;background:#1c2d43;border-radius:10px;text-align:center;color:#ddf1f7;text-decoration:none;padding:13px 9px;font-size:12px}.errorbox{margin:10px 0;background:#3c2532;border:1px solid #865061;border-radius:12px;padding:13px;color:#ffc3cd;font-size:12px;line-height:1.5}.refresh-btn{border:1px solid #395944;color:#b5ff61;background:#173028;border-radius:11px;padding:9px 13px;font-size:12px;font-weight:800}.tiny{font-size:10px;color:#7e91a9}@media(min-width:600px){.header{padding:25px 30px}.section{padding-left:30px;padding-right:30px}.banner{margin-left:30px;margin-right:30px}}
</style></head><body><div id="app"><header class="header"><div class="titlebar"><div class="brand"><div class="brand-mark">⚽</div><div><div class="title">Canlı Skor<span style="color:var(--lime)">+</span></div><div class="subtitle">Futbolun nabzı burada</div></div></div><span class="status-pill"><i class="dot"></i><span id="source-label">BAĞLANIYOR</span></span></div><div class="hero"><small>⚡ CANLI MAÇ TAKİBİ</small><h1>Her gol, her an, tek ekranda.</h1><p>Gerçek maç verileri. Sahte sonuç yok. En güncel skorlar aşağıda.</p><div class="hero-bottom"><span><b id="live-count">—</b> canlı maç</span><span>•</span><span>Son kontrol: <b id="updated-at" style="font-size:12px">—</b></span></div></div></header><main id="content" class="section"></main><div class="credit" id="credit"></div></div><nav class="nav" id="nav"><button data-tab="today" class="on"><span>▦</span>Maçlar</button><button data-tab="live"><span>⚡</span>Canlı</button><button data-tab="favorites"><span>☆</span>Favoriler</button><button data-tab="settings"><span>⚙</span>Ayarlar</button></nav>
<script>
'use strict';
const $=id=>document.getElementById(id); const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const STATE={tab:'today',day:0,filter:'Tümü',term:'',match:null,matches:[],loading:false,error:'',last:0,source:'sportscore',details:null};
const API_BSD='https://sports.bzzoiro.com',API_SS='https://sportscore.com';
let bsdToken=localStorage.getItem('bsdToken')||''; let favorites=new Set(JSON.parse(localStorage.getItem('canliFavorites')||'[]')); const pending=new Map(); let seq=0;
function nativeAvailable(){return typeof window.AndroidApi!=='undefined' && typeof AndroidApi.request==='function'}
window.__nativeResult=function(id,status,body){let o=pending.get(id);if(!o)return;pending.delete(id);let data;try{data=JSON.parse(body)}catch(e){o.reject(new Error('Geçersiz JSON yanıtı'));return}if(status<200||status>=300){let msg=(data&&data.detail)||data.message||('HTTP '+status);o.reject(new Error(typeof msg==='string'?msg:'HTTP '+status));return}o.resolve(data)};
function request(url,token=''){if(nativeAvailable())return new Promise((resolve,reject)=>{let id='r'+(++seq);pending.set(id,{resolve,reject});AndroidApi.request(url,token,id);setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('Bağlantı zaman aşımına uğradı'))}},18000)});return fetch(url,{headers:token?{'Authorization':'Token '+token}:{},cache:'no-store'}).then(async r=>{let j=await r.json();if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j})}
function getDate(offset=0){let now=new Date();now.setHours(12,0,0,0);now.setDate(now.getDate()+offset);return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')}
function showDate(iso){if(!iso)return '';let d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'})}
function showDateFull(iso){if(!iso)return '';let d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Istanbul'})}
function first(obj,keys,def=''){for(let k of keys){let v=obj?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return def}
function textVal(v){return typeof v==='object'&&v!==null?first(v,['name','short_name','title','display_name'],''):v||''}
function num(v){return (v===null||v===undefined||v==='')?'—':String(v)}
function normalize(row,provider){const b=provider==='bsd';let ho=first(row,['home_team','home','homeTeam','team_home','home_team_name']);let aw=first(row,['away_team','away','awayTeam','team_away','away_team_name']);let league=first(row,['league','competition','tournament','league_name']);let date=first(row,['event_date','start_time','kickoff','time','start_at','date']);let status=String(first(row,['status','match_status'],'upcoming')).toLowerCase();if(['in_progress','playing','in-play','inplay','1h','2h','ht','extra_time','et','penalties'].includes(status))status='live';if(status==='ft'||status==='ended')status='finished';let hName=String(textVal(ho)||first(row,['home_name','home_team_name'],'Ev sahibi')),aName=String(textVal(aw)||first(row,['away_name','away_team_name'],'Deplasman'));let minute=first(row,['current_minute','minute','elapsed','status_text'],'');let id=String(first(row,['id','event_id','match_id','slug'],[hName,aName,date].join('-')));let scoreH=first(row,['home_score','score_home','homeGoals'],null),scoreA=first(row,['away_score','score_away','awayGoals'],null);if(scoreH===null&&row.score&&typeof row.score==='object'){scoreH=first(row.score,['home','home_score'],null);scoreA=first(row.score,['away','away_score'],null)}if(b&&row.extra_time_score){let eh=first(row.extra_time_score,['home','home_score'],0),ea=first(row.extra_time_score,['away','away_score'],0);if(scoreH!==null&&scoreA!==null){scoreH=Number(scoreH)+Number(eh||0);scoreA=Number(scoreA)+Number(ea||0)}}return {provider,id,slug:String(row.slug||''),home:hName,away:aName,league:String(textVal(league)||'Diğer Ligler'),time:date,status,minute,hs:scoreH,as:scoreA,raw:row}}
function arrayOf(x){if(Array.isArray(x))return x;for(let k of ['results','matches','fixtures','events','data','live'])if(Array.isArray(x?.[k]))return x[k];return []}
async function getMatches(day=0,liveOnly=false){let date=getDate(day),items=[];if(bsdToken){let endpoint=liveOnly?'/api/v2/events/live/':'/api/v2/events/?date_from='+date+'&date_to='+date+'&limit=200';let data=await request(API_BSD+endpoint,bsdToken);items=arrayOf(data).map(x=>normalize(x,'bsd'));STATE.source='bsd';return liveOnly?items.filter(x=>x.status==='live'):items}
let url=liveOnly?API_SS+'/api/widget/matches/?sport=football&limit=50':API_SS+'/api/v1/fixtures/?sport=football&date='+date+'&limit=200';let data;try{data=await request(url)}catch(e){if(liveOnly||day!==0)throw e;data=await request(API_SS+'/api/widget/matches/?sport=football&limit=50')}
items=arrayOf(data).map(x=>normalize(x,'sportscore'));STATE.source='sportscore'; if(liveOnly)return items.filter(x=>x.status==='live');return items}
const isLive=m=>m.status==='live';const isFinal=m=>m.status==='finished';const matchKey=m=>(m.provider==='bsd'?'b':'s')+':'+(m.slug||m.id);function saved(m){return favorites.has(matchKey(m))}
function saveMatch(m){let key=matchKey(m);if(favorites.has(key))favorites.delete(key);else favorites.add(key);localStorage.setItem('canliFavorites',JSON.stringify([...favorites]));render()}
function statusText(m){if(isLive(m))return m.minute?(/\d/.test(String(m.minute)) ? String(m.minute).replace(/[^\d+']/g,'').slice(0,5)+(String(m.minute).includes("'")?'':"'") : String(m.minute).slice(0,8)):'CANLI';if(isFinal(m))return 'MS';if(m.status==='postponed')return 'ERT';if(m.status==='cancelled')return 'İPT';return showDate(m.time)||'—'}
function scoreText(m,side){if(!isLive(m)&&!isFinal(m))return '–';return num(side==='home'?m.hs:m.as)}
function crest(name){return escapeHtml(String(name||'?').trim().charAt(0).toLocaleUpperCase('tr-TR'))}
function matchCard(m){let key=encodeURIComponent(matchKey(m));return `<article class="match" data-open="${key}"><div class="match-info ${isLive(m)?'score-live':''}">${escapeHtml(statusText(m))}</div><div class="teams"><div class="team"><span class="crest">${crest(m.home)}</span><span class="team-name">${escapeHtml(m.home)}</span></div><div class="team"><span class="crest">${crest(m.away)}</span><span class="team-name">${escapeHtml(m.away)}</span></div></div><div class="scores ${isLive(m)?'score-live':''}"><span>${escapeHtml(scoreText(m,'home'))}</span><span>${escapeHtml(scoreText(m,'away'))}</span></div><button class="star ${saved(m)?'saved':''}" data-star="${key}" aria-label="Favorilere ekle">${saved(m)?'★':'☆'}</button></article>`}
function groupedCards(items){const by=new Map();for(const m of items){let k=m.league||'Diğer Ligler';if(!by.has(k))by.set(k,[]);by.get(k).push(m)}if(!items.length)return `<div class="empty"><div class="empty-icon">⚽</div><h3>Bu ekranda maç bulunamadı</h3><p>Seçili gün veya filtrede veri bulunmuyor. Başka bir gün seçebilir ya da yenileyebilirsin.</p><button class="secondary" data-refresh="1">Tekrar dene</button></div>`;return [...by].sort((a,b)=>a[0].localeCompare(b[0],'tr')).map(([league,ms])=>`<div class="league-group"><div class="league-head"><strong>🏆 ${escapeHtml(league)}</strong><span>${ms.length} maç</span></div>${ms.sort((a,b)=>String(a.time||'').localeCompare(String(b.time||''))).map(matchCard).join('')}</div>`).join('')}
function titleRow(title){return `<div class="row"><div><div class="section-title">${title}</div><div class="muted">${STATE.last?('Son güncelleme: '+new Date(STATE.last).toLocaleTimeString('tr-TR')):'Canlı veri bekleniyor'}</div></div><button class="refresh-btn" data-refresh="1">↻ Yenile</button></div>`}
function screenMatches(){let title=STATE.tab==='live'?'⚡ Şu An Canlı':STATE.tab==='favorites'?'☆ Favori Maçlar':'⚽ Maç Merkezi';let a=STATE.matches;if(STATE.tab==='live')a=a.filter(isLive);if(STATE.tab==='favorites')a=a.filter(m=>saved(m));if(STATE.filter!=='Tümü')a=a.filter(m=>m.league===STATE.filter);if(STATE.term.trim())a=a.filter(m=>(m.home+' '+m.away+' '+m.league).toLocaleLowerCase('tr-TR').includes(STATE.term.toLocaleLowerCase('tr-TR').trim()));let leagues=[...new Set(STATE.matches.map(x=>x.league))].sort((x,y)=>x.localeCompare(y,'tr'));return `${titleRow(title)}<div class="datebar"><button class="date-btn ${STATE.day===-1?'on':''}" data-day="-1">Dün</button><button class="date-btn ${STATE.day===0?'on':''}" data-day="0">Bugün</button><button class="date-btn ${STATE.day===1?'on':''}" data-day="1">Yarın</button></div><div class="searchbox">⌕ <input id="search" type="search" placeholder="Takım veya lig ara" value="${escapeHtml(STATE.term)}" autocomplete="off"></div><div class="filter"><button data-filter="${encodeURIComponent('Tümü')}" class="chip ${STATE.filter==='Tümü'?'on':''}">Tümü</button>${leagues.map(l=>`<button data-filter="${encodeURIComponent(l)}" class="chip ${STATE.filter===l?'on':''}">${escapeHtml(l)}</button>`).join('')}</div>${STATE.loading?'<div class="loading"><span class="spinner"></span>Gerçek maçlar yükleniyor…</div>':''}${STATE.error?`<div class="errorbox">⚠ ${escapeHtml(STATE.error)} ${STATE.source==='sportscore'?'':'BSD anahtarını Ayarlar kısmından kontrol et.'}</div>`:''}${groupedCards(a)}`}
function screenSettings(){return `${titleRow('⚙ Veri Kaynağı Ayarları')}<div class="setting"><h3>🚀 BSD — daha sık güncelleme</h3><p>Ücretsiz BSD hesabından aldığın API anahtarını gir. Maçlar ve canlı skorlar BSD'den alınır. Bu sürüm test içindir; halka açık sürümde anahtar sunucu tarafında saklanmalıdır.</p><div class="label">BSD API ANAHTARI</div><input id="token" type="password" placeholder="API anahtarını buraya yapıştır" value="${escapeHtml(bsdToken)}" spellcheck="false" autocomplete="off"><div class="setting-actions"><button class="primary" data-save-token="1">Kaydet ve bağlan</button><button class="secondary" data-clear-token="1">Anahtarsız kullan</button></div><div class="limit-note">BSD: 7.500 istek/gün ücretsiz; canlı listesi yaklaşık 30 saniyede yenilenir. Her cihazın ayrı istek yaptığı bu test sürümü çok kullanıcılı yayın için uygun değildir.</div></div><div class="setting"><h3>🌍 SportScore — anahtarsız</h3><p>API anahtarı girilmediğinde otomatik kullanılır. Ücretsiz kaynak; sunucu yanıtları 60 saniye önbellekte tutulur ve günlük yaklaşık 10.000 istek/IP sınırı vardır. Kapsam tüm ligler için garanti değildir.</p><div class="gridlinks"><a href="https://sports.bzzoiro.com/register/">BSD hesabı oluştur ↗</a><a href="https://sportscore.com/developers/">SportScore şartları ↗</a></div></div><div class="setting"><h3>ℹ Uygulama bilgisi</h3><p>Canlı maçları görüntüler, favorileri bu cihazda saklar. Arka plan gol bildirimi ve canlı maç video yayını bu test sürümüne dahil değildir. Kaynak verisi bazen gecikmeli gelebilir.</p><p>Aktif kaynak: <b>${STATE.source==='bsd'?'BSD':'SportScore'}</b>. Veriler güncellenmediğinde eski skorlar canlıymış gibi gösterilmez.</p></div>`}
async function openDetail(m){STATE.match=m;STATE.details=null;STATE.error='';render();try{if(m.provider==='bsd'&&bsdToken){let [inc,stats]=await Promise.allSettled([request(API_BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/incidents/',bsdToken),request(API_BSD+'/api/v2/events/'+encodeURIComponent(m.id)+'/stats/',bsdToken)]);STATE.details={inc:inc.status==='fulfilled'?inc.value:null,stats:stats.status==='fulfilled'?stats.value:null}}else if(m.slug){STATE.details={ss:await request(API_SS+'/api/widget/match/?sport=football&slug='+encodeURIComponent(m.slug))}}else{STATE.details={}}}catch(e){STATE.details={err:e.message}}render()}
function statRow(label,left,right){let l=Number(left),r=Number(right);if(!Number.isFinite(l)||!Number.isFinite(r)||left===null||right===null)return '';let total=l+r,percentage=total?100*l/total:50;return `<div class="stats-row"><div class="stats-top"><b>${escapeHtml(left)}</b><span>${escapeHtml(label)}</span><b>${escapeHtml(right)}</b></div><div class="track"><div style="width:${percentage}%"></div><div style="width:${100-percentage}%"></div></div></div>`}
function detailScreen(m){let html=`<button class="back" data-back="1">‹ Maçlara dön</button><div class="section-title">${escapeHtml(m.league)}</div><div class="detail-hero"><div class="muted" style="text-align:center;margin-bottom:14px">${escapeHtml(showDateFull(m.time))} ${escapeHtml(showDate(m.time))}</div><div class="detail-teams"><div><div class="crest" style="width:50px;height:50px;font-size:21px;margin:auto">${crest(m.home)}</div><div class="detail-teamname">${escapeHtml(m.home)}</div></div><div class="detail-score">${scoreText(m,'home')} : ${scoreText(m,'away')}</div><div><div class="crest" style="width:50px;height:50px;font-size:21px;margin:auto">${crest(m.away)}</div><div class="detail-teamname">${escapeHtml(m.away)}</div></div></div><div class="detail-tag">${escapeHtml(statusText(m))} ${isLive(m)?' • CANLI':''}</div></div>`;
if(!STATE.details)return html+'<div class="loading"><span class="spinner"></span>Maç ayrıntıları getiriliyor…</div>';
if(STATE.details.err)html+=`<div class="errorbox">${escapeHtml(STATE.details.err)}</div>`;
let data=STATE.details.inc, events=arrayOf(data);if(!events.length)events=Array.isArray(data?.incidents)?data.incidents:[];if(STATE.details.ss){let d=STATE.details.ss;events=first(d,['timeline','incidents','events'],[]);if(!Array.isArray(events))events=[]}
html+='<h3>📋 Maç olayları</h3>';html+=events.length?events.map(e=>{let ty=String(first(e,['type','incident_type'],'')).toLowerCase(),ico=ty.includes('goal')?'⚽':ty.includes('card')?'🟨':ty.includes('sub')?'🔁':'•',time=first(e,['minute','time','match_minute'],'—'),name=textVal(first(e,['player','player_name','text','description'],''));return `<div class="event"><small>${escapeHtml(String(time))}'</small><span>${ico}</span><div><b>${escapeHtml(ty.replaceAll('_',' '))}</b> ${escapeHtml(name)}</div></div>`}).join(''):'<p class="muted">Bu maç için olay verisi henüz mevcut değil.</p>';
let s=STATE.details.stats?.stats;if(s&&s.home&&s.away){html+='<h3>📊 İstatistikler</h3>';for(const [label,key] of [['Topla oynama (%)','ball_possession'],['Şutlar','total_shots'],['İsabetli şutlar','shots_on_target'],['Korner','corner_kicks'],['Fauller','fouls'],['Sarı kart','yellow_cards']])html+=statRow(label,s.home[key],s.away[key])}else html+='<h3>📊 İstatistikler</h3><p class="muted">Bu maç için istatistik bulunmuyor veya veri kaynağı desteklemiyor.</p>';return html}
function render(){let live=STATE.matches.filter(isLive).length;$('live-count').textContent=String(live);$('updated-at').textContent=STATE.last?new Date(STATE.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';$('source-label').textContent=STATE.source==='bsd'?'BSD API':'SPORTSCORE';$('content').innerHTML=STATE.match?detailScreen(STATE.match):STATE.tab==='settings'?screenSettings():screenMatches();$('credit').innerHTML=STATE.source==='sportscore'?'<a href="https://sportscore.com/" rel="dofollow">Powered by SportScore</a> · Veriler gecikmeli olabilir':'Veri kaynağı: BSD · Veriler gecikmeli olabilir';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===STATE.tab))}
async function refresh(force=false){if(STATE.loading)return;STATE.loading=true;STATE.error='';render();try{let list=await getMatches(STATE.day,STATE.tab==='live'&&STATE.day===0);STATE.matches=list;STATE.last=Date.now();let cache={matches:list.map(x=>({...x,raw:undefined})),last:STATE.last,source:STATE.source,day:STATE.day};localStorage.setItem('scoreCache',JSON.stringify(cache))}catch(e){STATE.error=e.message||'Bağlantı kurulamadı. İnternetini kontrol et.';if(!STATE.matches.length){try{let cache=JSON.parse(localStorage.getItem('scoreCache')||'null');if(cache&&cache.day===STATE.day){STATE.matches=cache.matches||[];STATE.last=0;STATE.error+=' • Gösterilenler daha önce kaydedilmiş sonuçlardır.'}}catch(_){}}}finally{STATE.loading=false;render()}}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;STATE.tab=b.dataset.tab;STATE.match=null;STATE.term='';STATE.filter='Tümü';if(STATE.tab==='live'){STATE.day=0;refresh()}else if(STATE.tab==='today'){STATE.day=0;refresh()}else render()});
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(b){if(b.dataset.refresh){refresh(true);return}if(b.dataset.day!==undefined){STATE.day=Number(b.dataset.day);STATE.filter='Tümü';STATE.term='';refresh(true);return}if(b.dataset.filter!==undefined){STATE.filter=decodeURIComponent(b.dataset.filter);render();return}if(b.dataset.star){e.stopPropagation();let key=decodeURIComponent(b.dataset.star);let m=STATE.matches.find(x=>matchKey(x)===key);if(m)saveMatch(m);return}if(b.dataset.back){STATE.match=null;STATE.details=null;render();return}if(b.dataset.saveToken){let value=$('token').value.trim();bsdToken=value;localStorage.setItem('bsdToken',value);STATE.source=value?'bsd':'sportscore';STATE.match=null;STATE.tab='today';STATE.day=0;refresh(true);return}if(b.dataset.clearToken){bsdToken='';localStorage.removeItem('bsdToken');STATE.source='sportscore';STATE.match=null;STATE.tab='today';STATE.day=0;refresh(true);return}}
let card=e.target.closest('[data-open]');if(card){let key=decodeURIComponent(card.dataset.open);let m=STATE.matches.find(x=>matchKey(x)===key);if(m)openDetail(m)}});
$('content').addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;STATE.term=e.target.value;let input=$('search');let a=STATE.matches.filter(m=>STATE.filter==='Tümü'||m.league===STATE.filter).filter(m=>(m.home+' '+m.away+' '+m.league).toLocaleLowerCase('tr-TR').includes(STATE.term.toLocaleLowerCase('tr-TR')));let groups=groupedCards(a);let container=$('match-results');if(container)container.innerHTML=groups;else {render();input=$('search');input?.focus();input?.setSelectionRange(pos,pos)}}});
// Scheduled refresh only while app is visible and while match lists are in use.
setInterval(()=>{if(document.visibilityState==='hidden'||STATE.match||STATE.tab==='settings'||STATE.loading)return;let delay=bsdToken?30000:65000;if(Date.now()-STATE.last>delay)refresh()},12000);
window.onNativeBack=()=>{if(STATE.match){STATE.match=null;STATE.details=null;render();return true}if(STATE.tab!=='today'){STATE.tab='today';render();return true}return false};
if(bsdToken)STATE.source='bsd';render();refresh();
</script></body></html>
