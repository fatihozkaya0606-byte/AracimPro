    <nav class="bottom-nav" id="nav" aria-label="Ana gezinme"><button data-page="home" class="selected"><span>⌂</span><small>Ana Sayfa</small></button><button data-page="quran"><span>☷</span><small>Kur'an</small></button><button data-page="worship"><span>☾</span><small>İbadet</small></button><button data-page="learn"><span>✧</span><small>Öğren</small></button><button data-page="adhan"><span>♫</span><small>Ezanlar</small></button><button data-page="progress"><span>◎</span><small>Hatim</small></button></nav>
    <div id="toast" role="status"></div>
  </div>
  <script>
'use strict';
/* Nur Rehberi • v0.1
   Quran text / Turkish translation: AlQuran.cloud (quran-uthmani / tr.diyanet)
   Audio: AlQuran.cloud reciter edition audio streaming.
   Prayer times: AlAdhan method 13 (Turkey calculation); not an official Diyanet feed.
   No AI-generated Quran text; data from edition API is displayed verbatim.
*/
const API='https://api.alquran.cloud/v1';
const NAMES=['Fâtiha','Bakara','Âl-i İmrân','Nisâ','Mâide','En‘âm','A‘râf','Enfâl','Tevbe','Yûnus','Hûd','Yûsuf','Ra‘d','İbrâhîm','Hicr','Nahl','İsrâ','Kehf','Meryem','Tâhâ','Enbiyâ','Hac','Mü’minûn','Nûr','Furkân','Şuarâ','Neml','Kasas','Ankebût','Rûm','Lokmân','Secde','Ahzâb','Sebe’','Fâtır','Yâsîn','Sâffât','Sâd','Zümer','Mü’min','Fussilet','Şûrâ','Zuhruf','Duhân','Câsiye','Ahkâf','Muhammed','Fetih','Hucurât','Kâf','Zâriyât','Tûr','Necm','Kamer','Rahmân','Vâkıa','Hadîd','Mücâdele','Haşr','Mümtehine','Saff','Cuma','Münâfikûn','Tegâbün','Talâk','Tahrîm','Mülk','Kalem','Hâkka','Meâric','Nûh','Cin','Müzzemmil','Müddessir','Kıyâme','İnsân','Mürselât','Nebe’','Nâziât','Abese','Tekvîr','İnfitâr','Mutaffifîn','İnşikâk','Bürûc','Târık','A‘lâ','Gâşiye','Fecr','Beled','Şems','Leyl','Duhâ','İnşirâh','Tîn','Alak','Kadir','Beyyine','Zilzâl','Âdiyât','Kâria','Tekâsür','Asr','Hümeze','Fîl','Kureyş','Mâûn','Kevser','Kâfirûn','Nasr','Tebbet','İhlâs','Felak','Nâs'];
const RECITERS=[
['ar.alafasy','Mişari Raşid el-Afasi'],['ar.abdulbasit','Abdülbasit Abdüssamed'],['ar.husary','Mahmud Halil el-Husari'],['ar.minshawi','Muhammed Sıddık el-Minşavi'],['ar.sudais','Abdurrahman es-Südeys'],['ar.shuraim','Suud eş-Şureym'],['ar.ajamy','Ahmed el-Acemi'],['ar.hudhaify','Ali el-Huzeyfi'],['ar.muhammadayoub','Muhammed Eyyûb'],['ar.muhammadjibreel','Muhammed Cibril'],['ar.abdulbasitmujawwad','Abdülbasit – Mücevved'],['ar.minshawimujawwad','Minşavi – Mücevved']];
const CHOICES=[['quran','☷','Kur’an-ı Kerim'],['quran','♫','Sesli Kur’an'],['adhan','♪','Ezanlar'],['worship','☾','Namaz Vakitleri'],['worship','✥','Kıble'],['worship','◉','Dua & Zikir'],['progress','◷','Hatim Takibi'],['learn','✧','Elifba'],['learn','✦','İslami Bilgiler'],['settings','⚙','Ayarlar']];
const DEFAULT={page:'home',surah:1,search:'',reciter:'ar.alafasy',city:'Ankara',country:'Turkey',dailyGoal:10,dark:false,arabicSize:30,mealSize:14,bookmarks:[],completed:[],lastRead:null,zikr:0,zikrType:'Sübhânallah',todayCount:0,todayStamp:'',playing:null,playerReady:false};
function fromStore(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}}
const saved=fromStore('nur-settings',{});
const st={...DEFAULT,...saved,page:'home',search:'',playing:null,playerReady:false};
const main=document.getElementById('main'),playerBox=document.getElementById('player');
let catalog=NAMES.map((name,i)=>({number:i+1,name:norm(name),turkishName:name,englishName:name,numberOfAyahs:0,arabicName:''}));
let current=null,audio=new Audio(),audioList=[],loadSeq=0,prayerData=null,prayerDate='',geo=null,toastTimeout=null;
audio.preload='none';
if(st.dark)document.body.classList.add('dark');
if(st.todayStamp!==new Date().toDateString()){st.todayStamp=new Date().toDateString();st.todayCount=0;}
function norm(s){return String(s||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function save(){const x={};['reciter','city','country','dailyGoal','dark','arabicSize','mealSize','bookmarks','completed','lastRead','zikr','zikrType','todayCount','todayStamp'].forEach(k=>x[k]=st[k]);try{localStorage.setItem('nur-settings',JSON.stringify(x))}catch{}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2400)}
function dateText(){return new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})}
function label(n){return catalog[n-1]?.turkishName||NAMES[n-1]||`Sure ${n}`}
function fmt(n){return Number(n||0).toLocaleString('tr-TR')}
function section(name,sub=''){return `<div class="section-title">${name}<small>${sub}</small></div>`}
function btn(page,glyph,title){return `<button type="button" class="menu-card" data-page="${page}"><span class="glyph">${glyph}</span><strong>${title}</strong></button>`}
function drawNav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('selected',b.dataset.page===(st.page==='reader'?'quran':st.page==='settings'?'home':st.page)));document.getElementById('back').hidden=!['reader','settings'].includes(st.page)}
function render(){document.body.classList.toggle('dark',!!st.dark);drawNav();if(st.page==='home')home();else if(st.page==='quran')quran();else if(st.page==='reader')reader();else if(st.page==='worship')worship();else if(st.page==='progress')progress();else if(st.page==='learn')learn();else if(st.page==='adhan')adhan();else if(st.page==='settings')settings();else home();}
function go(page){if(!['home','quran','reader','worship','progress','learn','adhan','settings'].includes(page))return;st.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
function home(){let last=st.lastRead;let pl=prayerData?.timings;main.innerHTML=`<div class="intro"><div><div class="eyebrow">${dateText()}</div><div class="title">Selâmün aleyküm</div><p class="sub">Kur’an ile gönlüne ışık kat.</p></div><div class="moon">☪</div></div>
<div class="hero"><div class="gold">✦ HUZURLU BİR GÜN İÇİN</div><h2>${pl?'Namaz Vakitleri':'Günün vakitleri'}</h2><p>${esc(st.city)} • ${pl?'Bugünün vakitleri hazır':'Şehrine göre vakitleri öğren'}</p><div class="hero-foot"><span>${pl?`Akşam: ${esc(pl.Maghrib||'--:--')}`:'Konumunu seç ve vakitleri gör'}</span><button data-page="worship">Vakitleri gör →</button></div></div>
${section('Keşfet','Hızlı erişim')}<div class="grid">${CHOICES.map(x=>btn(...x)).join('')}</div>
${section('Kaldığın yerden devam','')}
<div class="card last-card"><div><div class="eyebrow">SON OKUMA</div><h3>${last?esc(label(last.surah)):'Kur’an okumaya başla'}</h3><p>${last?`${last.ayah}. ayette kaldın`:'114 surenin tamamına ulaş'}</p></div><button class="btn gold tiny" data-action="open-surah" data-surah="${last?.surah||1}" data-ayah="${last?.ayah||1}">Devam et →</button></div>
${section('Hatim hedefin','')}
<div class="card"><div class="row"><b>${st.completed.length} / 114 sure</b><span class="pill">%${Math.round(st.completed.length/114*100)}</span></div><div class="spacer"></div><div class="progress-bar"><span style="width:${st.completed.length/114*100}%"></span></div><p>Okumayı tamamladığın sureleri işaretleyerek takip et.</p></div>
<div class="notice">Bu sürümde Kur’an metni ve meal internet üzerinden yüklenir, açılan sureler cihazda önbelleğe alınır. Hatim kaydı bu cihazda saklanır.</div>`;}
function surahMarkup(x){return `<button type="button" class="surah" data-action="open-surah" data-surah="${x.number}"><span class="surah-num">${x.number}</span><span class="surah-details"><strong>${esc(x.turkishName)}</strong><small>${x.numberOfAyahs?`${x.numberOfAyahs} ayet • `:''}${x.number===1?'Fâtiha':x.number===2?'Bakara':'Kur’an-ı Kerim'}</small></span><span class="surah-ar" lang="ar" dir="rtl">${esc(x.arabicName||'۞')}</span></button>`}
function filtered(){return catalog.filter(x=>norm(x.turkishName).includes(norm(st.search))||String(x.number)===st.search.trim())}
function quran(){main.innerHTML=`<div class="intro"><div><div class="eyebrow">KUR’AN-I KERİM</div><div class="title">Sureler</div><p class="sub">114 sure • Arapça metin ve Türkçe meal</p></div><div class="moon">۞</div></div><label class="search">⌕ <input id="surah-search" autocomplete="off" placeholder="Sure adı veya numarası ara" value="${esc(st.search)}" aria-label="Sure ara"></label><div class="surah-list" id="surah-list">${filtered().map(surahMarkup).join('')||'<div class="empty">Aramana uygun sure bulunamadı.</div>'}</div>`;}
function reader(){const n=st.surah,meta=catalog[n-1];const completed=st.completed.includes(n);let t=`<div class="reading-head"><div class="ar-heading" dir="rtl" lang="ar">${esc(meta.arabicName||'۞')}</div><h2>${esc(label(n))} Suresi</h2><small>${n}. sure${meta.numberOfAyahs?' • '+meta.numberOfAyahs+' ayet':''} • Diyanet meali</small></div><div class="reader-tools"><select id="reciter" aria-label="Hafız seç">${RECITERS.map(x=>`<option value="${x[0]}" ${x[0]===st.reciter?'selected':''}>${esc(x[1])}</option>`).join('')}</select><button id="play-surah" data-action="play-surah">▶ Dinle</button><button data-action="font-up" title="Arapça yazıyı büyüt">A+</button><button data-action="font-down" title="Arapça yazıyı küçült">A−</button></div><div class="notice">Altın çerçeveli ayet dinlenen veya seçilen ayettir. Okuma hatırlatıcın cihazda saklanır.</div><div id="verses">`;
if(!current||current.number!==n)t+='<div class="empty"><span class="spinner"></span><p>Arapça ayetler ve Türkçe meal yükleniyor…</p></div>';
else t+=versesHTML(current);
t+='</div><div class="reader-footer"><button data-action="mark-completed" class="btn '+(completed?'ghost':'')+'">'+(completed?'✓ Sure tamamlandı • Geri al':'✓ Bu sureyi tamamladım')+'</button><div class="spacer"></div><button data-action="next-surah" class="btn ghost" '+(n>=114?'disabled':'')+'>Sonraki sure →</button></div>';
main.innerHTML=t;document.documentElement.style.setProperty('--arabic-size',st.arabicSize+'px');document.documentElement.style.setProperty('--meal-size',st.mealSize+'px');}
function versesHTML(data){const cached=!!data.cached;return `<p class="text-small muted">${cached?'Önbelleğe alınmış sure • ':''}Arapça: Uthmani • Türkçe meal: Diyanet (API)</p>`+data.ayahs.map(a=>{const saved=st.bookmarks.includes(`${data.number}:${a.numberInSurah}`);return `<article class="ayah ${st.playing?.surah===data.number&&st.playing.ayah===a.numberInSurah?'active':''}" id="ayah-${a.numberInSurah}"><div class="ayah-meta"><span>${data.number}:${a.numberInSurah}</span><div class="actions"><button title="Dinle" aria-label="Ayet dinle" class="mini" data-action="play-ayah" data-ayah="${a.numberInSurah}">▶</button><button title="Kaydet" aria-label="Ayet kaydet" class="mini ${saved?'saved':''}" data-action="bookmark" data-ayah="${a.numberInSurah}">${saved?'★':'☆'}</button><button title="Okudum" aria-label="Ayet okundu olarak işaretle" class="mini" data-action="read-ayah" data-ayah="${a.numberInSurah}">✓</button></div></div><div class="arabic" translate="no" lang="ar" dir="rtl">${esc(a.arabic)}</div><div class="translation" lang="tr">${esc(a.translation)}</div></article>`}).join('')}
async function requestJson(url,signal){const res=await fetch(url,{headers:{Accept:'application/json'},signal});if(!res.ok)throw new Error('Servis yanıt vermedi: '+res.status);const j=await res.json();if(j.code!==200&&j.status!=='OK'&&j.status!=='success')throw new Error('Veri alınamadı');return j.data}
async function ensureCatalog(){try{const list=await requestJson(`${API}/surah`);if(Array.isArray(list)&&list.length===114){catalog=list.map((x,i)=>({...x,turkishName:NAMES[i]}));if(st.page==='quran'||st.page==='home')render();}}catch{}}
async function openSurah(n,ayah=1){n=Math.max(1,Math.min(114,Number(n)||1));st.surah=n;st.lastRead={surah:n,ayah:Number(ayah)||1};save();current=null;go('reader');let seq=++loadSeq;
try{let cached=fromStore('surah-'+n,null);if(cached&&cached.ayahs?.length){current={...cached,cached:true};if(st.page==='reader'&&st.surah===n)render();}
const [ar,tr]=await Promise.all([requestJson(`${API}/surah/${n}/quran-uthmani`),requestJson(`${API}/surah/${n}/tr.diyanet`)]);
if(seq!==loadSeq)return;
if(!Array.isArray(ar.ayahs)||!Array.isArray(tr.ayahs)||ar.ayahs.length!==tr.ayahs.length)throw new Error('Ayet/meâl sayıları eşleşmiyor.');
const data={number:n,ayahs:ar.ayahs.map((a,i)=>({numberInSurah:a.numberInSurah,number:a.number,arabic:a.text,translation:tr.ayahs[i].text}))};if(data.ayahs.some((x,i)=>x.numberInSurah!==tr.ayahs[i].numberInSurah))throw new Error('Ayet sıralaması uyuşmuyor.');
current=data;try{localStorage.setItem('surah-'+n,JSON.stringify(data))}catch{};if(st.page==='reader'&&st.surah===n){render();if(ayah>1)document.getElementById('ayah-'+ayah)?.scrollIntoView({block:'center'});}
}catch(e){if(seq!==loadSeq)return;if(!current){document.getElementById('verses').innerHTML=`<div class="empty">Kur’an verileri yüklenemedi. İnternet bağlantısını kontrol et.<br><br><button class="btn" data-action="retry-surah">Tekrar dene</button></div>`;}else toast('Çevrimdışı kayıtlı sure açıldı.')}}
function playButton(){if(!st.playing){playerBox.hidden=true;return;}playerBox.hidden=false;const p=st.playing;playerBox.innerHTML=`<div class="meta"><b>♫ ${esc(label(p.surah))} • ${p.ayah}. ayet</b><small>${esc(RECITERS.find(x=>x[0]===st.reciter)?.[1]||'Hafız')}</small></div><button data-action="toggle-audio" aria-label="${audio.paused?'Oynat':'Duraklat'}">${audio.paused?'▶':'Ⅱ'}</button><button class="close" data-action="stop-audio" aria-label="Kapat">×</button>`;}
function updateActive(scroll=false){document.querySelectorAll('.ayah').forEach(el=>el.classList.toggle('active',Number(el.id.slice(5))===st.playing?.ayah&&st.surah===st.playing?.surah));if(scroll&&st.playing?.surah===st.surah)document.getElementById('ayah-'+st.playing.ayah)?.scrollIntoView({block:'center',behavior:'smooth'});}
async function fetchAudioList(n,reciter){const data=await requestJson(`${API}/surah/${n}/${encodeURIComponent(reciter)}`);if(!data?.ayahs?.length)throw new Error('Bu hafızın kaydı bulunamadı.');return data.ayahs.map(x=>x.audio);}
async function startAudio(ayah){stopAdhan();if(!current?.ayahs?.length){toast('Önce surenin yüklenmesini bekle.');return;}let n=st.surah;const edition=st.reciter;let token=++audioToken;audio.pause();audio.removeAttribute('src');audio.load();st.playing={surah:n,ayah};playButton();updateActive(true);
try{let urls=await fetchAudioList(n,edition);if(token!==audioToken)return;audioList=urls;await playIndex(ayah-1,token);}catch(e){if(token!==audioToken)return;st.playing=null;playButton();toast('Ses kaydı yüklenemedi. Başka hafız seçebilir veya tekrar deneyebilirsin.');}}
let audioToken=0;
async function playIndex(index,token){if(token!==audioToken||index>=audioList.length){stopAudio();return;}st.playing={surah:st.surah,ayah:index+1};const url=audioList[index];if(!url){stopAudio();toast('Bu ayetin ses kaydı yok.');return;}audio.src=url;audio.playbackRate=1;audio.onended=()=>{if(token===audioToken)playIndex(index+1,token).catch(()=>stopAudio())};audio.onerror=()=>{if(token===audioToken){stopAudio();toast('Ses akışı kesildi.')}};playButton();updateActive(true);try{await audio.play();playButton()}catch{toast('Ses oynatılamadı; yeniden oynatmayı dene.');playButton();}}
function stopAudio(){audioToken++;audio.pause();audio.removeAttribute('src');audio.load();st.playing=null;audioList=[];playButton();updateActive();}
function worship(){const t=prayerData?.timings;const times=[['Fajr','İmsak / Sabah'],['Sunrise','Güneş'],['Dhuhr','Öğle'],['Asr','İkindi'],['Maghrib','Akşam'],['Isha','Yatsı']];main.innerHTML=`<div class="eyebrow">İBADET REHBERİ</div><div class="title">Namaz & Zikir</div><p class="sub">Günün vakitleri, kıble yönü, dijital tesbih</p>
${section('Namaz vakitleri','Hesaplanan değerler')}
<div class="card"><div class="row"><label style="flex:1"><span class="form-label" style="margin:0 0 4px">Şehir</span><input id="city" class="field" placeholder="Örn. Ankara" value="${esc(st.city)}"></label><button class="btn" style="align-self:end" data-action="get-prayer">Getir</button></div><p>Hesaplama: AlAdhan • Diyanet yöntemi (13). Resmî ilan edilen vakitlerden birkaç dakika farklı olabilir.</p><div class="prayer-grid">${times.map(([key,name])=>`<div class="prayer-time"><small>${name}</small><b>${esc(t?.[key]?.split(' ')[0]||'--:--')}</b></div>`).join('')}</div>${prayerData?`<p class="muted">${esc(st.city)} için ${esc(prayerDate)} vakitleri</p>`:''}</div>
${section('Kıble bulucu','Konum izni gerekir')}
<div class="card"><div class="row"><div><h3>🧭 Kıble yönü</h3><p>${geo?.bearing!=null?`Kuzeyden saat yönünde ${geo.bearing.toFixed(1)}°`:'Konumuna göre kıble açısını hesapla.'}</p></div><button class="btn ghost" data-action="qibla">Hesapla</button></div>${geo?'<p class="text-small muted">Bu açı gerçek kuzeye göredir. Telefonda sensörle dönen pusula henüz eklenmedi.</p>':''}</div>
${section('Dijital tesbih','Cihazda kaydedilir')}
<div class="card"><div class="chip-row">${['Sübhânallah','Elhamdülillah','Allahu ekber','Salavat'].map(s=>`<button class="chip ${st.zikrType===s?'active':''}" data-action="zikr-type" data-value="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="tasbih"><div class="sub">${esc(st.zikrType)}</div><button class="counter-btn" data-action="zikr-add" aria-label="Bir tesbih say">${fmt(st.zikr)}</button><p>Her dokunuşta 1 artar</p><button class="btn ghost tiny" data-action="zikr-reset">Sayacı sıfırla</button></div></div>
<div class="notice">Ezan bildirimi ve otomatik gerçek zamanlı pusula, ileriki Android sürümlerine planlandı; bu prototipte etkin değildir.</div>`;}
async function getPrayer(){let city=document.getElementById('city')?.value?.trim()||st.city;if(!city){toast('Şehir gir.');return;}st.city=city;save();try{const today=new Date();let d=`${String(today.getDate()).padStart(2,'0')}-${String(today.getMonth()+1).padStart(2,'0')}-${today.getFullYear()}`;let url=`https://api.aladhan.com/v1/timingsByCity/${d}?city=${encodeURIComponent(city)}&country=Turkey&method=13`;let res=await fetch(url);let j=await res.json();if(!res.ok||j.code!==200||!j.data?.timings)throw Error('No prayer');prayerData=j.data;prayerDate=d;worship();}catch{toast('Vakitler alınamadı. Şehir ve interneti kontrol et.')}}
function toRad(x){return x*Math.PI/180}function bearing(lat,lng){const a=toRad(lat),dl=toRad(39.8262-lat),lon=toRad(21.4225-lng);return (Math.atan2(Math.sin(lon),Math.cos(a)*Math.tan(toRad(39.8262))-Math.sin(a)*Math.cos(lon))*180/Math.PI+360)%360}
function qibla(){if(!navigator.geolocation){toast('Konum özelliği bu tarayıcıda yok.');return;}navigator.geolocation.getCurrentPosition(p=>{geo={bearing:bearing(p.coords.latitude,p.coords.longitude)};worship();},()=>toast('Konum izni verilmedi veya konum alınamadı.'),{enableHighAccuracy:false,timeout:12000});}
function progress(){const p=Math.round(st.completed.length/114*100);main.innerHTML=`<div class="eyebrow">KİŞİSEL TAKİP</div><div class="title">Hatim Yolculuğum</div><p class="sub">Okumalarını kendi hızında tamamla.</p>
<div class="card"><div class="row"><div><div class="eyebrow">TAMAMLANAN SURE</div><h3 style="font-size:34px;margin:0">${st.completed.length} <span class="muted" style="font-size:15px">/ 114</span></h3></div><span class="pill">%${p}</span></div><div class="spacer"></div><div class="progress-bar"><span style="width:${p}%"></span></div><p>Bu oran, tamamlanan sure sayısı üzerinden hesaplanır; cüz veya okunan ayet oranı değildir.</p></div>
<div class="card"><div class="row"><div><div class="eyebrow">BUGÜN OKUNDU İŞARETLENEN</div><h3 style="font-size:29px;margin:0">${st.todayCount} <span class="muted" style="font-size:14px">/ ${st.dailyGoal} ayet</span></h3></div><span class="tag">Günlük hedef</span></div><div class="progress-bar" style="margin-top:12px"><span style="width:${Math.min(100,st.todayCount/st.dailyGoal*100)}%"></span></div><p>Okuma ekranındaki ✓ butonuyla ayetleri işaretleyebilirsin.</p></div>
${section('Tamamlanan sureler','')}
<div class="card">${st.completed.length?st.completed.slice().sort((a,b)=>a-b).map(n=>`<div class="row" style="padding:8px 0"><span>✓ ${esc(label(n))}</span><button class="action-link" data-action="open-surah" data-surah="${n}">Aç →</button></div>`).join(''):'<p>Henüz tamamlanan sure işaretlemedin. Sureyi açıp alttaki “Tamamladım” düğmesine bas.</p>'}</div><button class="btn" style="width:100%" data-page="quran">Kur’an okumaya başla →</button>`;}
function learn(){main.innerHTML=`<div class="eyebrow">İLİM YOLCULUĞU</div><div class="title">Öğrenme Merkezi</div><p class="sub">Sonraki sürümler için planlanan içerikler</p>
${[['☷','Elifba ve tecvid','Harfler, mahreç ve adım adım eğitim'],['✦','Dualar ve anlamları','Kaynakları doğrulanmış dua kütüphanesi'],['✧','Peygamberler tarihi','Kaynaklı ders ve anlatımlar'],['☾','Namaz rehberi','Abdest ve namazın öğrenilmesi'],['◎','Esmaül Hüsna','Allah’ın güzel isimleri ve anlamları'],['✺','Yapay zekâ rehberi','Kaynakları doğrulayan dikkatli soru-cevap']].map(([i,t,s])=>`<div class="card"><div class="row"><div class="row" style="justify-content:flex-start"><span style="font-size:26px;color:var(--gold)">${i}</span><div><h3 style="margin:0">${t}</h3><p>${s}</p></div></div><span class="pill">Yakında</span></div></div>`).join('')}<div class="notice">Bu alanlar henüz çalışır eğitim içeriği sunmuyor. Uydurma dini açıklama veya hadis kullanılmıyor.</div>`;}
function settings(){main.innerHTML=`<div class="eyebrow">KİŞİSELLEŞTİR</div><div class="title">Ayarlar</div><div class="card"><label class="form-label" for="dark">Görünüm</label><button class="btn ghost" data-action="toggle-theme">${st.dark?'☀ Açık temaya geç':'☾ Koyu temaya geç'}</button><label class="form-label" for="dailyGoal">Günlük ayet hedefi</label><select class="field" id="dailyGoal">${[5,10,20,30,50,100].map(n=>`<option ${n===st.dailyGoal?'selected':''} value="${n}">${n} ayet</option>`).join('')}</select><label class="form-label" for="fontSelect">Arapça yazı boyutu</label><select class="field" id="fontSelect">${[24,27,30,34,38,42].map(n=>`<option ${n===st.arabicSize?'selected':''} value="${n}">${n} px</option>`).join('')}</select></div>
<div class="card"><h3>Veriler ve kaynaklar</h3><p>Kur’an metni: AlQuran.cloud / quran-uthmani. Türkçe meal: AlQuran.cloud / tr.diyanet. Ses kayıtları: AlQuran.cloud / ilgili hafızlar. Namaz vakitleri: AlAdhan, yöntem 13 (Diyanet hesaplama yöntemi, resmî yayın değil).</p><p>Yer işaretleri ve hatim takibi yalnız bu cihazın yerel depolamasındadır; hesap ve bulut yedeği yoktur. Okunan surelerin çevrimdışı önbelleği tarayıcıya bağlıdır.</p><button class="btn ghost" data-action="clear-cache">İndirilen sure önbelleğini temizle</button></div><div class="notice">Google Play için yayımdan önce Diyanet onay süreci ve metin, meal, ses kullanım hakları doğrulanmalıdır. Bu uygulama şimdilik geliştirme prototipidir.</div>`;}
// Central controls: no fake actions, all visible buttons work or state clearly when planned.
document.addEventListener('click',async ev=>{
const page=ev.target.closest('[data-page]');if(page){go(page.dataset.page);return;}
const b=ev.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,n=Number(b.dataset.ayah||1);if(act==='adhan-play'){playAdhan(b.dataset.id);return;}if(act==='adhan-stop'){stopAdhan();return;}
if(act==='open-surah')openSurah(Number(b.dataset.surah),Number(b.dataset.ayah||1));
else if(act==='next-surah')openSurah(st.surah+1);
else if(act==='retry-surah')openSurah(st.surah);
else if(act==='play-surah')startAudio(1);
else if(act==='play-ayah')startAudio(n);
else if(act==='toggle-audio'){if(audio.paused){try{await audio.play()}catch{toast('Ses oynatılamadı.')}}else audio.pause();playButton();}
else if(act==='stop-audio')stopAudio();
else if(act==='font-up'){st.arabicSize=Math.min(42,st.arabicSize+2);save();render();}
else if(act==='font-down'){st.arabicSize=Math.max(22,st.arabicSize-2);save();render();}
else if(act==='bookmark'){const key=`${st.surah}:${n}`;if(st.bookmarks.includes(key))st.bookmarks=st.bookmarks.filter(s=>s!==key);else st.bookmarks.push(key);save();render();toast('Yer işareti kaydedildi.');}
else if(act==='read-ayah'){st.lastRead={surah:st.surah,ayah:n};st.todayCount+=1;save();toast(`${st.surah}:${n} okundu olarak işaretlendi.`);}
else if(act==='mark-completed'){if(st.completed.includes(st.surah))st.completed=st.completed.filter(x=>x!==st.surah);else st.completed.push(st.surah);save();render();toast('Hatim durumu güncellendi.');}
else if(act==='get-prayer')getPrayer();
else if(act==='qibla')qibla();
else if(act==='zikr-type'){st.zikrType=b.dataset.value;st.zikr=0;save();worship();}
else if(act==='zikr-add'){st.zikr++;if(navigator.vibrate)navigator.vibrate(8);save();worship();}
else if(act==='zikr-reset'){st.zikr=0;save();worship();}
else if(act==='toggle-theme'){st.dark=!st.dark;save();render();}
else if(act==='clear-cache'){if(confirm('İndirilen sure önbelleği temizlensin mi? Hatim ve ayarların korunur.')){for(let i=1;i<=114;i++)localStorage.removeItem('surah-'+i);toast('Önbellek temizlendi.');}}
});
document.addEventListener('input',ev=>{if(ev.target.id==='surah-search'){st.search=ev.target.value;const list=document.getElementById('surah-list');if(list)list.innerHTML=filtered().map(surahMarkup).join('')||'<div class="empty">Aramana uygun sure bulunamadı.</div>';}});
document.addEventListener('change',ev=>{if(ev.target.id==='reciter'){st.reciter=ev.target.value;save();stopAudio();toast('Hafız değiştirildi.');}else if(ev.target.id==='dailyGoal'){st.dailyGoal=Number(ev.target.value);save();toast('Günlük hedef kaydedildi.')}else if(ev.target.id==='fontSelect'){st.arabicSize=Number(ev.target.value);save();render();}});
document.getElementById('back').addEventListener('click',()=>go(st.page==='reader'?'quran':'home'));
if('serviceWorker' in navigator && window.location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});

/* Ezan Dinle: CC lisanslı Wikimedia Commons kaynaklarından hazırlanmış çevrimdışı kayıtlar.
   Kaynak eserler orijinal müezzin adı doğrulanmadan başka bir kişiye atfedilmez.
   Derleme aşamasında FFmpeg ile MP3 kodlamasına dönüştürüldü (96 kbit/sn mono).
*/
const ADHANS=[{"id":"mecca2013","title":"Mekke Ezanı — Mescid-i Haram","sub":"21 Ocak 2013 • Tarihî kayıt","file":"mecca_2013.mp3","kind":"mekke","credit":"Seyfula Islam","license":"CC BY 3.0","licurl":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Adhan,_Great_Mosque_of_Mecca_-_Jan_21,_2013.webm","duration":"3 dk 17 sn"},{"id":"mecca2012","title":"Mekke Akşam Ezanı — Mescid-i Haram","sub":"25 Şubat 2012 • Tarihî kayıt","file":"mecca_2012.mp3","kind":"mekke","credit":"3omar Faruq","license":"CC BY 3.0","licurl":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Maghrib_Adhan_at_the_Masjid_al_Haram,_Mecca_-_25_Feb,_2012.webm","duration":"5 dk 1 sn"},{"id":"beautiful","title":"Güzel Ezan — Sade Makam","sub":"Farklı ezan yorumu","file":"beautiful_adhan.mp3","kind":"guzel","credit":"Adam-synagda","license":"CC0 1.0","licurl":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Beautiful_adhan.ogg","duration":"2 dk 34 sn"},{"id":"aaqib","title":"Güzel Ezan — Aaqib Azeez başlıklı kayıt","sub":"Kayıt başlığına göre • Müezzin kimliği doğrulanmadı","file":"aaqib_azeez.mp3","kind":"guzel","credit":"Atcovi","license":"CC BY-SA 4.0","licurl":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3","duration":"1 dk 27 sn"}];
const adhanAudio=document.createElement('audio');adhanAudio.preload='metadata';document.body.appendChild(adhanAudio);
let currentAdhan=null;let adhanError=false;
const adhanFloat=document.createElement('div');adhanFloat.className='adhan-float';adhanFloat.hidden=true;document.querySelector('.app-shell').appendChild(adhanFloat);
function adhan(){
  const cards=ADHANS.map(a=>`<div class="adhan-card">
  <div class="adhan-top"><span class="adhan-icon">${a.kind==='mekke'?'🕋':'♪'}</span><span class="adhan-license">${esc(a.license)}</span></div>
  <div class="adhan-name">${esc(a.title)}</div><p>${esc(a.sub)}</p>
  <div class="adhan-tags"><span>♫ ${esc(a.duration)}</span><span>✓ Çevrimdışı kayıt</span></div>
  <div class="adhan-actions"><button class="btn ${currentAdhan===a.id&&!adhanAudio.paused?'gold':'ghost'}" data-action="adhan-play" data-id="${a.id}">${currentAdhan===a.id&&!adhanAudio.paused?'Ⅱ Duraklat':'▶ Dinle'}</button><a class="adhan-link" href="${esc(a.page)}" target="_blank" rel="noopener">Kaynağı gör ↗</a></div>
  <div class="adhan-credit">Kaydı yükleyen / hak sahibi: ${esc(a.credit)} · <a href="${esc(a.licurl)}" target="_blank" rel="noopener">${esc(a.license)}</a> · MP3 biçimine dönüştürüldü.</div>
  </div>`).join('');
  main.innerHTML=`<div class="intro"><div><div class="eyebrow">HUZURA DAVET</div><div class="title">Ezan Dinle</div><p class="sub">Mekke ezanları ve etkileyici farklı ezan kayıtları.</p></div><div class="moon">♪</div></div>
  <div class="adhan-hero"><span>🕋 MEKKE • MESCİD-İ HARAM</span><h2>Gönüllere dokunan ezanlar</h2><p>Gerçek tarihî ses kayıtları. İnternet gerekmeden dinle.</p></div>
  ${section('Mekke Ezanları','Tarihî kayıtlar')}
  ${cards}
  <div class="notice">Bu kayıtlar canlı yayın değildir. Sesler Creative Commons izinlerine göre sunulur. Ezanların müezzinlerini doğrulamadığımız yerlerde isim atfetmiyoruz. Namaz vakti bildirimi bu sürümde henüz etkin değildir.</div>`;
}
function drawAdhanFloat(){
  const a=ADHANS.find(x=>x.id===currentAdhan);
  if(!a){adhanFloat.hidden=true;return}
  adhanFloat.hidden=false;
  const icon=adhanAudio.paused?'▶':'Ⅱ';
  const current=Number.isFinite(adhanAudio.currentTime)?Math.floor(adhanAudio.currentTime):0;
  const duration=Number.isFinite(adhanAudio.duration)?Math.floor(adhanAudio.duration):0;
  const time=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  adhanFloat.innerHTML=`<div class="adhan-float-name">♪ ${esc(a.title)}<small>${time(current)} / ${time(duration)}</small></div><button data-action="adhan-play" data-id="${esc(a.id)}">${icon}</button><button data-action="adhan-stop">✕</button>`;
}
function stopAdhan(){adhanAudio.pause();adhanAudio.removeAttribute('src');adhanAudio.load();currentAdhan=null;drawAdhanFloat();}
async function playAdhan(id){
  const a=ADHANS.find(x=>x.id===id);if(!a)return;
  if(currentAdhan===id&&!adhanAudio.paused){adhanAudio.pause();drawAdhanFloat();if(st.page==='adhan')adhan();return}
  if(currentAdhan!==id){
    stopAudio();
    adhanAudio.pause();
    currentAdhan=id;
    adhanError=false;
    adhanAudio.src='audio/'+a.file;
    adhanAudio.load();
  }
  try{await adhanAudio.play();drawAdhanFloat();if(st.page==='adhan')adhan();}
  catch(e){adhanError=true;adhanAudio.pause();toast('Ezan ses dosyası açılamadı.');drawAdhanFloat();}
}
adhanAudio.addEventListener('ended',()=>{drawAdhanFloat();if(st.page==='adhan')adhan();});
adhanAudio.addEventListener('pause',()=>{drawAdhanFloat();});
adhanAudio.addEventListener('playing',()=>{drawAdhanFloat();});
adhanAudio.addEventListener('timeupdate',()=>{if(!adhanFloat.hidden)drawAdhanFloat();});
adhanAudio.addEventListener('error',()=>{if(!adhanError){adhanError=true;toast('Ezan yüklenemedi. Uygulamayı yeniden açmayı dene.')}});

render();ensureCatalog();

</script>
