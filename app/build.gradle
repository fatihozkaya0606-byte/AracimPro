plugins {
    id 'com.android.application'
}

import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.aracimpro.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aracimpro.app'
        minSdk 24
        targetSdk 36
        buildConfigField "String", "OTOAPI_KEY", "\"${System.getenv('OTOAPI_KEY') ?: ''}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${System.getenv('FIREBASE_API_KEY') ?: ''}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${System.getenv('FIREBASE_PROJECT_ID') ?: ''}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${System.getenv('FIREBASE_APP_ID') ?: ''}\""
        versionCode 16
        versionName '5.5.0'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
