plugins {
    id 'com.android.application'
}

import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.aracimpro.app'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.aracimpro.app'
        minSdk 24
        targetSdk 36
        buildConfigField "String", "OTOAPI_KEY", "\"${System.getenv('OTOAPI_KEY') ?: ''}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${System.getenv('FIREBASE_API_KEY') ?: ''}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${System.getenv('FIREBASE_PROJECT_ID') ?: ''}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${System.getenv('FIREBASE_APP_ID') ?: ''}\""
        buildConfigField "String", "MARKET_API_URL", "\"${System.getenv('MARKET_API_URL') ?: ''}\""
        buildConfigField "String", "LIVE_DATA_API_URL", "\"${System.getenv('LIVE_DATA_API_URL') ?: ''}\""
        buildConfigField 'boolean', 'ADMOB_TEST_MODE', 'false'
        // Dedicated App Open ad unit: set APP_OPEN_AD_UNIT_ID as a GitHub Actions secret.
        // Never reuse interstitial or banner IDs. Without a valid unit, live App Open stays off.
        buildConfigField 'String', 'APP_OPEN_AD_UNIT_ID', '\"' + ((System.getenv('APP_OPEN_AD_UNIT_ID') ?: '').matches('ca-app-pub-[0-9]+/[0-9]+') ? System.getenv('APP_OPEN_AD_UNIT_ID') : '') + '\"'
        // A public AdMob rewarded unit ID. Debug mode independently uses Google's
        // sample rewarded ad ID in MainActivity; production uses this exact unit.
        buildConfigField 'String', 'REWARDED_AD_UNIT_ID', '"ca-app-pub-7205009121067400/7362031917"'
        versionCode 129
        versionName '7.11.53'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.neonpreview'
            versionNameSuffix '-admobpreview'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            ndk {
                debugSymbolLevel 'FULL'
            }
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'org.reactivestreams:reactive-streams:1.0.4'
    // AdMob remains the primary ad SDK and preserves the same banner, MREC and interstitial units.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // AppLovin demand through AdMob Mediation. Requires account mapping in AdMob UI;
    // no independent AppLovin placements or extra ad surfaces are introduced.
    // Google official legacy GMA adapter, compatible with play-services-ads 25.5.0.
    implementation 'com.google.ads.mediation:applovin:13.6.4.2'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Keep advertising identifier dependency explicit for SDK compatibility.
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
}
