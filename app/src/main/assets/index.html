function specsModal(){const v=requireVehicle('Teknik Özellikler');if(!v)return;window._specModalOpen=true;const prod=[v.productionCity,v.productionCountry].filter(Boolean).join(' / ')||v.brandCountry||'Üretim yeri verisi henüz yok';const ev=v.fuel==='Elektrik'||v.batteryKwh||v.rangeKm;modal('Teknik Özellikler',`<div class="specSource"><div><b>${esc(v.year+' '+v.make+' '+v.model)}</b><div class="muted small">${esc(v.engine||'Motor seçilmedi')} • ${esc(v.trim||'Paket seçilmedi')}</div></div><span class="sourceBadge">${esc(v.specSource||'Teknik veri bekleniyor')}</span></div><div class="specTable">${specLine('Araç Türü',v.type)}${specLine('Kasa',v.body)}${specLine('Motor / Versiyon',v.engine)}${specLine('Motor Hacmi',v.engineCc,' cc')}${specLine('Güç',v.powerHp,' hp')}${specLine('Tork',v.torqueNm,' Nm')}${specLine('0-100',v.zeroTo100,' sn')}${specLine('Maksimum Hız',v.topSpeedKph,' km/s')}${specLine('Ortalama Tüketim',v.avgConsumptionL,' L/100 km')}${specLine('Şehir İçi',v.cityConsumptionL,' L/100 km')}${specLine('Şehir Dışı',v.hwyConsumptionL,' L/100 km')}${specLine('Yakıt Deposu',v.fuelTankL,' L')}${specLine('Ağırlık',v.weightKg,' kg')}${specLine('Bagaj Hacmi',v.trunkL,' L')}${specLine('Uzunluk',v.lengthMm,' mm')}${specLine('Genişlik',v.widthMm,' mm')}${specLine('Yükseklik',v.heightMm,' mm')}${specLine('Aks Mesafesi',v.wheelbaseMm,' mm')}${specLine('Kapı',v.doors)}${specLine('Koltuk',v.seats)}${specLine('Şanzıman',v.transmission)}${specLine('Çekiş',v.drive)}${specLine('Yakıt / Enerji',v.fuel)}${specLine('Marka Ülkesi',v.brandCountry)}${specLine('Üretim Yeri',prod)}${specLine('Üretici',v.manufacturer)}${specLine('Motor Kodu',v.engineCode)}${specLine('Enjeksiyon',v.injectionSystem)}${specLine('Besleme',v.aspiration)}${specLine('Motor Yağı',v.oilCapacityL,' L')}${specLine('Soğutma Sıvısı',v.coolantCapacityL,' L')}${specLine('AdBlue',v.adblueTankL,' L')}${specLine('Lastik',v.tireSizes)}${specLine('Jant',v.wheelSizes)}${ev?specLine('Batarya',v.batteryKwh,' kWh'):''}${ev?specLine('Elektrik Menzili',v.rangeKm,' km'):''}${ev?specLine('EV Tüketim',v.avgConsumptionKwh,' kWh/100 km'):''}${ev?specLine('AC Şarj',v.chargingAcKw,' kW'):''}${ev?specLine('DC Şarj',v.chargingDcKw,' kW'):''}${ev?specLine('Şarj Soketi',v.chargingConnector):''}</div><div class="card" style="margin-top:12px"><div class="muted small">Veri kaynağı</div><b>${esc(v.specSource||'Henüz otomatik veri alınmadı')}</b>${v.specMatchedTrim?`<div class="muted small">Eşleşen varyant: ${esc(v.specMatchedTrim)}</div>`:''}${v.specConfidence?`<div class="muted small">Eşleşme güveni: %${Math.round(v.specConfidence)}</div>`:''}${v.specUpdatedAt?`<div class="muted small">Güncelleme: ${esc(v.specUpdatedAt)}</div>`:''}${v.specError?`<div class="muted small dangerText">Son hata: ${esc(v.specError)}</div>`:''}</div><div class="grid2" style="margin-top:12px"><button class="primary" onclick="refreshTechnicalSpecs()">Teknik Verileri Otomatik Yenile</button><button class="secondary" onclick="decodeVehicleVin()">VIN'den Üretim Yerini Bul</button></div><button class="secondary wide" style="margin-top:10px" onclick="openVehicle('${v.id}')">Araç Bilgilerini Düzenle</button><div class="notice" style="margin-top:10px"><b>V15:</b> Teknik bilgiler OtoAPI varyant kataloğundan otomatik aranır. VIN zorunlu değildir; yalnız üretim fabrikası/ülkesi gibi şasiye özgü bilgiler için isteğe bağlıdır. Veri bulunamazsa yeniden sorgulama yapılabilir ve uygulama sahte değer üretmez.</div>`)}
function compareVehicles(){const v=activeVehicle();if(!v)return;const others=state.vehicles.filter(x=>x.id!==v.id);if(!others.length){modal('Araç Karşılaştırma',`<div class="empty"><h3>İkinci araç gerekli</h3><p class="muted">Garaja karşılaştırmak istediğin aracı da ekle. Teknik özelliklerini girdikten sonra burada yan yana göreceksin.</p><button class="primary" onclick="openVehicle()">İkinci Araç Ekle</button></div>`);return}const b=others[0];modal('Araç Karşılaştırma',`<div class="field"><label>Karşılaştırılacak araç</label><select onchange="renderComparison(this.value)">${others.slice().sort((a,b)=>(a.make+' '+a.model).localeCompare(b.make+' '+b.model,'tr',{numeric:true})).map(x=>`<option value="${x.id}">${esc(x.year+' '+x.make+' '+x.model)}</option>`).join('')}</select></div><div id="comparisonBox">${comparisonHtml(v,b)}</div>`)}
function renderComparison(id){const v=activeVehicle(),b=state.vehicles.find(x=>x.id===id),box=document.getElementById('comparisonBox');if(box&&b)box.innerHTML=comparisonHtml(v,b)}
function comparisonHtml(a,b){const r=(label,key,unit='')=>`<div class="specCell"><span>${label}</span><b>${a[key]?esc(a[key])+unit:'—'}</b></div><div class="specCell"><span>${label}</span><b>${b[key]?esc(b[key])+unit:'—'}</b></div>`;return `<div class="compareGrid" style="margin:12px 0 8px"><div class="compareHead">${esc(a.year+' '+a.make+' '+a.model)}</div><div class="compareHead">${esc(b.year+' '+b.make+' '+b.model)}</div></div><div class="specTable">${r('Güç','powerHp',' hp')}${r('Tork','torqueNm',' Nm')}${r('Motor','engine')}${r('Motor Hacmi','engineCc',' cc')}${r('0-100','zeroTo100',' sn')}${r('Maks. Hız','topSpeedKph',' km/s')}${r('Ort. Tüketim','avgConsumptionL',' L/100 km')}${r('Depo','fuelTankL',' L')}${r('Ağırlık','weightKg',' kg')}${r('Bagaj','trunkL',' L')}${r('Uzunluk','lengthMm',' mm')}${r('Genişlik','widthMm',' mm')}${r('Yükseklik','heightMm',' mm')}${r('Şanzıman','transmission')}${r('Çekiş','drive')}${r('Yakıt','fuel')}${r('Menzil','rangeKm',' km')}</div>`}
function avgConsumption(){const a=vf(state.fuel).filter(x=>x.liters&&x.km).sort((a,b)=>a.km-b.km);if(a.length<2)return 0;const dist=a.at(-1).km-a[0].km,lit=a.slice(1).reduce((t,x)=>t+(+x.liters||0),0);return dist>0?lit/dist*100:0}
function lastFuelPrice(){const a=vf(state.fuel).filter(x=>x.liters&&x.cost).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return a[0]?a[0].cost/a[0].liters:(+state.prefs.fuelPrice||0)}
function fuelBudgetCalculator(){const c=avgConsumption()||7.5,p=lastFuelPrice()||state.prefs.fuelPrice||0;modal('Aylık Yakıt Tahmini',`<form class="form" oninput="calcFuelBudget(this)"><div class="formrow"><div class="field"><label>Aylık KM</label><input name="km" type="number" value="${Math.round((state.prefs.annualKm||12000)/12)}"></div><div class="field"><label>Tüketim (L/100 km)</label><input name="cons" type="number" step="0.1" value="${c.toFixed(1)}"></div></div><div class="field"><label>Yakıt / Enerji Birim Fiyatı</label><input name="price" type="number" step="0.01" value="${p?p.toFixed(2):''}"></div><div class="card" style="margin:0"><span class="muted small">Tahmini aylık maliyet</span><div id="fuelBudgetResult" class="calcResult">—</div></div></form>`);setTimeout(()=>calcFuelBudget(document.querySelector('.sheet form')),50)}
function calcFuelBudget(f){if(!f)return;const km=+f.km.value||0,c=+f.cons.value||0,p=+f.price.value||0,tot=km*c/100*p;document.getElementById('fuelBudgetResult').textContent=tot?money(tot):'—'}
function routeCalculator(){const c=avgConsumption()||7.5,p=lastFuelPrice()||state.prefs.fuelPrice||0;modal('Yol Maliyeti Hesapla',`<form class="form" oninput="calcRoute(this)"><div class="formrow"><div class="field"><label>Tek yön mesafe (km)</label><input name="km" type="number" value="100"></div><div class="field"><label>Gidiş-dönüş</label><select name="round"><option value="2">Evet</option><option value="1">Hayır</option></select></div></div><div class="formrow"><div class="field"><label>Tüketim (L/100 km)</label><input name="cons" type="number" step="0.1" value="${c.toFixed(1)}"></div><div class="field"><label>Birim fiyat</label><input name="price" type="number" step="0.01" value="${p?p.toFixed(2):''}"></div></div><div class="field"><label>Otoyol / Köprü / Ek Gider</label><input name="extra" type="number" step="0.01" value="0"></div><div class="card" style="margin:0"><span class="muted small">Tahmini toplam</span><div id="routeResult" class="calcResult">—</div><div id="routeDetail" class="muted small"></div></div></form>`);setTimeout(()=>calcRoute(document.querySelector('.sheet form')),50)}
function calcRoute(f){if(!f)return;const km=(+f.km.value||0)*(+f.round.value||1),cons=+f.cons.value||0,price=+f.price.value||0,extra=+f.extra.value||0,fuel=km*cons/100*price,total=fuel+extra;document.getElementById('routeResult').textContent=total?money(total):'—';document.getElementById('routeDetail').textContent=`${num(km)} km • Yakıt/enerji ${money(fuel)} • Ek gider ${money(extra)}`}
function valuationModal(){const a=vf(state.valuations).sort((a,b)=>String(b.date).localeCompare(String(a.date)));modal('Araç Değer Takibi',`<form class="form" onsubmit="saveValuation(event)"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Değer (TL)</label><input type="number" step="0.01" name="value" required></div></div><div class="field"><label>Değer Kaynağı</label><select name="note">${optList(VALUATION_SOURCES,'','Kaynak seç')}</select></div><button class="primary wide">Değer Kaydı Ekle</button></form><div class="list" style="margin-top:12px">${a.length?a.map(x=>`<div class="row"><div class="rowIcon">${ico('value')}</div><div class="rowMain"><strong>${fmtDate(x.date)}</strong><span>${esc(x.note||'')}</span></div><div class="rowValue">${money(x.value)}</div></div>`).join(''):'<div class="muted">Henüz değer kaydı yok.</div>'}</div>`) }
function saveValuation(e){e.preventDefault();const f=new FormData(e.target),o={id:uid(),vehicleId:activeVehicle().id,date:f.get('date'),value:+f.get('value'),note:f.get('note').trim()};state.valuations.push(o);activeVehicle().currentValue=o.value;closeModal();save();valuationModal()}
function batteriesInlineView(){const a=vf(state.batteries).sort((a,b)=>String(b.installDate).localeCompare(String(a.installDate)));return `<div class="sectionHead"><h2>Akü Geçmişi</h2><button class="linkbtn" onclick="batteryModal()">+ Akü</button></div>${listOrEmpty(a,x=>`<div class="row"><div class="rowIcon">${ico('battery')}</div><div class="rowMain"><strong>${esc(x.brand||'Akü')} ${esc(x.model||'')}</strong><span>${fmtDate(x.installDate)} • ${num(x.installKm||0)} km • ${x.warrantyMonths||0} ay garanti</span></div></div>`)}`}
function batteryModal(){const a=vf(state.batteries).sort((a,b)=>String(b.installDate).localeCompare(String(a.installDate)));modal('Akü Takibi',`<form class="form" onsubmit="saveBattery(event)"><div class="formrow"><div class="field"><label>Marka</label><select name="brand" required>${optList(BATTERY_BRANDS,'','Marka seç')}</select></div><div class="field"><label>Kapasite / Tip</label><select name="model">${optList(BATTERY_SPECS,'','Akü seç')}</select></div></div><div class="formrow"><div class="field"><label>Takılma Tarihi</label><input type="date" name="installDate" value="${today()}" required></div><div class="field"><label>Takılma KM</label><input type="number" name="installKm" value="${activeVehicle()?.km||0}"></div></div><div class="formrow"><div class="field"><label>Garanti</label><select name="warrantyMonths">${[12,18,24,30,36,48].map(v=>`<option value="${v}" ${v===24?'selected':''}>${v} ay</option>`).join('')}</select></div><div class="field"><label>Fiyat</label><input type="number" step="0.01" name="cost"></div></div><button class="primary wide">Akü Kaydı Ekle</button></form><div class="list" style="margin-top:12px">${a.map(x=>`<div class="row"><div class="rowIcon">${ico('battery')}</div><div class="rowMain"><strong>${esc(x.brand)} ${esc(x.model||'')}</strong><span>${fmtDate(x.installDate)} • ${num(x.installKm)} km</span></div><div class="rowValue">${money(x.cost||0)}</div></div>`).join('')}</div>`) }
function saveBattery(e){e.preventDefault();const f=new FormData(e.target);state.batteries.push({id:uid(),vehicleId:activeVehicle().id,brand:f.get('brand').trim(),model:f.get('model').trim(),installDate:f.get('installDate'),installKm:+f.get('installKm'),warrantyMonths:+f.get('warrantyMonths'),cost:+f.get('cost')||0});closeModal();save();batteryModal()}
function accidentModal(){const a=vf(state.accidents).sort((a,b)=>String(b.date).localeCompare(String(a.date)));modal('Kaza / Hasar Kaydı',`<form class="form" onsubmit="saveAccident(event)"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>KM</label><input type="number" name="km" value="${activeVehicle()?.km||0}"></div></div><div class="field"><label>Hasar Türü</label><select name="title" required>${optList(ACCIDENT_TYPES,'','Hasar türü seç')}</select></div><div class="formrow"><div class="field"><label>Hasar / Onarım Tutarı</label><input type="number" step="0.01" name="cost"></div><div class="field"><label>Durum</label><select name="status">${optList(['Onarıldı','Onarım Bekliyor','Sigorta Sürecinde','Ekspertizde','Parça Bekliyor','Kayıt Amaçlı'], 'Onarıldı','Durum seç')}</select></div></div><div class="field"><label>Açıklama (isteğe bağlı)</label><textarea name="note"></textarea></div><button class="primary wide">Hasar Kaydı Ekle</button></form><div class="list" style="margin-top:12px">${a.length?a.map(x=>`<div class="row"><div class="rowIcon">${ico('crash')}</div><div class="rowMain"><strong>${esc(x.title)}</strong><span>${fmtDate(x.date)} • ${num(x.km)} km • ${esc(x.status)}</span></div><div class="rowValue">${money(x.cost||0)}</div></div>`).join(''):'<div class="muted">Kaza/hasar kaydı yok.</div>'}</div>`) }
function saveAccident(e){e.preventDefault();const f=new FormData(e.target);state.accidents.push({id:uid(),vehicleId:activeVehicle().id,date:f.get('date'),km:+f.get('km'),title:f.get('title').trim(),cost:+f.get('cost')||0,status:f.get('status'),note:f.get('note').trim()});closeModal();save();accidentModal()}

function pickDocument(){if(!activeVehicle())return;try{Android.pickDocument('newdoc:'+activeVehicle().id)}catch(e){alert('Belge seçici açılamadı')}}
window.onNativeDocumentPicked=(ctx,uri,name,mime,size)=>{if(!ctx.startsWith('newdoc:'))return;const vehicleId=ctx.split(':')[1],o={id:uid(),vehicleId,uri,name,mime,size,category:'Diğer',date:today(),expiry:'',note:''};state.documents.push(o);save();editDocument(o.id)};
function editDocument(id){const x=vf(state.documents).find(v=>v.id===id);if(!x)return;modal('Belge Bilgileri',`<form class="form" onsubmit="saveDocument(event,'${id}')"><div class="field"><label>Belge</label><input disabled value="${esc(x.name)}"></div><div class="formrow"><div class="field"><label>Kategori</label><select name="category">${optList(['Ruhsat','Trafik Sigortası','Kasko','Muayene','Servis Faturası','Ekspertiz','Vergi/MTV','Diğer'],x.category,'Kategori seç')}</select></div><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}"></div></div><div class="field"><label>Geçerlilik / Bitiş Tarihi</label><input type="date" name="expiry" value="${x.expiry||''}"></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button><button type="button" class="secondary wide" onclick="openDoc('${id}')">Belgeyi Aç</button><button type="button" class="danger wide" onclick="removeRec('documents','${id}')">Sil</button></form>`)}
function saveDocument(e,id){e.preventDefault();const f=new FormData(e.target),x=state.documents.find(v=>v.id===id);Object.assign(x,{category:f.get('category'),date:f.get('date'),expiry:f.get('expiry'),note:f.get('note').trim()});closeModal();save()}
function openDoc(id){const x=state.documents.find(v=>v.id===id);try{Android.openUri(x.uri,x.mime)}catch(e){alert('Belge açılamadı')}}
function documentsViewModal(){const a=vf(state.documents);modal('Belge Kasası',`<div class="form"><button class="primary wide" onclick="pickDocument()">+ Yeni Belge Seç</button>${a.length?a.map(x=>`<div class="row"><div class="rowIcon">📄</div><div class="rowMain"><strong>${esc(x.category)}</strong><span>${esc(x.name)}${x.expiry?' • Bitiş '+fmtDate(x.expiry):''}</span></div><div class="docButtons"><button onclick="openDoc('${x.id}')">Aç</button><button onclick="editDocument('${x.id}')">✎</button></div></div>`).join(''):'<div class="empty">Belge yok</div>'}</div>`)}

function emergencyModal(){const x=state.emergency;modal('Acil Durum & Yardım',`<form class="form" onsubmit="saveEmergency(event)"><div class="notice">Kaza veya arıza anında kayıtlı numaralara hızlıca ulaşabilirsin. Aramalar önce telefonun arama ekranını açar.</div><div class="field"><label>Sigorta Şirketi</label><select name="insurer">${optList(INSURERS,x.insurer,"Sigorta şirketi seç")}</select></div><div class="formrow"><div class="field"><label>Sigorta Telefonu</label><input name="insurancePhone" value="${esc(x.insurancePhone)}"></div><div class="field"><label>Yol Yardım / Çekici</label><input name="roadsidePhone" value="${esc(x.roadsidePhone)}"></div></div><div class="field"><label>Yakın / Acil İrtibat</label><input name="personalPhone" value="${esc(x.personalPhone)}"></div><div class="field"><label>Poliçe No</label><input name="policyNo" value="${esc(x.policyNo)}"></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note)}</textarea></div><button class="primary wide">Kaydet</button></form><div class="grid2" style="margin-top:12px"><button class="danger" onclick="dial(apEmergency())">📞 ${apEmergency()}</button>${x.insurancePhone?`<button class="secondary" onclick="dial('${esc(x.insurancePhone)}')">📞 Sigorta</button>`:''}${x.roadsidePhone?`<button class="secondary" onclick="dial('${esc(x.roadsidePhone)}')">🚚 Yol Yardım</button>`:''}${x.personalPhone?`<button class="secondary" onclick="dial('${esc(x.personalPhone)}')">👤 Yakınım</button>`:''}</div>`)}

function driveCenterModal(){window._speedOpen=true;modal('Canlı Sürüş Merkezi',`<div class="form"><div class="notice">GPS hız göstergesi yalnız yardımcı bilgidir. Sürüş sırasında telefona bakma; aracın göstergesi ve trafik kuralları önceliklidir.</div><div class="speedDial"><div><b id="liveSpeed">0</b><span>km/s</span><div id="speedAccuracy" class="small" style="margin-top:8px;color:#7898b9">GPS bekleniyor…</div></div></div><div class="grid2"><button class="primary" onclick="startLiveSpeed()">Hızı Başlat</button><button class="secondary" onclick="stopLiveSpeed()">Durdur</button></div><button class="secondary wide" onclick="openLocationSettings()" style="margin-top:8px">📍 Telefon Konum Ayarlarını Aç</button><div class="sectionHead"><h2>Yakınımdaki Araç Noktaları</h2></div><div class="nearbyGrid"><button class="secondary" onclick="nearbyFuel()">⛽ En Yakın Benzinlik</button><button class="secondary" onclick="nearbyInspection()">🧾 TÜVTÜRK Muayene</button><button class="secondary" onclick="nearbyCharging()">⚡ Şarj İstasyonu</button><button class="secondary" onclick="nearbyService()">🔧 Oto Servis</button><button class="secondary" onclick="nearbyTire()">🛞 Lastikçi</button><button class="secondary" onclick="nearbyParking()">🅿️ Otopark</button><button class="secondary" onclick="nearbyHospital()">🏥 Hastane</button><button class="secondary" onclick="nearbyHealthCenter()">🩺 Sağlık Ocağı</button><button class="secondary" onclick="nearbyPharmacy()">💊 Eczane</button><button class="secondary" onclick="nearbyMosque()">🕌 Cami</button><button class="secondary" onclick="nearbyNotary()">📄 Noter</button><button class="secondary" onclick="nearbyHotel()">🛏️ Otel</button><button class="secondary" onclick="nearbyFood()">🍽️ Yeme & İçme</button><button class="secondary" onclick="nearbyAttractions()">📍 Gezilecek Yerler</button><button class="secondary" onclick="nearbyRoadside()">🚚 Yol Yardım</button><button class="secondary" onclick="nearbyRestArea()">🚻 WC & Dinlenme</button><button class="secondary" onclick="nearbyAssembly()">🆘 Toplanma Alanı</button><button class="secondary" onclick="nearbyCarWash()">🧽 Oto Yıkama</button></div><div id="driveLocation" class="hint">Konum izni + telefondaki Konum/GPS açık olduğunda harita doğrudan bulunduğun çevreden açılır.</div></div>`);window._speedOpen=true;setTimeout(startLiveSpeed,250)}
function startLiveSpeed(){try{Android.startSpeedTracking()}catch(e){toast('GPS hız özelliği kullanılamıyor')}}
function stopLiveSpeed(){try{Android.stopSpeedTracking()}catch(e){};const e=document.getElementById('speedAccuracy');if(e)e.textContent='Durduruldu'}

function daysToDate(d){if(!d)return null;const x=new Date(d+'T12:00:00');return Math.ceil((x-new Date())/86400000)}
function reminderState(d){const n=daysToDate(d);if(n===null)return{txt:'Tarih yok',cls:''};if(n<0)return{txt:`${Math.abs(n)} gün geçti`,cls:'danger'};if(n===0)return{txt:'Bugün',cls:'danger'};if(n<=14)return{txt:`${n} gün kaldı`,cls:'warn'};return{txt:`${n} gün kaldı`,cls:'ok'}}

function calcMarketEstimate(x){const base=+x.benchmarkAvg||currentValuation()||+activeVehicle()?.currentValue||+activeVehicle()?.purchasePrice||0;if(!base)return{base:0,avg:0,min:0,max:0};if((x.autoRef||x.rangeExact)&&+x.min&&+x.max)return{base,avg:base,min:+x.min,max:+x.max};const kmFactor={'Emsallerinden Düşük':1.03,'Emsal KM':1,'Emsallerinden Biraz Yüksek':.96,'Emsallerinden Çok Yüksek':.90}[x.kmLevel]||1;const conditionFactor={'Çok Temiz / Orijinale Yakın':1.03,'Normal Kullanılmış':1,'Lokal Boyalı':.98,'Birden Fazla Boyalı':.95,'Değişenli':.90,'Ağır Hasar Kayıtlı':.78}[x.condition]||1;let avg=base*kmFactor*conditionFactor;const tr=+x.tramer||0;if(tr>0)avg=Math.max(base*.55,avg-Math.min(tr*.22,base*.12));return{base,avg,min:avg*.94,max:avg*1.06}}
function latestMarketCheck(){const v=activeVehicle();if(!v)return null;return (state.marketChecks||[]).filter(x=>x.vehicleId===v.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null}
function marketMoney(n){return Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL'}
function marketComparablePrices(raw){return String(raw||'').split(/[\n,;]+/).map(x=>Number(String(x).replace(/[^\d]/g,''))).filter(x=>Number.isFinite(x)&&x>=50000&&x<=100000000).slice(0,10)}
function marketMedian(arr){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function marketBenchmark(arr){if(!arr.length)return 0;const avg=arr.reduce((a,b)=>a+b,0)/arr.length;const med=marketMedian(arr);return Math.round(med*.65+avg*.35)}
function marketComparableText(x){if(Array.isArray(x?.comparables)&&x.comparables.length)return x.comparables.join('\n');return ''}

function saveMarketCheck(ev){ev.preventDefault();const v=activeVehicle(),f=new FormData(ev.target),comparables=marketComparablePrices(f.get('comparables'));if(comparables.length<3){toast('En az 3 emsal ilan fiyatı gir');return}const benchmarkAvg=marketBenchmark(comparables);const o={id:uid(),vehicleId:v.id,date:today(),comparables,benchmarkAvg,similarCount:comparables.length,kmLevel:f.get('kmLevel'),condition:f.get('condition'),tramer:+f.get('tramer')||0,trend30:f.get('trend30')===''?'':+f.get('trend30'),source:'Kullanıcının girdiği emsal ilanlar',asOf:today()};state.marketChecks.push(o);const e=calcMarketEstimate(o);if(e.avg){state.valuations.push({id:uid(),vehicleId:v.id,date:today(),ts:Date.now(),value:Math.round(e.avg),source:'Emsal ilan hesabı',note:`${comparables.length} emsal • medyan ağırlıklı • ${o.kmLevel} • ${o.condition}`});v.marketStatus='Emsal ilanlarla piyasa değeri hesaplandı'}save();marketValueModal();toast('Piyasa değeri hesaplandı')}

function monthlyData(n){const out=[];const now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),ym=d.toISOString().slice(0,7);const m=d.toLocaleDateString('tr-TR',{month:'short'});let total=0;for(const a of [vf(state.fuel),vf(state.expenses),vf(state.maintenance).filter(x=>x.dateDone),vf(state.services)])for(const x of a){const dt=x.date||x.dateDone;if(dt?.startsWith(ym))total+=Number(x.cost??x.total??0)||0}out.push({label:m,total})}return out}
function reportText(){const v=activeVehicle();if(!v)return'';let s=`ARACIM PRO - ARAÇ GEÇMİŞ RAPORU\n\nAraç: ${v.year} ${v.make} ${v.model}\nPlaka: ${v.plate}\nKilometre: ${num(v.km)} km\nMotor/Yakıt: ${v.engine} / ${v.fuel}\n\nMALİ ÖZET\nToplam gider: ${money(totalAll())}\nYakıt: ${money(totals().fuel)}\nBakım: ${money(totals().maint)}\nServis: ${money(totals().service)}\nDiğer: ${money(totals().exp)}\n\nSERVİS GEÇMİŞİ\n`;vf(state.services).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>s+=`${fmtDate(x.date)} | ${num(x.km)} km | ${x.work} | ${x.shop} | ${money(x.total)}\n`);s+='\nBAKIM / RESMİ İŞLEMLER\n';vf(state.maintenance).forEach(x=>s+=`${x.name} | ${x.completed?'Tamamlandı':'Planlı'} | ${x.dateDone||x.dueDate||''} | ${x.dueKm?num(x.dueKm)+' km':''} | ${money(x.cost)}\n`);s+='\nYAKIT KAYITLARI\n';vf(state.fuel).forEach(x=>s+=`${fmtDate(x.date)} | ${num(x.km)} km | ${x.liters} L | ${money(x.cost)} | ${x.station}\n`);s+='\nLASTİKLER\n';vf(state.tires).forEach(x=>s+=`${x.season} | ${x.brand} ${x.model} | ${x.size} | ${x.active?'Takılı':'Depoda'}\n`);s+='\nTEKNİK ÖZELLİKLER\n';s+=`Paket: ${v.trim||''} | Kasa: ${v.body||''} | Güç: ${v.powerHp||''} hp | Tork: ${v.torqueNm||''} Nm | Şanzıman: ${v.transmission||''} | Çekiş: ${v.drive||''}\n`;s+='\nDEĞER GEÇMİŞİ\n';vf(state.valuations).forEach(x=>s+=`${x.date} | ${money(x.value)} | ${x.note||''}\n`);s+='\nAKÜ\n';vf(state.batteries).forEach(x=>s+=`${x.installDate} | ${x.brand} ${x.model||''} | ${num(x.installKm)} km | ${money(x.cost||0)}\n`);s+='\nKAZA / HASAR\n';vf(state.accidents).forEach(x=>s+=`${x.date} | ${x.title} | ${x.status} | ${money(x.cost||0)}\n`);const p=techProfile(v);s+='\nARAÇ REHBERİ\n';s+=`Lastik: ${(p?.tires||[]).join(', ')||'Model/yıl kataloğundan aranıyor'}\nMotor yağı: ${p?.oil||'Üretici kılavuzu'}\nAntifriz: ${p?.coolant||'Üretici kılavuzu'}\nTriger: ${p?.timing||'Motor koduna göre doğrula'}\n`;const mc=latestMarketCheck();if(mc){const me=calcMarketEstimate(mc);s+='\nPİYASA DEĞERİ GÖSTERGESİ\n';s+=`Alt: ${money(me.min)} | Ortalama: ${money(me.avg)} | Üst: ${money(me.max)} | Emsal: ${mc.similarCount||0}\n`;}return s}

function biometric(){try{Android.authenticateBiometric()}catch(e){toast('Biyometri kullanılamıyor')}}window.onBiometricResult=(ok,msg)=>{if(ok)document.getElementById('lockRoot').innerHTML='';else if(msg&&msg!=='PIN')toast(msg)};window.appShouldLock=()=>showLock();
function updateWidget(){const v=activeVehicle(),u=upcoming()[0];if(!v)return;try{Android.updateWidget(`${v.year||''} ${v.make} ${v.model}`.trim(),`${num(v.km)} km • ${v.plate||'Plakasız'}`,u?`${u.name}${u.dueKm?' • '+num(Math.max(0,u.km))+' km':''}${u.dueDate?' • '+Math.max(0,u.days)+' gün':''}`:'Yaklaşan işlem yok')}catch(e){}}
function toast(t){try{Android.toast(t)}catch(e){console.log(t)}}function resetApp(){if(confirm('Tüm kayıtlar kalıcı olarak silinsin mi?')){state=structuredClone(initial);localStorage.removeItem(KEY);closeModal();save()}}
window.appBack=()=>{if(document.getElementById('lockRoot').innerHTML)return;if(document.getElementById('modalRoot').innerHTML){closeModal();return}if(current!=='home'){go('home');return}try{Android.toast('Çıkmak için ana ekran tuşunu kullan')}catch(e){}}
document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},350)});
syncCommunityStatus();applyTheme();render();setTimeout(()=>{runKmAlerts();updateWidget();configureFuelNative();const age=Date.now()-(+state.fuelMarket?.updatedAt||0);if(state.prefs.fuelAlertsEnabled&&age>6*3600000)refreshFuelDashboard(false);if(!state.prefs.photoFixV11){state.prefs.photoFixV11=true;localStorage.setItem(KEY,JSON.stringify(state));const v=activeVehicle();if(v&&v.make&&v.model&&v.photoLicense!=='Kullanıcı fotoğrafı'){window._imageSearchMode='auto:'+v.id;try{Android.searchVehicleImagesExact(v.make,v.model,+v.year||0,v.engine||'')}catch(e){}}}if(!state.prefs.specQuotaFixV153){state.prefs.specQuotaFixV153=true;localStorage.setItem(KEY,JSON.stringify(state))}const _av=activeVehicle();if(_av&&needsSpecRefresh(_av)&&!_av.specError)setTimeout(()=>queueSpecVehicle(_av,false,false),800);if(state.prefs.lockEnabled)showLock()},250);
</script>
