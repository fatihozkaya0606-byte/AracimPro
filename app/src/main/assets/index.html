<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#0d1b36;--muted:#718096;--line:#e6edf8;--blue:#0b67f0;--blue2:#2d8cff;--green:#17a86b;--orange:#f59e0b;--red:#e84c4c;--shadow:0 12px 30px rgba(34,70,122,.10);--r:22px;--safe-top:0px;--safe-bottom:0px;--visual-height:100dvh;--visual-top:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-bottom))}.top{position:sticky;top:0;z-index:20;background:rgba(244,248,255,.94);backdrop-filter:blur(14px);padding:calc(14px + var(--safe-top)) 16px 10px;border-bottom:1px solid rgba(230,237,248,.65)}.brandrow{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--blue2),#0751c8);box-shadow:0 8px 20px rgba(11,103,240,.25)}.logo .ico{width:25px;height:25px}.brandtext b{display:block;font-size:21px;letter-spacing:-.5px}.brandtext small{color:var(--muted);font-size:12px}.iconbtn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 7px 20px rgba(34,70,122,.08)}.ico{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.content{padding:14px 14px 4px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.hero{background:linear-gradient(150deg,#ffffff 20%,#eaf3ff 100%);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-65px;top:-70px;background:rgba(45,140,255,.09)}.herohead{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}.vehicleTitle{font-size:20px;font-weight:800;letter-spacing:-.4px}.vehicleSub{color:var(--muted);font-size:13px;margin-top:3px}.plate{display:inline-flex;margin-top:14px;background:#f3f6fa;border:1px solid #dce6f2;border-radius:8px;padding:7px 10px;font-weight:800;letter-spacing:.7px}.carart{height:128px;margin:6px 0 -4px;position:relative}.carart svg{width:100%;height:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px}.micon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;margin-bottom:10px}.micon.blue{background:#eaf3ff;color:var(--blue)}.micon.green{background:#e8f8f1;color:var(--green)}.micon.orange{background:#fff5df;color:var(--orange)}.micon.red{background:#fff0f0;color:var(--red)}.metric small{color:var(--muted);display:block;margin-bottom:3px}.metric strong{font-size:20px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.sectionTitle h2{font-size:17px;margin:0}.sectionTitle button,.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:700}.statusline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:3px;font-size:15px}.green{color:var(--green)}.progress{height:9px;background:#edf2f8;border-radius:99px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0caf68,#82d9a8)}.empty{text-align:center;padding:32px 16px}.empty .bigicon{width:74px;height:74px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;color:var(--blue);background:#eaf3ff}.empty h2{margin:0 0 8px}.empty p{color:var(--muted);margin:0 auto 18px;max-width:340px;line-height:1.45}.primary,.secondary,.danger{border:0;border-radius:15px;padding:13px 16px;font-weight:800;font-size:14px}.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 8px 20px rgba(11,103,240,.23)}.secondary{background:#eef4ff;color:var(--blue)}.danger{background:#fff0f0;color:var(--red)}.wide{width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.pill.ok{background:#e8f8f1;color:#13855a}.pill.warn{background:#fff5df;color:#bd7400}.pill.bad{background:#fff0f0;color:#c63a3a}.pill.info{background:#eaf3ff;color:#0b67f0}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}.rowicon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:#eef4ff;color:var(--blue)}.rowmain{min-width:0;flex:1}.rowmain b{display:block;font-size:14px}.rowmain small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowright{text-align:right}.rowright b{display:block;font-size:14px}.rowright small{color:var(--muted);font-size:11px}.fab{position:fixed;right:20px;bottom:calc(94px + var(--safe-bottom));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 12px 28px rgba(11,103,240,.3);display:none;place-items:center}.fab.show{display:grid}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding-bottom:var(--safe-bottom)}.nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 10px}.nav button{border:0;background:transparent;color:#8290a5;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:5px 2px}.nav button.active{color:var(--blue)}.nav .ico{width:21px;height:21px}.pageHead{display:flex;align-items:flex-start;justify-content:space-between;margin:4px 2px 14px}.pageHead h1{font-size:24px;margin:0;letter-spacing:-.5px}.pageHead p{margin:4px 0 0;color:var(--muted);font-size:13px}.summaryBig{display:flex;justify-content:space-between;align-items:flex-end}.summaryBig strong{font-size:30px;letter-spacing:-1px}.summaryBig small{color:var(--muted)}.chart{height:175px;display:flex;align-items:end;gap:8px;padding-top:14px}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;min-width:0}.bar{width:100%;max-width:38px;background:linear-gradient(180deg,#75b6ff,#1b79ef);border-radius:9px 9px 4px 4px;min-height:4px}.barvalue{height:16px;font-size:9px;font-weight:800;color:#36506f;white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis}.barwrap small{font-size:10px;color:var(--muted)}.kv{display:grid;grid-template-columns:120px 1fr;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border-bottom:0}.kv span{color:var(--muted);font-size:13px}.kv b{font-size:13px;text-align:right}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.miniCard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.miniCard small{color:var(--muted)}.miniCard b{display:block;font-size:20px;margin-top:4px}.notice{display:flex;gap:10px;padding:13px;border-radius:16px;background:#fff8e8;color:#7a5700;border:1px solid #ffe4a8;margin-bottom:12px}.notice .ico{flex:0 0 20px}.modal{position:fixed;inset:0;background:rgba(8,20,40,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:760px;background:#fff;border-radius:26px 26px 0 0;max-height:calc(100vh - 6px);overflow:auto;overscroll-behavior:contain;scroll-padding:80px 0 110px;padding:10px 16px 38px;box-shadow:0 -20px 50px rgba(8,20,40,.2)}body.keyboard-open .sheet{max-height:100vh;padding-bottom:72px}.handle{width:48px;height:5px;background:#dce4ef;border-radius:99px;margin:0 auto 14px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheethead h2{margin:0;font-size:20px}.close{border:0;background:#f1f4f8;width:36px;height:36px;border-radius:12px;font-size:22px}.form{display:grid;gap:11px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px 2px;color:#4f5d72}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe7f2;background:#f9fbff;border-radius:14px;padding:13px 12px;font:inherit;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:#7eb7ff;box-shadow:0 0 0 3px #eaf3ff}.field textarea{min-height:82px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.onboard{position:fixed;inset:0;z-index:150;background:linear-gradient(160deg,#f5f9ff,#eaf3ff);display:none;align-items:center;justify-content:center;padding:24px}.onboard.show{display:flex}.welcome{max-width:430px;text-align:center}.welcome .logo{width:86px;height:86px;border-radius:28px;margin:0 auto 20px}.welcome .logo .ico{width:48px;height:48px}.welcome h1{font-size:34px;margin:0}.welcome h1 span{color:var(--blue)}.welcome p{color:var(--muted);line-height:1.55;margin:12px 0 24px}.featureDots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.featureDots div{font-size:11px;background:#fff;border:1px solid var(--line);padding:10px 6px;border-radius:14px;color:#56657a}.muted{color:var(--muted)}.red{color:var(--red)}.space{height:5px}.toast{position:fixed;left:50%;bottom:calc(105px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:200;background:#10203a;color:#fff;padding:11px 15px;border-radius:13px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.content{padding-left:20px;padding-right:20px}.fab{right:calc(50% - 350px)}}
</style>

<div class="app">
<header class="top"><div class="brandrow"><div class="brand"><div class="logo"><svg class="ico"><use href="#i-car"/></svg></div><div class="brandtext"><b>Aracım <span style="color:var(--blue)">Pro</span></b><small>Aracınla ilgili her şey, tek yerde.</small></div></div><button class="iconbtn" onclick="openSettings()"><svg class="ico"><use href="#i-settings"/></svg></button></div></header>
<main class="content">
<section id="home" class="page active"></section>
<section id="garage" class="page"></section>
<section id="fuel" class="page"></section>
<section id="maintenance" class="page"></section>
<section id="reports" class="page"></section>
</main>
<button id="fab" class="fab" onclick="fabAction()"><svg class="ico" style="width:27px;height:27px"><use href="#i-plus"/></svg></button>
</div>
<nav class="bottom"><div class="nav">
<button data-page="home" class="active" onclick="go('home')"><svg class="ico"><use href="#i-home"/></svg><span>Ana Sayfa</span></button>
<button data-page="garage" onclick="go('garage')"><svg class="ico"><use href="#i-car"/></svg><span>Garaj</span></button>
<button data-page="fuel" onclick="go('fuel')"><svg class="ico"><use href="#i-fuel"/></svg><span>Yakıt</span></button>
<button data-page="maintenance" onclick="go('maintenance')"><svg class="ico"><use href="#i-wrench"/></svg><span>Bakım</span></button>
<button data-page="reports" onclick="go('reports')"><svg class="ico"><use href="#i-chart"/></svg><span>Raporlar</span></button>
</div></nav>
<div id="modal" class="modal" onclick="modalBackdrop(event)"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2 id="modalTitle">Ekle</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="onboard" class="onboard"><div class="welcome"><div class="logo"><svg class="ico"><use href="#i-car"/></svg></div><h1>Aracım <span>Pro</span></h1><p>Yakıtını, bakımını, masraflarını ve yaklaşan işlemlerini tek uygulamada takip et.</p><div class="featureDots"><div>⛽ Yakıt Takibi</div><div>🔧 Bakım Planı</div><div>📊 Gider Raporu</div></div><button class="primary wide" onclick="startOnboarding()">Aracımı Ekle</button></div></div>
<div id="toast" class="toast">Kaydedildi</div>
<script>
const KEY='aracim_pro_v1';
const initial={vehicle:null,fuel:[],maintenance:[],prefs:{firstRun:true}};
let state=load(); let current='home';
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function money(n){return new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}).format(Number(n)||0)+' TL'}
function num(n,d=0){return new Intl.NumberFormat('tr-TR',{maximumFractionDigits:d,minimumFractionDigits:d}).format(Number(n)||0)}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function pad2(n){return String(n).padStart(2,'0')}
function localDateKey(d=new Date()){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function localMonthKey(d=new Date()){return d.getFullYear()+'-'+pad2(d.getMonth()+1)}
function isoToday(){return localDateKey(new Date())}
function compactMoney(n){n=Number(n)||0;if(n>=1000000)return num(n/1000000,1)+' Mn';if(n>=1000)return num(n/1000,1)+' B';return num(n)}
function fmtDate(s){if(!s)return '—'; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'})}
function daysUntil(s){if(!s)return 99999; const a=new Date();a.setHours(0,0,0,0);const b=new Date(s+'T00:00:00');return Math.ceil((b-a)/86400000)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);try{Android.toast(t)}catch(e){}}
function icon(id){return `<svg class="ico"><use href="#${id}"/></svg>`}
function go(p){current=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('fab').classList.toggle('show',p==='fuel'||p==='maintenance');window.scrollTo(0,0)}
window.appBack=()=>{if(document.getElementById('modal').classList.contains('open'))closeModal();else if(current!=='home')go('home')}
function carSvg(){return `<svg viewBox="0 0 520 180" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#d9e7f7"/><stop offset="1" stop-color="#9fb9d6"/></linearGradient></defs><path d="M82 125c10-31 31-50 64-60l62-18c31-9 71-8 104 2l54 17c20 6 34 18 45 36l19 8c9 3 15 11 15 21v14H72v-8c0-6 4-10 10-12Z" fill="url(#g)" stroke="#29466b" stroke-width="4"/><path d="m171 66 46-9c28-6 64-5 88 2l37 12H171Z" fill="#eff7ff" stroke="#29466b" stroke-width="3"/><path d="M247 58v49M360 75l22 34M137 100h34M380 102h32" stroke="#29466b" stroke-width="4" stroke-linecap="round"/><circle cx="154" cy="143" r="25" fill="#24364d"/><circle cx="154" cy="143" r="12" fill="#dce7f4"/><circle cx="367" cy="143" r="25" fill="#24364d"/><circle cx="367" cy="143" r="12" fill="#dce7f4"/><path d="M74 133h45M408 133h36" stroke="#0b67f0" stroke-width="5"/></svg>`}
function calc(){const fuelTotal=state.fuel.reduce((s,x)=>s+(+x.cost||0),0);const maintTotal=state.maintenance.reduce((s,x)=>s+(+x.cost||0),0);const month=localMonthKey(new Date());const fuelMonth=state.fuel.filter(x=>x.date?.startsWith(month)).reduce((s,x)=>s+(+x.cost||0),0);const maintMonth=state.maintenance.filter(x=>x.dateDone?.startsWith(month)).reduce((s,x)=>s+(+x.cost||0),0);return{fuelTotal,maintTotal,total:fuelTotal+maintTotal,fuelMonth,maintMonth,monthTotal:fuelMonth+maintMonth}}
function dueInfo(m){const km=state.vehicle?.km||0; const kd=m.dueKm?m.dueKm-km:999999; const dd=daysUntil(m.dueDate); if(kd<0||dd<0)return{cls:'bad',text:'Gecikti'}; if(kd<=1000||dd<=30)return{cls:'warn',text:'Yaklaşıyor'}; if(m.completed)return{cls:'ok',text:'Tamamlandı'}; return{cls:'info',text:'Planlandı'}}
function upcoming(){return state.maintenance.filter(m=>!m.completed).sort((a,b)=>Math.min((a.dueKm||99999999)-(state.vehicle?.km||0),daysUntil(a.dueDate)*30)-Math.min((b.dueKm||99999999)-(state.vehicle?.km||0),daysUntil(b.dueDate)*30))}
function renderHome(){const el=document.getElementById('home');if(!state.vehicle){el.innerHTML=`<div class="card empty"><div class="bigicon">${icon('i-car')}</div><h2>Garajın henüz boş</h2><p>Aracını eklediğinde yakıt, bakım, masraf ve hatırlatmalarını tek yerden takip edebilirsin.</p><button class="primary" onclick="openVehicle()">Araç Ekle</button></div>`;return} const v=state.vehicle,c=calc(),ups=upcoming();const next=ups[0];const remain=next?.dueKm?next.dueKm-v.km:null; el.innerHTML=`
<div class="card hero"><div class="herohead"><div><div class="vehicleTitle">${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</div><div class="vehicleSub">${esc(v.engine||'')} ${v.fuel?' • '+esc(v.fuel):''} ${v.transmission?' • '+esc(v.transmission):''}</div>${v.plate?`<div class="plate">🇹🇷 ${esc(v.plate.toUpperCase())}</div>`:''}</div><button class="iconbtn" onclick="openVehicle()">${icon('i-edit')}</button></div><div class="carart">${carSvg()}</div></div>
<div class="metrics"><div class="metric"><div class="micon blue">${icon('i-wallet')}</div><small>Toplam Gider</small><strong>${money(c.total)}</strong></div><div class="metric"><div class="micon green">${icon('i-fuel')}</div><small>Yakıt</small><strong>${money(c.fuelTotal)}</strong></div><div class="metric"><div class="micon blue">${icon('i-wrench')}</div><small>Bakım</small><strong>${money(c.maintTotal)}</strong></div><div class="metric"><div class="micon orange">${icon('i-bell')}</div><small>Yaklaşan İşlem</small><strong>${ups.filter(x=>['warn','bad'].includes(dueInfo(x).cls)).length}</strong></div></div>
<div class="card"><div class="sectionTitle"><h2>Araç Durumu</h2><span class="pill ${ups.some(x=>dueInfo(x).cls==='bad')?'bad':ups.some(x=>dueInfo(x).cls==='warn')?'warn':'ok'}">${ups.some(x=>dueInfo(x).cls==='bad')?'Kontrol Gerekli':ups.some(x=>dueInfo(x).cls==='warn')?'İşlem Yaklaşıyor':'İyi Durumda'}</span></div><div class="statusline"><div class="stat"><small>Güncel KM</small><b>${num(v.km)} km</b></div><div class="stat"><small>Sıradaki işlem</small><b>${next?esc(next.name):'Yok'}</b></div><div class="stat"><small>Kalan</small><b class="green">${remain!=null?num(Math.max(0,remain))+' km':next?.dueDate?Math.max(0,daysUntil(next.dueDate))+' gün':'—'}</b></div></div><div class="progress"><span style="width:${remain!=null?Math.max(8,Math.min(100,100-remain/100)):100}%"></span></div></div>
${ups.length?`<div class="sectionTitle"><h2>Yaklaşan İşlemler</h2><button onclick="go('maintenance')">Tümünü Gör</button></div><div class="list">${ups.slice(0,3).map(maintRow).join('')}</div>`:''}`}
function maintRow(m){const d=dueInfo(m);const sub=[m.dueKm?num(m.dueKm)+' km':'',m.dueDate?fmtDate(m.dueDate):''].filter(Boolean).join(' • ');return `<div class="row"><div class="rowicon">${icon('i-wrench')}</div><div class="rowmain"><b>${esc(m.name)}</b><small>${sub||esc(m.note||'Bakım kaydı')}</small></div><div class="rowright"><span class="pill ${d.cls}">${d.text}</span>${m.cost?`<small>${money(m.cost)}</small>`:''}</div></div>`}
function renderGarage(){const el=document.getElementById('garage'); if(!state.vehicle){el.innerHTML=`<div class="pageHead"><div><h1>Garaj</h1><p>Araç bilgilerin</p></div></div><div class="card empty"><div class="bigicon">${icon('i-car')}</div><h2>Araç ekle</h2><p>Tüm takip özelliklerini kullanmak için önce aracını ekle.</p><button class="primary" onclick="openVehicle()">Araç Ekle</button></div>`;return} const v=state.vehicle;el.innerHTML=`<div class="pageHead"><div><h1>Garaj</h1><p>Araç kimliği ve güncel kilometre</p></div><button class="iconbtn" onclick="openVehicle()">${icon('i-edit')}</button></div><div class="card hero"><div class="vehicleTitle">${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</div><div class="vehicleSub">${esc(v.engine||'')} ${v.fuel?' • '+esc(v.fuel):''} ${v.transmission?' • '+esc(v.transmission):''}</div><div class="carart">${carSvg()}</div></div><div class="card"><div class="kv"><span>Plaka</span><b>${esc(v.plate||'—')}</b></div><div class="kv"><span>Güncel KM</span><b>${num(v.km)} km</b></div><div class="kv"><span>Yakıt</span><b>${esc(v.fuel||'—')}</b></div><div class="kv"><span>Şanzıman</span><b>${esc(v.transmission||'—')}</b></div><div class="kv"><span>Motor</span><b>${esc(v.engine||'—')}</b></div><div class="kv"><span>Not</span><b>${esc(v.note||'—')}</b></div></div><button class="secondary wide" onclick="quickKm()">Kilometreyi Güncelle</button>`}
function renderFuel(){const el=document.getElementById('fuel');const c=calc(); const sorted=[...state.fuel].sort((a,b)=>(b.date||'').localeCompare(a.date||''));let avg='—';if(sorted.length>=2){const byKm=[...state.fuel].filter(x=>x.km&&x.liters).sort((a,b)=>a.km-b.km);if(byKm.length>=2){const dist=byKm[byKm.length-1].km-byKm[0].km;const liters=byKm.slice(1).reduce((s,x)=>s+(+x.liters||0),0);if(dist>0)avg=num(liters/dist*100,1)+' L/100 km'}} el.innerHTML=`<div class="pageHead"><div><h1>Yakıt Takibi</h1><p>Yakıt tüketimini ve harcamanı izle</p></div></div><div class="grid2"><div class="miniCard"><small>Bu Ay Yakıt</small><b>${money(c.fuelMonth)}</b></div><div class="miniCard"><small>Ortalama Tüketim</small><b style="font-size:17px">${avg}</b></div></div><div class="space"></div><div class="sectionTitle"><h2>Son Yakıt Alımları</h2><button onclick="openFuel()">+ Ekle</button></div>${sorted.length?`<div class="list">${sorted.map(f=>`<div class="row" onclick="openFuel('${f.id}')"><div class="rowicon">${icon('i-fuel')}</div><div class="rowmain"><b>${fmtDate(f.date)} • ${num(f.liters,1)} L</b><small>${num(f.km)} km ${f.station?' • '+esc(f.station):''}</small></div><div class="rowright"><b>${money(f.cost)}</b><small>${f.liters?num(f.cost/f.liters,2)+' TL/L':''}</small></div></div>`).join('')}</div>`:`<div class="card empty"><div class="bigicon">${icon('i-fuel')}</div><h2>Yakıt kaydı yok</h2><p>İlk dolumunu eklediğinde tüketim ve gider istatistikleri oluşmaya başlayacak.</p><button class="primary" onclick="openFuel()">Yakıt Ekle</button></div>`}`}
function renderMaintenance(){const el=document.getElementById('maintenance');const items=[...state.maintenance].sort((a,b)=>Number(a.completed)-Number(b.completed));el.innerHTML=`<div class="pageHead"><div><h1>Bakım & Hatırlatma</h1><p>Bakımları ve resmi işlemleri aksatma</p></div></div>${!state.vehicle?`<div class="notice">${icon('i-info')}<div>KM bazlı hatırlatmalar için önce Garaj bölümünden araç ekle.</div></div>`:''}<div class="sectionTitle"><h2>İşlemler</h2><button onclick="openMaintenance()">+ Ekle</button></div>${items.length?`<div class="list">${items.map(m=>`<div onclick="openMaintenance('${m.id}')">${maintRow(m)}</div>`).join('')}</div>`:`<div class="card empty"><div class="bigicon">${icon('i-wrench')}</div><h2>Bakım kaydı yok</h2><p>Yağ değişimi, muayene, sigorta, lastik ve diğer işlemler için hatırlatma oluştur.</p><button class="primary" onclick="openMaintenance()">İşlem Ekle</button></div>`}`}
function monthKey(date){return (date||'').slice(0,7)}
function renderReports(){const el=document.getElementById('reports');const c=calc();let months=[];let d=new Date();for(let i=5;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(localMonthKey(x))}const vals=months.map(m=>state.fuel.filter(x=>monthKey(x.date)===m).reduce((s,x)=>s+(+x.cost||0),0)+state.maintenance.filter(x=>monthKey(x.dateDone)===m).reduce((s,x)=>s+(+x.cost||0),0));const max=Math.max(1,...vals);el.innerHTML=`<div class="pageHead"><div><h1>Raporlar</h1><p>Giderlerinin özetini gör ve dışa aktar</p></div></div><div class="card"><div class="summaryBig"><div><small>Toplam araç gideri</small><br><strong>${money(c.total)}</strong></div><span class="pill info">Tüm zamanlar</span></div><div class="chart">${months.map((m,i)=>`<div class="barwrap"><span class="barvalue">${vals[i]?compactMoney(vals[i]):''}</span><div class="bar" style="height:${Math.max(4,vals[i]/max*110)}px" title="${money(vals[i])}"></div><small>${new Date(m+'-01T12:00:00').toLocaleDateString('tr-TR',{month:'short'})}</small></div>`).join('')}</div></div><div class="grid2"><div class="miniCard"><small>Yakıt Toplamı</small><b>${money(c.fuelTotal)}</b></div><div class="miniCard"><small>Bakım Toplamı</small><b>${money(c.maintTotal)}</b></div></div><div class="space"></div><div class="card"><div class="sectionTitle"><h2>Dışa Aktar & Yedekle</h2></div><div class="toolbar"><button class="secondary" onclick="exportCsv()">${icon('i-download')} CSV Raporu</button><button class="secondary" onclick="backupJson()">${icon('i-shield')} Yedek Al</button><button class="secondary" onclick="shareSummary()">Raporu Paylaş</button></div><p class="muted" style="font-size:12px;margin:6px 0 0">Veriler cihazında tutulur. İnternet bağlantısı gerekmez.</p></div>`}
function syncReminders(){try{state.maintenance.forEach(m=>{Android.cancelMaintenanceReminder(m.id);if(!m.completed&&m.dueDate)Android.scheduleMaintenanceReminder(m.id,m.name,m.dueDate)})}catch(e){}}
function renderAll(){renderHome();renderGarage();renderFuel();renderMaintenance();renderReports();syncReminders(); if(state.prefs?.firstRun && !state.vehicle)document.getElementById('onboard').classList.add('show'); else document.getElementById('onboard').classList.remove('show')}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function modalBackdrop(e){if(e.target.id==='modal')closeModal()}
function startOnboarding(){document.getElementById('onboard').classList.remove('show');openVehicle(true)}
function openVehicle(first=false){const v=state.vehicle||{};modal(state.vehicle?'Aracı Düzenle':'Aracını Ekle',`<form class="form" onsubmit="saveVehicle(event,${first})"><div class="formrow"><div class="field"><label>Marka</label><input name="make" required value="${esc(v.make||'')}" placeholder="Hyundai"></div><div class="field"><label>Model</label><input name="model" required value="${esc(v.model||'')}" placeholder="Elantra"></div></div><div class="formrow"><div class="field"><label>Model Yılı</label><input name="year" type="number" min="1950" max="2030" required value="${esc(v.year||'')}"></div><div class="field"><label>Plaka</label><input name="plate" value="${esc(v.plate||'')}" placeholder="06 ABC 123"></div></div><div class="formrow"><div class="field"><label>Güncel Kilometre</label><input name="km" type="number" min="0" required value="${esc(v.km??'')}"></div><div class="field"><label>Yakıt</label><select name="fuel"><option ${v.fuel==='Benzin'?'selected':''}>Benzin</option><option ${v.fuel==='Dizel'?'selected':''}>Dizel</option><option ${v.fuel==='LPG'?'selected':''}>LPG</option><option ${v.fuel==='Hibrit'?'selected':''}>Hibrit</option><option ${v.fuel==='Elektrik'?'selected':''}>Elektrik</option></select></div></div><div class="formrow"><div class="field"><label>Motor</label><input name="engine" value="${esc(v.engine||'')}" placeholder="1.6 CVVT"></div><div class="field"><label>Şanzıman</label><select name="transmission"><option ${v.transmission==='Otomatik'?'selected':''}>Otomatik</option><option ${v.transmission==='Manuel'?'selected':''}>Manuel</option></select></div></div><div class="field"><label>Not</label><textarea name="note" placeholder="Araçla ilgili özel notlar">${esc(v.note||'')}</textarea></div><button class="primary wide" type="submit">Kaydet</button></form>`)}
function saveVehicle(e,first){e.preventDefault();const f=new FormData(e.target);state.vehicle={...(state.vehicle||{}),make:f.get('make').trim(),model:f.get('model').trim(),year:+f.get('year'),plate:f.get('plate').trim(),km:+f.get('km'),fuel:f.get('fuel'),engine:f.get('engine').trim(),transmission:f.get('transmission'),note:f.get('note').trim()};state.prefs={...(state.prefs||{}),firstRun:false};closeModal();save();toast('Araç kaydedildi')}
function quickKm(){if(!state.vehicle)return;modal('Kilometreyi Güncelle',`<form class="form" onsubmit="saveKm(event)"><div class="field"><label>Güncel Kilometre</label><input autofocus name="km" type="number" min="${state.vehicle.km||0}" required value="${state.vehicle.km||0}"></div><button class="primary wide">Güncelle</button></form>`)}
function saveKm(e){e.preventDefault();const km=+new FormData(e.target).get('km');state.vehicle.km=km;closeModal();save();toast('Kilometre güncellendi')}
function openFuel(id){const x=state.fuel.find(v=>v.id===id)||{};modal(id?'Yakıt Kaydını Düzenle':'Yakıt Ekle',`<form class="form" onsubmit="saveFuel(event,'${id||''}')"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" required value="${esc(x.date||isoToday())}"></div><div class="field"><label>Kilometre</label><input type="number" name="km" min="0" inputmode="numeric" required value="${esc(x.km??state.vehicle?.km??'')}"></div></div><div class="formrow"><div class="field"><label>Litre</label><input type="number" name="liters" step="0.01" min="0" inputmode="decimal" required value="${esc(x.liters??'')}"></div><div class="field"><label>Toplam Tutar (TL)</label><input type="number" name="cost" step="0.01" min="0" inputmode="decimal" required value="${esc(x.cost??'')}"></div></div><div class="field"><label>İstasyon</label><input name="station" value="${esc(x.station||'')}" placeholder="Opet, Shell..."></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="deleteFuel('${id}')">Kaydı Sil</button>`:''}</form>`)}
function saveFuel(e,id){e.preventDefault();const f=new FormData(e.target);const o={id:id||String(Date.now()),date:f.get('date'),km:+f.get('km'),liters:+f.get('liters'),cost:+f.get('cost'),station:f.get('station').trim()};if(id)state.fuel=state.fuel.map(x=>x.id===id?o:x);else state.fuel.push(o);if(state.vehicle&&o.km>state.vehicle.km)state.vehicle.km=o.km;closeModal();save();toast('Yakıt kaydedildi')}
function deleteFuel(id){if(confirm('Bu yakıt kaydı silinsin mi?')){state.fuel=state.fuel.filter(x=>x.id!==id);closeModal();save();toast('Kayıt silindi')}}
function openMaintenance(id){const x=state.maintenance.find(v=>v.id===id)||{};modal(id?'İşlemi Düzenle':'Bakım / Hatırlatma Ekle',`<form class="form" onsubmit="saveMaintenance(event,'${id||''}')"><div class="field"><label>İşlem</label><input name="name" list="maintTypes" required value="${esc(x.name||'')}" placeholder="Yağ Değişimi, Muayene, Sigorta..."><datalist id="maintTypes"><option value="Yağ Değişimi"><option value="Periyodik Bakım"><option value="Muayene"><option value="Trafik Sigortası"><option value="Kasko"><option value="Lastik Kontrolü"><option value="Lastik Değişimi"><option value="Fren Kontrolü"><option value="Akü Kontrolü"><option value="Polen Filtresi"><option value="Hava Filtresi"><option value="Triger / Zincir Kontrolü"></datalist></div><div class="formrow"><div class="field"><label>Hedef KM</label><input name="dueKm" type="number" min="0" inputmode="numeric" value="${esc(x.dueKm??'')}"></div><div class="field"><label>Hedef Tarih</label><input name="dueDate" type="date" value="${esc(x.dueDate||'')}"></div></div><div class="formrow"><div class="field"><label>Masraf (TL)</label><input name="cost" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(x.cost??'')}"></div><div class="field"><label>Yapıldığı Tarih</label><input name="dateDone" type="date" value="${esc(x.dateDone||'')}"></div></div><div class="field"><label>Not</label><textarea name="note" placeholder="Parça, servis, marka vb.">${esc(x.note||'')}</textarea></div><label style="display:flex;gap:9px;align-items:center;font-size:13px;font-weight:700"><input type="checkbox" name="completed" ${x.completed?'checked':''}> İşlem tamamlandı</label><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="deleteMaintenance('${id}')">Kaydı Sil</button>`:''}</form>`)}
function saveMaintenance(e,id){e.preventDefault();const f=new FormData(e.target);const o={id:id||String(Date.now()),name:f.get('name').trim(),dueKm:f.get('dueKm')?+f.get('dueKm'):null,dueDate:f.get('dueDate')||'',cost:f.get('cost')?+f.get('cost'):0,dateDone:f.get('dateDone')||'',note:f.get('note').trim(),completed:f.get('completed')==='on'};if(o.completed&&!o.dateDone)o.dateDone=isoToday();if(id)state.maintenance=state.maintenance.map(x=>x.id===id?o:x);else state.maintenance.push(o);try{Android.cancelMaintenanceReminder(o.id);if(!o.completed&&o.dueDate){Android.requestNotificationPermission();Android.scheduleMaintenanceReminder(o.id,o.name,o.dueDate)}}catch(e){}closeModal();save();toast('İşlem kaydedildi')}
function deleteMaintenance(id){if(confirm('Bu işlem silinsin mi?')){try{Android.cancelMaintenanceReminder(id)}catch(e){}state.maintenance=state.maintenance.filter(x=>x.id!==id);closeModal();save();toast('İşlem silindi')}}
function openSettings(){modal('Ayarlar',`<div class="form"><div class="card" style="margin:0"><div class="sectionTitle"><h2>Aracım Pro</h2><span class="pill info">v1.4.0</span></div><p class="muted" style="font-size:13px;line-height:1.5">Veriler yalnızca cihazında saklanır. Uygulama internetsiz çalışır ve hesap açmanı istemez.</p></div><button class="secondary wide" onclick="backupJson()">Yedek Dosyası Oluştur</button><button class="secondary wide" onclick="openBackupFile()">Yedekten Geri Yükle</button><button class="danger wide" onclick="resetApp()">Tüm Verileri Sil</button></div>`)}
function openBackupFile(){try{Android.openBackupFile()}catch(e){showRestore()}}
function restoreBackupFromNative(content){try{const s=JSON.parse(content);if(!s||typeof s!=='object')throw 0;state={...initial,...s,prefs:{firstRun:false,...(s.prefs||{})}};closeModal();save();toast('Yedek geri yüklendi')}catch(e){alert('Yedek dosyası geçerli değil.')}}
window.restoreBackupFromNative=restoreBackupFromNative;
function showRestore(){modal('Yedekten Geri Yükle',`<form class="form" onsubmit="restoreJson(event)"><div class="field"><label>Yedek JSON içeriği</label><textarea name="json" required placeholder="Yedek dosyasındaki içeriği buraya yapıştır"></textarea></div><button class="primary wide">Geri Yükle</button></form>`)}
function restoreJson(e){e.preventDefault();try{const s=JSON.parse(new FormData(e.target).get('json'));if(!s||typeof s!=='object')throw 0;state={...initial,...s,prefs:{firstRun:false,...(s.prefs||{})}};closeModal();save();toast('Yedek geri yüklendi')}catch(err){alert('Yedek içeriği geçerli değil.')}}
function resetApp(){if(confirm('Tüm araç, yakıt ve bakım kayıtları kalıcı olarak silinsin mi?')){state=structuredClone(initial);localStorage.removeItem(KEY);closeModal();renderAll();toast('Tüm veriler silindi')}}
function fabAction(){if(current==='fuel')openFuel();else if(current==='maintenance')openMaintenance()}
function exportCsv(){let rows=[['Tür','Tarih','Kilometre','Açıklama','Litre','Tutar TL']];state.fuel.forEach(x=>rows.push(['Yakıt',x.date,x.km,x.station,x.liters,x.cost]));state.maintenance.forEach(x=>rows.push(['Bakım',x.dateDone||x.dueDate,x.dueKm||'',x.name,'',x.cost||0]));const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');saveNative('AracimPro_Rapor.csv','text/csv',csv)}
function backupJson(){saveNative('AracimPro_Yedek.json','application/json',JSON.stringify(state,null,2))}
function saveNative(name,mime,content){try{Android.saveFile(name,mime,content)}catch(e){const blob=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function shareSummary(){const c=calc();const v=state.vehicle;const t=`Aracım Pro Raporu\n${v?`${v.year} ${v.make} ${v.model} • ${num(v.km)} km\n`:''}Toplam gider: ${money(c.total)}\nYakıt: ${money(c.fuelTotal)}\nBakım: ${money(c.maintTotal)}\nYaklaşan işlem: ${upcoming()[0]?.name||'Yok'}`;try{Android.shareText('Aracım Pro Raporu',t)}catch(e){navigator.clipboard?.writeText(t);toast('Rapor panoya kopyalandı')}}
function setNativeInsets(top,bottom){document.documentElement.style.setProperty('--safe-top',(Number(top)||0)+'px');document.documentElement.style.setProperty('--safe-bottom',(Number(bottom)||0)+'px');updateVisualViewport()}
window.setNativeInsets=setNativeInsets;
function updateVisualViewport(){const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;const y=vv?vv.offsetTop:0;document.documentElement.style.setProperty('--visual-height',Math.max(240,h)+'px');document.documentElement.style.setProperty('--visual-top',y+'px')}
if(window.visualViewport){visualViewport.addEventListener('resize',updateVisualViewport);visualViewport.addEventListener('scroll',updateVisualViewport)}window.addEventListener('resize',updateVisualViewport);
document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;document.body.classList.add('keyboard-open');setTimeout(()=>{const sheet=e.target.closest('.sheet');if(sheet){const er=e.target.getBoundingClientRect(),sr=sheet.getBoundingClientRect();const wanted=sr.top+72;const delta=er.top-wanted;if(Math.abs(delta)>8)sheet.scrollBy({top:delta,behavior:'smooth'});}else{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){e.target.scrollIntoView()}}},420)});document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,select,textarea'))document.body.classList.remove('keyboard-open')},180));
updateVisualViewport();
renderAll();
</script>
</body></html>
