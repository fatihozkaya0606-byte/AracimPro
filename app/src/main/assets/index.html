<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Aracım Pro</title>
<style>
:root{--bg:#f3f7fd;--card:#fff;--ink:#10213c;--muted:#75879b;--line:#dfe7f0;--blue:#1675ed;--blue2:#2e91ff;--green:#13ad74;--orange:#f5a300;--red:#e24d54;--shadow:0 10px 30px rgba(27,70,126,.08);--nav:76px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:calc(var(--nav) + 18px)}
body.dark{--bg:#0d1522;--card:#151f2d;--ink:#eef5ff;--muted:#98a9bb;--line:#283649;--shadow:none}body.dark .header{background:#101a28}body.dark input,body.dark select,body.dark textarea{background:#111c2a;color:var(--ink)}
.header{position:sticky;top:0;z-index:20;background:rgba(243,247,253,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px 10px}.brandrow{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--blue2),#075aca);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 18px rgba(22,117,237,.25)}.brand{font-size:23px;font-weight:800;letter-spacing:-.4px}.brand b{color:var(--blue)}.grow{flex:1}.iconbtn{width:43px;height:43px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font-size:20px;box-shadow:var(--shadow)}.vehicleSelect{margin-top:9px;display:flex;align-items:center;gap:8px}.vehicleSelect select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:12px;font-weight:700}
main{padding:16px}.hero{background:linear-gradient(145deg,#eaf4ff,#fff);border:1px solid var(--line);border-radius:25px;padding:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}.dark .hero{background:linear-gradient(145deg,#142a44,#151f2d)}.heroTop{display:flex;gap:12px;align-items:flex-start}.vehiclePhoto{width:112px;height:76px;border-radius:18px;background:#deedff;object-fit:cover;display:grid;place-items:center;font-size:38px}.hero h1{font-size:22px;margin:0 0 4px}.muted{color:var(--muted)}.small{font-size:12px}.plate{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-weight:800}.kmline{margin-top:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}.chip{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#e6f2ff;color:#086bd8}.chip.green{background:#e2f8ef;color:#09865a}.chip.orange{background:#fff2d5;color:#ad6b00}.chip.red{background:#ffe6e7;color:#bd3139}.dark .chip{filter:brightness(.85)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.metric .ico{width:38px;height:38px;border-radius:13px;background:#eaf4ff;display:grid;place-items:center;margin-bottom:12px}.metric strong{font-size:22px;display:block;margin-top:3px}.metric .label{font-size:13px;color:var(--muted)}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.sectionHead h2{font-size:20px;margin:0}.linkbtn{border:0;background:none;color:var(--blue);font-weight:800}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px}.rowIcon{width:42px;height:42px;border-radius:14px;background:#edf5ff;display:grid;place-items:center;font-size:19px;flex:0 0 auto}.rowMain{flex:1;min-width:0}.rowMain strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowMain span{font-size:12px;color:var(--muted)}.rowValue{text-align:right;font-weight:800}.empty{text-align:center;padding:34px 18px}.empty .big{font-size:42px}.empty h3{margin:10px 0 5px}.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;text-align:left;color:var(--ink)}.quick span{font-size:24px;display:block;margin-bottom:8px}.quick b{display:block}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-weight:800}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:var(--nav);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:7px 4px 8px}.dark .nav{background:rgba(15,24,36,.97)}.nav button{border:0;background:none;color:#8393a6;font-size:10px;font-weight:700;padding:3px 0}.nav button i{display:block;font-style:normal;font-size:22px;line-height:28px}.nav button.active{color:var(--blue)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 16px);width:58px;height:58px;border-radius:19px;border:0;background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;font-size:32px;box-shadow:0 12px 28px rgba(22,117,237,.35);z-index:15}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,25,45,.44);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-height:calc(100vh - 12px);overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:12px 18px 28px;box-shadow:0 -12px 45px rgba(0,0,0,.16)}.grab{width:44px;height:5px;border-radius:99px;background:#dce4ed;margin:0 auto 14px}.sheetHead{display:flex;align-items:center;gap:10px;margin-bottom:15px}.sheetHead h2{margin:0;font-size:22px}.close{margin-left:auto;border:0;width:42px;height:42px;border-radius:14px;background:var(--bg);color:var(--ink);font-size:24px}.form{display:flex;flex-direction:column;gap:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#53677f}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:15px;padding:13px 14px;outline:none}.field textarea{min-height:92px;resize:vertical}.wide{width:100%}.primary,.secondary,.danger{border:0;border-radius:15px;padding:14px 16px;font-weight:800}.primary{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff}.secondary{background:#eaf3ff;color:#106bcf}.danger{background:#ffe9ea;color:#c3333d}.photoEdit{display:flex;gap:12px;align-items:center}.photoPreview{width:108px;height:75px;border-radius:17px;object-fit:cover;background:#e8f2ff;display:grid;place-items:center;font-size:30px}.hint{font-size:11px;color:var(--muted);line-height:1.45}.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.toggle input{width:22px;height:22px}.progress{height:8px;background:#e7edf4;border-radius:99px;overflow:hidden}.progress b{display:block;height:100%;background:linear-gradient(90deg,#11ae75,#7cd9ad);border-radius:99px}.bars{height:180px;display:flex;align-items:flex-end;gap:7px;padding:10px 0}.bar{flex:1;text-align:center;min-width:0}.bar b{display:block;background:linear-gradient(#53a9ff,#1675ed);border-radius:8px 8px 3px 3px;min-height:4px}.bar span{display:block;font-size:10px;color:var(--muted);margin-top:5px}.bar em{display:block;font-style:normal;font-size:9px;font-weight:800;margin-bottom:4px}.lock{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}.lockBox{width:100%;max-width:380px;text-align:center}.lockLogo{width:78px;height:78px;margin:0 auto 16px;border-radius:24px;background:linear-gradient(145deg,var(--blue2),var(--blue));display:grid;place-items:center;color:#fff;font-size:38px}.pin{font-size:24px;letter-spacing:8px;text-align:center}.badge{font-size:10px;padding:3px 6px;border-radius:7px;background:#e9f3ff;color:#0c6dcc;font-weight:900}.docButtons{display:flex;gap:7px}.docButtons button{padding:8px 9px;border-radius:10px;border:0}.notice{padding:12px;border-radius:15px;background:#fff6df;color:#765111;font-size:12px;line-height:1.5}.dark .notice{background:#3a2c13;color:#ffd47c}@media(max-width:370px){.formrow,.grid2{grid-template-columns:1fr}.nav button{font-size:9px}.heroTop{flex-direction:column}.vehiclePhoto{width:100%;height:130px}}

/* V7 professional design additions */
.svgi{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.logo .svgi{width:27px;height:27px}.iconbtn .svgi{margin:auto}.metric .ico{color:var(--blue)}.metric .ico .svgi{width:21px;height:21px;margin:auto}.quick{display:flex;flex-direction:column;gap:7px;min-height:94px}.quick .qico{width:38px;height:38px;border-radius:13px;background:#edf5ff;color:var(--blue);display:grid;place-items:center}.quick .qico .svgi{width:21px;height:21px}.nav button i{height:29px;display:grid;place-items:center}.nav button i .svgi{width:21px;height:21px}.rowIcon{color:var(--blue)}.rowIcon .svgi{width:21px;height:21px}.vehiclePhoto,.photoPreview{border:1px solid var(--line);background:#e8f2ff}.vehiclePhoto{width:132px;height:88px}.heroSpecs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.specPill{font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 8px;color:var(--muted);font-weight:700}.imageSearchBox{border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--bg)}.imageResults{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.imageChoice{border:1px solid var(--line);background:var(--card);padding:5px;border-radius:14px;overflow:hidden;text-align:left;color:var(--ink)}.imageChoice img{width:100%;height:92px;object-fit:cover;border-radius:10px;background:#dde8f5}.imageChoice small{display:block;font-size:9px;color:var(--muted);padding:4px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sourceLine{font-size:10px;color:var(--muted);margin-top:6px}.sourceLine button{border:0;background:none;color:var(--blue);padding:0;font-size:10px}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpiHero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.kpiBox{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:12px}.kpiBox b{display:block;font-size:18px;margin-top:4px}.specTable{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}.specCell{background:var(--card);padding:12px}.specCell span{font-size:11px;color:var(--muted);display:block}.specCell b{font-size:14px;display:block;margin-top:3px}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compareHead{font-weight:900;padding:10px;background:#eaf4ff;border-radius:14px}.dark .compareHead{background:#17304b}.calcResult{font-size:28px;font-weight:900;color:var(--blue);margin:4px 0 12px}.emptyVehicle{width:100%;height:100%;display:grid;place-items:center;color:var(--blue)}.photoBadge{position:absolute;right:12px;top:12px;background:rgba(15,33,60,.82);color:#fff;border-radius:999px;padding:5px 8px;font-size:10px}.hero{position:relative}.badgePro{background:#101d31;color:#fff;padding:3px 7px;border-radius:999px;font-size:10px}.dark .imageSearchBox{background:#101a28}.dark .quick .qico,.dark .metric .ico{background:#19324e}.fullWidth{grid-column:1/-1}.notice.success{background:#e4f8ef;border-color:#bfe9d7;color:#08764f}.dangerText{color:var(--red)}

</style>
</head>
<body>
<div id="app" class="app"></div><div id="modalRoot"></div><div id="lockRoot"></div>
<script>
const KEY='aracim_pro_v1';
const V='3.0.0';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);const money=n=>(Number(n)||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' TL';const num=n=>(Number(n)||0).toLocaleString('tr-TR');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const initial={schema:3,vehicles:[],activeVehicleId:'',fuel:[],maintenance:[],expenses:[],tires:[],services:[],trips:[],documents:[],valuations:[],batteries:[],accidents:[],emergency:{insurer:'',insurancePhone:'',roadsidePhone:'',personalPhone:'',policyNo:'',note:''},prefs:{firstRun:true,dark:false,lockEnabled:false,pinHash:'',biometric:false,kmNotify:{},fuelPrice:0,annualKm:12000}};
let state=loadState(),current='home',recordsTab='fuel',planTab='maintenance';
function loadState(){let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};if(!s)return structuredClone(initial);if(s.vehicle&&!s.vehicles){const id='v_'+uid();return {...initial,vehicles:[{id,...s.vehicle,photo:''}],activeVehicleId:id,fuel:(s.fuel||[]).map(x=>({...x,vehicleId:id})),maintenance:(s.maintenance||[]).map(x=>({...x,vehicleId:id})),prefs:{...initial.prefs,...(s.prefs||{}),firstRun:false}}}return {...initial,...s,valuations:s.valuations||[],batteries:s.batteries||[],accidents:s.accidents||[],emergency:{...initial.emergency,...(s.emergency||{})},prefs:{...initial.prefs,...(s.prefs||{})}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));applyTheme();render();updateWidget()}
function activeVehicle(){return state.vehicles.find(v=>v.id===state.activeVehicleId)||state.vehicles[0]||null}
function setActive(id){state.activeVehicleId=id;save()}
function vf(arr){const v=activeVehicle();return v?arr.filter(x=>x.vehicleId===v.id):[]}
function sum(a,key='cost'){return a.reduce((t,x)=>t+(Number(x[key])||0),0)}
function totals(){return{fuel:sum(vf(state.fuel)),maint:sum(vf(state.maintenance)),exp:sum(vf(state.expenses)),service:sum(vf(state.services),'total')}}
function totalAll(){const t=totals();return t.fuel+t.maint+t.exp+t.service}
function upcoming(){const v=activeVehicle();if(!v)return[];return vf(state.maintenance).filter(x=>!x.completed).map(x=>{let days=99999;if(x.dueDate)days=Math.ceil((new Date(x.dueDate+'T12:00:00')-new Date())/86400000);let km=x.dueKm?x.dueKm-(v.km||0):999999;return{...x,days,km,score:Math.min(days,km/50)}}).sort((a,b)=>a.score-b.score)}

const iconPaths={
car:'<path d="M3 14l2-5a3 3 0 0 1 2.8-2h8.4A3 3 0 0 1 19 9l2 5v5h-2v-2H5v2H3z"/><path d="M5 14h14"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/>',
home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9 20v-6h6v6"/>',
garage:'<path d="M3 10 12 4l9 6v10H3z"/><path d="M7 20v-6h10v6"/><path d="M8 17h8"/>',
records:'<path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/>',
wrench:'<path d="M14 6a4 4 0 0 0-5 5L3 17l4 4 6-6a4 4 0 0 0 5-5l-3 3-4-4z"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6.2L14.7 4h-5.4L9 6.2a7 7 0 0 0-1.5.9l-2.4-1-2 3.4L5.1 11A7 7 0 0 0 5 12c0 .3 0 .7.1 1l-2 1.5 2 3.4 2.4-1A7 7 0 0 0 9 17.8l.3 2.2h5.4l.3-2.2a7 7 0 0 0 1.5-.9l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/>',
fuel:'<path d="M5 3h9v18H5z"/><path d="M7 7h5M14 8h2l3 3v7a2 2 0 0 0 4 0v-8l-2-2"/>',
expense:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 10h10M8 15h4"/>',
bell:'<path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 20h4"/>',
document:'<path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/>',
road:'<path d="M9 3 6 21M15 3l3 18M12 5v3M12 11v3M12 17v3"/>',
tire:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v5M20 12h-5M12 20v-5M4 12h5"/>',
battery:'<rect x="4" y="7" width="16" height="11" rx="2"/><path d="M8 5v2M16 5v2M8 12h4M10 10v4M15 12h3"/>',
crash:'<path d="M3 17h18M5 17l2-7h10l2 7"/><path d="M8 13h8M12 3v4M4 6l3 2M20 6l-3 2"/>',
compare:'<path d="M8 4 4 8l4 4M4 8h9M16 20l4-4-4-4M20 16h-9"/>',
calculator:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2"/>',
value:'<path d="M4 18 9 13l4 3 7-9"/><path d="M16 7h4v4"/>',
shield:'<path d="M12 3 20 6v6c0 5-3 8-8 9-5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
cloud:'<path d="M7 18h11a4 4 0 0 0 0-8 6 6 0 0 0-11-2 5 5 0 0 0 0 10z"/><path d="M12 11v7M9 14l3-3 3 3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
edit:'<path d="m4 20 4-1 10-10-3-3L5 16zM13 7l3 3"/>',
camera:'<path d="M4 8h4l2-3h4l2 3h4v11H4z"/><circle cx="12" cy="13" r="3"/>',
search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
phone:'<path d="M7 3h3l2 5-2 2a14 14 0 0 0 4 4l2-2 5 2v3c0 2-2 4-4 4C9 21 3 15 3 7c0-2 2-4 4-4z"/>',
lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
moon:'<path d="M20 15a8 8 0 1 1-11-11 7 7 0 0 0 11 11z"/>'
};
function ico(name){return `<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||iconPaths.info}</svg>`}

function applyTheme(){document.body.classList.toggle('dark',!!state.prefs.dark)}

function header(){const v=activeVehicle();return `<header class="header"><div class="brandrow"><div class="logo">${ico('car')}</div><div><div class="brand">Aracım <b>Pro</b> <span class="badgePro">V7</span></div><div class="muted small">Akıllı garaj • bakım • maliyet • araç fotoğrafı</div></div><div class="grow"></div><button class="iconbtn" onclick="openSettings()">${ico('settings')}</button></div>${state.vehicles.length?`<div class="vehicleSelect"><select onchange="setActive(this.value)">${state.vehicles.map(x=>`<option value="${x.id}" ${x.id===v?.id?'selected':''}>${esc((x.year||'')+' '+x.make+' '+x.model)} • ${esc(x.plate||'Plakasız')}</option>`).join('')}</select><button class="iconbtn" onclick="openVehicle()">${ico('plus')}</button></div>`:''}</header>`}
const navItems=[['home','home','Ana'],['garage','garage','Garaj'],['records','records','Kayıt'],['plan','wrench','Plan'],['reports','chart','Rapor'],['more','menu','Daha']];
function nav(){return `<nav class="nav">${navItems.map(([k,i,l])=>`<button class="${current===k?'active':''}" onclick="go('${k}')"><i>${ico(i)}</i>${l}</button>`).join('')}</nav>`}
function go(k){current=k;closeModal();render();scrollTo(0,0)}
function render(){applyTheme();const app=document.getElementById('app');app.innerHTML=header()+`<main>${view()}</main>`+nav()+fab()}
function view(){if(!activeVehicle()&&current!=='garage'&&current!=='more')return welcome();return ({home:homeView,garage:garageView,records:recordsView,plan:planView,reports:reportsView,more:moreView}[current]||homeView)()}
function welcome(){return `<div class="card empty"><div class="big" style="display:grid;place-items:center;color:var(--blue)">${ico('car')}</div><h3>Garajın henüz boş</h3><p class="muted">Yıl, marka ve modeli yaz. V7 internet varsa gerçek araç fotoğraflarını arar; seçtiğin görseli telefona önbelleğe alır.</p><button class="primary" onclick="openVehicle()">Aracımı Ekle</button></div>`}
function vehicleDistance(){const v=activeVehicle();if(!v)return 0;const kms=[...(vf(state.fuel).map(x=>+x.km||0)),...(vf(state.services).map(x=>+x.km||0)),...(vf(state.trips).flatMap(x=>[+x.startKm||0,+x.endKm||0]))].filter(Boolean);if(!kms.length)return v.km||0;return Math.max(...kms)-Math.min(...kms)}
function currentValuation(){const v=activeVehicle();if(!v)return 0;const a=vf(state.valuations).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return +(a[0]?.value||v.currentValue||0)}
function costPerKm(){const d=vehicleDistance();return d>0?totalAll()/d:0}

function fuelView(){const a=vf(state.fuel).sort((a,b)=>b.date.localeCompare(a.date));let avg='—';if(a.length>1){const s=[...a].sort((a,b)=>a.km-b.km),dist=s.at(-1).km-s[0].km,lit=s.slice(1).reduce((t,x)=>t+x.liters,0);if(dist>0)avg=(lit/dist*100).toFixed(1)+' L/100 km'}return `<div class="grid2"><div class="card metric"><div class="label">Yakıt Toplamı</div><strong>${money(sum(a))}</strong></div><div class="card metric"><div class="label">Ortalama Tüketim</div><strong>${avg}</strong></div></div><div class="sectionHead"><h2>Yakıt Alımları</h2><button class="linkbtn" onclick="openFuel()">+ Ekle</button></div>${listOrEmpty(a,x=>`<div class="row" onclick="openFuel('${x.id}')"><div class="rowIcon">⛽</div><div class="rowMain"><strong>${fmtDate(x.date)} • ${num(x.liters)} L</strong><span>${num(x.km)} km • ${esc(x.station||'İstasyon yok')}</span></div><div class="rowValue">${money(x.cost)}<div class="muted small">${x.liters?(x.cost/x.liters).toFixed(2)+' TL/L':''}</div></div></div>`)}`}

function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`}
function addMonths(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}

function searchVehiclePhotos(){const q=[formVehicleValue('year'),formVehicleValue('make'),formVehicleValue('model'),formVehicleValue('trim')].filter(Boolean).join(' ');if(!formVehicleValue('make')||!formVehicleValue('model')){toast('Önce marka ve modeli yaz');return}const a=document.getElementById('imageSearchArea');if(a)a.innerHTML=`<div class="imageSearchBox"><b>Fotoğraflar aranıyor…</b><div class="muted small">${esc(q)}</div></div>`;window._imageSearchMode='picker';try{Android.searchVehicleImages(q)}catch(e){toast('İnternet görsel araması kullanılamıyor')}}
window.onVehicleImageSearchResult=(raw,error)=>{let arr=[];try{arr=JSON.parse(raw||'[]')}catch(e){};if(window._imageSearchMode?.startsWith('auto:')){const id=window._imageSearchMode.split(':')[1];window._imageSearchMode='';if(arr[0])selectVehicleImage(arr[0],id,true);return}const a=document.getElementById('imageSearchArea');if(!a)return;if(error&&!arr.length){a.innerHTML=`<div class="notice">Fotoğraf aranamadı: ${esc(error)}. Galeriden kendi fotoğrafını seçebilirsin.</div>`;return}if(!arr.length){a.innerHTML=`<div class="notice">Bu model için uygun fotoğraf bulunamadı. Galeriden fotoğraf seçebilirsin.</div>`;return}window._vehicleImageResults=arr;a.innerHTML=`<div class="imageSearchBox"><b>Gerçek araç görselleri</b><div class="muted small">Doğru aracı seç. Kaynak ve lisans bilgisi araçta saklanır.</div><div class="imageResults">${arr.slice(0,8).map((x,i)=>`<button type="button" class="imageChoice" onclick="chooseVehicleImage(${i})"><img src="${x.url}"><small>${esc(x.title||'Wikimedia Commons')}</small></button>`).join('')}</div></div>`}
function chooseVehicleImage(i){const x=window._vehicleImageResults?.[i];if(!x)return;selectVehicleImage(x,window._editingVehicle?.id||'',false)}
function selectVehicleImage(x,id,auto){window._pendingRemoteImage={...x,id};if(!auto){const a=document.getElementById('imageSearchArea');if(a)a.innerHTML='<div class="notice success">Görsel telefona kaydediliyor…</div>'}try{Android.cacheRemoteImage('vehicle:'+id,x.url)}catch(e){if(window._editingVehicle){window._editingVehicle.photo=x.url;window._editingVehicle.photoSource=x.page;window._editingVehicle.photoLicense=x.license;window._editingVehicle.photoCredit=x.artist||x.credit;refreshVehiclePhotoPreview()}}}
window.onRemoteVehicleImageCached=(ctx,data,error)=>{if(!ctx.startsWith('vehicle:'))return;const id=ctx.split(':')[1],meta=window._pendingRemoteImage||{};if(error||!data){toast('Fotoğraf önbelleğe alınamadı');return}const v=state.vehicles.find(x=>x.id===id);if(v){Object.assign(v,{photo:data,photoSource:meta.page||'',photoLicense:meta.license||'Wikimedia Commons',photoCredit:meta.artist||meta.credit||''});save()}else if(window._editingVehicle?.id===id){Object.assign(window._editingVehicle,{photo:data,photoSource:meta.page||'',photoLicense:meta.license||'Wikimedia Commons',photoCredit:meta.artist||meta.credit||''});refreshVehiclePhotoPreview();const a=document.getElementById('imageSearchArea');if(a)a.innerHTML='<div class="notice success">Gerçek araç fotoğrafı seçildi ve telefona kaydedildi.</div>'}}
function refreshVehiclePhotoPreview(){const p=document.getElementById('vehiclePhotoPreview');if(!p||!window._editingVehicle)return;p.innerHTML=window._editingVehicle.photo?`<img class="photoPreview" src="${window._editingVehicle.photo}">`:`<div class="photoPreview"><div class="emptyVehicle">${ico('car')}</div></div>`}
function saveVehicle(e,id){e.preventDefault();const f=new FormData(e.target),base=window._editingVehicle||{};const g=n=>String(f.get(n)||'').trim(),n=n=>f.get(n)?+f.get(n):'';const o={...base,id:id||base.id||'v_'+uid(),type:g('type'),make:g('make'),model:g('model'),trim:g('trim'),year:n('year'),plate:g('plate').toUpperCase(),color:g('color'),km:n('km')||0,fuel:g('fuel'),engine:g('engine'),transmission:g('transmission'),body:g('body'),drive:g('drive'),engineCc:n('engineCc'),powerHp:n('powerHp'),torqueNm:n('torqueNm'),zeroTo100:n('zeroTo100'),weightKg:n('weightKg'),trunkL:n('trunkL'),purchaseDate:g('purchaseDate'),purchasePrice:n('purchasePrice'),currentValue:n('currentValue'),note:g('note')};if(id)state.vehicles=state.vehicles.map(x=>x.id===id?o:x);else state.vehicles.push(o);state.activeVehicleId=o.id;state.prefs.firstRun=false;closeModal();runKmAlerts();save();if(!o.photo){window._imageSearchMode='auto:'+o.id;try{Android.searchVehicleImages([o.year,o.make,o.model,o.trim].filter(Boolean).join(' '))}catch(e){}}}
function deleteVehicle(id){if(!confirm('Araç ve bu araca bağlı tüm kayıtlar silinsin mi?'))return;state.vehicles=state.vehicles.filter(x=>x.id!==id);for(const k of ['fuel','maintenance','expenses','tires','services','trips','documents','valuations','batteries','accidents'])state[k]=state[k].filter(x=>x.vehicleId!==id);state.activeVehicleId=state.vehicles[0]?.id||'';closeModal();save()}
function pickVehiclePhoto(id){try{Android.pickImage('vehicle:'+id)}catch(e){alert('Fotoğraf seçici açılamadı')}}
window.onNativeImagePicked=(ctx,data)=>{if(ctx.startsWith('vehicle:')){const id=ctx.split(':')[1];const v=state.vehicles.find(x=>x.id===id);if(v){v.photo=data;v.photoSource='';v.photoLicense='Kullanıcı fotoğrafı';save();openVehicle(id)}else if(window._editingVehicle?.id===id){window._editingVehicle.photo=data;window._editingVehicle.photoSource='';window._editingVehicle.photoLicense='Kullanıcı fotoğrafı';refreshVehiclePhotoPreview()}}};
function openPhotoSource(id){const v=state.vehicles.find(x=>x.id===id);if(!v?.photoSource)return;try{Android.openUri(v.photoSource,'')}catch(e){}}

function quickKm(){const v=activeVehicle();if(!v)return;modal('Kilometreyi Güncelle',`<form class="form" onsubmit="saveKm(event)"><div class="field"><label>Güncel Kilometre</label><input autofocus name="km" type="number" min="${v.km||0}" required value="${v.km||0}"></div><button class="primary wide">Güncelle</button></form>`)}
function saveKm(e){e.preventDefault();activeVehicle().km=+new FormData(e.target).get('km');closeModal();runKmAlerts();save()}
function runKmAlerts(){const v=activeVehicle();if(!v)return;state.prefs.kmNotify ||= {};vf(state.maintenance).filter(x=>!x.completed&&x.dueKm).forEach(x=>{const left=x.dueKm-v.km;if(left<=1000&&!state.prefs.kmNotify[x.id]){state.prefs.kmNotify[x.id]=true;try{Android.showNotification('Yaklaşan bakım',`${x.name} için ${Math.max(0,left)} km kaldı.`,x.id)}catch(e){}}})}

function openFuel(id=''){const x=vf(state.fuel).find(v=>v.id===id)||{};modal(id?'Yakıt Kaydını Düzenle':'Yakıt Ekle',`<form class="form" onsubmit="saveFuel(event,'${id}')"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" required value="${x.date||today()}"></div><div class="field"><label>Kilometre</label><input type="number" name="km" required value="${x.km??activeVehicle()?.km??0}"></div></div><div class="formrow"><div class="field"><label>Litre / kWh</label><input type="number" name="liters" step="0.01" required value="${x.liters??''}"></div><div class="field"><label>Toplam Tutar</label><input type="number" name="cost" step="0.01" required value="${x.cost??''}"></div></div><div class="formrow"><div class="field"><label>Kullanım</label><select name="driveType">${['Karma','Şehir İçi','Uzun Yol'].map(o=>`<option ${x.driveType===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Dolum</label><select name="fillType">${['Depo Dolu','Kısmi Dolum','Şarj'].map(o=>`<option ${x.fillType===o?'selected':''}>${o}</option>`).join('')}</select></div></div><div class="field"><label>İstasyon / Şarj Noktası</label><input name="station" value="${esc(x.station||'')}"></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('fuel','${id}')">Sil</button>`:''}</form>`)}
function saveFuel(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),km:+f.get('km'),liters:+f.get('liters'),cost:+f.get('cost'),station:f.get('station').trim(),driveType:f.get('driveType'),fillType:f.get('fillType')};upsert('fuel',o,id);if(o.km>activeVehicle().km)activeVehicle().km=o.km;closeModal();runKmAlerts();save()}

function saveExpense(e,id){e.preventDefault();const f=new FormData(e.target);upsert('expenses',{id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),category:f.get('category'),cost:+f.get('cost'),note:f.get('note').trim()},id);closeModal();save()}
function openTrip(id=''){const x=vf(state.trips).find(v=>v.id===id)||{};modal(id?'Yolculuğu Düzenle':'Yolculuk Ekle',`<form class="form" onsubmit="saveTrip(event,'${id}')"><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}" required></div><div class="formrow"><div class="field"><label>Başlangıç KM</label><input type="number" name="startKm" value="${x.startKm??activeVehicle().km}" required></div><div class="field"><label>Bitiş KM</label><input type="number" name="endKm" value="${x.endKm??''}" required></div></div><div class="field"><label>Rota</label><input name="route" value="${esc(x.route||'')}" placeholder="Ankara - Çankırı"></div><div class="field"><label>Amaç</label><input name="purpose" value="${esc(x.purpose||'')}" placeholder="İş, tatil, şehir içi"></div><div class="field"><label>Yolculuk ek gideri</label><input type="number" step="0.01" name="cost" value="${x.cost??0}"></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('trips','${id}')">Sil</button>`:''}</form>`)}
function saveTrip(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),startKm:+f.get('startKm'),endKm:+f.get('endKm'),route:f.get('route').trim(),purpose:f.get('purpose').trim(),cost:+f.get('cost'),note:f.get('note').trim()};upsert('trips',o,id);if(o.endKm>activeVehicle().km)activeVehicle().km=o.endKm;closeModal();runKmAlerts();save()}
function openService(id=''){const x=vf(state.services).find(v=>v.id===id)||{};modal(id?'Servisi Düzenle':'Servis Kaydı Ekle',`<form class="form" onsubmit="saveService(event,'${id}')"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}" required></div><div class="field"><label>KM</label><input type="number" name="km" value="${x.km??activeVehicle().km}" required></div></div><div class="field"><label>Servis / Usta</label><input name="shop" value="${esc(x.shop||'')}"></div><div class="field"><label>Yapılan İş</label><input name="work" required value="${esc(x.work||'')}"></div><div class="field"><label>Parçalar / Marka</label><textarea name="parts">${esc(x.parts||'')}</textarea></div><div class="formrow"><div class="field"><label>Parça Tutarı</label><input type="number" step="0.01" name="partsCost" value="${x.partsCost??0}"></div><div class="field"><label>İşçilik</label><input type="number" step="0.01" name="labor" value="${x.labor??0}"></div></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('services','${id}')">Sil</button>`:''}</form>`)}
function saveService(e,id){e.preventDefault();const f=new FormData(e.target),pc=+f.get('partsCost'),lb=+f.get('labor');const o={id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),km:+f.get('km'),shop:f.get('shop').trim(),work:f.get('work').trim(),parts:f.get('parts').trim(),partsCost:pc,labor:lb,total:pc+lb,note:f.get('note').trim()};upsert('services',o,id);if(o.km>activeVehicle().km)activeVehicle().km=o.km;closeModal();save()}
const maintPresets={'Yağ Değişimi':[10000,12],'Periyodik Bakım':[15000,12],'Hava Filtresi':[20000,18],'Polen Filtresi':[15000,12],'Fren Kontrolü':[15000,12],'Lastik Kontrolü':[10000,6],'Akü Kontrolü':[0,24],'Triger / Zincir Kontrolü':[60000,48],'Muayene':[0,24],'Trafik Sigortası':[0,12],'Kasko':[0,12],'MTV 1. Taksit':[0,12],'MTV 2. Taksit':[0,12]};
function openMaintenance(id=''){const x=vf(state.maintenance).find(v=>v.id===id)||{};const opts=Object.keys(maintPresets);modal(id?'İşlemi Düzenle':'Bakım / Hatırlatma Ekle',`<form class="form" onsubmit="saveMaintenance(event,'${id}')"><div class="field"><label>İşlem</label><input name="name" list="maintTypes" onchange="applyMaintPreset(this.value)" required value="${esc(x.name||'')}"><datalist id="maintTypes">${opts.map(o=>`<option value="${o}">`).join('')}</datalist></div><div class="hint">Hazır bakım aralıkları genel öneridir; aracının üretici kitapçığına göre değiştirebilirsin.</div><div class="formrow"><div class="field"><label>Hedef KM</label><input id="dueKm" name="dueKm" type="number" value="${x.dueKm??''}"></div><div class="field"><label>Hedef Tarih</label><input id="dueDate" name="dueDate" type="date" value="${x.dueDate||''}"></div></div><div class="formrow"><div class="field"><label>Masraf</label><input name="cost" type="number" step="0.01" value="${x.cost??0}"></div><div class="field"><label>Yapıldığı Tarih</label><input name="dateDone" type="date" value="${x.dateDone||''}"></div></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><label class="toggle"><span>İşlem tamamlandı</span><input type="checkbox" name="completed" ${x.completed?'checked':''}></label><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeMaintenance('${id}')">Sil</button>`:''}</form>`)}
function applyMaintPreset(name){const p=maintPresets[name];if(!p)return;const v=activeVehicle();if(p[0])document.getElementById('dueKm').value=(v?.km||0)+p[0];if(p[1])document.getElementById('dueDate').value=addMonths(new Date(),p[1])}
function saveMaintenance(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,name:f.get('name').trim(),dueKm:f.get('dueKm')?+f.get('dueKm'):null,dueDate:f.get('dueDate')||'',cost:+f.get('cost')||0,dateDone:f.get('dateDone')||'',note:f.get('note').trim(),completed:f.get('completed')==='on'};if(o.completed&&!o.dateDone)o.dateDone=today();upsert('maintenance',o,id);try{Android.cancelMaintenanceReminder(o.id);if(!o.completed&&o.dueDate){Android.requestNotificationPermission();Android.scheduleMaintenanceReminder(o.id,o.name,o.dueDate)}}catch(e){}delete state.prefs.kmNotify[o.id];closeModal();runKmAlerts();save()}
function removeMaintenance(id){try{Android.cancelMaintenanceReminder(id)}catch(e){}removeRec('maintenance',id)}
function openTire(id=''){const x=vf(state.tires).find(v=>v.id===id)||{};modal(id?'Lastik Setini Düzenle':'Lastik Seti Ekle',`<form class="form" onsubmit="saveTire(event,'${id}')"><div class="formrow"><div class="field"><label>Sezon</label><select name="season">${['Yazlık','Kışlık','Dört Mevsim'].map(o=>`<option ${x.season===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Ölçü</label><input name="size" value="${esc(x.size||'')}" placeholder="205/55 R16"></div></div><div class="formrow"><div class="field"><label>Marka</label><input name="brand" value="${esc(x.brand||'')}"></div><div class="field"><label>Model</label><input name="model" value="${esc(x.model||'')}"></div></div><div class="formrow"><div class="field"><label>Takılma KM</label><input type="number" name="fittedKm" value="${x.fittedKm??activeVehicle().km}"></div><div class="field"><label>Diş Derinliği (mm)</label><input type="number" step="0.1" name="tread" value="${x.tread??''}"></div></div><div class="formrow"><div class="field"><label>Satın Alma Tarihi</label><input type="date" name="purchaseDate" value="${x.purchaseDate||''}"></div><div class="field"><label>Takılma Tarihi</label><input type="date" name="fittedDate" value="${x.fittedDate||today()}"></div></div><label class="toggle"><span>Şu anda araçta takılı</span><input type="checkbox" name="active" ${x.active?'checked':''}></label><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('tires','${id}')">Sil</button>`:''}</form>`)}
function saveTire(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,season:f.get('season'),size:f.get('size').trim(),brand:f.get('brand').trim(),model:f.get('model').trim(),fittedKm:+f.get('fittedKm'),tread:f.get('tread'),purchaseDate:f.get('purchaseDate'),fittedDate:f.get('fittedDate'),active:f.get('active')==='on',note:f.get('note').trim()};if(o.active)state.tires=state.tires.map(x=>x.vehicleId===o.vehicleId?{...x,active:false}:x);upsert('tires',o,id);closeModal();save()}
function upsert(k,o,id){state[k]=id?state[k].map(x=>x.id===id?o:x):[...state[k],o]}
function removeRec(k,id){if(confirm('Bu kayıt silinsin mi?')){state[k]=state[k].filter(x=>x.id!==id);closeModal();save()}}

function specLine(label,value,unit=''){return `<div class="specCell"><span>${label}</span><b>${value?esc(value)+unit:'—'}</b></div>`}
function specsModal(){const v=activeVehicle();if(!v)return;modal('Teknik Özellikler',`<div class="specTable">${specLine('Araç Türü',v.type)}${specLine('Kasa',v.body)}${specLine('Motor',v.engine)}${specLine('Motor Hacmi',v.engineCc,' cc')}${specLine('Güç',v.powerHp,' hp')}${specLine('Tork',v.torqueNm,' Nm')}${specLine('Şanzıman',v.transmission)}${specLine('Çekiş',v.drive)}${specLine('Yakıt',v.fuel)}${specLine('0-100',v.zeroTo100,' sn')}${specLine('Ağırlık',v.weightKg,' kg')}${specLine('Bagaj',v.trunkL,' L')}</div><button class="secondary wide" style="margin-top:12px" onclick="openVehicle('${v.id}')">Teknik Verileri Düzenle</button><div class="hint" style="margin-top:10px">Evrensel teknik veri tabanları tüm Türkiye/Avrupa varyantlarını eksiksiz kapsamadığı için V7 teknik bilgiyi araç profiline kaydeder; böylece karşılaştırma ve maliyet hesapları doğru araç verinle çalışır.</div>`)}
function compareVehicles(){const v=activeVehicle();if(!v)return;const others=state.vehicles.filter(x=>x.id!==v.id);if(!others.length){modal('Araç Karşılaştırma',`<div class="empty"><h3>İkinci araç gerekli</h3><p class="muted">Garaja karşılaştırmak istediğin aracı da ekle. Teknik özelliklerini girdikten sonra burada yan yana göreceksin.</p><button class="primary" onclick="openVehicle()">İkinci Araç Ekle</button></div>`);return}const b=others[0];modal('Araç Karşılaştırma',`<div class="field"><label>Karşılaştırılacak araç</label><select onchange="renderComparison(this.value)">${others.map(x=>`<option value="${x.id}">${esc(x.year+' '+x.make+' '+x.model)}</option>`).join('')}</select></div><div id="comparisonBox">${comparisonHtml(v,b)}</div>`)}
function renderComparison(id){const v=activeVehicle(),b=state.vehicles.find(x=>x.id===id),box=document.getElementById('comparisonBox');if(box&&b)box.innerHTML=comparisonHtml(v,b)}
function comparisonHtml(a,b){const r=(label,key,unit='')=>`<div class="specCell"><span>${label}</span><b>${a[key]?esc(a[key])+unit:'—'}</b></div><div class="specCell"><span>${label}</span><b>${b[key]?esc(b[key])+unit:'—'}</b></div>`;return `<div class="compareGrid" style="margin:12px 0 8px"><div class="compareHead">${esc(a.year+' '+a.make+' '+a.model)}</div><div class="compareHead">${esc(b.year+' '+b.make+' '+b.model)}</div></div><div class="specTable">${r('Güç','powerHp',' hp')}${r('Tork','torqueNm',' Nm')}${r('Motor','engine')}${r('Motor Hacmi','engineCc',' cc')}${r('Şanzıman','transmission')}${r('Çekiş','drive')}${r('0-100','zeroTo100',' sn')}${r('Ağırlık','weightKg',' kg')}${r('Bagaj','trunkL',' L')}${r('Yakıt','fuel')}</div>`}
function avgConsumption(){const a=vf(state.fuel).filter(x=>x.liters&&x.km).sort((a,b)=>a.km-b.km);if(a.length<2)return 0;const dist=a.at(-1).km-a[0].km,lit=a.slice(1).reduce((t,x)=>t+(+x.liters||0),0);return dist>0?lit/dist*100:0}
function lastFuelPrice(){const a=vf(state.fuel).filter(x=>x.liters&&x.cost).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return a[0]?a[0].cost/a[0].liters:(+state.prefs.fuelPrice||0)}
function fuelBudgetCalculator(){const c=avgConsumption()||7.5,p=lastFuelPrice()||state.prefs.fuelPrice||0;modal('Aylık Yakıt Tahmini',`<form class="form" oninput="calcFuelBudget(this)"><div class="formrow"><div class="field"><label>Aylık KM</label><input name="km" type="number" value="${Math.round((state.prefs.annualKm||12000)/12)}"></div><div class="field"><label>Tüketim (L/100 km)</label><input name="cons" type="number" step="0.1" value="${c.toFixed(1)}"></div></div><div class="field"><label>Yakıt / Enerji Birim Fiyatı</label><input name="price" type="number" step="0.01" value="${p?p.toFixed(2):''}"></div><div class="card" style="margin:0"><span class="muted small">Tahmini aylık maliyet</span><div id="fuelBudgetResult" class="calcResult">—</div></div></form>`);setTimeout(()=>calcFuelBudget(document.querySelector('.sheet form')),50)}
function calcFuelBudget(f){if(!f)return;const km=+f.km.value||0,c=+f.cons.value||0,p=+f.price.value||0,tot=km*c/100*p;document.getElementById('fuelBudgetResult').textContent=tot?money(tot):'—'}
function routeCalculator(){const c=avgConsumption()||7.5,p=lastFuelPrice()||state.prefs.fuelPrice||0;modal('Yol Maliyeti Hesapla',`<form class="form" oninput="calcRoute(this)"><div class="formrow"><div class="field"><label>Tek yön mesafe (km)</label><input name="km" type="number" value="100"></div><div class="field"><label>Gidiş-dönüş</label><select name="round"><option value="2">Evet</option><option value="1">Hayır</option></select></div></div><div class="formrow"><div class="field"><label>Tüketim (L/100 km)</label><input name="cons" type="number" step="0.1" value="${c.toFixed(1)}"></div><div class="field"><label>Birim fiyat</label><input name="price" type="number" step="0.01" value="${p?p.toFixed(2):''}"></div></div><div class="field"><label>Otoyol / Köprü / Ek Gider</label><input name="extra" type="number" step="0.01" value="0"></div><div class="card" style="margin:0"><span class="muted small">Tahmini toplam</span><div id="routeResult" class="calcResult">—</div><div id="routeDetail" class="muted small"></div></div></form>`);setTimeout(()=>calcRoute(document.querySelector('.sheet form')),50)}
function calcRoute(f){if(!f)return;const km=(+f.km.value||0)*(+f.round.value||1),cons=+f.cons.value||0,price=+f.price.value||0,extra=+f.extra.value||0,fuel=km*cons/100*price,total=fuel+extra;document.getElementById('routeResult').textContent=total?money(total):'—';document.getElementById('routeDetail').textContent=`${num(km)} km • Yakıt/enerji ${money(fuel)} • Ek gider ${money(extra)}`}
function valuationModal(){const a=vf(state.valuations).sort((a,b)=>String(b.date).localeCompare(String(a.date)));modal('Araç Değer Takibi',`<form class="form" onsubmit="saveValuation(event)"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Değer (TL)</label><input type="number" step="0.01" name="value" required></div></div><div class="field"><label>Not / Kaynak</label><input name="note" placeholder="İlan ortalaması, ekspertiz..."></div><button class="primary wide">Değer Kaydı Ekle</button></form><div class="list" style="margin-top:12px">${a.length?a.map(x=>`<div class="row"><div class="rowIcon">${ico('value')}</div><div class="rowMain"><strong>${fmtDate(x.date)}</strong><span>${esc(x.note||'')}</span></div><div class="rowValue">${money(x.value)}</div></div>`).join(''):'<div class="muted">Henüz değer kaydı yok.</div>'}</div>`)}
function saveValuation(e){e.preventDefault();const f=new FormData(e.target),o={id:uid(),vehicleId:activeVehicle().id,date:f.get('date'),value:+f.get('value'),note:f.get('note').trim()};state.valuations.push(o);activeVehicle().currentValue=o.value;closeModal();save();valuationModal()}
function batteriesInlineView(){const a=vf(state.batteries).sort((a,b)=>String(b.installDate).localeCompare(String(a.installDate)));return `<div class="sectionHead"><h2>Akü Geçmişi</h2><button class="linkbtn" onclick="batteryModal()">+ Akü</button></div>${listOrEmpty(a,x=>`<div class="row"><div class="rowIcon">${ico('battery')}</div><div class="rowMain"><strong>${esc(x.brand||'Akü')} ${esc(x.model||'')}</strong><span>${fmtDate(x.installDate)} • ${num(x.installKm||0)} km • ${x.warrantyMonths||0} ay garanti</span></div></div>`)}`}
function batteryModal(){const a=vf(state.batteries).sort((a,b)=>String(b.installDate).localeCompare(String(a.installDate)));modal('Akü Takibi',`<form class="form" onsubmit="saveBattery(event)"><div class="formrow"><div class="field"><label>Marka</label><input name="brand" required></div><div class="field"><label>Model / Ah</label><input name="model"></div></div><div class="formrow"><div class="field"><label>Takılma Tarihi</label><input type="date" name="installDate" value="${today()}" required></div><div class="field"><label>Takılma KM</label><input type="number" name="installKm" value="${activeVehicle()?.km||0}"></div></div><div class="formrow"><div class="field"><label>Garanti (ay)</label><input type="number" name="warrantyMonths" value="24"></div><div class="field"><label>Fiyat</label><input type="number" step="0.01" name="cost"></div></div><button class="primary wide">Akü Kaydı Ekle</button></form><div class="list" style="margin-top:12px">${a.map(x=>`<div class="row"><div class="rowIcon">${ico('battery')}</div><div class="rowMain"><strong>${esc(x.brand)} ${esc(x.model||'')}</strong><span>${fmtDate(x.installDate)} • ${num(x.installKm)} km</span></div><div class="rowValue">${money(x.cost||0)}</div></div>`).join('')}</div>`)}
function saveBattery(e){e.preventDefault();const f=new FormData(e.target);state.batteries.push({id:uid(),vehicleId:activeVehicle().id,brand:f.get('brand').trim(),model:f.get('model').trim(),installDate:f.get('installDate'),installKm:+f.get('installKm'),warrantyMonths:+f.get('warrantyMonths'),cost:+f.get('cost')||0});closeModal();save();batteryModal()}
function accidentModal(){const a=vf(state.accidents).sort((a,b)=>String(b.date).localeCompare(String(a.date)));modal('Kaza / Hasar Kaydı',`<form class="form" onsubmit="saveAccident(event)"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>KM</label><input type="number" name="km" value="${activeVehicle()?.km||0}"></div></div><div class="field"><label>Başlık</label><input name="title" placeholder="Arka tampon hasarı" required></div><div class="formrow"><div class="field"><label>Hasar / Onarım Tutarı</label><input type="number" step="0.01" name="cost"></div><div class="field"><label>Durum</label><select name="status"><option>Onarıldı</option><option>Bekliyor</option><option>Sigortada</option></select></div></div><div class="field"><label>Açıklama</label><textarea name="note"></textarea></div><button class="primary wide">Hasar Kaydı Ekle</button></form><div class="list" style="margin-top:12px">${a.length?a.map(x=>`<div class="row"><div class="rowIcon">${ico('crash')}</div><div class="rowMain"><strong>${esc(x.title)}</strong><span>${fmtDate(x.date)} • ${num(x.km)} km • ${esc(x.status)}</span></div><div class="rowValue">${money(x.cost||0)}</div></div>`).join(''):'<div class="muted">Kaza/hasar kaydı yok.</div>'}</div>`)}
function saveAccident(e){e.preventDefault();const f=new FormData(e.target);state.accidents.push({id:uid(),vehicleId:activeVehicle().id,date:f.get('date'),km:+f.get('km'),title:f.get('title').trim(),cost:+f.get('cost')||0,status:f.get('status'),note:f.get('note').trim()});closeModal();save();accidentModal()}

function pickDocument(){if(!activeVehicle())return;try{Android.pickDocument('newdoc:'+activeVehicle().id)}catch(e){alert('Belge seçici açılamadı')}}
window.onNativeDocumentPicked=(ctx,uri,name,mime,size)=>{if(!ctx.startsWith('newdoc:'))return;const vehicleId=ctx.split(':')[1],o={id:uid(),vehicleId,uri,name,mime,size,category:'Diğer',date:today(),expiry:'',note:''};state.documents.push(o);save();editDocument(o.id)};
function editDocument(id){const x=vf(state.documents).find(v=>v.id===id);if(!x)return;modal('Belge Bilgileri',`<form class="form" onsubmit="saveDocument(event,'${id}')"><div class="field"><label>Belge</label><input disabled value="${esc(x.name)}"></div><div class="formrow"><div class="field"><label>Kategori</label><select name="category">${['Ruhsat','Trafik Sigortası','Kasko','Muayene','Servis Faturası','Ekspertiz','Vergi/MTV','Diğer'].map(o=>`<option ${x.category===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}"></div></div><div class="field"><label>Geçerlilik / Bitiş Tarihi</label><input type="date" name="expiry" value="${x.expiry||''}"></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button><button type="button" class="secondary wide" onclick="openDoc('${id}')">Belgeyi Aç</button><button type="button" class="danger wide" onclick="removeRec('documents','${id}')">Sil</button></form>`)}
function saveDocument(e,id){e.preventDefault();const f=new FormData(e.target),x=state.documents.find(v=>v.id===id);Object.assign(x,{category:f.get('category'),date:f.get('date'),expiry:f.get('expiry'),note:f.get('note').trim()});closeModal();save()}
function openDoc(id){const x=state.documents.find(v=>v.id===id);try{Android.openUri(x.uri,x.mime)}catch(e){alert('Belge açılamadı')}}
function documentsViewModal(){const a=vf(state.documents);modal('Belge Kasası',`<div class="form"><button class="primary wide" onclick="pickDocument()">+ Yeni Belge Seç</button>${a.length?a.map(x=>`<div class="row"><div class="rowIcon">📄</div><div class="rowMain"><strong>${esc(x.category)}</strong><span>${esc(x.name)}${x.expiry?' • Bitiş '+fmtDate(x.expiry):''}</span></div><div class="docButtons"><button onclick="openDoc('${x.id}')">Aç</button><button onclick="editDocument('${x.id}')">✎</button></div></div>`).join(''):'<div class="empty">Belge yok</div>'}</div>`)}
function emergencyModal(){const x=state.emergency;modal('Acil Durum & Yardım',`<form class="form" onsubmit="saveEmergency(event)"><div class="notice">Kaza veya arıza anında kayıtlı numaralara hızlıca ulaşabilirsin. Aramalar önce telefonun arama ekranını açar.</div><div class="field"><label>Sigorta Şirketi</label><input name="insurer" value="${esc(x.insurer)}"></div><div class="formrow"><div class="field"><label>Sigorta Telefonu</label><input name="insurancePhone" value="${esc(x.insurancePhone)}"></div><div class="field"><label>Yol Yardım / Çekici</label><input name="roadsidePhone" value="${esc(x.roadsidePhone)}"></div></div><div class="field"><label>Yakın / Acil İrtibat</label><input name="personalPhone" value="${esc(x.personalPhone)}"></div><div class="field"><label>Poliçe No</label><input name="policyNo" value="${esc(x.policyNo)}"></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note)}</textarea></div><button class="primary wide">Kaydet</button></form><div class="grid2" style="margin-top:12px"><button class="danger" onclick="dial('112')">📞 112</button>${x.insurancePhone?`<button class="secondary" onclick="dial('${esc(x.insurancePhone)}')">📞 Sigorta</button>`:''}${x.roadsidePhone?`<button class="secondary" onclick="dial('${esc(x.roadsidePhone)}')">🚚 Yol Yardım</button>`:''}${x.personalPhone?`<button class="secondary" onclick="dial('${esc(x.personalPhone)}')">👤 Yakınım</button>`:''}</div>`)}
function saveEmergency(e){e.preventDefault();state.emergency=Object.fromEntries([...new FormData(e.target).entries()]);closeModal();save()}function dial(n){try{Android.dial(n)}catch(e){location.href='tel:'+n}}
function monthlyData(n){const out=[];const now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),ym=d.toISOString().slice(0,7);const m=d.toLocaleDateString('tr-TR',{month:'short'});let total=0;for(const a of [vf(state.fuel),vf(state.expenses),vf(state.maintenance).filter(x=>x.dateDone),vf(state.services)])for(const x of a){const dt=x.date||x.dateDone;if(dt?.startsWith(ym))total+=Number(x.cost??x.total??0)||0}out.push({label:m,total})}return out}
function reportText(){const v=activeVehicle();if(!v)return'';let s=`ARACIM PRO - ARAÇ GEÇMİŞ RAPORU\n\nAraç: ${v.year} ${v.make} ${v.model}\nPlaka: ${v.plate}\nKilometre: ${num(v.km)} km\nMotor/Yakıt: ${v.engine} / ${v.fuel}\n\nMALİ ÖZET\nToplam gider: ${money(totalAll())}\nYakıt: ${money(totals().fuel)}\nBakım: ${money(totals().maint)}\nServis: ${money(totals().service)}\nDiğer: ${money(totals().exp)}\n\nSERVİS GEÇMİŞİ\n`;vf(state.services).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>s+=`${fmtDate(x.date)} | ${num(x.km)} km | ${x.work} | ${x.shop} | ${money(x.total)}\n`);s+='\nBAKIM / RESMİ İŞLEMLER\n';vf(state.maintenance).forEach(x=>s+=`${x.name} | ${x.completed?'Tamamlandı':'Planlı'} | ${x.dateDone||x.dueDate||''} | ${x.dueKm?num(x.dueKm)+' km':''} | ${money(x.cost)}\n`);s+='\nYAKIT KAYITLARI\n';vf(state.fuel).forEach(x=>s+=`${fmtDate(x.date)} | ${num(x.km)} km | ${x.liters} L | ${money(x.cost)} | ${x.station}\n`);s+='\nLASTİKLER\n';vf(state.tires).forEach(x=>s+=`${x.season} | ${x.brand} ${x.model} | ${x.size} | ${x.active?'Takılı':'Depoda'}\n`);s+='\nTEKNİK ÖZELLİKLER\n';s+=`Paket: ${v.trim||''} | Kasa: ${v.body||''} | Güç: ${v.powerHp||''} hp | Tork: ${v.torqueNm||''} Nm | Şanzıman: ${v.transmission||''} | Çekiş: ${v.drive||''}\n`;s+='\nDEĞER GEÇMİŞİ\n';vf(state.valuations).forEach(x=>s+=`${x.date} | ${money(x.value)} | ${x.note||''}\n`);s+='\nAKÜ\n';vf(state.batteries).forEach(x=>s+=`${x.installDate} | ${x.brand} ${x.model||''} | ${num(x.installKm)} km | ${money(x.cost||0)}\n`);s+='\nKAZA / HASAR\n';vf(state.accidents).forEach(x=>s+=`${x.date} | ${x.title} | ${x.status} | ${money(x.cost||0)}\n`);return s}
function exportPdf(){try{Android.savePdf('AracimPro_Arac_Gecmisi.pdf','Aracım Pro Araç Geçmişi',reportText())}catch(e){alert('PDF kaydetme kullanılamıyor')}}
function exportCsv(){let r=[['Tür','Tarih','KM','Açıklama','Tutar']];vf(state.fuel).forEach(x=>r.push(['Yakıt',x.date,x.km,x.station,x.cost]));vf(state.expenses).forEach(x=>r.push(['Gider',x.date,'',x.category,x.cost]));vf(state.services).forEach(x=>r.push(['Servis',x.date,x.km,x.work,x.total]));vf(state.maintenance).forEach(x=>r.push(['Bakım',x.dateDone||x.dueDate,x.dueKm||'',x.name,x.cost]));vf(state.batteries).forEach(x=>r.push(['Akü',x.installDate,x.installKm,x.brand+' '+(x.model||''),x.cost]));vf(state.accidents).forEach(x=>r.push(['Hasar',x.date,x.km,x.title,x.cost]));vf(state.valuations).forEach(x=>r.push(['Araç Değeri',x.date,'',x.note,x.value]));const csv='\uFEFF'+r.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');saveFile('AracimPro_Rapor.csv','text/csv',csv)}
function exportXls(){const rows=[];vf(state.fuel).forEach(x=>rows.push(['Yakıt',x.date,x.km,x.station,x.cost]));vf(state.expenses).forEach(x=>rows.push(['Gider',x.date,'',x.category,x.cost]));vf(state.services).forEach(x=>rows.push(['Servis',x.date,x.km,x.work,x.total]));const html=`<html><meta charset="utf-8"><table border="1"><tr><th>Tür</th><th>Tarih</th><th>KM</th><th>Açıklama</th><th>Tutar</th></tr>${rows.map(r=>'<tr>'+r.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join('')}</table></html>`;saveFile('AracimPro_Rapor.xls','application/vnd.ms-excel',html)}
function saveFile(n,m,c){try{Android.saveFile(n,m,c)}catch(e){const b=new Blob([c],{type:m}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}}
function shareSummary(){try{Android.shareText('Aracım Pro Raporu',reportText().slice(0,4000))}catch(e){}}
function backup(){saveFile('AracimPro_Yedek.json','application/json',JSON.stringify(state,null,2))}function backupCloud(){modal('Buluta Yedekle',`<div class="form"><div class="notice">Kaydet ekranında Google Drive, OneDrive veya başka bir bulut sağlayıcısını seçebilirsin. Böylece hesap şifresi uygulamaya verilmez.</div><button class="primary wide" onclick="backup();closeModal()">Yedek Dosyasını Kaydet</button></div>`)}
function restore(){try{Android.openBackupFile()}catch(e){}}window.restoreBackupFromNative=c=>{try{const s=JSON.parse(c);state={...initial,...s,emergency:{...initial.emergency,...(s.emergency||{})},prefs:{...initial.prefs,...(s.prefs||{})}};closeModal();save();toast('Yedek geri yüklendi')}catch(e){alert('Geçersiz yedek')}};
function openSettings(){modal('Ayarlar',`<div class="form"><div class="card" style="margin:0"><b>Aracım Pro ${V} • V7</b><p class="muted small">Gerçek araç fotoğrafı + bakım + maliyet + değer + teknik veri merkezi.</p></div><label class="toggle"><span>🌙 Karanlık Tema</span><input type="checkbox" ${state.prefs.dark?'checked':''} onchange="state.prefs.dark=this.checked;save();openSettings()"></label><label class="toggle"><span>🔐 PIN Kilidi</span><input type="checkbox" ${state.prefs.lockEnabled?'checked':''} onchange="togglePin(this.checked)"></label><label class="toggle"><span>👆 Biyometrik Açılış</span><input type="checkbox" ${state.prefs.biometric?'checked':''} onchange="state.prefs.biometric=this.checked;save()"></label><div class="formrow"><div class="field"><label>Varsayılan Yakıt/Enerji Birim Fiyatı</label><input type="number" step="0.01" value="${state.prefs.fuelPrice||''}" onchange="state.prefs.fuelPrice=+this.value;save()"></div><div class="field"><label>Yıllık Tahmini KM</label><input type="number" value="${state.prefs.annualKm||12000}" onchange="state.prefs.annualKm=+this.value;save()"></div></div><button class="secondary wide" onclick="backup()">Yedek Al</button><button class="secondary wide" onclick="backupCloud()">Google Drive / Buluta Yedekle</button><button class="secondary wide" onclick="restore()">Yedekten Geri Yükle</button><button class="secondary wide" onclick="try{Android.requestNotificationPermission();toast('Bildirim izni kontrol edildi')}catch(e){}">Bildirim İznini Kontrol Et</button><button class="danger wide" onclick="resetApp()">Tüm Verileri Sil</button><div class="hint">Belge kasasındaki dosya bağlantıları telefondaki dosyalara işaret eder. Telefon değişiminde belgeleri ayrıca taşıman gerekebilir.</div></div>`)}
function pinHash(p){let h=2166136261;for(const c of p){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function togglePin(on){if(on){modal('PIN Belirle',`<form class="form" onsubmit="savePin(event)"><div class="field"><label>4-8 haneli PIN</label><input autofocus class="pin" inputmode="numeric" pattern="[0-9]{4,8}" name="pin" required></div><button class="primary wide">PIN'i Kaydet</button></form>`)}else{state.prefs.lockEnabled=false;state.prefs.pinHash='';save();openSettings()}}
function savePin(e){e.preventDefault();const p=new FormData(e.target).get('pin');state.prefs.pinHash=pinHash(p);state.prefs.lockEnabled=true;closeModal();save();toast('PIN kilidi açıldı')}
function showLock(){if(!state.prefs.lockEnabled)return;document.getElementById('lockRoot').innerHTML=`<div class="lock"><div class="lockBox"><div class="lockLogo">🚘</div><h2>Aracım Pro Kilitli</h2><p class="muted">Devam etmek için PIN veya biyometrik doğrulama kullan.</p><form class="form" onsubmit="unlockPin(event)"><div class="field"><input autofocus class="pin" inputmode="numeric" name="pin" placeholder="••••" required></div><button class="primary wide">PIN ile Aç</button></form>${state.prefs.biometric?`<button class="secondary wide" style="margin-top:10px" onclick="biometric()">👆 Parmak İzi / Biyometri</button>`:''}</div></div>`;if(state.prefs.biometric)setTimeout(biometric,250)}function unlockPin(e){e.preventDefault();if(pinHash(new FormData(e.target).get('pin'))===state.prefs.pinHash)document.getElementById('lockRoot').innerHTML='';else toast('PIN yanlış')}
function biometric(){try{Android.authenticateBiometric()}catch(e){toast('Biyometri kullanılamıyor')}}window.onBiometricResult=(ok,msg)=>{if(ok)document.getElementById('lockRoot').innerHTML='';else if(msg&&msg!=='PIN')toast(msg)};window.appShouldLock=()=>showLock();
function updateWidget(){const v=activeVehicle(),u=upcoming()[0];if(!v)return;try{Android.updateWidget(`${v.year||''} ${v.make} ${v.model}`.trim(),`${num(v.km)} km • ${v.plate||'Plakasız'}`,u?`${u.name}${u.dueKm?' • '+num(Math.max(0,u.km))+' km':''}${u.dueDate?' • '+Math.max(0,u.days)+' gün':''}`:'Yaklaşan işlem yok')}catch(e){}}
function toast(t){try{Android.toast(t)}catch(e){console.log(t)}}function resetApp(){if(confirm('Tüm kayıtlar kalıcı olarak silinsin mi?')){state=structuredClone(initial);localStorage.removeItem(KEY);closeModal();save()}}
window.appBack=()=>{if(document.getElementById('lockRoot').innerHTML)return;if(document.getElementById('modalRoot').innerHTML){closeModal();return}if(current!=='home'){go('home');return}try{Android.toast('Çıkmak için ana ekran tuşunu kullan')}catch(e){}}
document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},350)});
applyTheme();render();setTimeout(()=>{runKmAlerts();updateWidget();if(state.prefs.lockEnabled)showLock()},250);
</script>
</body>
</html>
