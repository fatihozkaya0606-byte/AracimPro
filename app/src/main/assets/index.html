.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,25,45,.44);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-height:calc(100vh - 12px);overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:12px 18px 28px;box-shadow:0 -12px 45px rgba(0,0,0,.16)}.grab{width:44px;height:5px;border-radius:99px;background:#dce4ed;margin:0 auto 14px}.sheetHead{display:flex;align-items:center;gap:10px;margin-bottom:15px}.sheetHead h2{margin:0;font-size:22px}.close{margin-left:auto;border:0;width:42px;height:42px;border-radius:14px;background:var(--bg);color:var(--ink);font-size:24px}.form{display:flex;flex-direction:column;gap:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#53677f}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:15px;padding:13px 14px;outline:none}.field textarea{min-height:92px;resize:vertical}.wide{width:100%}.primary,.secondary,.danger{border:0;border-radius:15px;padding:14px 16px;font-weight:800}.primary{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff}.secondary{background:#eaf3ff;color:#106bcf}.danger{background:#ffe9ea;color:#c3333d}.photoEdit{display:flex;gap:12px;align-items:center}.photoPreview{width:108px;height:75px;border-radius:17px;object-fit:cover;background:#e8f2ff;display:grid;place-items:center;font-size:30px}.hint{font-size:11px;color:var(--muted);line-height:1.45}.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.toggle input{width:22px;height:22px}.progress{height:8px;background:#e7edf4;border-radius:99px;overflow:hidden}.progress b{display:block;height:100%;background:linear-gradient(90deg,#11ae75,#7cd9ad);border-radius:99px}.bars{height:180px;display:flex;align-items:flex-end;gap:7px;padding:10px 0}.bar{flex:1;text-align:center;min-width:0}.bar b{display:block;background:linear-gradient(#53a9ff,#1675ed);border-radius:8px 8px 3px 3px;min-height:4px}.bar span{display:block;font-size:10px;color:var(--muted);margin-top:5px}.bar em{display:block;font-style:normal;font-size:9px;font-weight:800;margin-bottom:4px}.lock{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}.lockBox{width:100%;max-width:380px;text-align:center}.lockLogo{width:78px;height:78px;margin:0 auto 16px;border-radius:24px;background:linear-gradient(145deg,var(--blue2),var(--blue));display:grid;place-items:center;color:#fff;font-size:38px}.pin{font-size:24px;letter-spacing:8px;text-align:center}.badge{font-size:10px;padding:3px 6px;border-radius:7px;background:#e9f3ff;color:#0c6dcc;font-weight:900}.docButtons{display:flex;gap:7px}.docButtons button{padding:8px 9px;border-radius:10px;border:0}.notice{padding:12px;border-radius:15px;background:#fff6df;color:#765111;font-size:12px;line-height:1.5}.dark .notice{background:#3a2c13;color:#ffd47c}@media(max-width:370px){.formrow,.grid2{grid-template-columns:1fr}.nav button{font-size:9px}.heroTop{flex-direction:column}.vehiclePhoto{width:100%;height:130px}}

/* V7 professional design additions */
.svgi{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.logo .svgi{width:27px;height:27px}.iconbtn .svgi{margin:auto}.metric .ico{color:var(--blue)}.metric .ico .svgi{width:21px;height:21px;margin:auto}.quick{display:flex;flex-direction:column;gap:7px;min-height:94px}.quick .qico{width:38px;height:38px;border-radius:13px;background:#edf5ff;color:var(--blue);display:grid;place-items:center}.quick .qico .svgi{width:21px;height:21px}.nav button i{height:29px;display:grid;place-items:center}.nav button i .svgi{width:21px;height:21px}.rowIcon{color:var(--blue)}.rowIcon .svgi{width:21px;height:21px}.vehiclePhoto,.photoPreview{border:1px solid var(--line);background:#e8f2ff}.vehiclePhoto{width:132px;height:88px}.heroSpecs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.specPill{font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 8px;color:var(--muted);font-weight:700}.imageSearchBox{border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--bg)}.imageResults{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.imageChoice{border:1px solid var(--line);background:var(--card);padding:5px;border-radius:14px;overflow:hidden;text-align:left;color:var(--ink)}.imageChoice img{width:100%;height:92px;object-fit:cover;border-radius:10px;background:#dde8f5}.imageChoice small{display:block;font-size:9px;color:var(--muted);padding:4px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sourceLine{font-size:10px;color:var(--muted);margin-top:6px}.sourceLine button{border:0;background:none;color:var(--blue);padding:0;font-size:10px}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpiHero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.kpiBox{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:12px}.kpiBox b{display:block;font-size:18px;margin-top:4px}.specTable{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}.specCell{background:var(--card);padding:12px}.specCell span{font-size:11px;color:var(--muted);display:block}.specCell b{font-size:14px;display:block;margin-top:3px}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compareHead{font-weight:900;padding:10px;background:#eaf4ff;border-radius:14px}.dark .compareHead{background:#17304b}.calcResult{font-size:28px;font-weight:900;color:var(--blue);margin:4px 0 12px}.emptyVehicle{width:100%;height:100%;display:grid;place-items:center;color:var(--blue)}.photoBadge{position:absolute;right:12px;top:12px;background:rgba(15,33,60,.82);color:#fff;border-radius:999px;padding:5px 8px;font-size:10px}.hero{position:relative}.badgePro{background:#101d31;color:#fff;padding:3px 7px;border-radius:999px;font-size:10px}.dark .imageSearchBox{background:#101a28}.dark .quick .qico,.dark .metric .ico{background:#19324e}.fullWidth{grid-column:1/-1}.notice.success{background:#e4f8ef;border-color:#bfe9d7;color:#08764f}.dangerText{color:var(--red)}


/* V8 selectable catalog */
.catalogStep{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:12px}.catalogStepTitle{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:8px}.catalogStatus{font-size:11px;color:var(--muted);margin-top:6px;min-height:16px}.catalogStatus.ok{color:var(--green)}.catalogStatus.warn{color:var(--orange)}.selectNote{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.45}.selectNote svg{flex:0 0 auto;margin-top:1px}.premiumCard{background:linear-gradient(135deg,#101d31,#244c7d);color:#fff;border:0}.premiumCard .muted{color:#c6d7ec}.lockedPro{position:relative}.lockedPro:after{content:'PRO';position:absolute;right:8px;top:8px;background:#101d31;color:#fff;font-size:9px;font-weight:900;padding:3px 6px;border-radius:999px}
.guideGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.guideCard{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px}.guideCard h3{font-size:15px;margin:0 0 7px}.guideCard p{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.45}.kv{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}.kv:last-child{border-bottom:0}.kv b{text-align:right}.statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--green)}.statusDot.warn{background:var(--orange)}.statusDot.red{background:var(--red)}.fuelBanner{margin-top:12px;background:linear-gradient(135deg,#0f67cf,#2b93ff);color:#fff;border:0}.fuelBanner .muted{color:#dcecff}.fuelPrices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.fuelPrice{background:rgba(255,255,255,.13);padding:10px;border-radius:14px}.fuelPrice span{display:block;font-size:10px;opacity:.8}.fuelPrice b{font-size:15px}.newsRow{padding:10px 0;border-bottom:1px solid var(--line)}.newsRow:last-child{border:0}.newsRow b{display:block;font-size:13px;line-height:1.35}.riskBox{border-left:4px solid var(--orange);padding:10px 12px;background:var(--bg);border-radius:12px;margin:8px 0}.riskBox.good{border-color:var(--green)}.riskBox.high{border-color:var(--red)}.sourceBadge{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:4px 7px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}.marketRange{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.marketRange .kpiBox{text-align:center;padding:10px}.checklist{display:flex;flex-direction:column;gap:8px}.checkitem{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:13px;background:var(--bg)}.checkitem input{margin-top:3px}.dark .fuelBanner{background:linear-gradient(135deg,#124e8c,#1d6fb5)}@media(max-width:370px){.guideGrid,.marketRange,.fuelPrices{grid-template-columns:1fr}}


/* V12 deep specs + live drive */
.driveBanner{background:linear-gradient(135deg,#0c213d,#174f88);color:#fff;border:0}.driveBanner .muted{color:#cce2f8}.speedDial{width:190px;height:190px;border-radius:50%;margin:12px auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#152b45 0 48%,#091522 49% 100%);border:8px solid #243f5f;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.18);color:#fff;text-align:center}.speedDial b{display:block;font-size:54px;line-height:1}.speedDial span{font-size:14px;color:#a8c7e8}.nearbyGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nearbyGrid button{min-height:70px;text-align:left}.specSource{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}.specWide{grid-column:1/-1}.liveDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#18c77b;box-shadow:0 0 0 5px rgba(24,199,123,.12);margin-right:7px}.dark .driveBanner{background:linear-gradient(135deg,#0a1a2b,#103a64)}

/* ARACIM PRO 6.0 COMPACT DISCOVERY HUB */
.moreHub{padding-bottom:10px}
.moreIntro{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.moreIntro .eyebrow{display:block;font-size:10px;letter-spacing:.12em;font-weight:900;color:var(--blue);margin-bottom:3px}
.moreIntro h2{font-size:19px;line-height:1.15;margin:0;color:var(--ink)}
.moreIntro p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.placeSearch{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:11px 12px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 8px 24px rgba(31,92,154,.07);margin-bottom:9px}
.placeSearch .searchIcon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#51677f;background:var(--bg);flex:0 0 auto}
.placeSearch .searchIcon .svgi{width:20px;height:20px}
.placeSearch .searchCopy{flex:1;min-width:0}
.placeSearch .searchCopy b{display:block;font-size:13px}
.placeSearch .searchCopy span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.placeSearch .searchLoc{display:flex;align-items:center;gap:4px;color:var(--blue);font-size:10px;font-weight:900;white-space:nowrap}
.placeSearch .searchLoc .svgi{width:15px;height:15px}
.moreQuickBar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 10px}
.moreQuickBar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:15px;padding:8px 4px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px;font-weight:800;box-shadow:0 5px 16px rgba(31,92,154,.05)}
.moreQuickBar i{width:29px;height:29px;border-radius:10px;background:#edf5ff;color:var(--blue);display:grid;place-items:center;font-style:normal}
.moreQuickBar i .svgi{width:17px;height:17px}
.moreGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.moreTile{--accent:#1675ed;--soft:#edf5ff;position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:9px 9px 10px;min-height:103px;text-align:left;box-shadow:0 7px 20px rgba(31,92,154,.055);overflow:hidden}
.moreTile:active{transform:scale(.985)}
.moreTile .qico{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.moreTile .qico .svgi{width:20px;height:20px;stroke-width:1.8}
.moreTile b{display:block;font-size:11.5px;line-height:1.12;letter-spacing:-.01em;padding-right:7px}
.moreTile .desc{display:block;font-size:9.5px;line-height:1.2;color:var(--muted);margin-top:4px}
.moreTile .arrow{position:absolute;right:7px;top:10px;color:#9badc0;font-size:15px;font-weight:700}
.moreTools{margin-top:10px;border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden}
.moreTools summary{list-style:none;padding:12px 13px;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.moreTools summary::-webkit-details-marker{display:none}
.moreTools summary:after{content:"＋";color:var(--blue);font-size:17px}
.moreTools[open] summary:after{content:"−"}
.moreToolsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:0 9px 10px}
.moreMini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:9px 5px;font-size:9.5px;font-weight:800;min-height:48px}
.moreSearchChips{display:flex;gap:7px;flex-wrap:wrap}
.moreSearchChips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 10px;font-size:11px;font-weight:800}
.dark .placeSearch,.dark .moreQuickBar button,.dark .moreTile,.dark .moreTools{box-shadow:none}
.dark .moreTile .qico{filter:saturate(.9) brightness(.85)}
@media(max-width:345px){.moreGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.moreQuickBar{grid-template-columns:repeat(4,minmax(0,1fr))}.moreTile{min-height:96px}}


/* ARACIM PRO 6.1 PROFESSIONAL DRIVER ASSISTANT */
.moreFilters{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 9px;margin:0 -1px 2px;scrollbar-width:none}
.moreFilters::-webkit-scrollbar{display:none}
.moreFilter{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;white-space:nowrap;box-shadow:0 4px 13px rgba(31,92,154,.04)}
.moreFilter.active{background:linear-gradient(135deg,var(--blue),#2d8fff);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(22,117,237,.23)}

function getLocalProfile(){try{return JSON.parse(localStorage.getItem(LOCAL_PROFILE_KEY)||'null')}catch(e){return null}}
function saveLocalProfile(o){localStorage.setItem(LOCAL_PROFILE_KEY,JSON.stringify(o||{}))}
function getLocalComments(){try{const a=JSON.parse(localStorage.getItem(LOCAL_COMMENTS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}

function localProfileCreate(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim();if(name.length<2)return toast('Görünen ad en az 2 karakter olmalı');saveLocalProfile({uid:'local_'+Date.now(),name,email,createdAt:Date.now()});syncCommunityStatus();closeModal();render();toast('Cihaz profili oluşturuldu')}

function loadState(){let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};if(!s)return structuredClone(initial);if(s.vehicle&&!s.vehicles){const id='v_'+uid();return {...initial,vehicles:[{id,...s.vehicle,photo:''}],activeVehicleId:id,fuel:(s.fuel||[]).map(x=>({...x,vehicleId:id})),maintenance:(s.maintenance||[]).map(x=>({...x,vehicleId:id})),prefs:{...initial.prefs,...(s.prefs||{}),firstRun:false}}}return {...initial,...s,valuations:s.valuations||[],batteries:s.batteries||[],accidents:s.accidents||[],marketChecks:s.marketChecks||[],fuelMarket:{...initial.fuelMarket,...(s.fuelMarket||{})},emergency:{...initial.emergency,...(s.emergency||{})},prefs:{...initial.prefs,...(s.prefs||{})}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));applyTheme();render();updateWidget()}
function activeVehicle(){return state.vehicles.find(v=>v.id===state.activeVehicleId)||state.vehicles[0]||null}
function setActive(id){state.activeVehicleId=id;save()}
function vf(arr){const v=activeVehicle();return v?arr.filter(x=>x.vehicleId===v.id):[]}
function sum(a,key='cost'){return a.reduce((t,x)=>t+(Number(x[key])||0),0)}
function totals(){return{fuel:sum(vf(state.fuel)),maint:sum(vf(state.maintenance)),exp:sum(vf(state.expenses)),service:sum(vf(state.services),'total')}}
function totalAll(){const t=totals();return t.fuel+t.maint+t.exp+t.service}
function upcoming(){const v=activeVehicle();if(!v)return[];return vf(state.maintenance).filter(x=>!x.completed).map(x=>{let days=99999;if(x.dueDate)days=Math.ceil((new Date(x.dueDate+'T12:00:00')-new Date())/86400000);let km=x.dueKm?x.dueKm-(v.km||0):999999;return{...x,days,km,score:Math.min(days,km/50)}}).sort((a,b)=>a.score-b.score)}

 if(saved&&AP_COUNTRIES[saved])return saved;
 const tag=(navigator.language||'tr-TR').replace('_','-');
 const m=tag.match(/-([A-Za-z]{2})$/);

 if(direct&&AP_COUNTRIES[direct])return direct;

/* ARACIM PRO V7.3.6 TRUE FULL LANGUAGE ENGINE */
const AP_ML_TARGET={
  en:'en',de:'de',fr:'fr',es:'es',it:'it',pt:'pt',nl:'nl',ar:'ar',
  ru:'ru',uk:'uk',fa:'fa',pl:'pl',ro:'ro',bg:'bg',el:'el',cs:'cs',
  hu:'hu',hr:'hr',sq:'sq',ka:'ka',ja:'ja',ko:'ko',zh:'zh',hi:'hi',
  id:'id',ms:'ms'
};
const AP_NOT_FULL_YET=new Set(['az','sr','bs']);
const apNativePending={};
const apNativeCaches={};
const apNodeState=new WeakMap();
const apTranslatedAttrs=new WeakMap();
let apNativeBusy=false,apNativeTimer=0,apNativeSeq=0,apNativeToastLang='';

function apNativeCache(lang){
  if(apNativeCaches[lang])return apNativeCaches[lang];
  try{apNativeCaches[lang]=JSON.parse(localStorage.getItem('aracimpro_full_i18n_v6_'+lang)||'{}')||{}}
  catch(e){apNativeCaches[lang]={}}
  return apNativeCaches[lang];
}
function apSaveNativeCache(lang){
  try{localStorage.setItem('aracimpro_full_i18n_v6_'+lang,JSON.stringify(apNativeCaches[lang]||{}))}catch(e){}
}
function apShouldTranslateUI(t){
  t=String(t||'').trim();
  if(!t||t.length>500)return false;
  if(/^https?:\/\//i.test(t))return false;
  if(/^V\d+(?:\.\d+)*$/i.test(t))return false;
  if(t==='Aracım Pro'||t==='AracımPro')return false;
  if(/^(GPS|HGS|KGM|PTT|TÜVTÜRK|GLOBAL)$/i.test(t))return false;
  if(/^[\d\s.,:%+°•\-–—()\/₺$€£¥₽₹₼]+$/.test(t))return false;
  return /[A-Za-zÀ-ž\u0100-\u024F\u0370-\u03FF\u0400-\u04FF\u0600-\u06FF\u0900-\u097F\u10A0-\u10FF\u3040-\u30FF\u3400-\u9FFF\uAC00-\uD7AF]/.test(t);
}
function apAttrDone(el,attr){
  const set=apTranslatedAttrs.get(el);return !!(set&&set.has(attr));
}
function apMarkAttrDone(el,attr){
  let set=apTranslatedAttrs.get(el);
  if(!set){set=new Set();apTranslatedAttrs.set(el,set)}
  set.add(attr);
}
function apAddTranslationCandidate(groups,source,setter){
  source=String(source||'').trim();
  if(!apShouldTranslateUI(source))return;
  if(!groups.has(source))groups.set(source,[]);
  groups.get(source).push(setter);
}
function apShowLangLoading(){
  if(apLang()==='tr')return;
  try{toast('🌐 '+(AP_LANGS[apLang()]?.[0]||apLang())+' çevirisi uygulanıyor…')}catch(e){}
}
function apHideLangLoading(){}

function apRunNativeI18n(root=document){
  const lang=apLang();
  if(lang==='tr'){apHideLangLoading();return}
  if(apNativeBusy)return;
  const target=AP_ML_TARGET[lang];
  if(!target||!window.Android||typeof Android.translateUiBatch!=='function'){apHideLangLoading();return}

  const cache=apNativeCache(lang),groups=new Map();
  const scope=(root&&root.nodeType)?root:document;
  const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);

  for(const node of nodes){
    const parent=node.parentElement;
    if(!parent||/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(parent.tagName))continue;
    if(parent.closest('.brand,[data-no-translate],#appLangSelect,#appCountrySelect,#apLangLoading'))continue;

    const raw=node.nodeValue||'',src=raw.trim();
    if(!apShouldTranslateUI(src))continue;

    const st=apNodeState.get(node);
    if(st&&st.lang===lang&&raw.trim()===st.value)continue;

    if(cache[src]){
      if(node.isConnected){
        const v=cache[src];
        node.nodeValue=raw.replace(src,v);
        apNodeState.set(node,{lang,value:v});
      }
      continue;
    }

    apAddTranslationCandidate(groups,src,{
      apply:(v)=>{
        if(!node.isConnected)return;
        const now=node.nodeValue||'';
        if(now.trim()===src){
          node.nodeValue=now.replace(src,v);
          apNodeState.set(node,{lang,value:v});
        }
      }
    });
  }

  scope.querySelectorAll?.('[placeholder],[title],[aria-label]').forEach(el=>{
    if(el.closest('.brand,[data-no-translate],#appLangSelect,#appCountrySelect,#apLangLoading'))return;
    for(const attr of ['placeholder','title','aria-label']){
      if(apAttrDone(el,attr))continue;
      const src=(el.getAttribute(attr)||'').trim();
      if(!apShouldTranslateUI(src))continue;
      if(cache[src]){
        el.setAttribute(attr,cache[src]);
        apMarkAttrDone(el,attr);
        continue;
      }
      apAddTranslationCandidate(groups,src,{
        apply:(v)=>{
          if(el.isConnected&&(el.getAttribute(attr)||'').trim()===src)el.setAttribute(attr,v);
          apMarkAttrDone(el,attr);
        }
      });
    }
  });

  const all=[...groups.keys()];
  if(!all.length){
    apHideLangLoading();
    if(apNativeToastLang===lang){
      apNativeToastLang='';
      try{toast('✅ '+(AP_LANGS[lang]?.[0]||lang)+' hazır')}catch(e){}
    }
    return;
  }

  const texts=all.slice(0,140);
  const id='ap736_'+(++apNativeSeq);
  const selected=new Map(texts.map(t=>[t,groups.get(t)]));
  apNativePending[id]={lang,texts,groups:selected};
  apNativeBusy=true;

  if(apNativeToastLang!==lang){
    apNativeToastLang=lang;
    try{toast('🌐 '+(AP_LANGS[lang]?.[0]||lang)+' hazırlanıyor…')}catch(e){}
  }
  try{
    Android.translateUiBatch(target,id,JSON.stringify(texts));
  }catch(e){
    apNativeBusy=false;
    apHideLangLoading();
  }
}
function scheduleNativeI18n(root=document,delay=80){
  if(apLang()==='tr'){apHideLangLoading();return}
  clearTimeout(apNativeTimer);
  apNativeTimer=setTimeout(()=>apRunNativeI18n(root),delay);
}
window.onNativeTranslations=(requestId,payload,error)=>{
  const req=apNativePending[requestId];
  delete apNativePending[requestId];
  apNativeBusy=false;
  if(!req){scheduleNativeI18n(document.body,120);return}

  let arr=[];
  try{arr=JSON.parse(payload||'[]')}catch(e){}
  const cache=apNativeCache(req.lang);

  req.texts.forEach((src,i)=>{
    const translated=String((arr[i]===undefined||arr[i]===null)?src:arr[i]).trim()||src;
    cache[src]=translated;
    (req.groups.get(src)||[]).forEach(ref=>{try{ref.apply(translated)}catch(e){}});
  });
  apSaveNativeCache(req.lang);

  if(error){
    console.log('ML Translate:',error);
    apHideLangLoading();
    setTimeout(()=>scheduleNativeI18n(document.body,1200),1200);
  }else{
    setTimeout(()=>scheduleNativeI18n(document.body,50),50);
  }
};

setTimeout(()=>{
  try{
    if(AP_NOT_FULL_YET.has(state?.prefs?.language)){
      state.prefs.language='tr';
      localStorage.setItem(KEY,JSON.stringify(state));
      render();
    }
    const obs=new MutationObserver(mutations=>{
      let needs=false;
      for(const m of mutations){
        if(m.type==='childList'&&m.addedNodes&&m.addedNodes.length)needs=true;
        if(m.type==='characterData'){
          const st=apNodeState.get(m.target);
          const now=(m.target.nodeValue||'').trim();
          if(!st||now!==st.value){
            apNodeState.delete(m.target);
            needs=true;
          }
        }
      }
      if(needs)scheduleNativeI18n(document.body,120);
    });
    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
    scheduleNativeI18n(document.body,120);
  }catch(e){}
},350);

let apLiveTickerTimer=0;
let apLiveTickerRefreshTimer=0;
let apLiveTickerIndex=0;
let apLiveTickerTouchUntil=0;
let apLiveTickerRaf=0;
let apLiveTickerLast=0;
let apWeatherPendingAt=0;

function liveTickerItems(){
  const out=[];
  const c=state.prefs.weatherCache||{};

  if(c.temp!=null){
    const warn=(+c.rainChance||0)>=50 || (+c.precip||0)>0;
    out.push({
      icon:weatherEmoji(c.code),
      title:`${Math.round(c.temp)}°C • ${weatherName(c.code)}`,
      sub:`Rüzgar ${Math.round(c.wind||0)} km/s${c.rainChance!=null?' • Yağış %'+Math.round(c.rainChance):''}`,
      cls:warn?'warn':'',
      click:'weatherDetailModal()'
    });
  }else{
    const ws=String(state.prefs.weatherStatus||'');
    const waited=apWeatherPendingAt?Date.now()-apWeatherPendingAt:0;
    const failed=waited>15000;
    out.push({
      icon:'🌤️',
      title:ws&&(/izin|GPS|alınamadı|erişilemiyor/i.test(ws))?ws:(failed?'Hava verisi alınamadı':'Hava durumu alınıyor'),
      sub:failed?'Konum/GPS ve interneti kontrol et':'Konumdan otomatik yenilenir',
      cls:failed?'warn':'',
      click:'weatherDetailModal()'
    });
  }

  const fuel=state.fuelMarket||{};
  if(fuel.live && (+fuel.gasoline>0 || +fuel.diesel>0 || +fuel.lpg>0)){
    const parts=[];
    if(+fuel.gasoline>0)parts.push(`Benzin ${Number(fuel.gasoline).toFixed(2)} TL`);
    if(+fuel.diesel>0)parts.push(`Motorin ${Number(fuel.diesel).toFixed(2)} TL`);
    if(+fuel.lpg>0)parts.push(`LPG ${Number(fuel.lpg).toFixed(2)} TL`);
    out.push({
      icon:'⛽',
      title:parts.join(' • '),
      sub:`${fuel.city||state.prefs.fuelCity||'Konum'} • ${fuel.source||'güncel fiyat'}`,
      click:'fuelMarketModal(false)'
    });
  }

  const rg=fuelRangeData();
  if(rg&&rg.pct){
    out.push({
      icon:'🛣️',
      title:`Tahmini menzil ${Math.round(rg.range)} km`,
      sub:`Yakıt seviyesi yaklaşık %${Math.round(rg.pct)}`,
      cls:rg.pct<=20?'danger':'',
      click:'fuelRangeModal()'
    });
  }

  const up=upcoming();
  if(up.length){
    const u=up[0];
    let left='';
    if(Number.isFinite(u.days)&&u.days<99999) left=`${u.days} gün`;
    if(Number.isFinite(u.km)&&u.km<999999) left+=(left?' • ':'')+`${Math.max(0,Math.round(u.km))} km`;
    out.push({
      icon:'🔧',
      title:`${u.name||'Bakım'}${left?' • '+left:''}`,
      sub:'Yaklaşan bakım / resmî işlem',
      cls:(u.days<=7||u.km<=500)?'danger':(u.days<=30||u.km<=1500)?'warn':'',
      click:"go('plan')"
    });
  }

  const health=vehicleHealthScore();
  if(activeVehicle()){
    out.push({
      icon:'❤️‍🩹',
      title:`Araç sağlık puanı ${health.score}/100`,
      sub:health.notes?.[0]||health.label||'Araç kayıtlarına göre hesaplanır',
      cls:health.score<65?'danger':health.score<80?'warn':'',
      click:'vehicleHealthModal()'
    });
  }

  const alerts=smartAlertItems();
  if(alerts.length){
    out.push({
      icon:'🔔',
      title:`${alerts.length} önemli araç uyarısı`,
      sub:alerts[0]?.title||alerts[0]?.text||'Kontrol edilmesi gereken kayıt var',
      cls:'warn',
      click:'smartAlertsModal()'
    });
  }

  const val=currentValuation();
  if(val>0){
    out.push({
      icon:'📊',
      title:`Piyasa değeri ${money(val)}`,
      sub:'Kayıtlı son araç değerleme verisi',
      click:'marketValueModal()'
    });
  }

  const road=state.prefs.roadCache||{};
  if(apCountry()==='TR'){
    if(road.updatedAt){
      const mins=Math.max(0,Math.floor((Date.now()-Number(road.updatedAt||0))/60000));
      out.push({
        icon:road.status==='closed'?'⛔':road.status==='work'?'🚧':'✅',
        title:road.title||'KGM yol durumu',
        sub:`KGM • ${mins<1?'şimdi':mins+' dk önce'}`,
        cls:road.status==='closed'?'danger':road.status==='work'?'warn':'',
        click:'roadStatusModal()'
      });
    }else{
      out.push({
        icon:'🚧',
        title:'Konuma göre yol durumu alınıyor',
        sub:'KGM kapalı yollar ve yol çalışmaları',
        click:'roadStatusModal()'
      });
    }
  }

  return out.slice(0,8);
}

function liveTickerHtml(){
  const items=liveTickerItems();
  const loop=items.length>1?[...items,...items]:items;
  return `<div class="liveRibbon" id="liveRibbon">
    <div class="liveRibbonHead">
      <span class="liveRibbonState"><i class="liveDot"></i> CANLI BİLGİ</span>

    <div class="liveTickerViewport" id="liveTickerViewport"
      ontouchstart="apLiveTickerTouchUntil=Date.now()+9000"
      onscroll="updateLiveTickerDots()">
      ${loop.map((x,i)=>`<div class="liveTickerItem ${x.cls||''}" onclick="${x.click||''}">
        <span class="ltIcon">${x.icon}</span>

function updateLiveTickerDots(){
  const vp=document.getElementById('liveTickerViewport');
  const dots=[...(document.querySelectorAll('#liveTickerDots i')||[])];
  if(!vp||!dots.length)return;
  const cards=[...(vp.querySelectorAll('.liveTickerItem')||[])];
  if(!cards.length)return;
  let best=0,bestD=1e9;
  cards.forEach((c,i)=>{
    const d=Math.abs(c.offsetLeft-vp.scrollLeft);
    if(d<bestD){bestD=d;best=i}
  });
  apLiveTickerIndex=best;
  dots.forEach((d,i)=>d.classList.toggle('active',i===best));
}

function advanceLiveTicker(ts){
  const vp=document.getElementById('liveTickerViewport');
  if(!vp){apLiveTickerRaf=requestAnimationFrame(advanceLiveTicker);return}

  if(!apLiveTickerLast)apLiveTickerLast=ts;
  const dt=Math.min(50,Math.max(0,ts-apLiveTickerLast));
  apLiveTickerLast=ts;

  if(document.visibilityState==='visible' && Date.now()>=apLiveTickerTouchUntil){
    vp.scrollLeft += dt*0.050;
    const half=vp.scrollWidth/2;
    if(half>0 && vp.scrollLeft>=half)vp.scrollLeft-=half;
  }

  apLiveTickerRaf=requestAnimationFrame(advanceLiveTicker);
}

function refreshLiveTickerOnly(){
  const old=document.getElementById('liveRibbon');
  if(!old)return;
  const holder=document.createElement('div');
  holder.innerHTML=liveTickerHtml();
  old.replaceWith(holder.firstElementChild);
  apLiveTickerIndex=0;
}

function autoLiveDataRefresh(){
  const now=Date.now();
  const wc=state.prefs.weatherCache||{};
  if(!wc.ts || now-(+wc.ts||0)>10*60*1000){
    apWeatherPendingAt=Date.now();
    state.prefs.weatherStatus='Hava verisi alınıyor';
    try{
      if(typeof Android.fetchWeatherAuto==='function')Android.fetchWeatherAuto();
      else {window._homeWeatherCapture=true;Android.startSpeedTracking()}
    }catch(e){state.prefs.weatherStatus='Hava servisine erişilemiyor'}
  }

  const fm=state.fuelMarket||{};
  const liveCity=(wc.city||state.prefs.fuelCity||'').trim();
  if(liveCity && (!fm.updatedAt || fm.city!==liveCity || now-(+fm.updatedAt||0)>15*60*1000)){
    state.prefs.fuelCity=liveCity;
    try{Android.fetchFuelDashboard(liveCity,state.prefs.fuelAlertType)}catch(e){}
  }

  const rc=state.prefs.roadCache||{};
  if(apCountry()==='TR' && liveCity &&
     (!rc.updatedAt || rc.city!==liveCity || now-(+rc.updatedAt||0)>10*60*1000)){
    try{Android.fetchRoadStatus(liveCity,wc.district||'')}catch(e){}
  }

  refreshLiveTickerOnly();
}

function startLiveTickerAuto(){
  clearInterval(apLiveTickerTimer);
  clearInterval(apLiveTickerRefreshTimer);
  if(apLiveTickerRaf)cancelAnimationFrame(apLiveTickerRaf);
  apLiveTickerLast=0;
  apLiveTickerRaf=requestAnimationFrame(advanceLiveTicker);

  apLiveTickerRefreshTimer=setInterval(()=>{
    if(document.visibilityState==='visible')autoLiveDataRefresh();
  },5*60*1000);

  setTimeout(autoLiveDataRefresh,700);
}

function weatherEmoji(code){code=+code||0;if(code===0)return'☀️';if(code<=2)return'🌤️';if(code===3)return'☁️';if(code===45||code===48)return'🌫️';if((code>=51&&code<=67)||(code>=80&&code<=82))return'🌧️';if((code>=71&&code<=77)||(code>=85&&code<=86))return'🌨️';if(code>=95)return'⛈️';return'🌤️'}
function weatherName(code){code=+code||0;if(code===0)return'Açık';if(code<=2)return'Parçalı bulutlu';if(code===3)return'Bulutlu';if(code===45||code===48)return'Sisli';if(code>=51&&code<=67)return'Yağışlı';if(code>=71&&code<=77)return'Karlı';if(code>=80&&code<=82)return'Sağanak';if(code>=85&&code<=86)return'Kar sağanağı';if(code>=95)return'Gök gürültülü';return'Hava durumu'}
function loadHomeWeather(){const c=state.prefs.weatherCache;if(c&&Date.now()-(+c.ts||0)<10*60*1000){refreshTodayBar();return}apWeatherPendingAt=Date.now();state.prefs.weatherStatus='Hava verisi alınıyor';try{if(typeof Android.fetchWeatherAuto==='function')Android.fetchWeatherAuto();else{window._homeWeatherCapture=true;Android.startSpeedTracking()}}catch(e){state.prefs.weatherStatus='Hava servisine erişilemiyor';refreshTodayBar();refreshLiveTickerOnly()}}
function refreshTodayBar(){const c=state.prefs.weatherCache||{},t=document.getElementById('weatherTitle'),sub=document.getElementById('weatherSub'),ic=document.getElementById('weatherIcon'),chip=document.getElementById('weatherChip'),h=document.getElementById('healthChipTitle');if(t)t.textContent=c.temp!=null?`Hava ${Math.round(c.temp)}°C`:'Hava --°C';if(ic)ic.textContent=weatherEmoji(c.code);if(sub)sub.textContent=c.temp!=null?`${weatherName(c.code)} • Rüzgar ${Math.round(c.wind||0)} km/s`:'Konumdan güncelleniyor';if(chip&&c.temp!=null)chip.classList.add('weatherReady');if(h)h.textContent=vehicleHealthScore().label;const rg=fuelRangeData(),al=smartAlertItems(),rc=document.getElementById('rangeChipTitle'),ac=document.getElementById('alertChipTitle');if(rc)rc.textContent=rg.pct?`Menzil ${Math.round(rg.range)} km`:'Menzil —';if(ac)ac.textContent=`Uyarı ${al.length}`}
window.onWeatherResult=(payload,error)=>{apWeatherPendingAt=0;if(error){state.prefs.weatherStatus=String(error||'Hava durumu alınamadı');console.log('weather',error);localStorage.setItem(KEY,JSON.stringify(state));refreshTodayBar();refreshLiveTickerOnly();return}try{const d=JSON.parse(payload||'{}'),c=d.current||{},day=d.daily||{};if(c.temperature_2m==null)throw new Error('Hava servisi sıcaklık döndürmedi');const city=String(d.city||'').trim(),district=String(d.district||'').trim();state.prefs.weatherStatus='';state.prefs.weatherCache={temp:c.temperature_2m,feels:c.apparent_temperature,precip:c.precipitation,code:c.weather_code,wind:c.wind_speed_10m,max:Array.isArray(day.temperature_2m_max)?day.temperature_2m_max[0]:null,min:Array.isArray(day.temperature_2m_min)?day.temperature_2m_min[0]:null,rainChance:Array.isArray(day.precipitation_probability_max)?day.precipitation_probability_max[0]:null,city,district,lat:d.latitude,lon:d.longitude,ts:Date.now()};if(city){state.prefs.fuelCity=city;try{Android.fetchFuelDashboard(city,state.prefs.fuelAlertType)}catch(e){}if(apCountry()==='TR'){try{Android.fetchRoadStatus(city,district)}catch(e){}}}localStorage.setItem(KEY,JSON.stringify(state));refreshTodayBar();setTimeout(refreshLiveTickerOnly,60)}catch(e){state.prefs.weatherStatus='Hava verisi okunamadı';console.log(e);refreshLiveTickerOnly()}}
function weatherDetailModal(){const c=state.prefs.weatherCache||{};if(c.temp==null){loadHomeWeather();return modal('Hava Durumu',`<div class="notice">Konumdan hava durumu alınıyor. Birkaç saniye sonra tekrar aç.</div>`)}modal('Hava Durumu',`<div class="proPanel"><div class="proPanelTitle"><i style="font-size:24px">${weatherEmoji(c.code)}</i><div><b>${Math.round(c.temp)}°C • ${weatherName(c.code)}</b><span>Hissedilen ${Math.round(c.feels??c.temp)}°C</span></div></div><div class="assistSummary"><div class="sumCard"><span>Bugün en yüksek</span><b>${c.max!=null?Math.round(c.max)+'°C':'—'}</b></div><div class="sumCard"><span>Bugün en düşük</span><b>${c.min!=null?Math.round(c.min)+'°C':'—'}</b></div><div class="sumCard"><span>Yağış ihtimali</span><b>${c.rainChance!=null?Math.round(c.rainChance)+'%':'—'}</b></div><div class="sumCard"><span>Rüzgar</span><b>${Math.round(c.wind||0)} km/s</b></div></div>${(+c.precip>0||(+c.rainChance||0)>=50)?`<div class="notice" style="margin-top:10px">⚠️ Yağış ihtimali yüksek. Yolculukta takip mesafesini artır ve hızını koşullara göre ayarla.</div>`:''}<button class="secondary wide" style="margin-top:10px" onclick="state.prefs.weatherCache=null;save();closeModal();loadHomeWeather()">Havayı Yenile</button></div>`)}

function vehicleHealthScore(){const v=activeVehicle();if(!v)return{score:0,label:'Araç yok',notes:['Önce araç ekle']};let score=100,notes=[];const sv=vf(state.services||[]);if(!sv.length){score-=12;notes.push('Bakım kaydı eklenmemiş')}else{const last=sv.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];if(last?.date){const age=(Date.now()-new Date(last.date+'T12:00:00'))/86400000;if(age>365){score-=12;notes.push('Son bakım 1 yıldan eski')}}}
const r=state.prefs.driverReminders||{};[['inspection','Muayene',15],['insurance','Trafik sigortası',12],['tire','Lastik',7]].forEach(([k,n,p])=>{const d=daysToDate(r[k]);if(d!==null&&d<0){score-=p;notes.push(n+' tarihi geçmiş')}});const acc=vf(state.accidents||[]).filter(x=>x.status&&x.status!=='Onarıldı'&&x.status!=='Kayıt Amaçlı');if(acc.length){score-=Math.min(18,acc.length*8);notes.push('Bekleyen hasar/onarım kaydı var')}
const bats=vf(state.batteries||[]).filter(x=>x.installDate).sort((a,b)=>String(b.installDate).localeCompare(String(a.installDate)));if(bats[0]){const years=(Date.now()-new Date(bats[0].installDate+'T12:00:00'))/(365.25*86400000);if(years>4){score-=8;notes.push('Akü 4 yıldan eski')}}score=Math.max(35,Math.min(100,Math.round(score)));return{score,label:`Sağlık ${score}/100`,notes:notes.length?notes:['Kayıtlara göre kritik uyarı yok']}}
function vehicleHealthModal(){const h=vehicleHealthScore();modal('Araç Sağlık Puanı',`<div class="proPanel"><div class="healthRing" style="--score:${h.score}"><div class="healthText"><b>${h.score}</b><small>/100</small></div></div><div class="statusList">${h.notes.map(x=>`<div class="statusRow"><span>${esc(x)}</span><span class="statusTag ${h.score>=80?'ok':h.score>=60?'warn':'danger'}">${h.score>=80?'İyi':h.score>=60?'Kontrol':'Dikkat'}</span></div>`).join('')}</div><div class="hint">Bu puan yalnızca Aracım Pro'ya girilen bakım, tarih, akü ve hasar kayıtlarından hesaplanan yardımcı bir göstergedir; mekanik ekspertiz değildir.</div><div class="proActionGrid"><button onclick="closeModal();go('plan')">🔧 Bakım Planı</button><button onclick="driverReminderModal()">🔔 Hatırlatıcılar</button></div></div>`)}

function vehiclePref(){const v=activeVehicle();if(!v)return{};state.prefs.vehicleAssistant=state.prefs.vehicleAssistant||{};state.prefs.vehicleAssistant[v.id]=state.prefs.vehicleAssistant[v.id]||{};return state.prefs.vehicleAssistant[v.id]}
function fuelRangeData(){const p=vehiclePref(),v=activeVehicle()||{};const parse=x=>parseFloat(String(x??'').replace(',','.'))||0;const tank=+p.tankLiters||parse(v.fuelTank)||parse(v.tank)||50;const cons=+p.consumption||parse(v.consumption)||parse(v.avgConsumption)||7.5;const pct=Math.max(0,Math.min(100,+p.fuelPercent||0));const liters=tank*pct/100;const range=cons>0?liters/cons*100:0;return{tank,cons,pct,liters,range}}
function saveFuelRange(e){e.preventDefault();const f=new FormData(e.target),p=vehiclePref();p.tankLiters=+f.get('tank')||50;p.consumption=+f.get('cons')||7.5;p.fuelPercent=Math.max(0,Math.min(100,+f.get('pct')||0));localStorage.setItem(KEY,JSON.stringify(state));fuelRangeModal();refreshTodayBar();toast('Yakıt ve menzil kaydedildi')}

function smartAlertItems(){const out=[],r=state.prefs.driverReminders||{},w=state.prefs.weatherCache||{},h=vehicleHealthScore(),rg=fuelRangeData();[['inspection','Muayene'],['insurance','Trafik sigortası'],['mtv','MTV / Vergi'],['tire','Lastik değişimi']].forEach(([k,n])=>{const d=daysToDate(r[k]);if(d!==null&&d<=30)out.push({icon:d<0?'⛔':'🔔',title:n,detail:d<0?`${Math.abs(d)} gün gecikti`:`${d} gün kaldı`})});upcoming().slice(0,3).forEach(x=>{if((x.days!=null&&x.days<=30)||(x.km!=null&&x.km<=1500))out.push({icon:'🔧',title:x.name||'Bakım',detail:x.days<=30?`${x.days} gün kaldı`:`${Math.max(0,Math.round(x.km))} km kaldı`})});if((+w.rainChance||0)>=50)out.push({icon:'🌧️',title:'Yağış uyarısı',detail:`Yağış ihtimali %${Math.round(w.rainChance)}`});if(h.score<80)out.push({icon:'❤️',title:'Araç sağlığı',detail:`Sağlık puanı ${h.score}/100`});if(rg.pct>0&&rg.range<80)out.push({icon:'⛽',title:'Yakıt düşük',detail:`Tahmini menzil ${Math.round(rg.range)} km`});return out}

onclick="communityLogoutNow()">Çıkış Yap</button><button class="danger wide" style="margin-top:10px" onclick="location.href='https://fatihozkaya0606-byte.github.io/AracimPro/delete-account.html'">Hesabımı Sil / Silme Talebi</button><div class="hint" style="margin-top:8px">Hesabın ve hesaba bağlı verilerin silinmesi için talep sayfasını açar.</div>`);return}modal('Kullanıcı Hesabı',`<div class="card" style="margin:0"><b>Giriş Yap</b><form class="form" style="margin-top:10px" onsubmit="communityLoginNow(event)"><div class="field"><label>E-posta</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Şifre</label><input type="password" name="password" minlength="6" required autocomplete="current-password"></div><button class="primary wide">Giriş Yap</button></form></div><div class="card" style="margin-top:12px"><b>Yeni Hesap Oluştur</b><form class="form" style="margin-top:10px" onsubmit="communityRegisterNow(event)"><div class="field"><label>Görünen Ad</label><input name="name" minlength="2" maxlength="40" required></div><div class="field"><label>E-posta</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Şifre</label><input type="password" name="password" minlength="6" required autocomplete="new-password"></div><button class="secondary wide">Hesap Oluştur</button></form></div><div class="hint" style="margin-top:10px">Şifren Firebase Authentication tarafından yönetilir; uygulama kendi içinde düz metin şifre saklamaz.</div>`)}

function modelCommentKey(v){return v?`${String(v.make||'').trim().toLocaleLowerCase('tr-TR')}|${String(v.model||'').trim().toLocaleLowerCase('tr-TR')}`:''}
function starText(n){n=Math.max(0,Math.min(5,Math.round(+n||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}
function commentsForActive(){return communityComments.slice().sort((a,b)=>(+b.createdAt||0)-(+a.createdAt||0))}
function commentsModal(fetchNow=true){const v=activeVehicle();if(!v)return;const key=modelCommentKey(v);syncCommunityStatus();communityCommentsKey=key;if(communityAuthState.configured){if(fetchNow){communityLoading=true;communityError='';try{Android.communityFetchComments(key)}catch(e){communityLoading=false;communityError='Yorum servisi açılamadı'}}}else{communityLoading=false;communityError='';communityComments=getLocalComments().filter(x=>x.modelKey===key)}const arr=commentsForActive(),avg=arr.length?arr.reduce((t,x)=>t+(+x.rating||0),0)/arr.length:0,cons=arr.filter(x=>+x.realConsumption>0),avgCons=cons.length?cons.reduce((t,x)=>t+(+x.realConsumption||0),0)/cons.length:0;const modeText=communityAuthState.configured?'Gerçek kullanıcı deneyimleri • yıl/motor bilgisi yorumlarda ayrıca görünür':'Bu cihazdaki kayıtlı deneyimler • bulut senkronu kapalı';modal('Kullanıcı Yorumları',`<div class="card" style="margin:0"><b>${esc(v.make+' '+v.model)}</b><div class="muted small">${modeText}</div><div class="communitySummary" style="margin-top:12px"><div class="kpiBox"><span class="muted small">Puan</span><b>${arr.length?avg.toFixed(1)+'/5':'—'}</b><div class="stars">${arr.length?starText(avg):'☆☆☆☆☆'}</div></div><div class="kpiBox"><span class="muted small">Gerçek Tüketim</span><b>${avgCons?avgCons.toFixed(1)+' L/100':'—'}</b><div class="muted small">${cons.length?cons.length+' kayıt':'Veri yok'}</div></div></div></div>${!communityAuthState.configured?`<div class="notice" style="margin-top:12px">Cihaz içi mod aktif. Profil ve yorumlar bu telefonda saklanır.</div>`:''}${communityAuthState.signedIn?`<button class="primary wide" style="margin-top:12px" onclick="openCommentForm()">Yorum Yaz</button>`:`<button class="primary wide" style="margin-top:12px" onclick="openAccount()">Yorum Yazmak İçin Profil Oluştur</button>`}<div class="sectionHead"><h2>${communityLoading?'Yorumlar yükleniyor…':'Yorumlar'}</h2>${communityAuthState.configured?`<button class="linkbtn" onclick="commentsModal(true)">Yenile</button>`:''}</div>${communityError?`<div class="notice">${esc(communityError)}</div>`:''}${arr.length?`<div class="list">${arr.map(c=>commentCard(c)).join('')}</div>`:`<div class="card empty"><h3>Henüz yorum yok</h3><p class="muted">Bu model için ilk deneyimini kaydedebilirsin.</p></div>`}`)}
function commentCard(c){const initial=esc(String(c.userName||'K').slice(0,1).toUpperCase()),d=c.createdAt?new Date(+c.createdAt).toLocaleDateString(apLocale()):'';return `<div class="reviewCard"><div class="reviewTop"><div class="avatar">${initial}</div><div class="grow"><b>${esc(c.userName||'Aracım Pro kullanıcısı')}</b><div class="stars">${starText(c.rating)}</div><div class="reviewMeta">${esc([c.year,c.engine,c.trim].filter(Boolean).join(' • '))}${c.mileage?' • '+num(c.mileage)+' km':''}${d?' • '+d:''}</div></div></div><div class="reviewBody">${esc(c.text||'')}</div><div class="reviewTags">${c.realConsumption?`<span class="reviewTag">⛽ ${Number(c.realConsumption).toFixed(1)} L/100</span>`:''}${c.pros?`<span class="reviewTag">✅ ${esc(c.pros)}</span>`:''}${c.cons?`<span class="reviewTag">➖ ${esc(c.cons)}</span>`:''}${c.issue?`<span class="reviewTag">⚠️ ${esc(c.issue)}</span>`:''}</div>${communityAuthState.configured?`<button class="linkbtn" style="margin-top:8px" onclick="reportCommunityComment('${esc(c.id)}')">Şikayet Et</button>`:''}</div>`}

function localExactSpecs(v){if(!v)return null;const y=+v.year||0,eng=String(v.engine||'').toLowerCase();const auto=/otomatik|dct|cvt|e-cvt/i.test(String(v.transmission||''));const row=LOCAL_EXACT_SPECS.find(r=>r.make===v.make&&r.model===v.model&&y>=r.from&&y<=r.to&&eng.includes(String(r.engine).toLowerCase())&&(r.automatic===undefined||r.automatic===auto));return row?{...row.spec,specUpdatedAt:today(),specConfidence:99}:null}
function applySpecData(v,r,prefer=false){if(!v||!r)return;const keys=['engineCc','powerHp','torqueNm','zeroTo100','topSpeedKph','weightKg','trunkL','fuelTankL','avgConsumptionL','cityConsumptionL','hwyConsumptionL','lengthMm','widthMm','heightMm','wheelbaseMm','doors','seats','brandCountry','productionCountry','productionCity','manufacturer','batteryKwh','rangeKm','avgConsumptionKwh','chargingAcKw','chargingDcKw','chargingConnector','body','drive','oilCapacityL','coolantCapacityL','adblueTankL','tireSizes','wheelSizes','engineCode','injectionSystem','aspiration'];for(const k of keys){if(r[k]!==undefined&&r[k]!==null&&r[k]!==''&&(prefer||!v[k]))v[k]=r[k]}if(r.source||r.specSource)v.specSource=r.specSource||r.source;if(r.matchedTrim)v.specMatchedTrim=r.matchedTrim;if(r.otoCarId)v.otoCarId=r.otoCarId;if(r.confidence!==undefined)v.specConfidence=r.confidence;if(r.specUpdatedAt)v.specUpdatedAt=r.specUpdatedAt;else v.specUpdatedAt=today()}
const SPEC_CORE_KEYS=['powerHp','torqueNm','zeroTo100','topSpeedKph','avgConsumptionL','weightKg','fuelTankL'];
let specQueue=[],specBusy=false,specTimer=null,specRequestCounter=0,specActiveRequest=0,specActiveIdentity='';
function needsSpecRefresh(v){if(!v)return false;const have=SPEC_CORE_KEYS.filter(k=>v[k]!==undefined&&v[k]!==null&&v[k]!=='').length;const age=v.specUpdatedAt?((Date.now()-new Date(v.specUpdatedAt+'T00:00:00').getTime())/86400000):999;return have<4||age>45}
function queueSpecVehicle(v,showToast=false,force=false){if(!v||!v.make||!v.model)return;const local=localExactSpecs(v);if(local){applySpecData(v,local,true);localStorage.setItem(KEY,JSON.stringify(state));if(showToast)toast('Yerel doğrulanmış teknik profil uygulandı')}if(!force&&!needsSpecRefresh(v)&&local)return;if(specQueue.some(x=>x.id===v.id)||(specBusy&&window._specVehicleId===v.id))return;specQueue.push({id:v.id,showToast,force});pumpSpecQueue()}
function pumpSpecQueue(){if(specBusy||!specQueue.length)return;const job=specQueue.shift(),v=state.vehicles.find(x=>x.id===job.id);if(!v){pumpSpecQueue();return}specBusy=true;window._specVehicleId=v.id;specActiveRequest=++specRequestCounter;specActiveIdentity=[v.make,v.model,v.year,v.engine,v.fuel,v.otoCarId].join('|');v.specLoading=true;v.specError='';localStorage.setItem(KEY,JSON.stringify(state));try{Android.fetchVehicleSpecs(v.make,v.model,+v.year||0,v.engine||'',v.fuel||'',v.transmission||'',specActiveRequest);if(job.showToast)toast('Teknik veriler aranıyor…');clearTimeout(specTimer);specTimer=setTimeout(()=>{if(specBusy&&window._specVehicleId===v.id){v.specLoading=false;v.specError='Teknik veri servisi zaman aşımına uğradı';localStorage.setItem(KEY,JSON.stringify(state));specBusy=false;pumpSpecQueue()}},18000)}catch(e){v.specLoading=false;v.specError='Teknik veri servisi kullanılamıyor';localStorage.setItem(KEY,JSON.stringify(state));specBusy=false;if(job.showToast)toast(v.specError);pumpSpecQueue()}}
function autoFetchSpecsForVehicle(v,showToast=false,force=false){queueSpecVehicle(v,showToast,force)}
function refreshAllVehicleSpecs(showToast=true){const list=(state.vehicles||[]).filter(v=>v.make&&v.model);list.forEach(v=>queueSpecVehicle(v,false,true));if(showToast)toast(list.length+' araç için teknik veri yenilemesi sıraya alındı')}
window.onVehicleSpecsResult=(payload,error,requestId)=>{if(!specBusy||requestId!==specActiveRequest)return;clearTimeout(specTimer);const id=window._specVehicleId,v=state.vehicles.find(x=>x.id===id);if(v&&[v.make,v.model,v.year,v.engine,v.fuel,v.otoCarId].join('|')===specActiveIdentity){let r={};try{r=JSON.parse(payload||'{}')}catch(e){};v.specLoading=false;if(Object.keys(r).length){const local=localExactSpecs(v);applySpecData(v,r,!local);if(local)applySpecData(v,local,true);v.specError=''}else if(error){v.specError=error}localStorage.setItem(KEY,JSON.stringify(state));render();if(window._specModalOpen)specsModal();if(window._guideOpen)vehicleGuideModal(true)}specBusy=false;window._specVehicleId='';pumpSpecQueue()}

function genericTechProfile(v){if(!v)return null;const ev=v.fuel==='Elektrik'||String(v.engine||'').toLowerCase().includes('elektrik');return {generic:true,verified:v.specSource||'Aracım Pro otomatik katalog',reliability:v.specError?('Otomatik teknik veri kaynağı bu varyantı henüz eşleştiremedi: '+v.specError):'Bu araç için teknik veriler otomatik katalogdan aranır. VIN zorunlu değildir.',tires:[],wheels:[],pressure:'Kapı içi lastik etiketindeki soğuk basınç değerini kullan',bolt:'Jant ölçüsüyle birlikte model/yıl bazlı katalogdan eşleştir',oil:ev?'Elektrikli araçta içten yanmalı motor yağı bulunmaz':'Motor koduna uygun üretici onaylı motor yağı; katalog eşleşmesi tamamlandığında ayrıntı gösterilir',oilCapacity:ev?'—':'Motor varyantına göre teknik katalogdan aranıyor',coolant:ev?'Batarya/elektrik motoru soğutma devresi için üretici onaylı sıvı':'Üretici onaylı uzun ömürlü soğutma sıvısı; motor varyantına göre katalogdan aranıyor',coolantCapacity:'Model/motor varyantına göre teknik katalogdan aranıyor',brakeFluid:'Üretici onaylı fren hidroliği; model/yıl standardına göre',transFluid:ev?'Tek oranlı redüksiyon/aktarma sıvısı üretici planına göre':(String(v.transmission||'').includes('DCT')?'DCT tipine uygun üretici onaylı şanzıman sıvısı':'Şanzıman tipine uygun üretici onaylı sıvı'),fuelTank:v.fuelTankL?(v.fuelTankL+' L'):(ev?'—':'Otomatik teknik katalogdan aranıyor'),timing:ev?'Elektrikli motorda triger sistemi yok':'Motor koduna göre zincir/kayış bilgisi teknik katalogdan aranıyor',battery:ev?'12V yardımcı akü + yüksek voltaj batarya ayrı takip edilir':'Araç donanımına göre standart/EFB/AGM; fiziksel ölçü ve CCA eşleşmeli',bulbs:'Far donanımına göre halojen/xenon/LED; model yılına göre katalogdan',wipers:'Model/kasa yılına göre katalogdan',issues:[],buy:[]}}

function allVariantEngines(make='',model='',year=0){const r=variantRule(make,model,+year||0);if(!r?.fuels)return[];return [...new Set(Object.values(r.fuels).flat().filter(Boolean))].sort(azSort)}

function searchVehiclePhotos(auto=false){const f=selectedVehicleForm();if(!f)return;const make=f.elements.make.value,model=f.elements.model.value,year=f.elements.year.value,engine=f.elements.engine?.value||'';if(!make||!model){if(!auto)alert('Önce marka ve model seç');return}const area=document.getElementById('imageSearchArea');if(area)area.innerHTML=`<div class="imageSearchBox"><b>Doğru kasa fotoğrafı aranıyor…</b><div class="hint">${esc(photoSearchTerms(make,model,year,engine)[0])}</div></div>`;window._imageSearchMode=auto?'edit-auto':'edit-manual';try{Android.searchVehicleImagesExact(make,model,+year||0,engine)}catch(e){try{Android.searchVehicleImages([year,make,model].filter(Boolean).join(' '))}catch(_){if(area)area.innerHTML=`<div class="notice">Görsel araması açılamadı. Galeriden fotoğraf seçebilirsin.</div>`}}}
window.onVehicleImageSearchResult=(payload,error)=>{let arr=[];try{arr=JSON.parse(payload||'[]')}catch(e){};window._vehicleImageResults=arr;const area=document.getElementById('imageSearchArea');const auto=window._imageSearchMode==='edit-auto'||String(window._imageSearchMode||'').startsWith('auto:');if(!arr.length){if(area)area.innerHTML=`<div class="notice">Bu araç için açık lisanslı fotoğraf bulunamadı. Galeriden kendi araç fotoğrafını seçebilirsin.</div>`;return}if(String(window._imageSearchMode||'').startsWith('auto:')){const id=String(window._imageSearchMode).split(':')[1],r=arr.find(x=>+(x.confidence||0)>=80)||arr[0];window._pendingImageMeta={id,source:r.page||'',license:r.license||'Wikimedia Commons',credit:r.artist||r.credit||'',title:r.title||''};try{Android.cacheRemoteImage('saved:'+id,r.fullUrl||r.url)}catch(e){};return}if(auto&&window._editingVehicle){chooseVehicleImage(0,true);return}if(area)area.innerHTML=`<div class="imageSearchBox"><b>Fotoğraf seç</b><div class="hint">Açık lisanslı sonuçlar • doğru kasa/generasyonu seçebilirsin.</div><div class="imageResults">${arr.slice(0,8).map((r,i)=>`<button type="button" class="imageChoice" onclick="chooseVehicleImage(${i},false)"><img src="${esc(r.url)}"><small>${esc(r.title||'Araç fotoğrafı')}</small></button>`).join('')}</div>${error?`<div class="hint">${esc(error)}</div>`:''}</div>`}
function chooseVehicleImage(i,auto=false){const r=(window._vehicleImageResults||[])[i];if(!r||!window._editingVehicle)return;window._pendingImageMeta={id:window._editingVehicle.id,source:r.page||'',license:r.license||'Wikimedia Commons',credit:r.artist||r.credit||'',title:r.title||''};const area=document.getElementById('imageSearchArea');if(area)area.innerHTML=`<div class="imageSearchBox"><b>Fotoğraf hazırlanıyor…</b></div>`;try{Android.cacheRemoteImage('edit:'+window._editingVehicle.id,r.fullUrl||r.url)}catch(e){if(area)area.innerHTML=`<div class="notice">Fotoğraf indirilemedi. Başka bir sonuç seçebilirsin.</div>`}}
window.onRemoteVehicleImageCached=(ctx,data,error)=>{const meta=window._pendingImageMeta||{};if(!data){const area=document.getElementById('imageSearchArea');if(area)area.innerHTML=`<div class="notice">Fotoğraf kaydedilemedi${error?' • '+esc(error):''}.</div>`;return}if(String(ctx).startsWith('edit:')&&window._editingVehicle){window._editingVehicle.photo=data;window._editingVehicle.photoSource=meta.source||'';window._editingVehicle.photoLicense=meta.license||'Wikimedia Commons';window._editingVehicle.photoCredit=meta.credit||'';refreshVehiclePhotoPreview();const area=document.getElementById('imageSearchArea');if(area)area.innerHTML=`<div class="notice success">Gerçek araç fotoğrafı seçildi. Kaydet dediğinde araçla birlikte saklanacak.</div>`}else if(String(ctx).startsWith('saved:')){const id=String(ctx).split(':')[1],v=state.vehicles.find(x=>x.id===id);if(v){v.photo=data;v.photoSource=meta.source||'';v.photoLicense=meta.license||'Wikimedia Commons';v.photoCredit=meta.credit||'';save()}}}
function pickVehiclePhoto(id){try{Android.pickImage('vehicle:'+id)}catch(e){alert('Fotoğraf seçici açılamadı')}}
window.onNativeImagePicked=(ctx,data)=>{if(ctx.startsWith('vehicle:')){const id=ctx.split(':')[1];const v=state.vehicles.find(x=>x.id===id);if(v){v.photo=data;v.photoSource='';v.photoLicense='Kullanıcı fotoğrafı';save();openVehicle(id)}else if(window._editingVehicle?.id===id){window._editingVehicle.photo=data;window._editingVehicle.photoSource='';window._editingVehicle.photoLicense='Kullanıcı fotoğrafı';refreshVehiclePhotoPreview()}}};
function openPhotoSource(id){const v=state.vehicles.find(x=>x.id===id);if(!v?.photoSource)return;try{Android.openUri(v.photoSource,'')}catch(e){}}

function quickKm(){const v=activeVehicle();if(!v)return;modal('Kilometreyi Güncelle',`<form class="form" onsubmit="saveKm(event)"><div class="field"><label>Güncel Kilometre</label><input autofocus name="km" type="number" min="${v.km||0}" required value="${v.km||0}"></div><button class="primary wide">Güncelle</button></form>`)}
function saveKm(e){e.preventDefault();activeVehicle().km=+new FormData(e.target).get('km');closeModal();runKmAlerts();save()}
function runKmAlerts(){const v=activeVehicle();if(!v)return;state.prefs.kmNotify ||= {};vf(state.maintenance).filter(x=>!x.completed&&x.dueKm).forEach(x=>{const left=x.dueKm-v.km;if(left<=1000&&!state.prefs.kmNotify[x.id]){state.prefs.kmNotify[x.id]=true;try{Android.showNotification('Yaklaşan bakım',`${x.name} için ${Math.max(0,left)} km kaldı.`,x.id)}catch(e){}}})}

function openFuel(id=''){const x=vf(state.fuel).find(v=>v.id===id)||{};modal(id?'Yakıt Kaydını Düzenle':'Yakıt Ekle',`<form class="form" onsubmit="saveFuel(event,'${id}')"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" required value="${x.date||today()}"></div><div class="field"><label>Kilometre</label><input type="number" name="km" required value="${x.km??activeVehicle()?.km??0}"></div></div><div class="formrow"><div class="field"><label>Litre / kWh</label><input type="number" name="liters" step="0.01" required value="${x.liters??''}"></div><div class="field"><label>Toplam Tutar</label><input type="number" name="cost" step="0.01" required value="${x.cost??''}"></div></div><div class="formrow"><div class="field"><label>Kullanım</label><select name="driveType">${optList(['Karma','Şehir İçi','Uzun Yol','Yoğun Trafik','Otoyol'],x.driveType||'Karma','Kullanım seç')}</select></div><div class="field"><label>Dolum</label><select name="fillType">${optList(['Depo Dolu','Kısmi Dolum','Şarj %20-80','Şarj %0-100','Şarj / Diğer'],x.fillType||'Depo Dolu','Dolum seç')}</select></div></div><div class="field"><label>İstasyon / Şarj Noktası</label><select name="station">${optList(FUEL_STATIONS,x.station,'İstasyon seç')}</select></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('fuel','${id}')">Sil</button>`:''}</form>`) }
function saveFuel(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),km:+f.get('km'),liters:+f.get('liters'),cost:+f.get('cost'),station:f.get('station').trim(),driveType:f.get('driveType'),fillType:f.get('fillType')};upsert('fuel',o,id);if(o.km>activeVehicle().km)activeVehicle().km=o.km;closeModal();runKmAlerts();save()}

const expenseCats=['MTV','Trafik Sigortası','Kasko','Otoyol/HGS','Park','Yıkama','Ceza','Aksesuar','Muayene','Diğer'];
function openExpense(id=''){const x=vf(state.expenses).find(v=>v.id===id)||{};modal(id?'Gideri Düzenle':'Gider Ekle',`<form class="form" onsubmit="saveExpense(event,'${id}')"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}" required></div><div class="field"><label>Kategori</label><select name="category">${optList(expenseCats,x.category,'Kategori seç')}</select></div></div><div class="field"><label>Tutar (TL)</label><input type="number" step="0.01" name="cost" value="${x.cost??''}" required></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('expenses','${id}')">Sil</button>`:''}</form>`)}
function saveExpense(e,id){e.preventDefault();const f=new FormData(e.target);upsert('expenses',{id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),category:f.get('category'),cost:+f.get('cost'),note:f.get('note').trim()},id);closeModal();save()}
function openTrip(id=''){const x=vf(state.trips).find(v=>v.id===id)||{};modal(id?'Yolculuğu Düzenle':'Yolculuk Ekle',`<form class="form" onsubmit="saveTrip(event,'${id}')"><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}" required></div><div class="formrow"><div class="field"><label>Başlangıç KM</label><input type="number" name="startKm" value="${x.startKm??activeVehicle().km}" required></div><div class="field"><label>Bitiş KM</label><input type="number" name="endKm" value="${x.endKm??''}" required></div></div><div class="field"><label>Yolculuk Amacı</label><select name="purpose">${optList(TRIP_PURPOSES,x.purpose,'Amaç seç')}</select></div><div class="field"><label>Rota (isteğe bağlı)</label><input name="route" value="${esc(x.route||'')}" placeholder="Örn. Ankara → Çankırı"></div><div class="field"><label>Yolculuk ek gideri</label><input type="number" step="0.01" name="cost" value="${x.cost??0}"></div><div class="field"><label>Not (isteğe bağlı)</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('trips','${id}')">Sil</button>`:''}</form>`) }
function saveTrip(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),startKm:+f.get('startKm'),endKm:+f.get('endKm'),route:f.get('route').trim(),purpose:f.get('purpose').trim(),cost:+f.get('cost'),note:f.get('note').trim()};upsert('trips',o,id);if(o.endKm>activeVehicle().km)activeVehicle().km=o.endKm;closeModal();runKmAlerts();save()}
function openService(id=''){const x=vf(state.services).find(v=>v.id===id)||{};modal(id?'Servisi Düzenle':'Servis Kaydı Ekle',`<form class="form" onsubmit="saveService(event,'${id}')"><div class="formrow"><div class="field"><label>Tarih</label><input type="date" name="date" value="${x.date||today()}" required></div><div class="field"><label>KM</label><input type="number" name="km" value="${x.km??activeVehicle().km}" required></div></div><div class="formrow"><div class="field"><label>Servis Türü</label><select name="shop">${optList(SERVICE_SHOPS,x.shop,'Servis türü seç')}</select></div><div class="field"><label>Yapılan İş</label><select name="work" required>${optList(SERVICE_TYPES,x.work,'İşlem seç')}</select></div></div><div class="field"><label>Parçalar / Marka (isteğe bağlı)</label><textarea name="parts" placeholder="Örn. yağ filtresi, balata, motor yağı">${esc(x.parts||'')}</textarea></div><div class="formrow"><div class="field"><label>Parça Tutarı</label><input type="number" step="0.01" name="partsCost" value="${x.partsCost??0}"></div><div class="field"><label>İşçilik</label><input type="number" step="0.01" name="labor" value="${x.labor??0}"></div></div><div class="field"><label>Not (isteğe bağlı)</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('services','${id}')">Sil</button>`:''}</form>`) }
function saveService(e,id){e.preventDefault();const f=new FormData(e.target),pc=+f.get('partsCost'),lb=+f.get('labor');const o={id:id||uid(),vehicleId:activeVehicle().id,date:f.get('date'),km:+f.get('km'),shop:f.get('shop').trim(),work:f.get('work').trim(),parts:f.get('parts').trim(),partsCost:pc,labor:lb,total:pc+lb,note:f.get('note').trim()};upsert('services',o,id);if(o.km>activeVehicle().km)activeVehicle().km=o.km;closeModal();save()}
const maintPresets={'Yağ Değişimi':[10000,12],'Periyodik Bakım':[15000,12],'Hava Filtresi':[20000,18],'Polen Filtresi':[15000,12],'Fren Kontrolü':[15000,12],'Lastik Kontrolü':[10000,6],'Akü Kontrolü':[0,24],'Triger / Zincir Kontrolü':[60000,48],'Muayene':[0,24],'Trafik Sigortası':[0,12],'Kasko':[0,12],'MTV 1. Taksit':[0,12],'MTV 2. Taksit':[0,12]};
function openMaintenance(id=''){const x=vf(state.maintenance).find(v=>v.id===id)||{};const opts=Object.keys(maintPresets);modal(id?'İşlemi Düzenle':'Bakım / Hatırlatma Ekle',`<form class="form" onsubmit="saveMaintenance(event,'${id}')"><div class="field"><label>İşlem</label><select name="name" onchange="applyMaintPreset(this.value)" required>${optList(opts,x.name,'İşlem seç')}</select></div><div class="hint">Hazır bakım aralıkları genel öneridir; aracının üretici kitapçığına göre değiştirebilirsin.</div><div class="formrow"><div class="field"><label>Hedef KM</label><input id="dueKm" name="dueKm" type="number" value="${x.dueKm??''}"></div><div class="field"><label>Hedef Tarih</label><input id="dueDate" name="dueDate" type="date" value="${x.dueDate||''}"></div></div><div class="formrow"><div class="field"><label>Masraf</label><input name="cost" type="number" step="0.01" value="${x.cost??0}"></div><div class="field"><label>Yapıldığı Tarih</label><input name="dateDone" type="date" value="${x.dateDone||''}"></div></div><div class="field"><label>Not</label><textarea name="note">${esc(x.note||'')}</textarea></div><label class="toggle"><span>İşlem tamamlandı</span><input type="checkbox" name="completed" ${x.completed?'checked':''}></label><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeMaintenance('${id}')">Sil</button>`:''}</form>`)}
function applyMaintPreset(name){const p=maintPresets[name];if(!p)return;const v=activeVehicle();if(p[0])document.getElementById('dueKm').value=(v?.km||0)+p[0];if(p[1])document.getElementById('dueDate').value=addMonths(new Date(),p[1])}
function saveMaintenance(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,name:f.get('name').trim(),dueKm:f.get('dueKm')?+f.get('dueKm'):null,dueDate:f.get('dueDate')||'',cost:+f.get('cost')||0,dateDone:f.get('dateDone')||'',note:f.get('note').trim(),completed:f.get('completed')==='on'};if(o.completed&&!o.dateDone)o.dateDone=today();upsert('maintenance',o,id);try{Android.cancelMaintenanceReminder(o.id);if(!o.completed&&o.dueDate){Android.requestNotificationPermission();Android.scheduleMaintenanceReminder(o.id,o.name,o.dueDate)}}catch(e){}delete state.prefs.kmNotify[o.id];closeModal();runKmAlerts();save()}
function removeMaintenance(id){try{Android.cancelMaintenanceReminder(id)}catch(e){}removeRec('maintenance',id)}
function openTire(id=''){const x=vf(state.tires).find(v=>v.id===id)||{};modal(id?'Lastik Setini Düzenle':'Lastik Seti Ekle',`<form class="form" onsubmit="saveTire(event,'${id}')"><div class="formrow"><div class="field"><label>Sezon</label><select name="season">${optList(['Yazlık','Kışlık','Dört Mevsim'],x.season||'Yazlık','Sezon seç')}</select></div><div class="field"><label>Ölçü</label><select name="size">${optList(TIRE_SIZES,x.size,'Ölçü seç')}</select></div></div><div class="formrow"><div class="field"><label>Marka</label><select name="brand">${optList(TIRE_BRANDS,x.brand,'Marka seç')}</select></div><div class="field"><label>Durum</label><select name="model">${optList(['Yeni','İyi','Orta','Değişim Yakın','Bilinmiyor'],x.model,'Durum seç')}</select></div></div><div class="formrow"><div class="field"><label>Takılma KM</label><input type="number" name="fittedKm" value="${x.fittedKm??activeVehicle().km}"></div><div class="field"><label>Diş Derinliği (mm)</label><input type="number" step="0.1" name="tread" value="${x.tread??''}"></div></div><div class="formrow"><div class="field"><label>Satın Alma Tarihi</label><input type="date" name="purchaseDate" value="${x.purchaseDate||''}"></div><div class="field"><label>Takılma Tarihi</label><input type="date" name="fittedDate" value="${x.fittedDate||today()}"></div></div><label class="toggle"><span>Şu anda araçta takılı</span><input type="checkbox" name="active" ${x.active?'checked':''}></label><div class="field"><label>Not (isteğe bağlı)</label><textarea name="note">${esc(x.note||'')}</textarea></div><button class="primary wide">Kaydet</button>${id?`<button type="button" class="danger wide" onclick="removeRec('tires','${id}')">Sil</button>`:''}</form>`) }
function saveTire(e,id){e.preventDefault();const f=new FormData(e.target),o={id:id||uid(),vehicleId:activeVehicle().id,season:f.get('season'),size:f.get('size').trim(),brand:f.get('brand').trim(),model:f.get('model').trim(),fittedKm:+f.get('fittedKm'),tread:f.get('tread'),purchaseDate:f.get('purchaseDate'),fittedDate:f.get('fittedDate'),active:f.get('active')==='on',note:f.get('note').trim()};if(o.active)state.tires=state.tires.map(x=>x.vehicleId===o.vehicleId?{...x,active:false}:x);upsert('tires',o,id);closeModal();save()}
function upsert(k,o,id){state[k]=id?state[k].map(x=>x.id===id?o:x):[...state[k],o]}
function removeRec(k,id){if(confirm('Bu kayıt silinsin mi?')){state[k]=state[k].filter(x=>x.id!==id);closeModal();save()}}
