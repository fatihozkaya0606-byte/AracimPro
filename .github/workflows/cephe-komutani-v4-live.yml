name: Cephe Komutani v4 Live Battle Test APK
on:
  push:
    branches: [ cephe-komutani-v4-live-battle ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate live-battle source
        run: |
          grep -Fq "versionCode 4" cephe-komutani/app/build.gradle
          grep -Fq "com.cephekomutani.livebattle" cephe-komutani/app/build.gradle
          grep -Fq "function beginLiveBattle" cephe-komutani/app/src/main/assets/index.html
          grep -Fq "function drawMovingColumn" cephe-komutani/app/src/main/assets/index.html
          grep -Fq "CANLI TAARRUZU BAŞLAT" cephe-komutani/app/src/main/assets/index.html
          test $(wc -c < cephe-komutani/app/src/main/assets/index.html) -gt 500000
      - name: Build test APK
        run: gradle -p cephe-komutani --no-daemon :app:assembleDebug
      - name: Verify artifact
        run: test -s cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cephe-Komutani-v4-Canli-Harekat-APK
          path: cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30