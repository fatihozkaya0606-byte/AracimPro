name: AracimPro v254 Startup Recovery Signed AAB

on:
  push:
    branches: [ aracimpro-254-startup-recovery-hotfix ]
  pull_request:
    branches: [ aracimpro-253-signed-no-forced-refresh ]
  workflow_dispatch:

jobs:
  signed-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Test ad policy and launch recovery protection
        run: |
          set -euo pipefail
          bash tools/test-bottom-banner.sh
          grep -q "versionCode 254" app/build.gradle
          grep -q 'onRenderProcessGone' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'startupRecovery254' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'elapsedOnSplash < 4700L' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q "versionName '7.12.6'" app/build.gradle
          grep -q "ADMOB_TEST_MODE', 'false'" app/build.gradle
          grep -q 'if (refreshing) return;' app/src/main/java/com/aracimpro/app/NativeFeedController146.java
          grep -q 'if (mrecAdLoaded || mrecAdView == null' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'SDK owns refresh after a successful load' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'if (loaded)' app/src/main/java/com/aracimpro/app/BottomBannerPolicy.java
          grep -q 'ca-app-pub-7205009121067400/9497290996' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'ca-app-pub-7205009121067400/3129664519' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'com.yandex.ads.adapter:admob-mobileads' app/build.gradle
          grep -q 'com.google.ads.mediation:unity' app/build.gradle
          grep -q 'com.google.ads.mediation:vungle' app/build.gradle
          echo 'PASS: ad unit IDs unchanged; native manual refresh disabled; initial no-fill retries retained.'
      - name: Restore existing Google Play upload signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed production AAB with original AdMob mediation
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          NATIVE_AD_UNIT_ID: ${{ secrets.NATIVE_AD_UNIT_ID }}
          MIDDLE_VIDEO_NATIVE_AD_UNIT_ID: ${{ secrets.MIDDLE_VIDEO_NATIVE_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:bundleRelease 2>&1 | tee v254-release-build.log
      - name: Verify bundle signature, payload and create download
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB"
          unzip -Z1 "$AAB" | grep -F -q 'base/manifest/AndroidManifest.xml'
          mkdir -p out
          cp "$AAB" out/AracimPro-v254-7.12.6-StartupRecovery-SIGNED.aab
          sha256sum out/AracimPro-v254-7.12.6-StartupRecovery-SIGNED.aab > out/SHA256.txt
          cat > out/README.txt <<EOF
          Aracim Pro 7.12.6 - versionCode 254
          Production signed Android App Bundle (.aab), Play upload key from existing GitHub secret.
          This artifact was NOT submitted to Google Play.
          Verified: signed AAB, bundle integrity, native manual auto-refresh removal,
          no application-driven banner or MREC retries after successful initial load.
          Initial no-fill recovery remains. Existing live ad unit IDs/mediation are unchanged.
          Check Play Console versionCode and remaining Play warnings before promotion.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AracimPro-v254-SIGNED-AAB-No-Forced-Refresh
          path: |
            out/
            v254-release-build.log
          if-no-files-found: ignore
          retention-days: 30

  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build debug APK and launch in Android emulator (sample ads only)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            set -euo pipefail
            gradle --no-daemon --max-workers=2 :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.aracimpro.app.neonpreview/com.aracimpro.app.MainActivity
            sleep 14
            adb shell pidof com.aracimpro.app.neonpreview
            adb logcat -d -v time > emulator-logcat.txt
            if grep -q 'FATAL EXCEPTION' emulator-logcat.txt && grep -q 'Process: com.aracimpro.app.neonpreview' emulator-logcat.txt; then
              echo 'FAIL: app crashed during startup'
              exit 1
            fi
            grep -q 'debug_home_ready_244' emulator-logcat.txt
            echo 'PASS: WebView reached home screen and Android process stayed alive.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AracimPro-v254-emulator-logcat
          path: emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
