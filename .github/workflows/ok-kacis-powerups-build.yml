name: OK Kacis Banner + Rewarded Preview APK (isolated)
on:
  push:
    branches: [ok-kacis-powerups-dev]
    paths:
      - 'game-development/game.js'
      - 'game-development/index.html'
      - 'game-development/style.css'
      - 'game-development/native/MainActivity.java'
      - 'game-development/game.integration.test.js'
      - 'game-development/boosters.js'
      - 'game-development/boosters.test.js'
      - '.github/workflows/ok-kacis-powerups-build.yml'
  pull_request:
    branches: [ok-kacis-game-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK for version 4.3 preview
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Extract current release 4.2 and overlay isolated gameplay + layout changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-src
          unzip -q OkKacis_4_2_KaynakKod.zip -d preview-src
          for asset in game.js index.html style.css; do
            test -s "game-development/$asset"
            cp "game-development/$asset" "preview-src/OkKacis/app/src/main/assets/$asset"
          done
          node --check preview-src/OkKacis/app/src/main/assets/game.js
          grep -q 'goal-arrow' preview-src/OkKacis/app/src/main/assets/index.html
          grep -q '4.3.1 OK Kacis' preview-src/OkKacis/app/src/main/assets/style.css
          node --test game-development/*.test.js
          test -s game-development/native/MainActivity.java
          cp game-development/native/MainActivity.java preview-src/OkKacis/app/src/main/java/com/okkacis/game/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("preview-src/OkKacis/app/build.gradle")
          s = p.read_text()
          for old,new in [
            ("compileSdk 35","compileSdk 36"),
            ("targetSdk 35","targetSdk 36"),
            ("versionCode 14","versionCode 16"),
            ("versionName '4.2.0'","versionName '4.3.2'"),
          ]:
              if s.count(old) != 1: raise RuntimeError(f"Expected one: {old}")
              s=s.replace(old,new)
          s += """
          android {
            buildTypes {
              debug {
                applicationIdSuffix '.dev'
                versionNameSuffix '-preview'
              }
            }
          }
          """
          s += """
          dependencies {
            implementation 'com.google.android.gms:play-services-ads:25.5.0'
          }
          """
          p.write_text(s)
          manifest = Path("preview-src/OkKacis/app/src/main/AndroidManifest.xml")
          xml=manifest.read_text()
          assert xml.count("<application ") == 1
          assert xml.count("</application>") == 1
          xml=xml.replace("<application ", """<uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application """, 1)
          xml=xml.replace("</application>", """  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />
            </application>""",1)
          manifest.write_text(xml)
          PY
      - name: Build test-only APK with separate application ID
        working-directory: preview-src/OkKacis
        run: gradle --no-daemon assembleDebug
      - name: Check output artifact
        run: test -s preview-src/OkKacis/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OK-Kacis-4.3.2-Banner-Rewarded-TEST-APK
          path: preview-src/OkKacis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
