name: AracimPro Start.io Banner Preview (no Play publish)
on:
  push:
    branches: [aracimpro-83-startio-banner-preview]
  pull_request:
    branches: [aracimpro-play-quality-83]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Check Start.io preview has no full-screen ads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          s=Path('app/src/main/java/com/aracimpro/app/MainActivity.java').read_text()
          assert "applicationIdSuffix '.startiopreview'" in g
          assert "com.startapp:inapp-sdk:5.+" in g
          assert "com.google.android.gms:play-services-ads:" not in g
          assert "com.google.android.ump:user-messaging-platform:" not in g
          assert '209956112' in m and '209956112' in s
          assert 'com.startapp.sdk.SPLASH_ENABLED' in m
          assert 'com.startapp.sdk.RETURN_ADS_ENABLED' in m
          assert 'showInterstitialOnce' not in s
          assert 'onFailedToReceiveAd(View view)' in s
          assert 'startBannerLoaded && !premiumActive && apPremiumSplashHidden' in s
          assert 'StartAppSDK.setTestAdsEnabled(true)' in s
          print('OK: isolated test app, start.io, banner-only, no empty banner area')
          PY
      - name: Build debug-only APK
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon assembleDebug
      - name: Ensure APK is present
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-Startio-Banner-Debug-Preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
