name: Galeri Krali 3D - Godot Android Test
on:
  push:
    branches:
      - galeri-krali-test-apk-fix
    paths:
      - 'galeri3d/**'
      - '.github/workflows/galeri-godot-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Android export templates and SDK paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          grep -n "export/android" "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Download properly licensed real 3D models
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p galeri3d/assets
          git clone --depth=1 --filter=blob:none --sparse https://github.com/JaronKBragg7337/spectral-gt-rs.git /tmp/car-spectral
          git -C /tmp/car-spectral sparse-checkout set spectral_gt_rs_game_ready.glb
          git clone --depth=1 --filter=blob:none --sparse https://github.com/KhronosGroup/glTF-Sample-Assets.git /tmp/gltf-samples
          git -C /tmp/gltf-samples sparse-checkout set Models/CarConcept/glTF-Binary Models/CesiumMan/glTF-Binary
          cp /tmp/car-spectral/spectral_gt_rs_game_ready.glb galeri3d/assets/spectral_gt_rs_game_ready.glb
          cp /tmp/gltf-samples/Models/CarConcept/glTF-Binary/CarConcept.glb galeri3d/assets/CarConcept.glb
          cp /tmp/gltf-samples/Models/CesiumMan/glTF-Binary/CesiumMan.glb galeri3d/assets/CesiumMan.glb
          for a in galeri3d/assets/*.glb; do
            test -s "$a"
            test "$(wc -c < "$a")" -gt 30000
            echo "Validated GLB: $a : $(wc -c < "$a") bytes"
          done
      - name: Fetch properly attributed realistic vehicles and people
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'galeri3d/assets';
            const cars = [
              'bmw-m4-csl','mercedes-benz-mersedes-e-class','hyundai-tucson',
              'audi-a6','porsche-panamera','hyundai-elantra','bmw-x5',
              'bmw-m3','mercedes-benz-mersedes-s-class','audi-a4'
            ];
            const entries = [
              ...cars.map(id=>({file:'cars/'+id+'.glb',url:'https://raw.githubusercontent.com/pedrosoandre/carros/main/assets/'+id+'.glb'})),
              {file:'people/dealer.glb',url:'https://models.codelove.in/models/business-male-02.glb'},
              {file:'people/dealer2.glb',url:'https://models.codelove.in/models/business-male-01.glb'},
              {file:'people/customer.glb',url:'https://models.codelove.in/models/business-female-01.glb'},
              {file:'people/hero.glb',url:'https://vibeassets.io/download/zpepqtthci?combined=1'}
            ];
            for (const item of entries) {
              let last;
              for(let retry=0;retry<3;retry++){
                try{
                  const resp=await fetch(item.url,{headers:{'User-Agent':'GaleriKraliGamePrototype/1.0'}});
                  if(!resp.ok)throw Error('HTTP '+resp.status+' '+item.url);
                  const data=Buffer.from(await resp.arrayBuffer());
                  if(data.toString('ascii',0,4)!=='glTF' || data.length<10000)throw Error('Invalid GLB '+item.url+' bytes='+data.length);
                  const dest=path.join(root,item.file);
                  fs.mkdirSync(path.dirname(dest),{recursive:true});
                  fs.writeFileSync(dest,data);
                  core.info(item.file+': '+data.length+' bytes');
                  last=null;
                  break;
                }catch(err){last=err; core.warning('retry '+item.file+': '+String(err))}
              }
              if(last)throw last;
            }
      - name: Godot version and project import
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          godot --headless --path galeri3d --editor --quit 2>&1 | tee /tmp/galeri-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:.*game.gd' /tmp/galeri-import.log; then exit 31; fi
      - name: Runtime smoke test (60 frames)
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path galeri3d --quit-after 60 2>&1 | tee /tmp/galeri-runtime.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:.*game.gd|Invalid call|Invalid access' /tmp/galeri-runtime.log; then exit 32; fi
      - name: Fail if vehicles or characters regress to toy placeholders
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path galeri3d --script res://validate_visual_assets.gd \
            2>&1 | tee /tmp/galeri-model-test.log
          grep -q 'VISUAL_ASSET_GATE_PASS' /tmp/galeri-model-test.log
      - name: Render gameplay screenshot for visual quality review
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a -s "-screen 0 1280x720x24" \
              godot --path galeri3d --rendering-method gl_compatibility \
              --script res://visual_capture.gd 2>&1 | tee /tmp/galeri-visual.log
            test -s galeri3d/visual_proof.png || exit 39
          else
            echo "::warning::xvfb-run unavailable; no visual verification possible in this runner."
          fi
      - name: Save screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: Galeri-Krali-3D-Visual-Evidence
          path: galeri3d/visual_proof.png
          if-no-files-found: warn
      - name: Export actual Godot Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path galeri3d --export-debug "Android" "$GITHUB_WORKSPACE/build/Galeri_Krali_3D_Gercek3D_Test.apk" 2>&1 | tee /tmp/galeri-export.log
          test -s build/Galeri_Krali_3D_Gercek3D_Test.apk
          ls -lh build/Galeri_Krali_3D_Gercek3D_Test.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/Galeri_Krali_3D_Gercek3D_Test.apk
      - name: Share APK
        uses: actions/upload-artifact@v4
        with:
          name: Galeri-Krali-3D-Godot-Test-APK
          path: build/Galeri_Krali_3D_Gercek3D_Test.apk
          if-no-files-found: error
