name: AracimPro v242 full Next-Gen Ads migration compile (NO RELEASE)

on:
  workflow_dispatch:
  push:
    branches: [ aracimpro-242-nextgen-full-app-migration-test ]
    paths:
      - '.github/workflows/aracimpro-242-nextgen-full-app-compile.yml'
      - 'app/src/main/java/com/aracimpro/app/MainActivity.java'
      - 'app/src/main/java/com/aracimpro/app/NativeFeedController146.java'
      - 'app/src/main/java/com/aracimpro/app/MiddleVideoNative237.java'
      - 'app/build.gradle'

jobs:
  compile-app-nextgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Verify migration constraints and preserve all mediation networks
        run: |
          grep -q "ads-mobile-sdk:1.6.0" app/build.gradle
          ! grep -q "implementation 'com.google.android.gms:play-services-ads:" app/build.gradle
          grep -q "com.google.android.gms', module: 'play-services-ads'" app/build.gradle
          grep -q "com.yandex.ads.adapter:admob-mobileads" app/build.gradle
          grep -q "com.google.ads.mediation:unity" app/build.gradle
          grep -q "com.google.ads.mediation:mintegral" app/build.gradle
          grep -q "com.google.ads.mediation:vungle" app/build.gradle
          grep -q "com.admost.sdk:admob-adapter" app/build.gradle
          grep -q 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' app/src/main/java/com/aracimpro/app/MainActivity.java
          echo "No live release. Compiling App code and Next-Gen ads only."
      - name: Compile complete Android app with Next-Gen ads
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:compileDebugJavaWithJavac 2>&1 | tee v242-compile.log
      - name: Upload compile diagnostics even when compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v242-NEXTGEN-COMPILE-LOGS-NO-APK-NO-AAB
          path: v242-compile.log
          if-no-files-found: ignore
          retention-days: 14
