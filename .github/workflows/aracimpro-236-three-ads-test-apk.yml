name: AracimPro v236 Native Plus MREC Test APK

on:
  push:
    branches: [ aracimpro-236-three-ads-test-apk ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify all three ad placements and Google test units
        run: |
          bash tools/test-bottom-banner.sh
          grep -q "applicationIdSuffix '.native236test'" app/build.gradle
          grep -q 'nativeFeed146.tryLoad()' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'createMrecAd();' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'requestBottomBanner138();' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'adView.setMediaView(media)' app/src/main/java/com/aracimpro/app/NativeFeedController146.java
          grep -q 'ca-app-pub-3940256099942544/1044960115' app/src/main/java/com/aracimpro/app/NativeFeedController146.java
          grep -q 'ca-app-pub-3940256099942544/6300978111' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'apNativeSlot146' app/src/main/assets/index.html
          grep -q 'apMrecSlot' app/src/main/assets/index.html
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Restore stable preview signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_B64" || (echo "Missing preview signing secret" >&2; exit 1)
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build three ad test APK
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Confirm APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v236-Ust-Native-Orta-Banner-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
