name: AracimPro v258 Android 15 EdgeToEdge and R8 Audit - Signed AAB

on:
  push:
    branches: [aracimpro-258-edge-to-edge-r8-audit]
  workflow_dispatch:

jobs:
  build-signed-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Verify only ordinary interstitial ads disabled
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("app/src/main/java/com/aracimpro/app/MainActivity.java").read_text()
          g=Path("app/build.gradle").read_text()
          assert "versionCode 258" in g and "versionName '7.12.10'" in g
          assert "private static final boolean ENABLE_INTERSTITIAL_ADS_256 = false;" in src
          assert "WindowCompat.enableEdgeToEdge(getWindow());" in src
          assert "WindowCompat.setDecorFitsSystemWindows(getWindow(), false);" not in src
          assert "WindowInsetsCompat.Type.displayCutout()" in src
          assert "WindowInsetsCompat.Type.systemBars()" in src
          assert "WindowInsetsCompat.Type.ime()" in src
          theme=Path("app/src/main/res/values-v30/styles.xml").read_text()
          assert 'name="android:windowLayoutInDisplayCutoutMode">always' in theme
          assert not any(x in src for x in ["getWindow().setStatusBarColor(", "getWindow().setNavigationBarColor("])
          for signature in [
              "private void loadSingleInterstitial()",
              "private void loadRecordInterstitial147()",
              "private void requestInterstitialAfterVehicleSaved122()",
              "private void showRecordInterstitial147(String type)",
              "private void testInterstitial141()"
          ]:
              assert signature + " {\n        if (!ENABLE_INTERSTITIAL_ADS_256) return;" in src, signature
          assert "private boolean requestOneInterstitialForNavigation(String target) {\n        if (!ENABLE_INTERSTITIAL_ADS_256) return false;" in src
          for preserved in ["requestMiddleVideoFirst237();", "loadAppOpenDuringSplash122();",
                            "loadExcelRewardedAd124();", "nativeFeed146.tryLoad();",
                            "requestBottomBanner138();", "createAdMobBanner();", "createMrecAd();"]:
              assert preserved in src, preserved
          print("PASS: interstitial-only disable and all other formats preserved")
          PY
          bash tools/test-bottom-banner.sh
      - name: Restore original Google Play upload signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build signed release AAB (not uploaded to Play)
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          NATIVE_AD_UNIT_ID: ${{ secrets.NATIVE_AD_UNIT_ID }}
          MIDDLE_VIDEO_NATIVE_AD_UNIT_ID: ${{ secrets.MIDDLE_VIDEO_NATIVE_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 :app:bundleRelease
      - name: Check real release AAB R8 percentages and vendor SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          bundle=Path("app/build/outputs/bundle/release/app-release.aab")
          with zipfile.ZipFile(bundle) as z:
              r8=json.loads(z.read("BUNDLE-METADATA/com.android.tools/r8.json"))
          stats=r8["stats"]
          optimization=100-stats["noOptimizationPercentage"]
          obfuscation=100-stats["noObfuscationPercentage"]
          shrinking=100-stats["noShrinkingPercentage"]
          print("R8 optimization:",round(optimization,2))
          print("R8 obfuscation:",round(obfuscation,2))
          print("R8 shrinking:",round(shrinking,2))
          assert optimization>=25 and obfuscation>=25, "R8 low scores"
          g=Path("app/build.gradle").read_text()
          assert "minifyEnabled true" in g and "shrinkResources true" in g
          print("Yandex Mobile Ads 8.6.0 and AdMob adapter version must be validated by Play for deprecated API warning")
          PY
      - name: Verify signed bundle and size
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB"
          unzip -Z1 "$AAB" | grep -F -q 'base/manifest/AndroidManifest.xml'
          mkdir -p out
          cp "$AAB" out/AracimPro-v258-7.12.10-EdgeToEdge-R8-Audit-SIGNED.aab
          sha256sum out/*.aab > out/SHA256.txt
          echo "Aracim Pro 258 (7.12.10). AndroidX edge-to-edge configured; interstitial only disabled. Yandex external SDK deprecated-API warning may remain. No Play upload." > out/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v258-SIGNED-AAB-EdgeToEdge-R8-Audit
          path: out/
          retention-days: 30
