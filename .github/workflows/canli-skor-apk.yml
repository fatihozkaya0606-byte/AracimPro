name: Canli Skor Test APK
on:
  workflow_dispatch:
  pull_request:
    branches: [canli-skor-app]
    paths: ['CanliSkor/**', '.github/workflows/canli-skor-apk.yml']
  push:
    branches: [canli-skor-app]
    paths: [ 'CanliSkor/**', '.github/workflows/canli-skor-apk.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: CanliSkor
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CanliSkor-Test-APK
          path: CanliSkor/app/build/outputs/apk/debug/app-debug.apk
