name: Dunya Penceresi APK
on:
  push:
    branches:
      - dunya-penceresi-apk
    paths:
      - 'dunya-penceresi/**'
      - '.github/workflows/dunya-penceresi-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check SDK availability
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Build debug APK
        run: gradle -p dunya-penceresi :app:assembleDebug --stacktrace --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: dunya-penceresi-test-apk
          path: dunya-penceresi/app/build/outputs/apk/debug/app-debug.apk
