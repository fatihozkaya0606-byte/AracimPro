name: AracimPro 100 Stable Rollback - Signed Play AAB
on:
  push:
    branches: [aracimpro-100-stable-rollback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Check stable V97 layout, rollback, language, AdMob, correct Play identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          h=Path('app/src/main/assets/index.html').read_text()
          n=Path('app/src/main/java/com/aracimpro/app/MainActivity.java').read_text()
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          assert "applicationId 'com.aracimpro.app'" in g
          assert 'versionCode 100' in g and "versionName '7.11.25'" in g
          assert "const V='7.11.25'" in h
          assert "buildConfigField 'boolean', 'ADMOB_TEST_MODE', 'false'" in g
          assert 'neon-dashboard-97.js' in h and 'neon-dashboard-97.css' in h
          assert 'rollback-100.css' in h
          assert 'ap100Language' in h and 'onclick="languageModal()"' in h
          assert "online-presence-98.js" not in h
          assert "language-shortcut-99.js" not in h
          assert "function ensureHomeFuelPrices(){\n  // V100" in h
          assert "function refreshNearbyFuelPrices(showToast=true){\n  // V100" in h
          assert "function apRefreshPresence(){/* V100" in h
          assert "window.onPresenceCount=(count,error)" in h
          assert "function openFuel(id='')" in h
          assert 'fuelRangeModal()' in h and 'apMrecCardHtml()' in h
          assert "requestAdMobConsentIfNeeded" in n
          assert 'updateMrecSlotNative' in n
          assert 'com.google.android.gms.ads.APPLICATION_ID' in m
          assert 'ca-app-pub-7205009121067400~4069879501' in m
          assert "com.startapp:inapp-sdk" not in g
          print('PASS: stable Neon V97 layout, V100 rollback, fuel-record retention, language access and live AdMob')
          PY
          node --check app/src/main/assets/r8plus-clean.js
          node --check app/src/main/assets/neon-dashboard-97.js
      - name: Build side-by-side V100 test APK
        run: gradle --no-daemon assembleDebug
      - name: Restore Play upload signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_B64" || (echo "Upload keystore secret missing" >&2; exit 1)
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build SIGNED AAB for manual review (never auto-publish)
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon bundleRelease
      - name: Check release outputs
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -F -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v100-STABLE-ROLLBACK-SIGNED-AAB-AND-TEST-APK
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
