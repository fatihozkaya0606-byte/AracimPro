name: Nur Rehberi Ezan Test APK
on:
  push:
    branches:
      - nur-rehberi-ezan
    paths:
      - 'nur-rehberi/**'
      - '.github/workflows/nur-rehberi-ezan.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Nur Rehberi JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          page=pathlib.Path("nur-rehberi/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",page)
          assert scripts, "No application JavaScript found"
          pathlib.Path("/tmp/nur-rehberi.js").write_text("\n".join(scripts),encoding="utf-8")
          assert "royal-tile" in page and "royal-audio-row" in page
          assert "function home()" in page and "function adhan()" in page
          PY
          node --check /tmp/nur-rehberi.js
          node --check nur-rehberi/app/src/main/assets/features.js
          node --check nur-rehberi/app/src/main/assets/tafsir_reader.js
          node --check nur-rehberi/app/src/main/assets/premium_hafiz.js
          node --check nur-rehberi/app/src/main/assets/book_reader.js
          grep -q 'book_reader.js' nur-rehberi/app/src/main/assets/index.html
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('nur-rehberi/app/src/main/assets')
          features=(root/'features.js').read_text(encoding='utf-8')
          book=(root/'book_reader.js').read_text(encoding='utf-8')
          assert "nrLibraryButton(route)" in features
          assert "'Oku'" not in features
          assert len(re.findall(r"^ \{name:",book,flags=re.MULTILINE))>=12
          assert 'nrGuideChange' in book
          assert 'RecitationPlayer' in pathlib.Path('nur-rehberi/app/src/main/java/com/nurrehberi/app/MainActivity.java').read_text()
          PY
          grep -q 'tafsir_reader.js' nur-rehberi/app/src/main/assets/index.html
          grep -q 'function tefsirKitap()' nur-rehberi/app/src/main/assets/tafsir_reader.js
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('nur-rehberi/app/src/main/assets')
          esma=json.loads((root/'esma.json').read_text(encoding='utf-8'))
          assert len(esma)==99,len(esma)
          names={row['name'] for row in esma}
          assert len(names)==99
          html=(root/'index.html').read_text(encoding='utf-8')
          for feature in ['books','tefsir','hadis','dualar','esma','elifba','bildirimler']:
            assert "'"+feature+"'" in html,feature
          assert 'features.js' in html
          PY
      - name: Bundle verified MP3Quran reciter catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,time,urllib.request,pathlib
          sources=[
            'https://www.mp3quran.net/api/v3/reciters?language=tr',
            'https://mp3quran.net/api/v3/reciters?language=eng',
            'https://www.mp3quran.net/api/v3/reciters?language=eng',
          ]
          errors=[]
          payload=None
          for url in sources:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; NurRehberiQA/1.1)','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=28) as resp:
                payload=json.load(resp)
              if len(payload.get('reciters',[]))>=90:
                print('Catalog fetched:',url,len(payload['reciters']))
                break
              errors.append(f'{url}: Too few reciters')
              payload=None
            except Exception as exc:
              errors.append(f'{url}: {str(exc)[:140]}')
          if not payload:
            print('ERR:',*errors,sep='\n')
            raise SystemExit('Cannot fetch authorized reciter catalog: refusing a broken APK')
          entries=[]
          for reciter in payload['reciters']:
            name=reciter.get('name')
            if not name: continue
            for mashaf in reciter.get('moshaf') or []:
              server=str(mashaf.get('server') or '')
              if not re.match(r'^https://(?:[a-z0-9-]+\.)*mp3quran\.net/',server,re.I): continue
              available=sorted(set(int(x) for x in str(mashaf.get('surah_list') or '').split(',') if x.strip().isdigit() and 1<=int(x)<=114))
              if not available: continue
              entries.append({'id':str(reciter['id'])+'-'+str(mashaf.get('id','0')),
                 'name':name,'moshaf':str(mashaf.get('name') or ''),'server':server.rstrip('/')+'/',
                 'available':available})
          if len(entries)<90:raise SystemExit(f'Only {len(entries)} valid recordings')
          dest=pathlib.Path('nur-rehberi/app/src/main/assets/reciters.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(entries,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(f'Bundled {len(entries)} recitation variants / {len(set(r["name"] for r in entries))} reciters; {dest.stat().st_size} bytes')
          print('Selected reciters:')
          for r in entries:
            if any(n in r['name'].lower() for n in ['basit','afasi','sudais','meaqli','minshawi']):
              print(r['name'],len(r['available']),r['server'])
          PY
      - name: Verify and bundle in-app Quran Central streaming catalog
        run: |
          python3 nur-rehberi/scripts/build_premium_reciters.py
          python3 - <<'PY'
          import json
          data=json.load(open('nur-rehberi/app/src/main/assets/premium_recitations.json'))
          tracks=data.get('readers',[{}])[0].get('tracks',[]) if data.get('readers') else []
          assert len(tracks)>=15,"Publisher stream verification insufficient: "+str(len(tracks))
          assert all(t['url'].startswith('https://') for t in tracks)
          print('Verified in-app Sadien tracks:',len(tracks))
          PY
      - name: Verify Turkish tafsir reader data API
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://raw.githubusercontent.com/spa5k/tafsir_api/main/tafsir/'
          samples=['turkish-mokhtasar','turkish-tafsir-as-saadi-turkish']
          for slug in samples:
            url=base+slug+'/1.json'
            req=urllib.request.Request(url,headers={'User-Agent':'NurRehberi/1.4 QA'})
            with urllib.request.urlopen(req,timeout=18) as resp:
              rows=json.load(resp)
            assert len(rows)==7,(slug,len(rows))
            assert all(isinstance(r.get('text'),str) and len(r['text'])>15 for r in rows)
            print('Verified Turkish in-app tafsir API:',slug,len(rows),'verses')
          PY
      - name: Verify featured Quran reciter MP3 streams
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,concurrent.futures,pathlib
          ids=['51-51','125-288','112-113','106-10912','9-9','121-122','241-241','118-119','128-128','4-4']
          src=pathlib.Path('nur-rehberi/app/src/main/assets')
          records={r['id']:r for r in json.loads((src/'reciters.json').read_text(encoding='utf-8'))}
          def check(id):
            r=records.get(id)
            if not r or not r['available']:return (id,False,'missing catalog')
            n=r['available'][0]
            url=r['server']+str(n).zfill(3)+'.mp3'
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 NurRehberi','Range':'bytes=0-1023','Accept':'audio/mpeg,*/*'})
              with urllib.request.urlopen(request,timeout=17) as resp:
                data=resp.read(1024)
                ctype=resp.headers.get('Content-Type','')
                valid=(resp.status in (200,206) and len(data)>=128 and ('audio/' in ctype or 'octet-stream' in ctype or data[:3] in (b'ID3',)))
              return (id,valid,ctype)
            except Exception as e:return (id,False,str(e)[:90])
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as exe:
            result=list(exe.map(check,ids))
          verified=[id for id,ok,_ in result if ok]
          for id,ok,detail in result:print('verified' if ok else 'unverified',id,detail)
          (src/'featured_verified.json').write_text(json.dumps(verified),encoding='utf-8')
          print('Featured live MP3 streams tested:',len(verified),'/',len(ids))
          PY
      - name: Build offline licensed adhan audio assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p nur-rehberi/app/src/main/assets/audio
          mkdir -p /tmp/nur-adhans
          cd /tmp/nur-adhans
          useragent="NurRehberi/0.6 (licenced-content-testing; Wikimedia Commons)"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 180 -A "$useragent" \
            "https://upload.wikimedia.org/wikipedia/commons/a/a7/Adhan%2C_Great_Mosque_of_Mecca_-_Jan_21%2C_2013.webm" -o mecca_2013.webm
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 180 -A "$useragent" \
            "https://upload.wikimedia.org/wikipedia/commons/6/6d/Maghrib_Adhan_at_the_Masjid_al_Haram%2C_Mecca_-_25_Feb%2C_2012.webm" -o mecca_2012.webm
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 180 -A "$useragent" \
            "https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg" -o beautiful_adhan.ogg
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 180 -A "$useragent" \
            "https://upload.wikimedia.org/wikipedia/commons/7/7d/The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3" -o aaqib_azeez.mp3
          for file in *.ogg *.webm *.mp3; do
            ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$file"
          done
          out="$GITHUB_WORKSPACE/nur-rehberi/app/src/main/assets/audio"
          ffmpeg -nostdin -v error -y -i mecca_2013.webm -vn -ac 1 -ar 44100 -c:a libmp3lame -b:a 96k "$out/mecca_2013.mp3"
          ffmpeg -nostdin -v error -y -i mecca_2012.webm -vn -ac 1 -ar 44100 -c:a libmp3lame -b:a 96k "$out/mecca_2012.mp3"
          ffmpeg -nostdin -v error -y -i beautiful_adhan.ogg -vn -ac 1 -ar 44100 -c:a libmp3lame -b:a 96k "$out/beautiful_adhan.mp3"
          ffmpeg -nostdin -v error -y -i aaqib_azeez.mp3 -vn -ac 1 -ar 44100 -c:a libmp3lame -b:a 96k "$out/aaqib_azeez.mp3"
          for file in "$out"/*.mp3; do
            test "$(stat -c%s "$file")" -gt 100000 || exit 1
            ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$file"
          done
          mkdir -p "$GITHUB_WORKSPACE/nur-rehberi/app/src/main/res/raw"
          # 14-second licensed excerpt, for notification-channel sound only.
          ffmpeg -nostdin -v error -y -ss 00:00:18 -i mecca_2013.webm -t 14 -vn -ac 1 -ar 44100 -c:a libmp3lame -b:a 96k "$GITHUB_WORKSPACE/nur-rehberi/app/src/main/res/raw/ezan_notify.mp3"
          test "$(stat -c%s "$GITHUB_WORKSPACE/nur-rehberi/app/src/main/res/raw/ezan_notify.mp3")" -gt 20000
                    ls -lh "$out"/*.mp3
      - name: Build debug APK
        run: gradle -p nur-rehberi :app:assembleDebug --stacktrace --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NurRehberi-3D-Plus-v1.5-Fix
          path: nur-rehberi/app/build/outputs/apk/debug/app-debug.apk
