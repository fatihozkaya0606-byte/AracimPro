name: Kapisma Arena Test APK
on:
  push:
    branches: [kapisma-arena-apk]
    paths:
      - 'kapisma-arena/**'
      - '.github/workflows/kapisma-test-apk.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build standalone Kapisma Arena APK
        run: cd kapisma-arena && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KapismaArena-Test-APK
          path: kapisma-arena/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
