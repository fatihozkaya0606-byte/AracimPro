name: AracimPro v247 Trace Deprecated Android API Actual Caller (NO PUBLISH)

on:
  workflow_dispatch:
  push:
    branches: [ aracimpro-247-play-deprecated-api-caller-trace ]
    paths: [ '.github/workflows/aracimpro-247-short-edges-caller-trace.yml' ]

jobs:
  release-bytecode-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK required by app
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/build-tools/36.0.0/dexdump"
      - name: Restore existing private signing key only inside runner
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_B64" || (echo "Missing signing key" >&2; exit 1)
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Confirm new SDK and preserve every existing mediation network
        run: |
          set -eu
          grep -q "ads-mobile-sdk:1.6.0" app/build.gradle
          ! grep -q "implementation 'com.google.android.gms:play-services-ads:" app/build.gradle
          grep -q "module: 'play-services-ads-lite'" app/build.gradle
          grep -q "com.yandex.ads.adapter:admob-mobileads" app/build.gradle
          grep -q "com.google.ads.mediation:unity" app/build.gradle
          grep -q "com.google.ads.mediation:mintegral" app/build.gradle
          grep -q "com.google.ads.mediation:vungle" app/build.gradle
          grep -q "com.admost.sdk:admob-adapter" app/build.gradle
          bash tools/test-bottom-banner.sh
      - name: Build optimized internal release AAB for bytecode analysis ONLY
        shell: bash
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          NATIVE_AD_UNIT_ID: ${{ secrets.NATIVE_AD_UNIT_ID }}
          MIDDLE_VIDEO_NATIVE_AD_UNIT_ID: ${{ secrets.MIDDLE_VIDEO_NATIVE_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:bundleRelease 2>&1 | tee v245-release-audit-build.log
      - name: Audit actual release DEX bytecode and R8 mapping
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          python3 tools/audit-play-warnings-v245.py
          cat app/build/outputs/play-audit-v245/report.txt
      - name: Identify exact callers of SHORT_EDGES helper in release DEX
        run: |
          python3 tools/audit-play-callers-v247.py
          cat app/build/outputs/play-audit-v247/deprecated-api-callers.txt
      - name: Upload ONLY summary and mapping (NO APK / NO AAB / NO Play publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v247-Deprecated-API-Caller-Report-ONLY
          path: |
            app/build/outputs/play-audit-v245/report.txt
            app/build/outputs/play-audit-v247/deprecated-api-callers.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/r8-report/summary.txt
            v245-release-audit-build.log
          if-no-files-found: ignore
          retention-days: 14
