name: AracimPro v242 Next-Gen SDK R8 release audit (NO RELEASE)

on:
  workflow_dispatch:
  push:
    branches: [ aracimpro-242-nextgen-full-app-migration-test ]
    paths: [ '.github/workflows/aracimpro-242-nextgen-r8-audit.yml' ]

jobs:
  r8-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Verify migration removed legacy GMA dependency and retained mediators
        run: |
          grep -q "ads-mobile-sdk:1.6.0" app/build.gradle
          ! grep -q "implementation 'com.google.android.gms:play-services-ads:" app/build.gradle
          grep -q "com.yandex.ads.adapter:admob-mobileads" app/build.gradle
          grep -q "com.google.ads.mediation:unity" app/build.gradle
          grep -q "com.google.ads.mediation:mintegral" app/build.gradle
          grep -q "com.google.ads.mediation:vungle" app/build.gradle
          grep -q "com.admost.sdk:admob-adapter" app/build.gradle
      - name: Run R8 optimized release minification without generating distributable APK or AAB
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:minifyReleaseWithR8 2>&1 | tee v242-r8-audit.log
      - name: Validate R8 mapping and note remaining vendor dependencies
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/mapping/release/usage.txt
          echo "R8 ran with Next-Gen Google Mobile Ads 1.6.0"
          echo "No signed APK, no AAB, no Play release."
          echo "Play Console optimization metrics and device ad fill still require separate validation."
      - name: Preserve diagnostic text only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v242-R8-DIAGNOSTICS-NO-APK-NO-AAB
          path: |
            v242-r8-audit.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: ignore
          retention-days: 14
