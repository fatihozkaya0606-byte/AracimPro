name: AracimPro v97 Neon Night - TEST APK
on:
  push:
    branches: [aracimpro-97-neon-dashboard-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install required SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Validate app integrity, Neon dashboard and native ads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          js=Path('app/src/main/assets/neon-dashboard-97.js').read_text()
          css=Path('app/src/main/assets/neon-dashboard-97.css').read_text()
          native=Path('app/src/main/java/com/aracimpro/app/MainActivity.java').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'versionCode 97' in gradle
          assert "versionName '7.11.22'" in gradle
          assert 'applicationIdSuffix' in gradle and '.neonpreview' in gradle
          assert 'neon-dashboard-97.js' in html and 'neon-dashboard-97.css' in html
          assert html.index('r8plus-clean.js') < html.index('neon-dashboard-97.js')
          assert 'apMrecCardHtml()' in js
          assert 'id="apMrecSlot"' in html
          assert '300px!important;height:250px!important' in css
          assert 'window.onPresenceCount' in html
          assert 'app_presence' in native and 'refreshPresenceCount' in native
          assert '120000L' in native
          assert 'apActiveUsers' in js and 'son 2 dk' in js
          assert 'monthlyData(6)' in js and 'fuelRangeData()' in js
          assert 'vehicleHealthScore()' in js and 'upcoming()' in js
          assert 'ap95ShareVehicleCard()' in js
          assert 'com.google.android.gms.ads.APPLICATION_ID' in manifest
          assert 'requestAdMobConsentIfNeeded' in native
          assert 'showOneInterstitialBeforeNavigation' in native
          assert 'updateMrecSlotNative' in native
          assert 'startapp' not in gradle.lower()
          print('PASS – UI, real data, approximate real active count, AdMob, navigation and isolated debug package')
          PY
          node --check app/src/main/assets/r8plus-clean.js
          node --check app/src/main/assets/neon-dashboard-97.js
      - name: Assemble installable TEST APK with Firebase configuration
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon assembleDebug
      - name: Verify APK file
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v97-NEON-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
