name: Unity Ads Ad Inspector mediation TEST APK

on:
  push:
    branches:
      - aracimpro-136-unity-mediation-test-real-units
  workflow_dispatch:

jobs:
  build:
    name: Build isolated mediation-only APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Build ONLY the side-by-side Android test APK
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon :app:assembleMediationTest
      - name: Verify APK exists and is named as a test package
        run: |
          APK="app/build/outputs/apk/mediationTest/app-mediationTest.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.aracimpro.app.unitymediationtest'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep 'Unity Test'
          sha256sum "$APK" | tee mediation-test-sha256.txt
      - name: Upload private GitHub Actions artifact (NOT a Play release)
        uses: actions/upload-artifact@v4
        with:
          name: AracimPro-Unity-REAL-ADMOB-UNITS-TEST-ONLY-APK
          path: |
            app/build/outputs/apk/mediationTest/app-mediationTest.apk
            mediation-test-sha256.txt
          retention-days: 7
          if-no-files-found: error
