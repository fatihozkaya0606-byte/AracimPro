name: Ok Kacis 4.2 Google Play AAB

on:
  push:
    branches: [ok-kacis-google-play]
    paths: [OkKacis_4_2_KaynakKod.zip]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-play-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore the EXACT 4.2 source package
        run: |
          test -s OkKacis_4_2_KaynakKod.zip || { echo "4.2 source ZIP not uploaded yet"; exit 1; }
          unzip -q OkKacis_4_2_KaynakKod.zip -d "$GITHUB_WORKSPACE/game-src"
          test -s game-src/OkKacis/app/src/main/assets/game.js
          test -s game-src/OkKacis/app/build.gradle
          grep -Fq "applicationId 'com.okkacis.game'" game-src/OkKacis/app/build.gradle
          grep -Fq "versionCode 14" game-src/OkKacis/app/build.gradle

      - name: Verify JavaScript syntax
        run: node --check game-src/OkKacis/app/src/main/assets/game.js

      - name: Restore existing Play upload signing key securely
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "PLAY_UPLOAD_KEYSTORE_B64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ok-kacis-upload-key.jks"
          test -s "$RUNNER_TEMP/ok-kacis-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/ok-kacis-upload-key.jks"

      - name: Build Google Play AAB
        working-directory: game-src/OkKacis
        run: gradle --no-daemon :app:bundleRelease

      - name: Sign and verify AAB
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          test -n "$PLAY_UPLOAD_STORE_PASSWORD" && test -n "$PLAY_UPLOAD_KEY_PASSWORD" && test -n "$PLAY_UPLOAD_KEY_ALIAS"
          INPUT="game-src/OkKacis/app/build/outputs/bundle/release/app-release.aab"
          OUTPUT="OkKacis_4_2_GooglePlay_Release.aab"
          test -s "$INPUT"
          jarsigner \
            -keystore "$RUNNER_TEMP/ok-kacis-upload-key.jks" \
            -storepass:env PLAY_UPLOAD_STORE_PASSWORD \
            -keypass:env PLAY_UPLOAD_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$OUTPUT" "$INPUT" "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify "$OUTPUT"
          unzip -t "$OUTPUT" | tail -1
          sha256sum "$OUTPUT"

      - name: Upload signed game bundle
        uses: actions/upload-artifact@v4
        with:
          name: OkKacis-4.2-GooglePlay-Signed-AAB
          path: OkKacis_4_2_GooglePlay_Release.aab
          if-no-files-found: error
