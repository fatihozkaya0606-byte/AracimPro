name: Cephe Komutani v2 Tactical APK
on:
  push:
    branches: [ cephe-komutani-v2-harekat ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Verify restored battle screen and version
        run: |
          grep -Fq "versionCode 2" cephe-komutani/app/build.gradle
          grep -Fq "function drawTank" cephe-komutani/app/src/main/assets/index.html
          grep -Fq "terrain.src='terrain.webp'" cephe-komutani/app/src/main/assets/index.html
          grep -Fq "function sendOrder" cephe-komutani/app/src/main/assets/index.html
      - name: Prepare tactical terrain artwork
        run: |
          python -m pip install -q numpy scipy pillow
          python cephe-komutani/generate_terrain.py
          test -s cephe-komutani/app/src/main/assets/terrain.webp
      - name: Build test APK
        run: gradle -p cephe-komutani --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
          ls -lh cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cephe-Komutani-v2-Android-APK
          path: cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30