name: Cephe Komutani v1 Test APK
on:
  push:
    branches: [ cephe-komutani-v1 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build test APK
        run: gradle -p cephe-komutani --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
          ls -lh cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cephe-Komutani-v1-Test-APK
          path: cephe-komutani/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30