name: OK Kacis booster regression checks
on:
  push:
    branches: [ok-kacis-powerups-dev]
    paths:
      - 'game-development/**'
      - '.github/workflows/ok-kacis-boosters-test.yml'
  pull_request:
    branches: [ok-kacis-game-v1]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check booster engine syntax
        run: node --check game-development/boosters.js
      - name: Check actual game syntax
        run: node --check game-development/game.js
      - name: Test level solvability and powerup behavior
        run: node --test game-development/*.test.js
