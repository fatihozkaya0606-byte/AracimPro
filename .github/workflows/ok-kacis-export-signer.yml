name: Export Android APK Signer For Offline Repair
on:
  push:
    branches: [ok-kacis-powerups-dev]
    paths: ['.github/workflows/ok-kacis-export-signer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android APK signer
        run: |
          sdkmanager "build-tools;36.0.0"
          test -s "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
          test -s "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          mkdir -p export-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" export-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" export-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools-36
          path: export-tools/
          if-no-files-found: error
