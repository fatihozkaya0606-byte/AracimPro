name: Turkish Caption Browser APK
on:
  push:
    branches:
      - turkce-altyazi-tarayici
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout separate branch
        uses: actions/checkout@v4
      - name: Extract standalone Android project
        run: |
          base64 -d browser-source.b64 | tar -xJf -
          test -f TurkceAltyaziTarayici/app/build.gradle
          sed -i 's/com.google.mlkit.nl.translate.DownloadConditions/com.google.mlkit.common.model.DownloadConditions/' TurkceAltyaziTarayici/app/src/main/java/com/stratexia/turkcealtyazi/SubtitleTranslator.java
          sed -i 's/b.setTextAllCaps(false);/b.setAllCaps(false);/' TurkceAltyaziTarayici/app/src/main/java/com/stratexia/turkcealtyazi/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: TurkceAltyaziTarayici
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turkish-Caption-Browser-Test-APK
          path: TurkceAltyaziTarayici/app/build/outputs/apk/debug/app-debug.apk
