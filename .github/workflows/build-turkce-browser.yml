name: Turkish Caption Browser APK
on:
  push:
    branches:
      - turkce-altyazi-tarayici
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout separate branch
        uses: actions/checkout@v4
      - name: Extract standalone Android project
        run: |
          base64 -d browser-source.b64 | tar -xJf -
          test -f TurkceAltyaziTarayici/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: TurkceAltyaziTarayici
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turkish-Caption-Browser-Test-APK
          path: TurkceAltyaziTarayici/app/build/outputs/apk/debug/app-debug.apk
