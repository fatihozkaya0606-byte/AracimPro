name: Ok Kacis 4.2 Google Play AAB

on:
  push:
    branches: [ok-kacis-game-v1]
    paths:
      - 'OkKacis_4_2_KaynakKod.zip'
      - '.github/workflows/ok-kacis-google-play-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ok Kacis game branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore current 4.2 source (do not build outdated v1)
        run: |
          test -s OkKacis_4_2_KaynakKod.zip || { echo "::error::Upload OkKacis_4_2_KaynakKod.zip to the ok-kacis-game-v1 branch first"; exit 1; }
          mkdir -p release-src
          unzip -q OkKacis_4_2_KaynakKod.zip -d release-src
          test -s release-src/OkKacis/app/src/main/assets/game.js
          test -s release-src/OkKacis/app/src/main/AndroidManifest.xml
          test -s release-src/OkKacis/app/build.gradle
          grep -q "applicationId 'com.okkacis.game'" release-src/OkKacis/app/build.gradle
          grep -q "versionCode 14" release-src/OkKacis/app/build.gradle
      - name: Check JavaScript syntax
        run: node --check release-src/OkKacis/app/src/main/assets/game.js
      - name: Restore existing Play upload signing key
        env:
          STORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$STORE_B64" || { echo "::error::PLAY_UPLOAD_KEYSTORE_B64 secret is missing"; exit 1; }
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/okk-play-upload.jks"
          test -s "$RUNNER_TEMP/okk-play-upload.jks"
      - name: Configure release signing
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          cat >> release-src/OkKacis/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              playRelease {
                storeFile file(System.getenv('RUNNER_TEMP') + '/okk-play-upload.jks')
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.playRelease
              }
            }
          }
          EOF
      - name: Build signed Google Play bundle
        working-directory: release-src/OkKacis
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease
      - name: Verify bundle exists and signature
        run: |
          test -s release-src/OkKacis/app/build/outputs/bundle/release/app-release.aab
          unzip -tq release-src/OkKacis/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify release-src/OkKacis/app/build/outputs/bundle/release/app-release.aab
      - name: Upload only Ok Kacis AAB
        uses: actions/upload-artifact@v4
        with:
          name: OkKacis-4.2-Google-Play-AAB
          path: release-src/OkKacis/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
