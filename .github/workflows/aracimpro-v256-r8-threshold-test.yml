name: AracimPro v256 R8 Obfuscation Threshold Test

on:
  push:
    branches: [ aracimpro-r8-256-mintegral-exclusion-test ]
  pull_request:
    branches: [ aracimpro-r8-256-obfuscation-audit ]
  workflow_dispatch:

jobs:
  signed-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Check v256 crash fix and existing ad placement integrity
        run: |
          set -euo pipefail
          bash tools/test-bottom-banner.sh
          grep -q "versionCode 256" app/build.gradle
          ! grep -E '^[[:space:]]*implementation .*com.google.ads.mediation:mintegral' app/build.gradle
          grep -q 'onRenderProcessGone' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'startupRecovery254' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'private void runAdUi255' app/src/main/java/com/aracimpro/app/MainActivity.java
          python3 - <<'PY'
          import re
          from pathlib import Path
          code=Path('app/src/main/java/com/aracimpro/app/MainActivity.java').read_text()
          expression=r'@Override\s+public void (?:onAdLoaded|onAdFailedToLoad|onAdImpression|onAdDismissedFullScreenContent|onAdShowedFullScreenContent|onAdFailedToShowFullScreenContent|onLoaded|onFailed)\s*\([^)]*\)\s*\{\s*runAdUi255\(\(\) -> \{'
          callbacks=re.findall(expression, code)
          assert len(callbacks)>=33, f'Only {len(callbacks)} callbacks are UI-thread protected'
          print(f'PASS: {len(callbacks)} GMA callbacks dispatched to main thread')
          PY
          grep -q 'elapsedOnSplash < 4700L' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q "versionName '7.12.8'" app/build.gradle
          grep -q "ADMOB_TEST_MODE', 'false'" app/build.gradle
          grep -q 'if (refreshing) return;' app/src/main/java/com/aracimpro/app/NativeFeedController146.java
          grep -q 'if (mrecAdLoaded || mrecAdView == null' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'SDK owns refresh after a successful load' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'if (loaded)' app/src/main/java/com/aracimpro/app/BottomBannerPolicy.java
          grep -q 'ca-app-pub-7205009121067400/9497290996' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'ca-app-pub-7205009121067400/3129664519' app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -q 'com.yandex.ads.adapter:admob-mobileads' app/build.gradle
          grep -q 'com.google.ads.mediation:unity' app/build.gradle
          grep -q 'com.google.ads.mediation:vungle' app/build.gradle
          echo 'PASS: ad unit IDs unchanged; native manual refresh disabled; initial no-fill retries retained.'
      - name: Restore existing Google Play upload signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed production AAB with original AdMob mediation
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          NATIVE_AD_UNIT_ID: ${{ secrets.NATIVE_AD_UNIT_ID }}
          MIDDLE_VIDEO_NATIVE_AD_UNIT_ID: ${{ secrets.MIDDLE_VIDEO_NATIVE_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:bundleRelease 2>&1 | tee v256-release-build.log
      - name: Measure real DEX code obfuscation before publishing
        run: |
          set -euo pipefail
          python3 tools/audit-r8-v256.py
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json
          bundle=Path("app/build/outputs/bundle/release/app-release.aab")
          with zipfile.ZipFile(bundle) as z:
              data=json.loads(z.read("BUNDLE-METADATA/com.android.tools/r8.json"))
          stats=data["stats"]
          print("DEX obfuscation:",round(100-stats["noObfuscationPercentage"],2),"%")
          print("DEX optimization:",round(100-stats["noOptimizationPercentage"],2),"%")
          print("DEX shrinking:",round(100-stats["noShrinkingPercentage"],2),"%")
          assert 100-stats["noObfuscationPercentage"]>=25.0, "Obfuscation still below 25%: do NOT publish"
          print("PASS: Play minimum 25% obfuscation reached in actual AAB")
          PY
      - name: Verify bundle signature, payload and create download
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB"
          unzip -Z1 "$AAB" | grep -F -q 'base/manifest/AndroidManifest.xml'
          mkdir -p out
          cp "$AAB" out/AracimPro-v256-7.12.8-R8-ThreshTest-SIGNED.aab
          sha256sum out/AracimPro-v256-7.12.8-R8-ThreshTest-SIGNED.aab > out/SHA256.txt
          cat > out/README.txt <<EOF
          Aracim Pro 7.12.8 - versionCode 256
          Production signed Android App Bundle (.aab), Play upload key from existing GitHub secret.
          This artifact was NOT submitted to Google Play. Validate in internal testing before promotion.
          Verified: signed AAB, bundle integrity, native manual auto-refresh removal,
          33 advertising callbacks marshalled to main thread, no forced banner/MREC refresh.
          Initial no-fill recovery remains. Existing live ad unit IDs/mediation are unchanged.
          Check Play Console versionCode and remaining Play warnings before promotion.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AracimPro-v256-SIGNED-AAB-R8-ThreshTest
          path: |
            out/
            v256-release-build.log
            out/r8-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

  installable-test-apk:
    runs-on: ubuntu-latest
    needs: signed-release-aab
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android dependencies
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Build separate Android debug APK with Google test ads
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p out
          cp "$APK" out/AracimPro-v256-7.12.8-Test.apk
          sha256sum out/AracimPro-v256-7.12.8-Test.apk > out/SHA256-APK.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AracimPro-v256-7.12.8-TEST-APK
          path: out/
          retention-days: 10
          if-no-files-found: ignore
