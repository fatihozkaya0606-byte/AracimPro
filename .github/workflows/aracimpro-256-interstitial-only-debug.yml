name: AracimPro v256 Only Interstitial Disabled - Test

on:
  push:
    branches: [aracimpro-256-only-interstitial-disabled]
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Verify ONLY interstitials are disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('app/src/main/java/com/aracimpro/app/MainActivity.java').read_text()
          assert "private static final boolean ENABLE_INTERSTITIAL_ADS_256 = false;" in code
          for signature in [
              "private void loadSingleInterstitial()",
              "private void loadRecordInterstitial147()",
              "private void requestInterstitialAfterVehicleSaved122()",
              "private void showRecordInterstitial147(String type)",
              "private void testInterstitial141()",
          ]:
              assert signature + " {\n        if (!ENABLE_INTERSTITIAL_ADS_256) return;" in code, signature
          assert "private boolean requestOneInterstitialForNavigation(String target) {\n        if (!ENABLE_INTERSTITIAL_ADS_256) return false;" in code
          for preserved in ["requestMiddleVideoFirst237();", "loadAppOpenDuringSplash122();",
                            "loadExcelRewardedAd124();", "nativeFeed146.tryLoad();",
                            "requestBottomBanner138();", "createAdMobBanner();", "createMrecAd();"]:
              assert preserved in code, preserved
          print("PASS: only interstitial ads disabled; other existing ad paths retained")
          PY
      - name: Compile test APK only (never publish)
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify APK was created
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v256-Only-Interstitial-Disabled-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
