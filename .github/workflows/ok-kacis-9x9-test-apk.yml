name: Ok Kacis 9x9 TEST APK - isolated
on:
  push:
    branches: [ok-kacis-v18-9x9-test-apk]
    paths:
      - 'game-development/**'
      - '.github/workflows/ok-kacis-9x9-test-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-9x9-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare standalone game from original source and corrected assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-src
          unzip -q OkKacis_4_2_KaynakKod.zip -d preview-src
          root=preview-src/OkKacis
          for asset in game.js index.html style.css; do
            test -s "game-development/$asset"
            cp "game-development/$asset" "$root/app/src/main/assets/$asset"
          done
          cp game-development/native/MainActivity.java "$root/app/src/main/java/com/okkacis/game/MainActivity.java"
          node --check "$root/app/src/main/assets/game.js"
          grep -Fq 'const SIZE = 9, TOTAL_LEVELS = 540' "$root/app/src/main/assets/game.js"
          grep -Fq -- '--cell:calc(100% / 9)' "$root/app/src/main/assets/style.css"
          if grep -Fq '14.285714%' "$root/app/src/main/assets/style.css"; then echo 'FAIL: old 7x7 CSS'; exit 1; fi
          if grep -Fq 'calc(100% / 7)' "$root/app/src/main/assets/style.css"; then echo 'FAIL: old 7x7 cell'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-src/OkKacis/app/build.gradle')
          s=p.read_text()
          for old,new in [
            ('compileSdk 35','compileSdk 36'),
            ('targetSdk 35','targetSdk 36'),
            ('versionCode 14','versionCode 18'),
            ("versionName '4.2.0'","versionName '4.3.3'")
          ]:
            assert s.count(old)==1, f'missing {old}'
            s=s.replace(old,new,1)
          s+="""\nandroid { buildTypes { debug { applicationIdSuffix '.dev'; versionNameSuffix '-9x9-preview' } } }\n"""
          s+="""\ndependencies {
            implementation 'com.google.android.gms:play-services-ads:25.5.0'
            implementation 'com.google.ads.mediation:applovin:13.6.4.2'
            implementation 'com.unity3d.ads:unity-ads:4.21.0'
            implementation 'com.google.ads.mediation:unity:4.21.0.0'
            implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
          }\n"""
          p.write_text(s)
          m=Path('preview-src/OkKacis/app/src/main/AndroidManifest.xml')
          xml=m.read_text()
          assert '<application ' in xml
          xml=xml.replace('<application ','''<uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          <application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" ''',1)
          xml=xml.replace('</application>','''  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />
          </application>''',1)
          m.write_text(xml)
          PY
          python3 -m pip install --quiet --user 'Pillow>=10,<13'
          python3 game-development/launcher-v17.py "$root" preview-icon
      - name: Verify all gameplay logic and level generation
        run: |
          set -euo pipefail
          node --test game-development/*.test.js
          echo "9x9 level-generator tests passed"
      - name: Build installable debug APK (separate dev app; test ads only)
        working-directory: preview-src/OkKacis
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and icon
        run: |
          set -euo pipefail
          a=preview-src/OkKacis/app/build/outputs/apk/debug/app-debug.apk
          test -s "$a"
          unzip -tq "$a"
          cp "$a" OkKacis_9x9_V18_TEST.apk
          sha256sum OkKacis_9x9_V18_TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OkKacis-9x9-V18-TEST-APK
          path: OkKacis_9x9_V18_TEST.apk
          if-no-files-found: error
