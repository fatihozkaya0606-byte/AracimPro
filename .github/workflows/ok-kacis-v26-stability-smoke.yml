name: Ok Kacis V26 Stability Repair - Android Smoke

on:
  push:
    branches: [ok-kacis-v26-stability-fix]
    paths:
      - 'game-development/**'
      - '.github/workflows/ok-kacis-v26-stability-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 and icon dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m pip install --quiet --user 'Pillow>=10,<13'
      - name: Test all 540 levels and crash guards
        run: |
          node --check game-development/game.js
          node --test game-development/*.test.js
      - name: Recreate production V26 app with safe test ads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-src
          unzip -q OkKacis_4_2_KaynakKod.zip -d smoke-src
          root=smoke-src/OkKacis
          for asset in game.js index.html style.css; do
            cp "game-development/$asset" "$root/app/src/main/assets/$asset"
          done
          cp game-development/native/MainActivity.java "$root/app/src/main/java/com/okkacis/game/MainActivity.java"
          python3 game-development/launcher-v17.py "$root" smoke-src
          python3 - <<'PY'
          from pathlib import Path
          root=Path('smoke-src/OkKacis')
          build=root/'app/build.gradle'
          text=build.read_text()
          for old,new in [('compileSdk 35','compileSdk 36'),('targetSdk 35','targetSdk 36'),('versionCode 14','versionCode 27'),("versionName '4.2.0'","versionName '4.4.1'")]:
              assert text.count(old)==1,old
              text=text.replace(old,new,1)
          text+='''\n dependencies {
              implementation 'com.google.android.gms:play-services-ads:25.5.0'
              implementation 'com.unity3d.ads:unity-ads:4.21.0'
              implementation 'com.google.ads.mediation:unity:4.21.0.0'
              implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
          }\n'''
          build.write_text(text)
          manifest=root/'app/src/main/AndroidManifest.xml'
          xml=manifest.read_text()
          xml=xml.replace('<application ','<uses-permission android:name="android.permission.INTERNET" />\n  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n  <application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" ',1)
          xml=xml.replace('</application>','  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />\n  </application>',1)
          manifest.write_text(xml)
          assert "applicationId 'com.okkacis.game'" in text
          assert 'applicationIdSuffix' not in text
          PY
      - name: Build installable Android test APK
        working-directory: smoke-src/OkKacis
        run: gradle --no-daemon :app:assembleDebug
      - name: Launch, navigate and collect Android emulator evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p smoke-results
            adb install -r smoke-src/OkKacis/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.okkacis.game/.MainActivity
            sleep 10
            adb exec-out screencap -p > smoke-results/home.png
            adb shell pidof com.okkacis.game | tee smoke-results/launch-pid.txt
            adb shell input tap 540 1880
            sleep 5
            adb exec-out screencap -p > smoke-results/after-tap.png
            adb shell pidof com.okkacis.game | tee smoke-results/navigation-pid.txt
            adb shell input keyevent 4
            sleep 2
            adb shell pidof com.okkacis.game | tee smoke-results/back-pid.txt
            adb logcat -d -v time > smoke-results/logcat.txt
            if grep -Eq 'FATAL EXCEPTION|Process: com.okkacis.game' smoke-results/logcat.txt; then
              echo 'Android runtime crash found; inspect logcat artifact'
              exit 1
            fi
      - name: Save screenshots and launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ok-kacis-v26-stability-smoke-evidence
          path: smoke-results/
          if-no-files-found: warn
