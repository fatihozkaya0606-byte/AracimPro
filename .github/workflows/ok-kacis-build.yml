name: Ok Kacis Android APK
on:
  push:
    branches:
      - ok-kacis-game-v1
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore standalone game project
        run: |
          base64 -d ok-kacis-src.tar.xz.base64 | tar -xJ
          test -f OkKacis/app/src/main/assets/index.html
          test -f OkKacis/app/src/main/assets/game.js
      - name: Verify JavaScript syntax
        run: node --check OkKacis/app/src/main/assets/game.js
      - name: Build installable APK
        working-directory: OkKacis
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s OkKacis/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OkKacis-Test-APK
          path: OkKacis/app/build/outputs/apk/debug/app-debug.apk