name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ main, aracimpro-115-exact-engine-catalog-all-makes, aracimpro-116-r8-interactive-studio, aracimpro-117-r8-hero-photo-polish, aracimpro-118-r8-3d-full-ui, aracimpro-119-splash-and-layout-fixes, aracimpro-120-3d-navigation-light-header, aracimpro-122-mrec-placement-app-open, aracimpro-123-admob-applovin-mediation, aracimpro-124-rewarded-excel ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Restore stable test signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_B64" || (echo "PLAY_UPLOAD_KEYSTORE_B64 secret is missing" >&2; exit 1)
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          cat > keystore.properties <<EOF2
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2
      - name: Verify OtoAPI secret
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
        run: |
          test -n "$OTOAPI_KEY" || (echo "OTOAPI_KEY secret is missing" >&2; exit 1)
      - name: Build debug APK
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-V116-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
