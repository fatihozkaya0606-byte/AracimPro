name: Extract game CSS for layout polish
on:
  push:
    branches: [ok-kacis-powerups-dev]
    paths:
      - '.github/workflows/ok-kacis-export-style.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ok-kacis-powerups-dev
          persist-credentials: true
      - name: Export current release style on the isolated dev branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          unzip -q OkKacis_4_2_KaynakKod.zip -d /tmp/source
          test -s /tmp/source/OkKacis/app/src/main/assets/style.css
          cp /tmp/source/OkKacis/app/src/main/assets/style.css game-development/style.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-development/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Expose current game CSS for safe layout work'
          git fetch origin ok-kacis-powerups-dev
          git rebase origin/ok-kacis-powerups-dev
          git push origin HEAD:ok-kacis-powerups-dev
