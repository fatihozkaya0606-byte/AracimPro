name: AracimPro 86 AdMob - Signed Internal Test AAB
on:
  push:
    branches: [aracimpro-86-admob-restored]
  pull_request:
    branches: [aracimpro-85-startio-banner-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - name: Verify AdMob-only app setup, UMP and premium gating
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          c=Path('app/src/main/java/com/aracimpro/app/MainActivity.java').read_text()
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          h=Path('app/src/main/assets/index.html').read_text()
          p=Path('privacy-policy.html').read_text()
          assert 'versionCode 86' in g and "versionName '7.11.11'" in g
          assert "implementation 'com.google.android.gms:play-services-ads:25.5.0'" in g
          assert "implementation 'com.google.android.ump:user-messaging-platform:4.0.0'" in g
          assert 'com.startapp:inapp-sdk' not in g
          assert 'com.startapp' not in c and 'StartAppSDK' not in c
          assert 'StartAppInitProvider' not in m and 'startapp' not in m.lower()
          assert 'com.google.android.gms.ads.APPLICATION_ID' in m
          assert 'ca-app-pub-7205009121067400~4069879501' in m
          assert 'ca-app-pub-7205009121067400/9497290996' in c
          assert 'requestConsentInfoUpdate' in c and 'loadAndShowConsentFormIfRequired' in c
          assert 'canRequestAdmobAds()' in c
          assert 'showPrivacyOptionsForm' in c
          assert 'runOnUiThread(this::startAdmobConsentIfNeeded)' in c
          assert 'if(premiumActive || !premiumBillingReady || !canRequestAdmobAds()' in c
          assert 'banner_failed' in c and 'getCode()' in c
          assert 'showInterstitialOnce' not in c
          assert 'admobAdsDiagnostics()' in c and 'Android.admobAdsDiagnostics()' in h
          assert "const V='7.11.11'" in h
          assert 'Google AdMob Reklam Kontrolü' in h
          assert 'Google' in p and 'UMP' in p
          print('OK: AdMob + Google UMP; no Start.io; premium-safe banner; detailed diagnostics')
          PY
      - name: Restore Play upload signing key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_B64" || (echo "Upload keystore secret missing" >&2; exit 1)
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build SIGNED AAB for manual review (never auto-publish)
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon bundleRelease
      - name: Check release outputs
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -F -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-86-AdMob-Geri-Donus-SIGNED-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
