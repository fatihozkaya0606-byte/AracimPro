name: Aracim Pro v144 AdMob Unity Mintegral Liftoff Signed AAB and Test APK

on:
  workflow_dispatch:
  push:
    branches: [ aracimpro-144-mintegral-liftoff-mediation ]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
      - name: Restore upload key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE_B64" ]; then
            echo "PLAY_UPLOAD_KEYSTORE_B64 secret is missing" >&2
            exit 1
          fi
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF2
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2
      - name: Verify OtoAPI secret
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
        run: |
          test -n "$OTOAPI_KEY" || (echo "OTOAPI_KEY secret is missing" >&2; exit 1)
      - name: Check intended release configuration
        run: |
          grep -Fq "versionCode 144" app/build.gradle
          grep -Fq "versionName '7.11.68'" app/build.gradle
          grep -Fq "com.google.ads.mediation:unity:4.21.0.0" app/build.gradle
          ! grep -Eq 'com.google.ads.mediation:(applovin|pangle):' app/build.gradle
          grep -Fq "com.google.ads.mediation:mintegral:17.1.81.1" app/build.gradle
          grep -Fq "com.google.ads.mediation:vungle:7.7.9.0" app/build.gradle
          grep -Fq "dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" settings.gradle
          test -s MEDIATION_MINTEGRAL_LIFTOFF.md
          grep -Fq "Mintegral" privacy-policy.html
          grep -Fq "Liftoff Monetize" privacy-policy.html
      - name: Verify App Open, Unity mediation, interstitial and banner code
        run: |
          grep -Fq "ca-app-pub-7205009121067400/2505091369" app/build.gradle
          grep -Fq "ca-app-pub-7205009121067400/2790024214" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "InterstitialAd.load(" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "loadSingleInterstitial()" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "requestBottomBanner138()" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "appOpenAttemptFinished141" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "installPreviewAdDiagnostics141()" app/src/main/java/com/aracimpro/app/MainActivity.java
          ! grep -Fq "appOpenLaunchCount122 < 2" app/src/main/java/com/aracimpro/app/MainActivity.java
          ! grep -Fq "now - appOpenLastShownAt122 <" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "activityResumed143" app/src/main/java/com/aracimpro/app/MainActivity.java
          grep -Fq "elapsedOnSplash < 11000L" app/src/main/java/com/aracimpro/app/MainActivity.java
      - name: Validate Titanium UI stylesheet and complete HTML integration
        run: |
          test -s app/src/main/assets/r8-titanium-142.css
          grep -Fq 'href="r8-titanium-142.css"' app/src/main/assets/index.html
          test -s app/src/main/assets/r8-titanium-visible-143.css
          grep -Fq 'href="r8-titanium-visible-143.css"' app/src/main/assets/index.html
          grep -Fq "titaniumControlStrip143()" app/src/main/assets/index.html
          grep -Fq "apTi143Pulse" app/src/main/assets/r8-titanium-visible-143.css
          grep -Fq "const V='7.11.68'" app/src/main/assets/index.html
          grep -Fq "body.r118Skin #app .nav" app/src/main/assets/r8-titanium-142.css
          grep -Fq "body.r118Skin:not(.apMrecReady)" app/src/main/assets/r8-titanium-142.css
          grep -Fq "body.r118Skin.r8HomeMode #app .n97Dashboard .n97Hero.n117Hero" app/src/main/assets/r8-titanium-142.css
          grep -Fq 'r8-ultra-3d-118.js' app/src/main/assets/index.html
      - name: Validate all AdMob mediation adapter dependency resolutions
        run: |
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/mediation-deps.txt"
          grep -Fq "com.google.ads.mediation:mintegral:17.1.81.1" "$RUNNER_TEMP/mediation-deps.txt"
          grep -Fq "com.google.ads.mediation:vungle:7.7.9.0" "$RUNNER_TEMP/mediation-deps.txt"
          grep -Fq "com.google.ads.mediation:unity:4.21.0.0" "$RUNNER_TEMP/mediation-deps.txt"
          ! grep -Eq '(mintegral|vungle):[0-9.]+ FAILED' "$RUNNER_TEMP/mediation-deps.txt"
      - name: Build side-by-side preview APK and signed release bundle
        env:
          OTOAPI_KEY: ${{ secrets.OTOAPI_KEY }}
          APP_OPEN_AD_UNIT_ID: ${{ secrets.APP_OPEN_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          LIVE_DATA_API_URL: ${{ secrets.LIVE_DATA_API_URL }}
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Verify signed bundle, mapping and native symbols exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.aracimpro.app.neonpreview'"
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -F -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'
          echo 'Confirmed: AAB contains native symbol metadata'
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -F 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v144-Mintegral-Liftoff-SIGNED-PLAY-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AracimPro-v144-Mediation-Test-APK-Google-Sample-Ads
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
