pluginManagement {
    // R8 9.4.14: verified with an isolated CI analyzer build.
    // Third-party AdMob/Yandex/Unity/Liftoff/Mintegral dependencies stay intact.
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools:r8:9.4.14'
        }
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Official AdMost Android Maven repository (HTTPS; no insecure HTTP).
        maven { url 'https://mvn-repo.admost.com/artifactory/amr-2' }
        // Official Mintegral SDK Maven repository, needed by the Google
        // Mintegral mediation adapter. Liftoff and Unity use Maven Central.
        maven {
            url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
        }
    }
}
rootProject.name = 'AracimPro'
include ':app'
// Isolated Next-Gen SDK migration smoke-test library. Production app does not depend on it.
include ':nextgen-ads'
