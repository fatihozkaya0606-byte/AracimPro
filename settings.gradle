pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Required by the official AdMob mediation adapters:
        // Pangle's Android SDK artifacts.
        maven { url = uri('https://artifact.bytedance.com/repository/pangle/') }
        // Mintegral's Android SDK artifacts.
        maven { url = uri('https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea') }
    }
}
rootProject.name = 'AracimPro'
include ':app'
